// ---------------------------------------------------------------------
// Monotributo: importar las ventas del último año y ordenarlas por mes
// (Excel de "Mis Comprobantes — Emitidos" o "Comprobantes de Ventas")
// ---------------------------------------------------------------------
function fechaAnyToYM(v) {
  if (typeof v === "number" && v > 30000 && v < 80000) { const d = new Date(Math.round((v - 25569) * 86400000)); return { y: d.getUTCFullYear(), m: d.getUTCMonth() + 1 }; }
  const t = String(v || "").trim();
  let m = t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (m) return { y: Number(m[3]), m: Number(m[2]) };
  m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return { y: Number(m[1]), m: Number(m[2]) };
  return null;
}
// CSV de ARCA ("Comprobantes en línea" → emitidos): separador ";", campos entre comillas, decimales con coma.
function parseCsvArca(text) {
  const t = String(text || "").replace(/^\uFEFF/, "");
  const first = t.split(/\r?\n/, 1)[0] || "";
  const delim = [";", "\t", ","].map((d) => [d, first.split(d).length]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < t.length; i++) {
    const ch = t[i];
    if (q) { if (ch === '"') { if (t[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === delim) { row.push(cur); cur = ""; }
    else if (ch === "\n" || ch === "\r") { if (ch === "\r" && t[i + 1] === "\n") i++; row.push(cur); cur = ""; if (row.some((x) => x !== "")) rows.push(row); row = []; }
    else cur += ch;
  }
  row.push(cur); if (row.some((x) => x !== "")) rows.push(row);
  return rows;
}
// Códigos de comprobante de ARCA: notas de crédito y recibos (el CSV trae el código numérico, p. ej. 13 = Nota de Crédito C)
const COD_NOTA_CREDITO = [3, 8, 13, 21, 43, 53, 112, 113, 114, 115, 203, 208, 213];
const COD_RECIBO = [4, 9, 15, 54];
function importarVentasMono(clientId, period, file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    let rows;
    if (/\.(csv|txt)$/i.test(file.name)) {
      let txt;
      try { txt = new TextDecoder("utf-8", { fatal: true }).decode(e.target.result); } catch (err) { txt = new TextDecoder("windows-1252").decode(e.target.result); }
      rows = parseCsvArca(txt);
    } else {
      let wb;
      try { wb = XLSX.read(e.target.result, { type: "array" }); }
      catch (err) { alert("No pude leer el archivo. ¿Es el Excel de comprobantes emitidos de ARCA?"); return; }
      const ws = wb.Sheets[wb.SheetNames[0]];
      rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "", raw: true });
    }
    const norm = (x) => String(x || "").trim().toLowerCase();
    let hi = -1; const col = {};
    for (let r = 0; r < Math.min(rows.length, 15); r++) {
      const names = rows[r].map(norm);
      const iF = names.findIndex((n) => n.indexOf("fecha") === 0);
      const iT = names.findIndex((n) => n === "imp. total" || n === "importe total" || n === "total" || n === "imp total");
      if (iF !== -1 && iT !== -1) {
        hi = r; col.fecha = iF; col.total = iT;
        names.forEach((n, i) => {
          if (n === "tipo" || n === "tipo de comprobante") col.tipo = i;
          else if (n.indexOf("tipo cambio") !== -1 || n.indexOf("tipo de cambio") !== -1) col.tc = i;
        });
        break;
      }
    }
    if (hi === -1 || col.tipo == null) { alert("No reconocí las columnas. Necesito una columna de fecha, una de tipo de comprobante y una de importe total (Excel de \"Mis Comprobantes\" emitidos o de \"Comprobantes de Ventas\")."); return; }
    const meses = {}; let recibos = 0, leidos = 0;
    for (let r = hi + 1; r < rows.length; r++) {
      const row = rows[r], f = fechaAnyToYM(row[col.fecha]);
      if (!f) continue;
      const tipo = String(row[col.tipo] || "").trim();
      const mCod = tipo.match(/^(\d{1,3})(?:\s*-|$)/), cod = mCod ? Number(mCod[1]) : null;
      if (/recibo/i.test(tipo) || (cod != null && COD_RECIBO.indexOf(cod) !== -1)) { recibos++; continue; }
      const tc = col.tc != null && num(row[col.tc]) > 0 ? num(row[col.tc]) : 1;
      let monto = Math.abs(num(row[col.total])) * tc;
      if (/Nota de Cr[eé]dito/i.test(tipo) || (cod != null && COD_NOTA_CREDITO.indexOf(cod) !== -1)) monto = -monto;
      const ym = `${f.y}-${String(f.m).padStart(2, "0")}`;
      const o = meses[ym] = meses[ym] || { total: 0, n: 0, nc: 0 };
      o.total = round2(o.total + monto); o.n++; if (monto < 0) o.nc++;
      leidos++;
    }
    if (!leidos) { alert("No encontré comprobantes con fecha en este archivo."); return; }
    state.monoImp = { clientId, period, meses, recibos, ceros: true };
    renderMonoImportModal();
  };
  reader.onerror = () => alert("No pude leer el archivo.");
  reader.readAsArrayBuffer(file);
}

        <label style="display:flex;gap:8px;align-items:center;font-size:13px;"><input type="checkbox" data-action="mono-imp-ceros" ${s.ceros ? "checked" : ""}> Cargar $ 0 en los meses de los 12 sin comprobantes</label>

      </div>
      <div class="modal-foot"><button class="btn" data-action="mono-imp-cancelar">Cancelar</button><button class="btn btn-accent" data-action="mono-imp-aplicar">Cargar facturación</button></div>

// Al perder el foco, si el campo es un monto o una alícuota/coeficiente,
// se reformatea para que se vea prolijo (separador de miles y 2 decimales
// para montos; 2-4 decimales para porcentajes) — nunca mientras se tipea,
// para no romper el punto decimal en progreso (ver `num`/`rawOrBlank`).
document.addEventListener(
  "focusout",
  (e) => {
    if (isRerendering) return; // synthetic blur from removing the focused node during re-render, not a real blur
    const t = e.target;
    if (!t || !t.dataset) return;
    const kind = t.dataset.kind;
    if (kind !== "money" && kind !== "percent") return;
    const refresher = MODAL_REFRESHERS[t.dataset.reopen];
    // El campo de edición manual de Base Imponible (Convenio Multilateral) se
    // cierra solo al perder el foco, volviendo al formato de solo lectura +
    // lápiz — en vez de quedar trabado como input.
    const isBaseOverride = t.dataset.path && t.dataset.path.indexOf(".baseOverrides.") !== -1;
    const raw = String(t.value || "").trim();
    // El refresco (reformatear + refresher/render) reconstruye el DOM del
    // modal o de #main. Si esto pasa de forma síncrona durante el mismo
    // click con el que se sale del campo (por ejemplo, clickeando el botón
    // "Listo" de un modal justo después de tipear), el navegador reemplaza
    // ese botón a mitad de camino entre el mousedown y el mouseup, y el
    // click se pierde — hacía falta un segundo click para que funcionara.
    // Diferirlo con setTimeout deja que el click en curso termine de
    // procesarse primero.
    const runRefresher = (clientid, period) => {
      if (!refresher) return;
      setTimeout(() => {
        if (document.getElementById("modal-root").innerHTML.trim() !== "") refresher(clientid, period);
      }, 0);
    };
    const closeBaseOverride = () => { setTimeout(() => { state.editingBaseImponible = null; render(); }, 0); };
    if (raw === "") {
      if (isBaseOverride) { closeBaseOverride(); return; }
      runRefresher(t.dataset.clientid, t.dataset.period); return;
    }
    const formatted = kind === "money" ? fmtMoneyRaw(num(raw)) : fmtPctRaw(num(raw));
    if (formatted === raw) {
      if (isBaseOverride) { closeBaseOverride(); return; }
      runRefresher(t.dataset.clientid, t.dataset.period); return;
    }
    t.value = formatted;
    if (t.dataset.action === "field") {
      const { clientid, period, path } = t.dataset;
      touchDoc(clientid, period, (doc) => setDeep(doc, path, formatted));
      if (isBaseOverride) { closeBaseOverride(); return; }
      if (refresher) { runRefresher(clientid, period); return; }
    } else if (t.dataset.cfg) {
      handleConfigInput(t);
    }
  },
  true
);

  else if (action === "add-activity-local") { mutateClient(currentClient().id, (c) => c.iibbLocal.activities.push({ code: "", desc: "", alicuota: 0 })); render(); }
  else if (action === "remove-activity-local") { const idx = Number(btn.dataset.idx); mutateClient(currentClient().id, (c) => c.iibbLocal.activities.splice(idx, 1)); render(); }
  else if (action === "remove-activity-iva") { const idx = Number(btn.dataset.idx); mutateClient(currentClient().id, (c) => c.iva.activities.splice(idx, 1)); render(); }
  else if (action === "add-pv-iva") { mutateClient(currentClient().id, (c) => { if (!c.iva.puntosVenta) c.iva.puntosVenta = []; c.iva.puntosVenta.push({ puntoVenta: "", code: "", alicuota: "21" }); }); render(); }
  else if (action === "remove-pv-iva") { const idx = Number(btn.dataset.idx); mutateClient(currentClient().id, (c) => c.iva.puntosVenta.splice(idx, 1)); render(); }
  else if (action === "open-activity-picker-local") { openActivityPickerModal("iibbLocal"); }
  else if (action === "open-activity-picker-cm") { openActivityPickerModal("iibbCM"); }
  else if (action === "open-activity-picker-iva") { openActivityPickerModal("iva"); }
  else if (action === "open-decreto814-modal") { renderDecreto814Modal(btn.dataset.clientid, btn.dataset.period); }
  else if (action === "activar-prorrateo" || action === "descartar-alerta-prorrateo") {
    const path = action === "activar-prorrateo" ? "iva.prorrateoExento" : "iva.prorrateoAlertaDescartada";
    touchDoc(btn.dataset.clientid, btn.dataset.period, (doc) => setDeep(doc, path, true));
    const rf = MODAL_REFRESHERS[btn.dataset.reopen];
    if (rf) rf(btn.dataset.clientid, btn.dataset.period); else render();
  }
  else if (action === "open-prorrateo-modal") { prorrateoModalShowDesglose = false; renderProrrateoModal(btn.dataset.clientid, btn.dataset.period); }
  else if (action === "toggle-prorrateo-desglose") { prorrateoModalShowDesglose = true; renderProrrateoModal(btn.dataset.clientid, btn.dataset.period); }
  else if (action === "open-date-picker") { openDatePickerFor(btn); }
  else if (action === "open-f2083-modal") { renderFormulario2083Modal(btn.dataset.clientid, btn.dataset.period); }
  else if (action === "open-iva-actividades-modal") { ivaActividadesActiveCode = null; renderIvaActividadesModal(btn.dataset.clientid, btn.dataset.period); }
  else if (action === "select-iva-actividad") { ivaActividadesActiveCode = btn.dataset.code; renderIvaActividadesModal(btn.dataset.clientid, btn.dataset.period); }
  else if (action === "toggle-theme") { toggleTheme(); }
  else if (action === "cm-encuadre-ok") {
    mutateClient(currentClient().id, (c) => (c.iibbCM.activities || []).forEach((a) => { if (!a.regimen) a.regimenAvisoOk = true; }));
    render();
  }
  else if (action === "open-ayuda") { e.preventDefault(); openAyuda(btn); }
  else if (action === "ayuda-cerrar") { cerrarAyuda(); }
  else if (action === "ayuda-texto") { toggleAyudaTexto(btn.dataset.ayuda); }
  else if (action === "descartar-aviso-alicuota") {
    touchDoc(btn.dataset.clientid, btn.dataset.period, (doc) => setDeep(doc, `iva.porActividad.${btn.dataset.code}.alicuotaAvisoDescartado`, true));
    const rf = MODAL_REFRESHERS[btn.dataset.reopen];
    if (rf) rf(btn.dataset.clientid, btn.dataset.period); else render();
  }
  else if (action === "open-sync-modal") { renderSyncModal(); }
  else if (action === "sync-save") { syncSaveFromModal(); }
  else if (action === "sync-pull-now") { syncPullFromModal(); }
  else if (action === "add-coef-vigencia") { renderCoefVigenciaModal(currentClient().id, null); }
  else if (action === "edit-coef-vigencia") { renderCoefVigenciaModal(currentClient().id, btn.dataset.desde); }
  else if (action === "open-activity-regimen-modal") { renderActivityRegimenModal(currentClient().id, btn.dataset.code); }
  else if (action === "toggle-base-edit") {
    const key = btn.dataset.jur + "|" + btn.dataset.code;
    state.editingBaseImponible = state.editingBaseImponible === key ? null : key;
    render();
  }
  else if (action === "remove-jurisdiction") { const idx = Number(btn.dataset.idx); mutateClient(currentClient().id, (c) => c.iibbCM.jurisdictions.splice(idx, 1)); render(); }
  else if (action === "add-all-jurisdictions") {
    mutateClient(currentClient().id, (c) => {
      const existing = new Set(c.iibbCM.jurisdictions.map((j) => j.name));
      AR_JURISDICCIONES.forEach((name) => { if (!existing.has(name)) c.iibbCM.jurisdictions.push({ name, alicuotas: {} }); });
    });
    render();
  }
});

document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.dataset.action === "field-select") {
    const { clientid, period, path } = t.dataset;
    touchDoc(clientid, period, (doc) => setDeep(doc, path, t.value));
    render();
  } else if (t.dataset.action === "select-coef-vigencia") {
    state.selectedCoefDesde = t.value || null;
    render();
  } else if (t.dataset.action === "add-jurisdiction-select") {
    const name = t.value;
    if (name) mutateClient(currentClient().id, (c) => { if (!c.iibbCM.jurisdictions.some((x) => x.name === name)) c.iibbCM.jurisdictions.push({ name, alicuotas: {} }); });
    render();
  } else if (t.dataset.action === "import-arca-file") {
    const { clientid, period } = t.dataset;
    const file = t.files && t.files[0];
    t.value = ""; // permite volver a elegir el mismo archivo si hace falta reimportar
    if (file) importArcaComprobantes(clientid, period, file);
  }
});

function handleConfigInput(t) {
  const c = currentClient();
  if (!c) return;
  const cfg = t.dataset.cfg;
  if (cfg === "name") mutateClient(c.id, (cl) => (cl.name = t.value));
  else if (cfg === "cuit") mutateClient(c.id, (cl) => (cl.cuit = t.value));
  else if (cfg === "toggle-iva") mutateClient(c.id, (cl) => (cl.iva.enabled = t.checked));
  else if (cfg === "toggle-prorrateo-exento") touchDoc(c.id, state.currentPeriod, (doc) => setDeep(doc, "iva.prorrateoExento", t.checked));
  else if (cfg === "toggle-turiva") touchDoc(c.id, state.currentPeriod, (doc) => setDeep(doc, "iva.turIvaEnabled", t.checked));
  else if (cfg === "toggle-iibblocal") mutateClient(c.id, (cl) => (cl.iibbLocal.enabled = t.checked));
  else if (cfg === "toggle-iibbcm") mutateClient(c.id, (cl) => (cl.iibbCM.enabled = t.checked));
  else if (cfg === "toggle-bp") { if (t.checked) bpDb().clientes[c.id] = true; else delete bpDb().clientes[c.id]; persistExtras(); render(); }
  else if (cfg === "toggle-gan") { if (t.checked) ganDb().clientes[c.id] = true; else delete ganDb().clientes[c.id]; persistExtras(); render(); }
  else if (cfg === "toggle-mono") mutateClient(c.id, (cl) => { cl.mono = Object.assign({ categoria: "", tipo: "servicios" }, cl.mono || {}); cl.mono.enabled = t.checked; });
  else if (cfg === "mono-cat") mutateClient(c.id, (cl) => { cl.mono = cl.mono || {}; cl.mono.categoria = t.value; });
  else if (cfg === "mono-tipo") mutateClient(c.id, (cl) => { cl.mono = cl.mono || {}; cl.mono.tipo = t.value; });
  else if (cfg === "mono-iibb") mutateClient(c.id, (cl) => { cl.mono = cl.mono || {}; cl.mono.iibb = t.value; });
  else if (cfg === "mono-comp") mutateClient(c.id, (cl) => { cl.mono = cl.mono || {}; cl.mono.comp = Object.assign({}, cl.mono.comp || {}); cl.mono.comp[t.dataset.comp] = t.checked; });
  else if (cfg === "mono-muni-nombre") mutateClient(c.id, (cl) => { cl.mono = cl.mono || {}; cl.mono.muniNombre = t.value; });
  else if (cfg === "mono-muni-monto") mutateClient(c.id, (cl) => { cl.mono = cl.mono || {}; cl.mono.muniMonto = t.value; });
  else if (cfg === "decreto814rate") mutateClient(c.id, (cl) => (cl.iva.decreto814Rate = t.value));
  else if (cfg === "iva-saldo-tecnico-inicial") mutateClient(c.id, (cl) => (cl.iva.saldosIniciales.saldoTecnicoAnterior = t.value));
  else if (cfg === "iva-saldo-libre-inicial") mutateClient(c.id, (cl) => (cl.iva.saldosIniciales.saldoLibreDisponibilidadAnterior = t.value));
  else if (cfg === "iibblocal-jurisdiccion") mutateClient(c.id, (cl) => (cl.iibbLocal.jurisdiccion = t.value));
  else if (cfg === "iibblocal-saldo-inicial") mutateClient(c.id, (cl) => (cl.iibbLocal.saldoInicial = t.value));
  else if (cfg === "iibblocal-activity-code") mutateClient(c.id, (cl) => (cl.iibbLocal.activities[Number(t.dataset.idx)].code = t.value));
  else if (cfg === "iva-activity-code") mutateClient(c.id, (cl) => (cl.iva.activities[Number(t.dataset.idx)].code = t.value));
  else if (cfg === "iva-activity-desc") mutateClient(c.id, (cl) => (cl.iva.activities[Number(t.dataset.idx)].desc = t.value));
  else if (cfg === "iva-pv-numero") mutateClient(c.id, (cl) => (cl.iva.puntosVenta[Number(t.dataset.idx)].puntoVenta = t.value));
  else if (cfg === "iva-pv-code") mutateClient(c.id, (cl) => (cl.iva.puntosVenta[Number(t.dataset.idx)].code = t.value));
  else if (cfg === "iva-pv-alicuota") mutateClient(c.id, (cl) => (cl.iva.puntosVenta[Number(t.dataset.idx)].alicuota = t.value));
  else if (cfg === "iibblocal-activity-desc") mutateClient(c.id, (cl) => (cl.iibbLocal.activities[Number(t.dataset.idx)].desc = t.value));
  else if (cfg === "iibblocal-activity-alicuota") mutateClient(c.id, (cl) => (cl.iibbLocal.activities[Number(t.dataset.idx)].alicuota = t.value));
  else if (cfg === "activity-code") mutateClient(c.id, (cl) => (cl.iibbCM.activities[Number(t.dataset.idx)].code = t.value));
  else if (cfg === "activity-desc") mutateClient(c.id, (cl) => (cl.iibbCM.activities[Number(t.dataset.idx)].desc = t.value));
  else if (cfg === "jur-alicuota") mutateClient(c.id, (cl) => {
    const jur = cl.iibbCM.jurisdictions.find((j) => j.name === t.dataset.jur);
    if (jur) { jur.alicuotas = jur.alicuotas || {}; jur.alicuotas[t.dataset.code] = t.value; }
  });
  else if (cfg === "coef") mutateClient(c.id, (cl) => {
    const desde = t.dataset.desde;
    const v = (cl.iibbCM.coeficientes || []).find((x) => x.desde === desde);
    if (v) { v.valores = v.valores || {}; v.valores[t.dataset.jur] = t.value; }
  });
  else if (cfg === "saldo-inicial-cm") mutateClient(c.id, (cl) => {
    cl.iibbCM.saldosIniciales = cl.iibbCM.saldosIniciales || {};
    cl.iibbCM.saldosIniciales[t.dataset.jur] = t.value;
  });
  renderPreservingFocus();
}

function renderCoefVigenciaModal(clientId, editDesde) {
  const client = getClient(clientId);
  if (!client) return;
  const existing = editDesde ? (client.iibbCM.coeficientes || []).find((v) => v.desde === editDesde) : null;
  const root = document.getElementById("modal-root");
  root.innerHTML = `
    <div class="modal-backdrop">
      <div class="modal" style="max-width:360px;">
        <div class="modal-head"><h3>${existing ? "Editar vigencia" : "Nueva vigencia de coeficientes"}</h3><button class="btn btn-ghost" data-action="close-modal">✕</button></div>
        <div class="modal-body">
          <p style="font-size:11.5px;color:var(--muted);margin:0;">Definí desde y hasta qué período rige este coeficiente. Fuera de ese rango, la herramienta no lo va a aplicar — así te avisa si te quedó un hueco sin cargar, en vez de arrastrar uno viejo que ya no corresponde.</p>
          ${existing ? "" : `<div class="field"><label>Último período declarado con los coeficientes anteriores</label><input type="month" id="coef-vig-ultimo" min="${MIN_PERIOD}"><span class="hint-sm" id="coef-vig-ultimo-hint">Si presentaste el CM05 antes de declarar enero, dejalo vacío: no hay ajuste.</span></div>`}
          <div class="field"><label>Desde (AAAA-MM)</label><input type="text" id="coef-vig-desde" placeholder="Ej: 2025-05" value="${escapeHtml(existing ? existing.desde : "")}"></div>
          <div class="field"><label><input type="checkbox" id="coef-vig-sigue" ${!existing || !existing.hasta ? "checked" : ""}> Sigue vigente (sin fecha de fin todavía)</label></div>
          <div class="field" id="coef-vig-hasta-field" style="${(!existing || !existing.hasta) ? "display:none;" : ""}">
            <label>Hasta (AAAA-MM, incluido)</label><input type="text" id="coef-vig-hasta" placeholder="Ej: 2026-04" value="${escapeHtml(existing && existing.hasta ? existing.hasta : "")}">
          </div>
        </div>
        <div class="modal-foot" style="${existing ? "justify-content:space-between;" : ""}">
          ${existing ? `<button class="btn btn-danger" data-action="delete-coef-vigencia" data-desde="${escapeHtml(existing.desde)}">Eliminar</button>` : ""}
          <div style="display:flex;gap:8px;${existing ? "" : "margin-left:auto;"}">
            <button class="btn" data-action="close-modal">Cancelar</button>
            <button class="btn btn-accent" data-action="confirm-coef-vigencia" data-editing="${existing ? existing.desde : ""}">${existing ? "Guardar" : "Crear"}</button>
          </div>
        </div>
      </div>
    </div>`;
  wireModalBackdropClose();
  const ult = document.getElementById("coef-vig-ultimo");
  if (ult) ult.addEventListener("input", () => {
    const hint = document.getElementById("coef-vig-ultimo-hint"), d = document.getElementById("coef-vig-desde");
    if (!/^\d{4}-\d{2}$/.test(ult.value)) { hint.textContent = "Si presentaste el CM05 antes de declarar enero, dejalo vacío: no hay ajuste."; return; }
    const desde = addMonths(ult.value, 1);
    d.value = desde;
    hint.innerHTML = periodMonth(desde) === 1
      ? `Los coeficientes nuevos rigen desde <b>${periodLabel(desde)}</b>. No hay ajuste.`
      : `Los coeficientes nuevos rigen desde <b>${periodLabel(desde)}</b>. En ese período vas a ver el ajuste de <b>${monoRango(periodYear(desde) + "-01", ult.value)}</b> (también aparece como alerta en el Panel y el Calendario).`;
  });
  document.getElementById("coef-vig-sigue").addEventListener("change", (e) => {
    document.getElementById("coef-vig-hasta-field").style.display = e.target.checked ? "none" : "";
  });
}

function renderActivityRegimenModal(clientId, code) {

  if (!client) return;
  const a = (client.iibbCM.activities || []).find((x) => x.code === code);
  if (!a) return;
  const jurs = sortedJurisdictions(client.iibbCM.jurisdictions);
  const regimen = a.regimen || "general";
  const enc = cmEncuadreSugerido(a.code);
  const root = document.getElementById("modal-root");
  root.innerHTML = `
    <div class="modal-backdrop">
      <div class="modal" style="max-width:440px;">
        <div class="modal-head"><h3>Régimen CM — ${escapeHtml(a.code)}</h3><button class="btn btn-ghost" data-action="close-modal">✕</button></div>
        <div class="modal-body">
          <p style="font-size:11.5px;color:var(--muted);margin:0;">${escapeHtml(a.desc)}</p>
          ${enc ? `<div style="background:var(--diff-soft);color:var(--diff);border:1px solid var(--diff);border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.45;align-self:stretch;">
            <div class="wb-text">⚠ <b>Por el rubro podría corresponder el Art. ${enc.art} — ${escapeHtml(enc.nombre)}.</b><br>${escapeHtml(enc.regla)}<br><span style="font-size:12px;"><b>Aplica:</b> ${escapeHtml(enc.cuando)}</span></div>
            ${regimen !== "especial" ? `<div class="wb-actions" style="margin-top:8px;"><button type="button" class="btn btn-sm btn-accent" id="usar-encuadre">Usar Art. ${enc.art}</button></div>` : ""}
          </div>` : ""}
          <div class="field">
            <label>Régimen</label>
            <select id="regimen-select">
              <option value="general" ${regimen === "general" ? "selected" : ""}>General (Art. 2) — usa el coeficiente de distribución</option>
              <option value="especial" ${regimen === "especial" ? "selected" : ""}>Especial (Art. 6 a 13) — reparto propio de esta actividad</option>
              <option value="art14" ${regimen === "art14" ? "selected" : ""}>Inicio de actividades (Art. 14) — 100% en una jurisdicción</option>
            </select>
          </div>
          <div id="regimen-especial-block" style="display:${regimen === "especial" ? "flex" : "none"};flex-direction:column;gap:8px;">
            <div class="field">
              <label>Artículo aplicable</label>
              <select id="regimen-especial-art">
                <option value="">Elegir artículo…</option>
                ${CM_ENCUADRES.map((e) => `<option value="${e.art}" ${(a.especialArt || (enc && enc.art) || "") == e.art ? "selected" : ""}>Art. ${e.art} — ${escapeHtml(e.nombre)}</option>`).join("")}
              </select>
              <span class="hint-sm" id="regimen-especial-regla"></span>
            </div>
            <div id="regimen-reparto-block" style="display:none;flex-direction:column;gap:8px;">
              <div class="field"><label id="regimen-sede-label">Jurisdicción de la sede</label>
                <select id="regimen-sede"><option value="">Elegir…</option>${jurs.map((j) => `<option value="${escapeHtml(j.name)}" ${a.especialSede === j.name ? "selected" : ""}>${escapeHtml(j.name)}</option>`).join("")}</select></div>
              <div class="field"><label id="regimen-donde-label">Jurisdicción donde se realiza la actividad</label>
                <select id="regimen-donde"><option value="">Elegir…</option>${jurs.map((j) => `<option value="${escapeHtml(j.name)}" ${a.especialDonde === j.name ? "selected" : ""}>${escapeHtml(j.name)}</option>`).join("")}</select></div>
              <span id="regimen-reparto-hint" style="font-size:10.5px;color:var(--muted-soft);"></span>
            </div>
            <div id="regimen-montos-block" style="display:none;flex-direction:column;gap:8px;">
              <p id="regimen-montos-txt" style="font-size:11.5px;color:var(--muted);margin:0;"></p>
              ${jurs.map((j) => `
                <div class="field" style="flex-direction:row;align-items:center;justify-content:space-between;gap:8px;">
                  <label style="margin:0;">${escapeHtml(j.name)}</label>
                  <input type="text" inputmode="decimal" data-kind="money" data-montojur="${escapeHtml(j.name)}" value="${rawOrBlank(a.especialMontos && a.especialMontos[j.name], "money")}" placeholder="—" style="width:150px;text-align:right;">

              <span id="regimen-montos-total" style="font-size:11.5px;color:var(--muted);"></span>

              <p style="font-size:11.5px;color:var(--muted);margin:0;">La jurisdicción productora toma como base el precio mayorista, oficial o corriente en plaza al despachar (o el 85% del precio de venta si no se puede establecer). El resto del ingreso se reparte entre las jurisdicciones con el coeficiente general (Art. 2) vigente al período que estás viendo.</p>
              <div class="field"><label>Jurisdicción productora</label>
                <select id="regimen-prod"><option value="">Elegir…</option>${jurs.map((j) => `<option value="${escapeHtml(j.name)}" ${a.especial13 && a.especial13.prod === j.name ? "selected" : ""}>${escapeHtml(j.name)}</option>`).join("")}</select></div>

                <input type="text" inputmode="decimal" data-kind="money" id="regimen-total13" value="${rawOrBlank(a.especial13 && a.especial13.total, "money")}" placeholder="—"></div>

                <span class="pct-field"><input type="text" inputmode="decimal" data-kind="percent" data-jur="${escapeHtml(j.name)}" value="${rawOrBlank(a.distribEspecial && a.distribEspecial[j.name], "percent")}" placeholder="—" style="width:80px;"><span class="pct-suffix">%</span></span>

          <button class="btn btn-accent" data-action="confirm-activity-regimen" data-code="${escapeHtml(a.code)}">Guardar</button>
        </div>
      </div>
    </div>`;
  wireModalBackdropClose();
  // Reparto automático (Arts. 6, 7, 10, 11 y 12): con la jurisdicción de la
  // sede y la jurisdicción donde se hace la actividad se completan solos los
  // porcentajes (p. ej. 80% / 20%); si ambas son la misma, 100% a esa.
  const aplicarReparto = (completar) => {
    const v = Number(document.getElementById("regimen-especial-art").value);
    const e2 = CM_ENCUADRES.find((x) => x.art === v);
    const blk = document.getElementById("regimen-reparto-block");
    document.getElementById("regimen-montos-block").style.display = e2 && e2.montos ? "flex" : "none";
    document.getElementById("regimen-art13-block").style.display = e2 && e2.art13 ? "flex" : "none";
    if (e2 && e2.montos) document.getElementById("regimen-montos-txt").textContent = e2.montos.txt;
    if (!e2 || !e2.reparto) { blk.style.display = "none"; return; }
    blk.style.display = "flex";
    document.getElementById("regimen-sede-label").textContent = e2.reparto.ls;
    document.getElementById("regimen-donde-label").textContent = e2.reparto.ld;
    document.getElementById("regimen-reparto-hint").textContent = `Se completa ${e2.reparto.donde}% donde corresponde a la actividad y ${e2.reparto.sede}% a la sede. Si la actividad se hace en más de una jurisdicción, ajustá los porcentajes a mano abajo.`;
    if (!completar) return;
    const sede = document.getElementById("regimen-sede").value, donde = document.getElementById("regimen-donde").value;
    if (!sede || !donde) return;
    const map = {};
    if (sede === donde) map[sede] = 100; else { map[sede] = e2.reparto.sede; map[donde] = e2.reparto.donde; }
    document.querySelectorAll("#regimen-especial-block input[data-jur]").forEach((inp) => { inp.value = map[inp.dataset.jur] ? fmtPctRaw(map[inp.dataset.jur]) : ""; });
  };
  const actualizarRegla = (completar) => {
    const v = Number(document.getElementById("regimen-especial-art").value);
    const e2 = CM_ENCUADRES.find((x) => x.art === v);
    document.getElementById("regimen-especial-regla").textContent = e2 ? e2.regla : "";
    aplicarReparto(completar === true);
  };
  const llenarPct = (map) => {
    document.querySelectorAll("#regimen-especial-block input[data-jur]").forEach((inp) => { inp.value = map[inp.dataset.jur] ? fmtPctRaw(map[inp.dataset.jur]) : ""; });
  };
  // Arts. 8 y 9: porcentaje = importe de la jurisdicción / total.
  const calcMontos = () => {
    const ins = [...document.querySelectorAll("#regimen-montos-block input[data-montojur]")];
    const total = ins.reduce((acc, i) => acc + num(i.value), 0);
    document.getElementById("regimen-montos-total").textContent = total ? `Total: ${fmtMoney(total)}` : "";
    if (!total) return;
    const map = {};
    ins.forEach((i) => { const v = num(i.value); if (v) map[i.dataset.montojur] = (v / total) * 100; });
    llenarPct(map);
  };
  document.querySelectorAll("#regimen-montos-block input[data-montojur]").forEach((i) => i.addEventListener("input", calcMontos));
  // Art. 13: la productora toma la base; el resto se reparte por el coeficiente general.
  const calc13 = () => {
    const prod = document.getElementById("regimen-prod").value;
    const total = num(document.getElementById("regimen-total13").value);
    const base = num(document.getElementById("regimen-base13").value);
    const res = document.getElementById("regimen-art13-res");
    if (!prod || !total) { res.textContent = ""; return; }
    const pr = Math.max(0, Math.min(1, base / total));
    const map = {};
    jurs.forEach((j) => { map[j.name] = (1 - pr) * getCoef(client, j.name, state.currentPeriod) * 100; });
    map[prod] = (map[prod] || 0) + pr * 100;
    llenarPct(map);
    const suma = Object.values(map).reduce((x, y) => x + y, 0);
    res.textContent = `La productora toma ${fmtPct(pr)} por la base y el resto se reparte por coeficiente. Suma del reparto: ${fmtPct(suma / 100)}.` + (Math.abs(suma - 100) > 0.01 ? " Revisá que los coeficientes sumen 100%." : "");
  };
  ["regimen-prod", "regimen-total13", "regimen-base13"].forEach((id) => document.getElementById(id).addEventListener(id === "regimen-prod" ? "change" : "input", calc13));
  document.getElementById("regimen-85").addEventListener("click", () => {
    const total = num(document.getElementById("regimen-total13").value);
    if (!total) { showToast("Cargá primero el ingreso bruto total"); return; }
    document.getElementById("regimen-base13").value = fmtMoneyRaw(total * 0.85);
    calc13();
  });
  document.getElementById("regimen-especial-art").addEventListener("change", () => actualizarRegla(true));
  document.getElementById("regimen-sede").addEventListener("change", () => aplicarReparto(true));
  document.getElementById("regimen-donde").addEventListener("change", () => aplicarReparto(true));
  actualizarRegla(false);
  const usarBtn = document.getElementById("usar-encuadre");
  if (usarBtn) usarBtn.addEventListener("click", () => {
    document.getElementById("regimen-select").value = "especial";
    document.getElementById("regimen-especial-block").style.display = "flex";
    document.getElementById("regimen-art14-block").style.display = "none";
    document.getElementById("regimen-especial-art").value = String(enc.art);
    actualizarRegla(true);
    usarBtn.parentElement.remove();
  });
  document.getElementById("regimen-select").addEventListener("change", (e) => {
    document.getElementById("regimen-especial-block").style.display = e.target.value === "especial" ? "flex" : "none";
    document.getElementById("regimen-art14-block").style.display = e.target.value === "art14" ? "block" : "none";
  });
}

// Cerrar el modal al clickear el fondo, pero sólo cuando el click fue
// directamente sobre el fondo (no cuando "burbujeó" desde algo de adentro).
// Confirmación con el estilo de la app (reemplaza al confirm() nativo del navegador).
function appConfirm(msg, opts) {
  opts = opts || {};
  return new Promise((resolve) => {
    const prev = document.getElementById("confirm-root"); if (prev) prev.remove();
    const root = document.createElement("div"); root.id = "confirm-root";
    root.innerHTML = `<div class="modal-backdrop" style="z-index:120;"><div class="modal" style="max-width:440px;" role="alertdialog" aria-modal="true">
      <div class="modal-head"><h3 style="margin:0;font-size:16px;">${escapeHtml(opts.title || "Confirmar")}</h3></div>
      <div class="modal-body"><p style="margin:0;line-height:1.5;">${escapeHtml(msg)}</p></div>
      <div class="modal-foot"><button class="btn" data-c="0">${escapeHtml(opts.cancel || "Cancelar")}</button><button class="btn ${opts.danger ? "btn-danger" : "btn-accent"}" data-c="1">${escapeHtml(opts.ok || "Aceptar")}</button></div></div></div>`;
    document.body.appendChild(root);
    const fin = (v) => { document.removeEventListener("keydown", onKey, true); root.remove(); resolve(v); };
    const onKey = (e) => { if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); fin(false); } else if (e.key === "Enter") { e.preventDefault(); e.stopPropagation(); fin(true); } };
    document.addEventListener("keydown", onKey, true);
    root.addEventListener("click", (e) => { const b = e.target.closest("[data-c]"); if (b) fin(b.dataset.c === "1"); else if (e.target.classList.contains("modal-backdrop")) fin(false); });
    const okb = root.querySelector('[data-c="1"]'); if (okb) okb.focus();
  });
}
function wireModalBackdropClose() {
  const backdrop = document.querySelector("#modal-root .modal-backdrop");
  if (backdrop) backdrop.addEventListener("click", (e) => { if (e.target === e.currentTarget) document.getElementById("modal-root").innerHTML = ""; });
}

// ---------------------------------------------------------------------
// Selector de fecha propio (reemplaza <input type="date"> nativo, que no
// se puede re-diseñar para que combine con la paleta de la herramienta).
// ---------------------------------------------------------------------
let datePickerState = null; // { path, clientId, period, reopen, viewYear, viewMonth, selected, anchorRect }
function fmtDateDMY(iso) {
  if (!iso) return "";
  const [y, m, d] = iso.split("-");
  return `${d}/${m}/${y}`;
}
function openDatePickerFor(btn) {
  const { path, clientid, period, reopen } = btn.dataset;
  if (datePickerState && datePickerState.path === path && datePickerState.clientId === clientid && datePickerState.period === period) {
    closeDatePicker();
    return;
  }
  const doc = getDoc(clientid, period);
  const current = getDeep(doc, path, "") || "";
  const base = current ? new Date(current + "T00:00:00") : new Date();
  datePickerState = {
    path, clientId: clientid, period, reopen,
    viewYear: base.getFullYear(), viewMonth: base.getMonth(),
    selected: current || null,
    anchorRect: btn.getBoundingClientRect(),
  };
  renderDatePicker();
}
function closeDatePicker() {
  datePickerState = null;
  const root = document.getElementById("date-picker-root");
  if (root) root.innerHTML = "";
}
function saveDatePickerValue(iso) {
  if (!datePickerState) return;
  const { clientId, period, path, reopen } = datePickerState;
  touchDoc(clientId, period, (doc) => setDeep(doc, path, iso));
  const refresher = MODAL_REFRESHERS[reopen];
  if (refresher) refresher(clientId, period); else render();
}
function renderDatePicker() {
  const root = document.getElementById("date-picker-root");
  if (!datePickerState) { root.innerHTML = ""; return; }
  const { viewYear, viewMonth, selected, anchorRect } = datePickerState;
  const startDow = new Date(viewYear, viewMonth, 1).getDay();
  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
  const daysInPrevMonth = new Date(viewYear, viewMonth, 0).getDate();
  const now = new Date();
  const cells = [];
  for (let i = 0; i < startDow; i++) {
    const d = daysInPrevMonth - startDow + 1 + i;
    const m = viewMonth === 0 ? 11 : viewMonth - 1, y = viewMonth === 0 ? viewYear - 1 : viewYear;
    cells.push({ d, m, y, muted: true });
  }
  for (let d = 1; d <= daysInMonth; d++) cells.push({ d, m: viewMonth, y: viewYear, muted: false });
  while (cells.length < 42) {
    const d = cells.length - (startDow + daysInMonth) + 1;
    const m = viewMonth === 11 ? 0 : viewMonth + 1, y = viewMonth === 11 ? viewYear + 1 : viewYear;
    cells.push({ d, m, y, muted: true });
  }
  const isoOf = (c) => `${c.y}-${String(c.m + 1).padStart(2, "0")}-${String(c.d).padStart(2, "0")}`;
  const dowLabels = ["DO", "LU", "MA", "MI", "JU", "VI", "SA"];
  const dayButtons = cells.map((c) => {
    const iso = isoOf(c);
    const cls = ["dp-day"];
    if (c.muted) cls.push("dp-muted");
    if (c.y === now.getFullYear() && c.m === now.getMonth() && c.d === now.getDate()) cls.push("dp-today");
    if (selected && iso === selected) cls.push("dp-selected");
    return `<button type="button" class="${cls.join(" ")}" data-dp-iso="${iso}">${c.d}</button>`;
  }).join("");
  const monthLabel = `${MESES[viewMonth].toLowerCase()} de ${viewYear}`;

  const popW = 270, popH = 340;
  let top = anchorRect.bottom + 6, left = anchorRect.left;
  if (left + popW > window.innerWidth - 10) left = window.innerWidth - popW - 10;
  if (left < 10) left = 10;
  if (top + popH > window.innerHeight - 10) top = anchorRect.top - popH - 6;
  if (top < 10) top = 10;

  root.innerHTML = `
    <div class="date-picker-popover" style="top:${top}px;left:${left}px;">
      <div class="dp-head">
        <button type="button" data-dp-action="prev-month" title="Mes anterior">‹</button>
        <b>${monthLabel}</b>
        <button type="button" data-dp-action="next-month" title="Mes siguiente">›</button>
      </div>
      <div class="dp-grid">
        ${dowLabels.map((l) => `<div class="dp-dow">${l}</div>`).join("")}
        ${dayButtons}
      </div>
      <div class="dp-foot">
        <button type="button" data-dp-action="clear">Borrar</button>
        <button type="button" data-dp-action="today">Hoy</button>
      </div>
    </div>`;
}
document.getElementById("date-picker-root").addEventListener("click", (e) => {
  const dayBtn = e.target.closest("[data-dp-iso]");
  if (dayBtn) { saveDatePickerValue(dayBtn.dataset.dpIso); closeDatePicker(); return; }
  const actionBtn = e.target.closest("[data-dp-action]");
  if (!actionBtn || !datePickerState) return;
  const action = actionBtn.dataset.dpAction;
  if (action === "prev-month") {
    datePickerState.viewMonth--;
    if (datePickerState.viewMonth < 0) { datePickerState.viewMonth = 11; datePickerState.viewYear--; }
    renderDatePicker();
  } else if (action === "next-month") {
    datePickerState.viewMonth++;
    if (datePickerState.viewMonth > 11) { datePickerState.viewMonth = 0; datePickerState.viewYear++; }
    renderDatePicker();
  } else if (action === "clear") { saveDatePickerValue(""); closeDatePicker(); }
  else if (action === "today") {
    const n = new Date();
    saveDatePickerValue(`${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, "0")}-${String(n.getDate()).padStart(2, "0")}`);
    closeDatePicker();
  }
});

document.getElementById("modal-root").addEventListener("click", (e) => {
  const btn = e.target.closest("[data-action]");
  if (!btn) return;
  if (btn.dataset.action === "close-modal") document.getElementById("modal-root").innerHTML = "";
  else if (btn.dataset.action === "confirm-add-client") {
    const name = document.getElementById("new-client-name").value.trim();
    const cuit = document.getElementById("new-client-cuit").value.trim();
    document.getElementById("modal-root").innerHTML = "";
    addClient(name || "Nuevo cliente", cuit);
  }
  else if (btn.dataset.action === "confirm-coef-vigencia") {
    const re = /^\d{4}-(0[1-9]|1[0-2])$/;
    const desde = document.getElementById("coef-vig-desde").value.trim();
    const sigueVigente = document.getElementById("coef-vig-sigue").checked;
    const hasta = sigueVigente ? null : document.getElementById("coef-vig-hasta").value.trim();
    if (!re.test(desde)) { showToast("El período 'Desde' tiene que tener formato AAAA-MM"); return; }
    if (hasta && !re.test(hasta)) { showToast("El período 'Hasta' tiene que tener formato AAAA-MM"); return; }
    if (hasta && hasta < desde) { showToast("'Hasta' no puede ser anterior a 'Desde'"); return; }
    const editingDesde = btn.dataset.editing;
    let ok = true;
    mutateClient(currentClient().id, (c) => {
      c.iibbCM.coeficientes = c.iibbCM.coeficientes || [];
      if (editingDesde) {
        if (desde !== editingDesde && c.iibbCM.coeficientes.some((v) => v.desde === desde)) { ok = false; return; }
        const v = c.iibbCM.coeficientes.find((x) => x.desde === editingDesde);
        if (v) { v.desde = desde; v.hasta = hasta || null; }
      } else {
        if (c.iibbCM.coeficientes.some((v) => v.desde === desde)) { ok = false; return; }
        c.iibbCM.coeficientes.push({ desde, hasta: hasta || null, valores: {} });
      }
    });
    if (!ok) { showToast("Ya existe una vigencia cargada con esa fecha de inicio"); return; }
    state.selectedCoefDesde = desde;
    document.getElementById("modal-root").innerHTML = "";
    render();
  }
  else if (btn.dataset.action === "delete-coef-vigencia") {
    const desde = btn.dataset.desde;
    appConfirm(`¿Eliminar la vigencia de coeficientes desde ${periodLabel(desde)}? Esta acción no se puede deshacer.`, { ok: "Eliminar", danger: true }).then((ok) => {
      if (!ok) return;
      mutateClient(currentClient().id, (c) => {
        c.iibbCM.coeficientes = (c.iibbCM.coeficientes || []).filter((v) => v.desde !== desde);
      });
      if (state.selectedCoefDesde === desde) state.selectedCoefDesde = null;
      document.getElementById("modal-root").innerHTML = "";
      render();
    });
  }
  else if (btn.dataset.action === "confirm-activity-regimen") {
    const code = btn.dataset.code;
    const regimen = document.getElementById("regimen-select").value;
    let art14Jur = "";
    let distribEspecial = null;
    if (regimen === "especial") {
      distribEspecial = {};
      document.querySelectorAll("#regimen-especial-block input[data-jur]").forEach((inp) => {
        const v = num(inp.value);
        if (v) distribEspecial[inp.dataset.jur] = v;
      });
    } else if (regimen === "art14") {
      const sel = document.getElementById("regimen-art14-jur");
      art14Jur = sel ? sel.value : "";
      if (!art14Jur) { showToast("Elegí en qué jurisdicción arrancó la actividad"); return; }
    }
    mutateClient(currentClient().id, (c) => {
      const a = (c.iibbCM.activities || []).find((x) => x.code === code);
      if (!a) return;
      a.regimen = regimen === "general" ? undefined : regimen;
      a.especialArt = regimen === "especial" ? (Number(document.getElementById("regimen-especial-art") && document.getElementById("regimen-especial-art").value) || undefined) : undefined;
      const montosEl = [...document.querySelectorAll("#regimen-montos-block input[data-montojur]")];
      const artSel = Number(document.getElementById("regimen-especial-art").value);
      a.especialMontos = regimen === "especial" && (artSel === 8 || artSel === 9) ? Object.fromEntries(montosEl.filter((i) => num(i.value)).map((i) => [i.dataset.montojur, num(i.value)])) : undefined;
      a.especial13 = regimen === "especial" && artSel === 13 ? { prod: document.getElementById("regimen-prod").value, total: num(document.getElementById("regimen-total13").value), base: num(document.getElementById("regimen-base13").value) } : undefined;
      a.especialSede = regimen === "especial" ? (document.getElementById("regimen-sede").value || undefined) : undefined;
      a.especialDonde = regimen === "especial" ? (document.getElementById("regimen-donde").value || undefined) : undefined;
      if (regimen === "general") a.regimenAvisoOk = true; // ya lo revisó y lo dejó en general
      a.distribEspecial = regimen === "especial" ? distribEspecial : undefined;
      a.art14Jur = regimen === "art14" ? art14Jur : undefined;
    });
    document.getElementById("modal-root").innerHTML = "";
    render();
  }
  else if (btn.dataset.action === "pick-activity") {
    const code = btn.dataset.code, desc = btn.dataset.desc;
    mutateClient(currentClient().id, (c) => {
      // Se carga la actividad en TODOS los regímenes que el cliente tenga
      // habilitados (no sólo en el que abrió el buscador) — si ya la usás
      // en IVA, tiene sentido que esté también en IIBB (local y/o Convenio
      // Multilateral), sin tener que cargarla dos o tres veces a mano.
      // Sacarla si no corresponde en alguno se sigue haciendo manual, con
      // "Quitar" — eso sí queda independiente por régimen.
      if (c.iva.enabled && !c.iva.activities.some((a) => a.code === code)) c.iva.activities.push({ code, desc });
      if (c.iibbLocal.enabled && !c.iibbLocal.activities.some((a) => a.code === code)) c.iibbLocal.activities.push({ code, desc, alicuota: 0 });
      if (c.iibbCM.enabled && !c.iibbCM.activities.some((a) => a.code === code)) c.iibbCM.activities.push({ code, desc });
    });
    document.getElementById("modal-root").innerHTML = "";
    render();
  }
});

// ---------------------------------------------------------------------
// Importar "Comprobantes de Ventas" (Excel descargado del portal IVA de
// ARCA) y volcarlo en "Apertura de Otros Conceptos", por actividad/
// alícuota/condición del comprador — usando el mapeo Punto de Venta →
// Actividad cargado en Configuración → IVA. No toca lo que el contador ya
// haya tipeado a mano en otras actividades/alícuotas no presentes en el
// archivo importado.
// ---------------------------------------------------------------------
function parseArcaFecha(raw) {
  // Siempre "dd/mm/aaaa" (así la exporta el portal de ARCA). Si viniera
  // como fecha real de Excel (número serie), XLSX ya la entrega como string
  // acá porque leemos la hoja con raw:false.
  const m = String(raw || "").trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (!m) return null;
  return { y: Number(m[3]), m: Number(m[2]), d: Number(m[1]) };
}
function importArcaComprobantes(clientId, period, file) {
  const client = getClient(clientId);
  if (!client) return;
  const puntosVenta = client.iva.puntosVenta || [];
  const [targetY, targetM] = period.split("-").map(Number);

  const reader = new FileReader();
  reader.onload = (e) => {
    let wb;
    try {
      wb = XLSX.read(e.target.result, { type: "array" });
    } catch (err) {
      alert("No pude leer el archivo. ¿Es el Excel de \"Comprobantes de Ventas\" exportado de ARCA?");
      return;
    }
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "", raw: false });

    // Ubicar la fila de encabezados por nombre de columna (en vez de asumir
    // que es la fila 0), por si el portal cambia el orden o hay filas antes.
    const norm = (s) => String(s || "").trim().toLowerCase();
    let headerIdx = -1, col = {};
    for (let r = 0; r < Math.min(rows.length, 10); r++) {
      const names = rows[r].map(norm);
      if (names.includes("fecha") && names.some((n) => n.indexOf("punto de venta") !== -1)) {
        headerIdx = r;
        names.forEach((n, i) => {
          if (n === "fecha") col.fecha = i;
          else if (n === "tipo") col.tipo = i;
          else if (n.indexOf("punto de venta") !== -1) col.pv = i;
          else if (n.indexOf("neto gravado") !== -1) col.neto = i;
          else if (n === "exento") col.exento = i;
          else if (n === "iva") col.iva = i;
        });
        break;
      }
    }
    if (headerIdx === -1 || col.fecha == null || col.tipo == null || col.pv == null || col.neto == null || col.iva == null) {
      alert("No reconocí las columnas del archivo. Tiene que ser el Excel \"Comprobantes de Ventas\" tal como lo exporta el portal IVA de ARCA.");
      return;
    }

    // Acumuladores por actividad: igual estructura que iva.porActividad.
    const acc = {}; // code -> { debito:{ri105,cf105,ri21,cf21}, restCredito:{ncEmit105RI,...}, exento, exentoNC }
    const emptyAcc = () => ({ debito: { ri105: 0, cf105: 0, ri21: 0, cf21: 0 }, restCredito: { ncEmit105RI: 0, ncEmit105CF: 0, ncEmit21RI: 0, ncEmit21CF: 0 }, exento: 0, exentoNC: 0 });

    let comprobantesOk = 0, comprobantesFueraDePeriodo = 0;
    let montoSinPV = 0, pvSinConfigurar = new Set();
    let montoSinAlicuota = 0;
    let montoSinLetra = 0;

    for (let r = headerIdx + 1; r < rows.length; r++) {
      const row = rows[r];
      const fechaRaw = row[col.fecha];
      // La hoja trae, debajo de los comprobantes, el cuadro resumen armado a
      // mano (separado por una fila en blanco) — cortamos ahí.
      if (!fechaRaw && String(row[col.pv] || "").trim() === "" && comprobantesOk > 0) break;
      const fecha = parseArcaFecha(fechaRaw);
      if (!fecha) continue; // fila sin fecha válida (totales, encabezados repetidos, etc.)

      const tipo = String(row[col.tipo] || "").trim();
      const pv = String(row[col.pv] || "").trim();
      // Las Notas de Crédito vienen con el Neto Gravado (y el IVA) en
      // negativo en el export de ARCA — se trabaja con el valor absoluto, ya
      // que acá se guardan como un monto positivo de "N.C. emitidas" que el
      // propio papel de trabajo resta del débito (no como un neto negativo).
      const netoGravado = Math.abs(num(row[col.neto]));
      const ivaMonto = Math.abs(num(row[col.iva]));
      const exentoMonto = Math.abs(col.exento != null ? num(row[col.exento]) : 0);

      if (fecha.y !== targetY || fecha.m !== targetM) { comprobantesFueraDePeriodo++; continue; }

      const letraMatch = tipo.match(/([A-Z])\s*$/);
      const letra = letraMatch ? letraMatch[1] : null;
      const esRI = letra === "A";
      const esCF = letra === "B" || letra === "C";
      if (!esRI && !esCF) { montoSinLetra += netoGravado + exentoMonto; continue; }
      const esNC = /Nota de Cr[eé]dito/i.test(tipo);

      // A qué actividad corresponde este punto de venta — si tiene más de
      // una actividad asociada, se distingue por la alícuota real del
      // comprobante (IVA / Neto Gravado).
      const candidatos = puntosVenta.filter((x) => String(x.puntoVenta).trim() === pv);
      let code = null;
      let rate105 = null; // true=10,5% / false=21% / null=no se pudo determinar
      if (candidatos.length === 1) {
        code = candidatos[0].code;
      } else if (candidatos.length > 1) {
        const rateReal = netoGravado > 0 ? ivaMonto / netoGravado : 0;
        const match = candidatos.find((x) => Math.abs(rateReal - num(x.alicuota) / 100) < 0.02);
        code = match ? match.code : null;
      }
      if (!code) {
        montoSinPV += netoGravado + exentoMonto;
        if (pv) pvSinConfigurar.add(pv);
        continue;
      }

      if (netoGravado > 0) {
        const rateReal = ivaMonto / netoGravado;
        if (Math.abs(rateReal - 0.21) < 0.03) rate105 = false;
        else if (Math.abs(rateReal - 0.105) < 0.02) rate105 = true;
        else { montoSinAlicuota += netoGravado; continue; }
      }

      if (!acc[code]) acc[code] = emptyAcc();
      if (netoGravado > 0) {
        const key = (esRI ? "ri" : "cf") + (rate105 ? "105" : "21");
        if (esNC) acc[code].restCredito[("ncEmit" + (rate105 ? "105" : "21") + (esRI ? "RI" : "CF"))] += netoGravado;
        else acc[code].debito[key] += netoGravado;
      }
      if (exentoMonto) {
        if (esNC) acc[code].exentoNC += exentoMonto; else acc[code].exento += exentoMonto;
      }
      comprobantesOk++;
    }

    if (!comprobantesOk) {
      alert(`No encontré comprobantes de ${periodLabel(period)} en este archivo (¿es el período correcto?).`);
      return;
    }

    const codesImportados = Object.keys(acc);
    touchDoc(clientId, period, (doc) => {
      codesImportados.forEach((code) => {
        setDeep(doc, `iva.porActividad.${code}`, acc[code]);
      });
    });
    codesImportados.forEach((code) => syncVentasNetasFromIvaActividad(clientId, period, `iva.porActividad.${code}.debito.ri21`));

    let msg = `Importados ${comprobantesOk} comprobantes de ${periodLabel(period)} en ${codesImportados.length} actividad(es).`;
    if (montoSinPV > 0) msg += `\n\nOjo: ${fmtMoney(montoSinPV)} corresponden a punto(s) de venta sin configurar (${[...pvSinConfigurar].join(", ")}) — andá a Configuración → IVA → Puntos de venta y asignalos.`;
    if (montoSinAlicuota > 0) msg += `\n\n${fmtMoney(montoSinAlicuota)} tienen una alícuota que no pude identificar como 10,5% ni 21% — revisalos a mano.`;
    if (montoSinLetra > 0) msg += `\n\n${fmtMoney(montoSinLetra)} corresponden a comprobantes cuyo tipo no reconocí (ni Factura A, B o C) — revisalos a mano.`;
    if (comprobantesFueraDePeriodo > 0) msg += `\n\n(Se ignoraron ${comprobantesFueraDePeriodo} comprobantes del archivo por no pertenecer a ${periodLabel(period)}.)`;
    alert(msg);

    refreshIvaActividadesModal(clientId, period);
  };
  reader.onerror = () => alert("No pude leer el archivo.");
  reader.readAsArrayBuffer(file);
}

function renderFormulario2083Modal(clientId, period) {
  const client = state.clients.find((c) => c.id === clientId);
  if (!client) return;
  const r = calcIvaFor(client, period);

  const sumNeto = (arr) => round2(arr.reduce((s, b) => s + b.neto, 0));
  const sumCalc = (arr) => round2(arr.reduce((s, b) => s + b.calculado, 0));
  // Para Ventas y Compras usamos el importe "s/Portal IVA" (declarado) en
  // vez del recalculado, porque pueden existir diferencias entre ambos.
  const sumPortal = (arr) => round2(arr.reduce((s, b) => s + (b.portal ? b.portal : b.calculado), 0));

  // Ventas: "Operaciones de Venta" = Débito Fiscal (bruto); "Notas de Crédito
  // de Venta" = N.C. emitidas (restitución de crédito fiscal) — el F.2083
  // los declara sin netear, cada uno con su propia columna de Débito Fiscal.
  const ventasNeto = sumNeto(r.debitoBrackets), ventasDebito = sumPortal(r.debitoBrackets);
  const ncVentasNeto = sumNeto(r.restCreditoBrackets), ncVentasDebito = sumPortal(r.restCreditoBrackets);
  const ventasExento = num(r.exento.ventas), ncVentasExento = num(r.exento.ncVentas);

  // Compras: "Operaciones de Compra" = Crédito Fiscal; "Notas de Crédito de
  // Compra" = N.C. recibidas (restitución de débito fiscal).
  const comprasNeto = sumNeto(r.creditoBrackets), comprasCredito = sumPortal(r.creditoBrackets);
  const ncComprasNeto = sumNeto(r.restDebitoBrackets), ncComprasCredito = sumPortal(r.restDebitoBrackets);
  const comprasExento = num(r.exento.compras), ncComprasExento = num(r.exento.ncCompras);

  const operacionesNoCredito = num(r.exento.operacionesNoCredito);

  const row = (label, neto, exento, impuesto) => `
    <tr><td>${label}</td><td class="num">${fmtMoney(neto)}</td><td class="num">${fmtMoney(exento)}</td><td class="num">${fmtMoney(impuesto)}</td></tr>`;

  document.getElementById("modal-root").innerHTML = `

function normalizeSearch(s) {

}
function filterActivityPicker(q) {
  const container = document.getElementById("activity-results");

// ---------------------------------------------------------------------
// Exportación a Excel (valores calculados, sin fórmulas frágiles)
// ---------------------------------------------------------------------
// Orden en que se muestran los períodos en las hojas de IIBB del Excel:
// primero el que se está viendo en el tablero y después el resto en orden
// cronológico (Enero → Agosto, por ejemplo). En IVA el resto va del más nuevo
// al más viejo.
const COLOR_ACTUAL = { bg: "FFE08A", fg: "5C3B00" };
function periodosOrdenVisual(periods) {
  const v = periods.slice().sort();
  const i = v.indexOf(state.currentPeriod);
  if (i > 0) v.unshift(v.splice(i, 1)[0]);
  return v;
}

function nowStampAR() {
  return new Date().toLocaleString("es-AR", { dateStyle: "short", timeStyle: "short" });
}

// Construye una hoja a partir de un array de arrays, aplicando formato de
// número/porcentaje a las celdas numéricas (todo lo que no sea texto queda
// prolijo con separador de miles y dos decimales, salvo que se indique lo
// contrario), anchos de columna y combinación de celdas para los "banners"
// de sección.
function newSheet(rows, opts) {
  opts = opts || {};
  const wrapCols = opts.wrapCols || [0]; // qué columnas ajustan texto a varios renglones en filas de datos comunes (por defecto sólo la primera)
  // Si una fila tiene una celda fusionada ("merge") pero el array sólo trae
  // valor en la primera columna de ese rango, completamos las demás con ""
  // para que existan como celdas reales — si no, el borde y el color de
  // fondo sólo se verían en la primera celda del título/banner, no en todo
  // el ancho fusionado.
  (opts.merges || []).forEach((m) => {
    if (!m) return;
    for (let r = m.s.r; r <= m.e.r; r++) {
      if (!rows[r]) rows[r] = [];
      for (let c = m.s.c; c <= m.e.c; c++) {
        if (rows[r][c] === undefined) rows[r][c] = "";
      }
    }
  });
  const ws = XLSX.utils.aoa_to_sheet(rows);
  const ref = ws["!ref"];
  if (ref) {
    const range = XLSX.utils.decode_range(ref);
    for (let R = range.s.r; R <= range.e.r; R++) {
      for (let C = range.s.c; C <= range.e.c; C++) {
        const cell = ws[XLSX.utils.encode_cell({ r: R, c: C })];
        if (!cell || cell.t !== "n") continue;
        const key = R + ":" + C;
        if (opts.formats && opts.formats.has(key)) { cell.z = opts.formats.get(key); continue; }
        if (opts.skipCols && opts.skipCols.indexOf(C) !== -1) continue;
        cell.z = "#,##0.00";
      }
    }
  }
  // Celdas con fórmula: se escribe el valor ya calculado (por si se abre sin
  // recalcular) y además la fórmula real, para que se pueda auditar de dónde
  // sale cada número sin depender de que Excel recalcule al abrir.
  if (opts.formulas) {
    opts.formulas.forEach((formula, key) => {
      const [R, C] = key.split(":").map(Number);
      const addr = XLSX.utils.encode_cell({ r: R, c: C });
      const existing = ws[addr];
      const v = existing && typeof existing.v === "number" ? existing.v : 0;
      ws[addr] = Object.assign({ t: "n", v, f: formula }, existing && existing.z ? { z: existing.z } : { z: "#,##0.00" });
    });
  }
  if (opts.colWidths) ws["!cols"] = opts.colWidths.map((w) => ({ wch: w }));
  if (opts.merges) ws["!merges"] = opts.merges;
  if (opts.freezeHeaderRow != null) ws["!freeze"] = { xSplit: 0, ySplit: opts.freezeHeaderRow };

  // Estilo: título de la hoja (fila 0) en violeta con texto blanco, banners
  // de sección (filas fusionadas de punta a punta, se detectan solas a
  // partir de los merges) en violeta claro, encabezados de columna
  // (opts.headerRows, porque no siempre están fusionados y hay que
  // indicarlos a mano) en un violeta más suave — los tres centrados tanto
  // horizontal como verticalmente —, filas de "TOTAL" en negrita (se
  // detectan solas: cualquier fila de datos cuya primera celda esté toda en
  // mayúsculas), borde fino y visible en toda celda con datos, y además un
  // contorno más grueso alrededor de cada "cuadro" (cada bloque de filas
  // contiguas separado del resto por una fila en blanco). Va al final para
  // no perder el estilo cuando el paso de fórmulas de arriba reemplaza la
  // celda.
  const THIN = { style: "thin", color: { rgb: "9B8AC4" } };
  const THICK = { style: "medium", color: { rgb: "5B21B6" } };
  const bannerRows = new Set();
  (opts.merges || []).forEach((m) => { if (m && m.s.r === m.e.r && m.e.c > m.s.c) bannerRows.add(m.s.r); });
  const headerRows = new Set(opts.headerRows || []);
  const isTotalLabel = (v) => typeof v === "string" && /(^|[^a-záéíóúñ])TOTAL(ES)?([^a-záéíóúñ]|$)/i.test(v.trim());

  // Detectar cada "cuadro": tramo de filas contiguas con datos, separado del
  // resto por al menos una fila en blanco. Sirve tanto para el contorno
  // grueso como, en general, para saber qué columnas ocupa cada bloque.
  const blocks = [];
  let curStart = null, curMin = Infinity, curMax = -1;
  const closeBlock = (endExclusive) => {
    if (curStart === null) return;
    blocks.push({ r0: curStart, r1: endExclusive - 1, c0: curMin, c1: curMax });
    curStart = null; curMin = Infinity; curMax = -1;
  };
  for (let r = 0; r < rows.length; r++) {
    const row = rows[r];
    const isPlain = opts.plainRows && opts.plainRows.has(r);
    const cellsWithData = (row && !isPlain) ? row.map((v, c) => (v !== undefined && v !== "" && v !== null ? c : -1)).filter((c) => c >= 0) : [];
    if (cellsWithData.length) {
      if (curStart === null) curStart = r;
      cellsWithData.forEach((c) => { if (c < curMin) curMin = c; if (c > curMax) curMax = c; });
    } else {
      closeBlock(r);
    }
  }
  closeBlock(rows.length);

  const finalRef = ws["!ref"];
  if (finalRef) {
    const range = XLSX.utils.decode_range(finalRef);
    for (let R = range.s.r; R <= range.e.r; R++) {
      for (let C = range.s.c; C <= range.e.c; C++) {
        const addr = XLSX.utils.encode_cell({ r: R, c: C });
        const cell = ws[addr];
        if (!cell) continue;
        if (opts.plainRows && opts.plainRows.has(R)) {
          cell.s = { font: { italic: true, color: { rgb: "6B6480" } }, alignment: { wrapText: true, vertical: "top" } };
          continue;
        }
        const style = { border: { top: THIN, bottom: THIN, left: THIN, right: THIN } };
        if (R === 0 || (opts.mainTitleRows && opts.mainTitleRows.has(R))) {
          style.font = { bold: true, sz: 13, color: { rgb: "FFFFFF" } };
          style.fill = { patternType: "solid", fgColor: { rgb: "6D28D9" } };
          style.alignment = { vertical: "center", horizontal: "center", wrapText: true };
        } else if (bannerRows.has(R)) {
          style.font = { bold: true, color: { rgb: "3D2273" } };
          style.fill = { patternType: "solid", fgColor: { rgb: "EAE1FB" } };
          style.alignment = { vertical: "center", horizontal: "center", wrapText: true };
          if (opts.highlightBanners && opts.highlightBanners.has(R)) {
            const h = opts.highlightBanners.get(R);
            style.font = { bold: true, color: { rgb: h.fg } };
            style.fill = { patternType: "solid", fgColor: { rgb: h.bg } };
          }
        } else if (headerRows.has(R)) {
          style.font = { bold: true, color: { rgb: "3D2273" } };
          style.fill = { patternType: "solid", fgColor: { rgb: "F5F1FC" } };
          style.alignment = { wrapText: true, vertical: "center", horizontal: "center" };
        } else {
          style.alignment = { wrapText: wrapCols.includes(C), vertical: "top" };
          if (cell.v === "REVISAR") style.font = { bold: true, color: { rgb: "C0392B" } };
          else if (isTotalLabel(rows[R] && rows[R][0])) style.font = { bold: true };
          if (opts.highlightRows && opts.highlightRows.has(R)) {
            const h = opts.highlightRows.get(R);
            style.font = { bold: true, color: { rgb: h.fg } };
            style.fill = { patternType: "solid", fgColor: { rgb: h.bg } };
          }
          if (opts.highlightCells && opts.highlightCells.has(R + ":" + C)) {
            const h = opts.highlightCells.get(R + ":" + C);
            style.font = { bold: true, color: { rgb: h.fg } };
            style.fill = { patternType: "solid", fgColor: { rgb: h.bg } };
          }
        }
        cell.s = style;
      }
    }
    // Contorno grueso por cuadro, encima del borde fino de cada celda.
    blocks.forEach((b) => {
      for (let R = b.r0; R <= b.r1; R++) {
        for (let C = b.c0; C <= b.c1; C++) {
          const addr = XLSX.utils.encode_cell({ r: R, c: C });
          const cell = ws[addr];
          if (!cell || !cell.s || !cell.s.border) continue;
          if (R === b.r0) cell.s.border.top = THICK;
          if (R === b.r1) cell.s.border.bottom = THICK;
          if (C === b.c0) cell.s.border.left = THICK;
          if (C === b.c1) cell.s.border.right = THICK;
        }
      }
    });
    // Divisores internos (por ejemplo, entre jurisdicciones dentro del mismo
    // cuadro): una línea algo más marcada arriba de esa fila, sin llegar a
    // fragmentar el cuadro en varios.
    (opts.innerDividerRows || []).forEach((R) => {
      for (let C = range.s.c; C <= range.e.c; C++) {
        const addr = XLSX.utils.encode_cell({ r: R, c: C });
        const cell = ws[addr];
        if (cell && cell.s && cell.s.border) cell.s.border.top = { style: "medium", color: { rgb: "B7A9E0" } };
      }
    });

    // Alto de fila automático para las celdas con ajuste de texto: al abrir
    // un archivo generado por código (a diferencia de uno tipeado a mano en
    // Excel), el alto de fila NO se agranda solo cuando el texto necesita
    // más de un renglón — por eso el texto quedaba "desbordado" fuera del
    // recuadro. Estimamos cuántos renglones va a necesitar cada celda con
    // wrap (según el ancho de su columna, sumando las columnas fusionadas
    // si corresponde) y le damos a la fila el alto que haga falta.
    const colChars = (opts.colWidths || []).map((w) => (typeof w === "number" ? w : 10));
    const mergeWidthFor = (R, C) => {
      let found = null;
      (opts.merges || []).forEach((m) => { if (m && m.s.r === R && m.s.c <= C && C <= m.e.c) found = m; });
      if (!found) return colChars[C] || 10;
      let sum = 0;
      for (let cc = found.s.c; cc <= found.e.c; cc++) sum += colChars[cc] || 10;
      return sum;
    };
    const rowHeights = {};
    for (let R = range.s.r; R <= range.e.r; R++) {
      const row = rows[R];
      if (!row) continue;
      let maxLines = 1;
      row.forEach((v, C) => {
        if (v === undefined || v === "" || v === null) return;
        const wraps = R === 0 || bannerRows.has(R) || headerRows.has(R) || wrapCols.includes(C);
        if (!wraps) return;
        const charsPerLine = Math.max(mergeWidthFor(R, C) - 2, 6);
        const lines = Math.max(1, Math.ceil(String(v).length / charsPerLine));
        if (lines > maxLines) maxLines = lines;
      });
      if (maxLines > 1) rowHeights[R] = Math.min(maxLines * 14 + 5, 220);
    }
    if (Object.keys(rowHeights).length) {
      ws["!rows"] = ws["!rows"] || [];
      Object.keys(rowHeights).forEach((R) => { ws["!rows"][R] = { hpt: rowHeights[R] }; });
    }
  }
  return ws;
}

// Notación A1, con la hoja entre comillas simples cuando corresponde (nombre
// con espacios) para referencias entre hojas: xsheetRef("IVA 08-2026", 4, 3).
function cellA1(r, c) { return XLSX.utils.encode_cell({ r, c }); }
function xsheetRef(sheetName, r, c) { return `'${sheetName}'!${cellA1(r, c)}`; }

function sectionMerge(rows, ncols) {
  const r = rows.length - 1;
  return ncols > 1 ? { s: { r, c: 0 }, e: { r, c: ncols - 1 } } : null;
}

function buildIndexSheet(wb, client, sections, which, extraLine) {
  const rows = [];
  const plainRows = new Set();
  const headerRows = [];
  rows.push([client.name]);
  rows.push([client.cuit ? `CUIT ${client.cuit}` : "CUIT sin cargar"]);
  rows.push([]);
  rows.push([`Generado el ${nowStampAR()} desde el tablero de Papeles de Trabajo Fiscales`]);
  plainRows.add(rows.length - 1);
  if (extraLine) { rows.push([extraLine]); plainRows.add(rows.length - 1); }
  rows.push([]);
  rows.push(["Contenido de este archivo"]);
  const contenidoMerge = sectionMerge(rows, 2);
  rows.push(["Hoja", "Contenido"]);
  headerRows.push(rows.length - 1);
  sections.forEach((s) => rows.push([s.sheet, s.desc]));
  rows.push([]);
  rows.push(["Cómo leer las columnas"]);
  const leyendaMerge = sectionMerge(rows, 2);
  rows.push(["Término", "Significado"]);
  headerRows.push(rows.length - 1);
  rows.push(["Según Libros", "Importe registrado en la contabilidad del contribuyente."]);
  rows.push(["Según Portal", which === "iva"
    ? "Importe que figura en el portal de ARCA (Portal IVA)."
    : "Importe que figura en el portal de la jurisdicción / SIFERE."]);
  rows.push(["Calculado", "Importe que resulta de aplicar la alícuota al monto según libros."]);
  rows.push(["Diferencia", "Según Portal menos Calculado. Si supera $1 en valor absoluto, se marca \"REVISAR\"."]);
  const merges = [
    { s: { r: 0, c: 0 }, e: { r: 0, c: 1 } },
    contenidoMerge,
    leyendaMerge,
  ];
  const ws = newSheet(rows, { colWidths: [34, 66], merges: merges.filter(Boolean), headerRows, plainRows, wrapCols: [0, 1] });
  XLSX.utils.book_append_sheet(wb, ws, "Índice");
}

// `which`: "iva" | "iibb" — cada impuesto sale en su propio archivo, con su
// propio Índice (las hojas de IVA y de IIBB no se referencian entre sí).
function exportClientToExcel(client, which) {
  if (!client) return;
  const esIva = which === "iva";
  const wb = XLSX.utils.book_new();
  // Nombre del archivo: "<Sociedad> IVA 09-2026" (período que se está viendo).
  const periodoArch = state.currentPeriod ? state.currentPeriod.slice(5, 7) + "-" + state.currentPeriod.slice(0, 4) : "";
  const baseName = `${client.name.replace(/[\\/:*?"<>|]+/g, " ").replace(/\s+/g, " ").trim()} ${esIva ? "IVA" : "IIBB"}${periodoArch ? " " + periodoArch : ""}`;
  wb.Props = { Title: baseName, Author: "Papeles de Trabajo Fiscales", CreatedDate: new Date() };

  const sections = [];
  let extraIndice = null;
  if (esIva && client.iva.enabled) {
    const hayPeriodo = listPeriodsWithTax(client.id, "iva").includes(state.currentPeriod);
    const conProrrateo = hayPeriodo && calcIvaFor(client, state.currentPeriod).prorrateoExentoEnabled;
    sections.push({ sheet: "Posición IVA", desc: "Resultado de IVA mes por mes (débito, crédito, saldos y arrastre) de todos los períodos cargados, con el período que se está viendo primero y resaltado." });
    if (hayPeriodo) {
      extraIndice = "Período detallado en las hojas IVA, Ventas x Actividad y F2083: " + periodLabel(state.currentPeriod);
      sections.push({ sheet: "IVA", desc: "Detalle del período que se está viendo: débito y crédito fiscal con origen de cada importe" + (conProrrateo ? ", y prorrateo del crédito fiscal (ventas gravadas y exentas, coeficiente, CF computable y no computable)." : ".") });
      if ((client.iva.activities || []).length) sections.push({ sheet: "Ventas x Actividad", desc: "Apertura de las ventas del período por actividad: gravadas por alícuota, exentas o no gravadas, N.C. emitidas y ventas netas." });
      sections.push({ sheet: "F2083", desc: "Resumen del Formulario 2083 del período (ventas, compras y operaciones que no generan crédito fiscal), para cotejar contra el Libro de IVA Digital." });
    }
  }
  if (!esIva && client.iibbLocal.enabled) sections.push({ sheet: "DDJJ IIBB Local", desc: "Liquidación mensual de Ingresos Brutos, jurisdicción local." });
  if (!esIva && client.iibbCM.enabled) sections.push({ sheet: "Liquidación CM / Detalle CM / Base y Coeficientes CM", desc: "Ingresos Brutos Convenio Multilateral: monto imponible por actividad, coeficientes de distribución y liquidación por jurisdicción." });
  if (!esIva && state.currentPeriod) extraIndice = "Período que se está viendo: " + periodLabel(state.currentPeriod) + " — figura primero y resaltado en las hojas; el resto, en orden cronológico.";
  buildIndexSheet(wb, client, sections, esIva ? "iva" : "iibb", extraIndice);

  if (esIva && client.iva.enabled) buildIvaSheets(wb, client);
  if (!esIva && client.iibbLocal.enabled) buildIibbLocalSheet(wb, client);
  if (!esIva && client.iibbCM.enabled) buildIibbCMSheets(wb, client);

  // Orden de las pestañas: primero el resultado (la DDJJ / la liquidación) y
  // después las hojas de respaldo que explican de dónde sale cada número. Las
  // hojas se arman en el orden del cálculo (porque las fórmulas se referencian
  // entre sí), así que acá se reordenan; lo que no figura en la lista queda
  // al final, en su orden original.
  const ordenPestanias = ["Índice", "Posición IVA", "IVA", "Ventas x Actividad", "F2083", "DDJJ IIBB Local", "IIBB Local Activ.", "Liquidación CM", "Detalle CM", "Base y Coeficientes CM"];
  const posicion = (n) => { const i = ordenPestanias.findIndex((pre) => n.startsWith(pre)); return i === -1 ? ordenPestanias.length : i; };
  wb.SheetNames = wb.SheetNames.map((n, i) => ({ n, i })).sort((a, b) => posicion(a.n) - posicion(b.n) || a.i - b.i).map((x) => x.n);

  const bytes = XLSX.write(wb, { bookType: "xlsx", type: "array" });
  const blob = new Blob([bytes], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  const filename = baseName + ".xlsx";

  if (state.downloads) {
    state.downloads.save({ filename, data: blob }).then(() => showToast("Excel descargado")).catch((err) => {
      if (err && err.code === "declined") return;

function ganCalc(cid, anio) {

  let tIng = 0, tEgr = 0;

    const g = (k) => {
      if (k === "sueldos") return ganF931Total(r, mm);

    tIng += ing; tEgr += egr;
  });

  v["t.ing"] = round2(tIng); v["t.egr"] = round2(tEgr);
  v["t.ajI"] = round2(tIng - T.arcaIng); v["t.ajE"] = round2(tEgr - T.arcaEgr);
  // Primera categoría
  const ing1 = T.alq + n("c1.otros"), gas1 = T.gAlq + n("c1.gastos") + n("c1.amort") + n("c1.presuntos");
  v["c1.ing"] = round2(ing1); v["c1.gas"] = round2(gas1); v["c1.neto"] = round2(ing1 - gas1 + n("adj.c1"));
  // Segunda categoría
  v["c2.divNeto"] = round2(T.div - n("c2.costoDiv"));
  v["c2.otros"] = round2(n("c2.otrosIng") - n("c2.otrosGas") + n("c2.derIng") - n("c2.derGas") + n("adj.c2"));
  // Tercera categoría (estado de resultados de la empresa / explotación y participación propia)
  const ingG = T.vb - T.nc + T.vex + n("c3.otrosIng");
  const costo = n("c3.bcIni") + T.compras + n("c3.comprasCosto") - n("c3.bcCie");
  const gnc = T.sueldos + T.iibb + n("c3.gastosNoCosto") + n("c3.amort") - n("c3.otrosRes");
  const gEmp = ingG - costo - gnc, pctTxt = String(getDeep(r, "c3.part", "")).trim(), pct = pctTxt === "" ? 100 : num(pctTxt);
  v["c3.ing"] = round2(ingG); v["c3.costo"] = round2(costo); v["c3.bruta"] = round2(ingG - costo);
  v["c3.gnc"] = round2(gnc); v["c3.emp"] = round2(gEmp); v["c3.pct"] = pct; v["c3.partNeto"] = round2(gEmp * pct / 100);
  v["c3.neto"] = round2(gEmp * pct / 100 + n("c3.oiIng") - n("c3.oiGas") + n("adj.c3"));

  const neto = v["c1.neto"] + v["c2.otros"] + v["c3.neto"] + v["c4.neto"];
  v["neto"] = round2(neto);
  v["subtotal"] = round2(neto - n("q.deriv"));
  v["antesDG"] = round2(v["subtotal"] - n("q.desgrav"));

function ganV(k, cls) { return `<span data-gv="${k}" ${cls ? `class="${cls}"` : ""}>${fmtMoneyRaw(GV[k] || 0)}</span>`; }

    return `<td>${ganInp("meses." + mm + "." + c[0], `data-tbl="${tbl}" data-mi="${mi}" data-ci="${ci}"`, auto)}</td>`;
  };
  const filas = GAN_MESES_KEYS.map((mm, mi) => `<tr><td style="text-align:left;">${MESES[mi]}</td>${cols.map((c, ci) => celda(mm, mi, c, ci)).join("")}
    <td class="num auto">${ganV("m" + mm + "." + (tbl === "ing" ? "ing" : "egr"))}</td>
    <td>${ganInp("meses." + mm + "." + arcaKey, `data-tbl="${tbl}" data-mi="${mi}" data-ci="${cols.length}"`)}</td>
    <td class="num auto">${ganV("m" + mm + "." + (tbl === "ing" ? "ajI" : "ajE"))}</td></tr>`).join("");
  const tot = `<tr class="tot"><td style="text-align:left;">TOTALES</td>${cols.map((c) => `<td class="num">${ganV("t." + c[0])}</td>`).join("")}<td class="num">${ganV("t." + totKey)}</td><td class="num">${ganV("t." + arcaKey)}</td><td class="num">${ganV("t." + ajKey)}</td></tr>`;

}

// ---- DDJJ modelo ----
// Devuelve las secciones en el mismo orden del aplicativo "Declaración jurada simplificada".
function ganDdjjSecciones(cid, anio) {
  const v = ganCalc(cid, anio), r = ganGet(cid, anio), c = getClient(cid) || {};
  const f = (l, val, o) => Object.assign({ l, v: val }, o || {});
  const secs = [];
  secs.push({ t: "Datos iniciales", filas: [{ l: "Contribuyente", txt: c.name || "" }, { l: "CUIT", txt: c.cuit || "—" }, { l: "Período fiscal", txt: String(anio) }] });
  const rent = [];
  const nz = (...ks) => ks.some((k) => Math.abs(v[k] || 0) > 0.004);
  if (nz("c1.ing", "c1.gas", "c1.neto")) rent.push(f("1ª categoría · Ingresos", v["c1.ing"]), f("1ª categoría · Gastos", v["c1.gas"]), f("1ª categoría · Resultado neto", v["c1.neto"], { sub: true }));
