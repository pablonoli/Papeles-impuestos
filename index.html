document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.dataset.action === "search-clients") {
    state.clientSearch = t.value;
    renderSidebarPreservingFocus();
  } else if (t.dataset.action === "field") {
    const { clientid, period, path } = t.dataset;
    touchDoc(clientid, period, (doc) => setDeep(doc, path, t.value));
    syncVentasNetasFromIvaActividad(clientid, period, path);
    const refresher = MODAL_REFRESHERS[t.dataset.reopen];
    if (refresher && t.type === "date") refresher(clientid, period);
    else renderPreservingFocus();
  } else if (t.dataset.action === "field-checkbox") {
    const { clientid, period, path } = t.dataset;
    touchDoc(clientid, period, (doc) => setDeep(doc, path, t.checked));
    const refresher = MODAL_REFRESHERS[t.dataset.reopen];
    if (refresher) refresher(clientid, period);
    else renderPreservingFocus();
  } else if (t.dataset.cfg) {
    handleConfigInput(t);
  }
});

// Al perder el foco, si el campo es un monto o una alícuota/coeficiente,
// se reformatea para que se vea prolijo (separador de miles y 2 decimales
// para montos; 2-4 decimales para porcentajes) — nunca mientras se tipea,
// para no romper el punto decimal en progreso (ver `num`/`rawOrBlank`).
document.addEventListener(
  "focusout",
  (e) => {
    if (isRerendering) return; // synthetic blur from removing the focused node during re-render, not a real blur
    const t = e.target;
    if (!t || !t.dataset) return;
    const kind = t.dataset.kind;
    if (kind !== "money" && kind !== "percent") return;
    const refresher = MODAL_REFRESHERS[t.dataset.reopen];
    const raw = String(t.value || "").trim();
    if (raw === "") { if (refresher) refresher(t.dataset.clientid, t.dataset.period); return; }
    const formatted = kind === "money" ? fmtMoneyRaw(num(raw)) : fmtPctRaw(num(raw));
    if (formatted === raw) { if (refresher) refresher(t.dataset.clientid, t.dataset.period); return; }
    t.value = formatted;
    if (t.dataset.action === "field") {
      const { clientid, period, path } = t.dataset;
      touchDoc(clientid, period, (doc) => setDeep(doc, path, formatted));
      if (refresher) { refresher(clientid, period); return; }
    } else if (t.dataset.cfg) {
      handleConfigInput(t);
    }
  },
  true
);

document.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-action]");
  if (!btn) return;

  if (action === "select-client") { state.currentClientId = btn.dataset.client; pickDefaultPeriod(); state.currentTab = "resumen"; render(); }
  else if (action === "select-tab") { state.currentTab = btn.dataset.tab; render(); }
  else if (action === "period-prev") { if (state.currentPeriod > MIN_PERIOD) { state.currentPeriod = addMonths(state.currentPeriod, -1); state.selectedCoefDesde = null; render(); } }
  else if (action === "period-next") { state.currentPeriod = addMonths(state.currentPeriod, 1); state.selectedCoefDesde = null; render(); }
  else if (action === "open-add-client") { openAddClientModal(); }
  else if (action === "delete-client") { if (confirm("¿Eliminar este cliente y todos sus períodos cargados?")) deleteClient(currentClient().id); }
  else if (action === "export-excel") { exportClientToExcel(currentClient()); }
  else if (action === "add-activity") { mutateClient(currentClient().id, (c) => c.iibbCM.activities.push({ code: "", desc: "" })); render(); }
  else if (action === "remove-activity") { const idx = Number(btn.dataset.idx); mutateClient(currentClient().id, (c) => c.iibbCM.activities.splice(idx, 1)); render(); }
  else if (action === "add-activity-local") { mutateClient(currentClient().id, (c) => c.iibbLocal.activities.push({ code: "", desc: "", alicuota: 0 })); render(); }
  else if (action === "remove-activity-local") { const idx = Number(btn.dataset.idx); mutateClient(currentClient().id, (c) => c.iibbLocal.activities.splice(idx, 1)); render(); }
  else if (action === "remove-activity-iva") { const idx = Number(btn.dataset.idx); mutateClient(currentClient().id, (c) => c.iva.activities.splice(idx, 1)); render(); }
  else if (action === "open-activity-picker-local") { openActivityPickerModal("iibbLocal"); }
  else if (action === "open-activity-picker-cm") { openActivityPickerModal("iibbCM"); }
  else if (action === "open-activity-picker-iva") { openActivityPickerModal("iva"); }
  else if (action === "open-decreto814-modal") { renderDecreto814Modal(btn.dataset.clientid, btn.dataset.period); }

  else if (action === "open-f2083-modal") { renderFormulario2083Modal(btn.dataset.clientid, btn.dataset.period); }
  else if (action === "open-iva-actividades-modal") { ivaActividadesActiveCode = null; renderIvaActividadesModal(btn.dataset.clientid, btn.dataset.period); }
  else if (action === "select-iva-actividad") { ivaActividadesActiveCode = btn.dataset.code; renderIvaActividadesModal(btn.dataset.clientid, btn.dataset.period); }
  else if (action === "toggle-theme") { toggleTheme(); }
  else if (action === "open-sync-modal") { renderSyncModal(); }
  else if (action === "sync-save") { syncSaveFromModal(); }
  else if (action === "sync-pull-now") { syncPullFromModal(); }
  else if (action === "add-coef-vigencia") { renderCoefVigenciaModal(currentClient().id, null); }
  else if (action === "edit-coef-vigencia") { renderCoefVigenciaModal(currentClient().id, btn.dataset.desde); }
  else if (action === "remove-jurisdiction") { const idx = Number(btn.dataset.idx); mutateClient(currentClient().id, (c) => c.iibbCM.jurisdictions.splice(idx, 1)); render(); }
  else if (action === "add-all-jurisdictions") {
    mutateClient(currentClient().id, (c) => {
      const existing = new Set(c.iibbCM.jurisdictions.map((j) => j.name));
      AR_JURISDICCIONES.forEach((name) => { if (!existing.has(name)) c.iibbCM.jurisdictions.push({ name, alicuotas: {} }); });
    });
    render();

});

function handleConfigInput(t) {
  const c = currentClient();
  if (!c) return;
  const cfg = t.dataset.cfg;
  if (cfg === "name") mutateClient(c.id, (cl) => (cl.name = t.value));
  else if (cfg === "cuit") mutateClient(c.id, (cl) => (cl.cuit = t.value));
  else if (cfg === "toggle-iva") mutateClient(c.id, (cl) => (cl.iva.enabled = t.checked));
  else if (cfg === "toggle-prorrateo-exento") mutateClient(c.id, (cl) => (cl.iva.prorrateoExento = t.checked));
  else if (cfg === "toggle-iibblocal") mutateClient(c.id, (cl) => (cl.iibbLocal.enabled = t.checked));
  else if (cfg === "toggle-iibbcm") mutateClient(c.id, (cl) => (cl.iibbCM.enabled = t.checked));
  else if (cfg === "decreto814rate") mutateClient(c.id, (cl) => (cl.iva.decreto814Rate = t.value));
  else if (cfg === "iva-saldo-tecnico-inicial") mutateClient(c.id, (cl) => (cl.iva.saldosIniciales.saldoTecnicoAnterior = t.value));
  else if (cfg === "iva-saldo-libre-inicial") mutateClient(c.id, (cl) => (cl.iva.saldosIniciales.saldoLibreDisponibilidadAnterior = t.value));
  else if (cfg === "iibblocal-jurisdiccion") mutateClient(c.id, (cl) => (cl.iibbLocal.jurisdiccion = t.value));
  else if (cfg === "iibblocal-saldo-inicial") mutateClient(c.id, (cl) => (cl.iibbLocal.saldoInicial = t.value));
  else if (cfg === "iibblocal-activity-code") mutateClient(c.id, (cl) => (cl.iibbLocal.activities[Number(t.dataset.idx)].code = t.value));
  else if (cfg === "iva-activity-code") mutateClient(c.id, (cl) => (cl.iva.activities[Number(t.dataset.idx)].code = t.value));
  else if (cfg === "iva-activity-desc") mutateClient(c.id, (cl) => (cl.iva.activities[Number(t.dataset.idx)].desc = t.value));
  else if (cfg === "iibblocal-activity-desc") mutateClient(c.id, (cl) => (cl.iibbLocal.activities[Number(t.dataset.idx)].desc = t.value));
  else if (cfg === "iibblocal-activity-alicuota") mutateClient(c.id, (cl) => (cl.iibbLocal.activities[Number(t.dataset.idx)].alicuota = t.value));
  else if (cfg === "activity-code") mutateClient(c.id, (cl) => (cl.iibbCM.activities[Number(t.dataset.idx)].code = t.value));
  else if (cfg === "activity-desc") mutateClient(c.id, (cl) => (cl.iibbCM.activities[Number(t.dataset.idx)].desc = t.value));
  else if (cfg === "jur-alicuota") mutateClient(c.id, (cl) => {
    const jur = cl.iibbCM.jurisdictions.find((j) => j.name === t.dataset.jur);
    if (jur) { jur.alicuotas = jur.alicuotas || {}; jur.alicuotas[t.dataset.code] = t.value; }
  });
  else if (cfg === "coef") mutateClient(c.id, (cl) => {
    const desde = t.dataset.desde;
    const v = (cl.iibbCM.coeficientes || []).find((x) => x.desde === desde);
    if (v) { v.valores = v.valores || {}; v.valores[t.dataset.jur] = t.value; }
  });
  else if (cfg === "saldo-inicial-cm") mutateClient(c.id, (cl) => {
    cl.iibbCM.saldosIniciales = cl.iibbCM.saldosIniciales || {};
    cl.iibbCM.saldosIniciales[t.dataset.jur] = t.value;
  });
  renderPreservingFocus();
}

// Cerrar el modal al clickear el fondo, pero sólo cuando el click fue

function wireModalBackdropClose() {
  const backdrop = document.querySelector("#modal-root .modal-backdrop");
  if (backdrop) backdrop.addEventListener("click", (e) => { if (e.target === e.currentTarget) document.getElementById("modal-root").innerHTML = ""; });

// ---------------------------------------------------------------------
// Selector de fecha propio (reemplaza <input type="date"> nativo, que no
// se puede re-diseñar para que combine con la paleta de la herramienta).
// ---------------------------------------------------------------------
let datePickerState = null; // { path, clientId, period, reopen, viewYear, viewMonth, selected, anchorRect }
function fmtDateDMY(iso) {
  if (!iso) return "";
  const [y, m, d] = iso.split("-");
  return `${d}/${m}/${y}`;
}
function openDatePickerFor(btn) {
  const { path, clientid, period, reopen } = btn.dataset;
  if (datePickerState && datePickerState.path === path && datePickerState.clientId === clientid && datePickerState.period === period) {
    closeDatePicker();
    return;
  }
  const doc = getDoc(clientid, period);
  const current = getDeep(doc, path, "") || "";
  const base = current ? new Date(current + "T00:00:00") : new Date();
  datePickerState = {
    path, clientId: clientid, period, reopen,
    viewYear: base.getFullYear(), viewMonth: base.getMonth(),
    selected: current || null,
    anchorRect: btn.getBoundingClientRect(),
  };
  renderDatePicker();
}
function closeDatePicker() {
  datePickerState = null;
  const root = document.getElementById("date-picker-root");
  if (root) root.innerHTML = "";
}
function saveDatePickerValue(iso) {
  if (!datePickerState) return;
  const { clientId, period, path, reopen } = datePickerState;
  touchDoc(clientId, period, (doc) => setDeep(doc, path, iso));
  const refresher = MODAL_REFRESHERS[reopen];
  if (refresher) refresher(clientId, period); else render();
}
function renderDatePicker() {
  const root = document.getElementById("date-picker-root");
  if (!datePickerState) { root.innerHTML = ""; return; }
  const { viewYear, viewMonth, selected, anchorRect } = datePickerState;
  const startDow = new Date(viewYear, viewMonth, 1).getDay();
  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
  const daysInPrevMonth = new Date(viewYear, viewMonth, 0).getDate();
  const now = new Date();
  const cells = [];
  for (let i = 0; i < startDow; i++) {
    const d = daysInPrevMonth - startDow + 1 + i;
    const m = viewMonth === 0 ? 11 : viewMonth - 1, y = viewMonth === 0 ? viewYear - 1 : viewYear;
    cells.push({ d, m, y, muted: true });
  }
  for (let d = 1; d <= daysInMonth; d++) cells.push({ d, m: viewMonth, y: viewYear, muted: false });
  while (cells.length < 42) {
    const d = cells.length - (startDow + daysInMonth) + 1;
    const m = viewMonth === 11 ? 0 : viewMonth + 1, y = viewMonth === 11 ? viewYear + 1 : viewYear;
    cells.push({ d, m, y, muted: true });
  }
  const isoOf = (c) => `${c.y}-${String(c.m + 1).padStart(2, "0")}-${String(c.d).padStart(2, "0")}`;
  const dowLabels = ["DO", "LU", "MA", "MI", "JU", "VI", "SA"];
  const dayButtons = cells.map((c) => {
    const iso = isoOf(c);
    const cls = ["dp-day"];
    if (c.muted) cls.push("dp-muted");
    if (c.y === now.getFullYear() && c.m === now.getMonth() && c.d === now.getDate()) cls.push("dp-today");
    if (selected && iso === selected) cls.push("dp-selected");
    return `<button type="button" class="${cls.join(" ")}" data-dp-iso="${iso}">${c.d}</button>`;
  }).join("");
  const monthLabel = `${MESES[viewMonth].toLowerCase()} de ${viewYear}`;

  const popW = 270, popH = 340;
  let top = anchorRect.bottom + 6, left = anchorRect.left;
  if (left + popW > window.innerWidth - 10) left = window.innerWidth - popW - 10;
  if (left < 10) left = 10;
  if (top + popH > window.innerHeight - 10) top = anchorRect.top - popH - 6;
  if (top < 10) top = 10;

  root.innerHTML = `
    <div class="date-picker-popover" style="top:${top}px;left:${left}px;">
      <div class="dp-head">
        <button type="button" data-dp-action="prev-month" title="Mes anterior">‹</button>
        <b>${monthLabel}</b>
        <button type="button" data-dp-action="next-month" title="Mes siguiente">›</button>
      </div>
      <div class="dp-grid">
        ${dowLabels.map((l) => `<div class="dp-dow">${l}</div>`).join("")}
        ${dayButtons}
      </div>
      <div class="dp-foot">
        <button type="button" data-dp-action="clear">Borrar</button>
        <button type="button" data-dp-action="today">Hoy</button>
      </div>
    </div>`;
}
document.getElementById("date-picker-root").addEventListener("click", (e) => {
  const dayBtn = e.target.closest("[data-dp-iso]");
  if (dayBtn) { saveDatePickerValue(dayBtn.dataset.dpIso); closeDatePicker(); return; }
  const actionBtn = e.target.closest("[data-dp-action]");
  if (!actionBtn || !datePickerState) return;
  const action = actionBtn.dataset.dpAction;
  if (action === "prev-month") {
    datePickerState.viewMonth--;
    if (datePickerState.viewMonth < 0) { datePickerState.viewMonth = 11; datePickerState.viewYear--; }
    renderDatePicker();
  } else if (action === "next-month") {
    datePickerState.viewMonth++;
    if (datePickerState.viewMonth > 11) { datePickerState.viewMonth = 0; datePickerState.viewYear++; }
    renderDatePicker();
  } else if (action === "clear") { saveDatePickerValue(""); closeDatePicker(); }
  else if (action === "today") {
    const n = new Date();
    saveDatePickerValue(`${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, "0")}-${String(n.getDate()).padStart(2, "0")}`);
    closeDatePicker();
  }
});

document.getElementById("modal-root").addEventListener("click", (e) => {
  const btn = e.target.closest("[data-action]");
  if (!btn) return;
  if (btn.dataset.action === "close-modal") document.getElementById("modal-root").innerHTML = "";
  else if (btn.dataset.action === "confirm-add-client") {
    const name = document.getElementById("new-client-name").value.trim();
    const cuit = document.getElementById("new-client-cuit").value.trim();
    document.getElementById("modal-root").innerHTML = "";
    addClient(name || "Nuevo cliente", cuit);
  }
  else if (btn.dataset.action === "confirm-coef-vigencia") {
    const re = /^\d{4}-(0[1-9]|1[0-2])$/;
    const desde = document.getElementById("coef-vig-desde").value.trim();
    const sigueVigente = document.getElementById("coef-vig-sigue").checked;
    const hasta = sigueVigente ? null : document.getElementById("coef-vig-hasta").value.trim();
    if (!re.test(desde)) { showToast("El período 'Desde' tiene que tener formato AAAA-MM"); return; }
    if (hasta && !re.test(hasta)) { showToast("El período 'Hasta' tiene que tener formato AAAA-MM"); return; }
    if (hasta && hasta < desde) { showToast("'Hasta' no puede ser anterior a 'Desde'"); return; }
    const editingDesde = btn.dataset.editing;
    let ok = true;
    mutateClient(currentClient().id, (c) => {
      c.iibbCM.coeficientes = c.iibbCM.coeficientes || [];
      if (editingDesde) {
        if (desde !== editingDesde && c.iibbCM.coeficientes.some((v) => v.desde === desde)) { ok = false; return; }
        const v = c.iibbCM.coeficientes.find((x) => x.desde === editingDesde);
        if (v) { v.desde = desde; v.hasta = hasta || null; }
      } else {
        if (c.iibbCM.coeficientes.some((v) => v.desde === desde)) { ok = false; return; }
        c.iibbCM.coeficientes.push({ desde, hasta: hasta || null, valores: {} });
      }
    });
    if (!ok) { showToast("Ya existe una vigencia cargada con esa fecha de inicio"); return; }
    state.selectedCoefDesde = desde;
    document.getElementById("modal-root").innerHTML = "";
    render();
  }
  else if (btn.dataset.action === "delete-coef-vigencia") {
    const desde = btn.dataset.desde;
    if (!confirm(`¿Eliminar la vigencia de coeficientes desde ${periodLabel(desde)}? Esta acción no se puede deshacer.`)) return;
    mutateClient(currentClient().id, (c) => {
      c.iibbCM.coeficientes = (c.iibbCM.coeficientes || []).filter((v) => v.desde !== desde);
    });
    if (state.selectedCoefDesde === desde) state.selectedCoefDesde = null;
    document.getElementById("modal-root").innerHTML = "";
    render();
  }
  else if (btn.dataset.action === "pick-activity") {
    const code = btn.dataset.code, desc = btn.dataset.desc;
    mutateClient(currentClient().id, (c) => {
      // Se carga la actividad en TODOS los regímenes que el cliente tenga
      // habilitados (no sólo en el que abrió el buscador) — si ya la usás
      // en IVA, tiene sentido que esté también en IIBB (local y/o Convenio
      // Multilateral), sin tener que cargarla dos o tres veces a mano.
      // Sacarla si no corresponde en alguno se sigue haciendo manual, con
      // "Quitar" — eso sí queda independiente por régimen.
      if (c.iva.enabled && !c.iva.activities.some((a) => a.code === code)) c.iva.activities.push({ code, desc });
      if (c.iibbLocal.enabled && !c.iibbLocal.activities.some((a) => a.code === code)) c.iibbLocal.activities.push({ code, desc, alicuota: 0 });
      if (c.iibbCM.enabled && !c.iibbCM.activities.some((a) => a.code === code)) c.iibbCM.activities.push({ code, desc });
    });
    document.getElementById("modal-root").innerHTML = "";
    render();
  }
});

function renderIvaActividadesModal(clientId, period) {
  const client = state.clients.find((c) => c.id === clientId);
  if (!client) return;
  const doc = getDoc(clientId, period);
  const porActividad = (doc && doc.iva && doc.iva.porActividad) || {};
  const activities = client.iva.activities || [];

  const rateCell = (code, group, key) => {
    const path = `iva.porActividad.${code}.${group}.${key}`;
    const val = getDeep(porActividad, `${code}.${group}.${key}`, 0);
    return `<td><input type="text" inputmode="decimal" data-kind="money" value="${rawOrBlank(val, "money")}" data-path="${path}" data-action="field" data-clientid="${clientId}" data-period="${period}" data-reopen="iva-actividades"></td>`;
  };
  const rateTable = (code, group, colRI, colCF) => `
    <table class="rate-table" style="table-layout:fixed;">
      <tr><th style="text-align:left;white-space:normal;">Alícuota</th><th style="white-space:normal;">${colRI}</th><th style="white-space:normal;">${colCF}</th></tr>

      <tr><td>21%</td>${rateCell(code, group, group === "debito" ? "ri21" : "ncEmit21RI")}${rateCell(code, group, group === "debito" ? "cf21" : "ncEmit21CF")}</tr>
    </table>`;

  const blocksByCode = {};
  activities.forEach((a) => {
    const pa = porActividad[a.code] || {};
    const debitoSum = ["ri105", "cf105", "ri21", "cf21"].reduce((s, k) => s + num(getDeep(pa, `debito.${k}`, 0)), 0);
    const ncSum = ["ncEmit105RI", "ncEmit105CF", "ncEmit21RI", "ncEmit21CF"].reduce((s, k) => s + num(getDeep(pa, `restCredito.${k}`, 0)), 0);
    const subtotal = debitoSum - ncSum + num(pa.exento) - num(pa.exentoNC);
    blocksByCode[a.code] = `
      <div class="card">
        <div class="card-head"><h3 style="font-size:13.5px;">${escapeHtml(a.code)} — ${escapeHtml(a.desc)}</h3></div>

            <h4 class="subhead-strong">1. Ventas gravadas</h4>
            <div class="table-scroll">${rateTable(a.code, "debito", "R.I. y Monotributistas", "Consumidores Finales y Exentos")}</div>
          </div>
          <div class="subsection">
            <h4 class="subhead-strong">2. Ventas exentas o no gravadas</h4>
            <div class="form-grid" style="grid-template-columns:repeat(2,1fr);">
              <div class="field"><label>Ventas exentas o no gravadas</label><input type="text" inputmode="decimal" data-kind="money" value="${rawOrBlank(pa.exento, "money")}" data-path="iva.porActividad.${a.code}.exento" data-action="field" data-clientid="${clientId}" data-period="${period}" data-reopen="iva-actividades"></div>
              <div class="field"><label>N.C. de venta — Exentas/No gravadas</label><input type="text" inputmode="decimal" data-kind="money" value="${rawOrBlank(pa.exentoNC, "money")}" data-path="iva.porActividad.${a.code}.exentoNC" data-action="field" data-clientid="${clientId}" data-period="${period}" data-reopen="iva-actividades"></div>
            </div>
          </div>
          <div class="subsection">
            <h4 class="subhead-strong">3. N.C. emitidas <span style="text-transform:none;letter-spacing:0;font-weight:600;color:var(--muted);font-size:12px;">(restitución de crédito fiscal)</span></h4>
            <div class="table-scroll">${rateTable(a.code, "restCredito", "R.I. y Monotributistas", "Consumidor Final y Exentos")}</div>
          </div>
          <div style="text-align:right;font-size:12px;color:var(--muted);border-top:1px solid var(--border);padding-top:8px;">Ventas Netas por actividad: <b class="mono">${fmtMoney(subtotal)}</b></div>
        </div>
      </div>`;
  });

  if (!activities.some((a) => a.code === ivaActividadesActiveCode)) {
    ivaActividadesActiveCode = activities[0] ? activities[0].code : null;
  }

  const activityTabs = activities.length > 1 ? `
    <div class="tabs" style="margin-bottom:14px;">
      ${activities.map((a) => `<button class="tab ${a.code === ivaActividadesActiveCode ? "active" : ""}" title="${escapeHtml(a.code)} — ${escapeHtml(a.desc)}" data-action="select-iva-actividad" data-code="${escapeHtml(a.code)}" data-clientid="${clientId}" data-period="${period}">${escapeHtml(a.code)}</button>`).join("")}
    </div>` : "";

  const blocks = (ivaActividadesActiveCode && blocksByCode[ivaActividadesActiveCode]) || `<p style="color:var(--muted);font-size:12px;">No hay actividades cargadas — agregalas en Configuración → IVA.</p>`;

  const granTotal = activities.reduce((s, a) => {
    const pa = porActividad[a.code] || {};
    const debitoSum = ["ri105", "cf105", "ri21", "cf21"].reduce((s2, k) => s2 + num(getDeep(pa, `debito.${k}`, 0)), 0);
    const ncSum = ["ncEmit105RI", "ncEmit105CF", "ncEmit21RI", "ncEmit21CF"].reduce((s2, k) => s2 + num(getDeep(pa, `restCredito.${k}`, 0)), 0);
    return s + debitoSum - ncSum + num(pa.exento) - num(pa.exentoNC);

  document.getElementById("modal-root").innerHTML = `

      <div class="modal" style="max-width:680px;">
        <div class="modal-head"><h3>Apertura de Otros Conceptos — ${periodLabel(period)}</h3><button class="btn btn-ghost" data-action="close-modal">✕</button></div>
        <div class="modal-body">

          ${blocks}
          <div style="text-align:right;font-size:13px;font-weight:700;padding-top:6px;">TOTAL — todas las actividades: <span class="mono">${fmtMoney(granTotal)}</span></div>
        </div>
        <div class="modal-foot"><button class="btn btn-accent" data-action="close-modal">Listo</button></div>
      </div>
    </div>`;
  wireModalBackdropClose();
}

function renderFormulario2083Modal(clientId, period) {
  const client = state.clients.find((c) => c.id === clientId);
  if (!client) return;
  const r = calcIvaFor(client, period);

  const sumNeto = (arr) => round2(arr.reduce((s, b) => s + b.neto, 0));
  const sumCalc = (arr) => round2(arr.reduce((s, b) => s + b.calculado, 0));

  // Ventas: "Operaciones de Venta" = Débito Fiscal (bruto); "Notas de Crédito
  // de Venta" = N.C. emitidas (restitución de crédito fiscal) — el F.2083
  // los declara sin netear, cada uno con su propia columna de Débito Fiscal.
  const ventasNeto = sumNeto(r.debitoBrackets), ventasDebito = sumCalc(r.debitoBrackets);
  const ncVentasNeto = sumNeto(r.restCreditoBrackets), ncVentasDebito = sumCalc(r.restCreditoBrackets);
  const ventasExento = num(r.exento.ventas), ncVentasExento = num(r.exento.ncVentas);

  // Compras: "Operaciones de Compra" = Crédito Fiscal; "Notas de Crédito de
  // Compra" = N.C. recibidas (restitución de débito fiscal).
  const comprasNeto = sumNeto(r.creditoBrackets), comprasCredito = sumCalc(r.creditoBrackets);
  const ncComprasNeto = sumNeto(r.restDebitoBrackets), ncComprasCredito = sumCalc(r.restDebitoBrackets);
  const comprasExento = num(r.exento.compras), ncComprasExento = num(r.exento.ncCompras);

  const operacionesNoCredito = num(r.exento.operacionesNoCredito);

  const row = (label, neto, exento, impuesto) => `
    <tr><td>${label}</td><td class="num">${fmtMoney(neto)}</td><td class="num">${fmtMoney(exento)}</td><td class="num">${fmtMoney(impuesto)}</td></tr>`;

  document.getElementById("modal-root").innerHTML = `

      <div class="modal" style="max-width:680px;">

        <div class="modal-body" style="gap:10px;">
          <p style="font-size:11.5px;color:var(--muted);margin:0;">Armado con lo cargado en la herramienta (según libros), para cotejar contra el Libro de IVA Digital antes de presentarlo en el Portal IVA.</p>
          <div style="margin-top:2px;">
            <h4 class="subhead-strong" style="margin-bottom:8px;">Ventas</h4>
            <div class="table-scroll"><table class="f2083-table">
              <tr><th style="text-align:left">Concepto</th><th style="text-align:right">Neto Gravado</th><th style="text-align:right">Exento o no Gravado</th><th style="text-align:right">Débito Fiscal</th></tr>
              ${row("Operaciones de Venta", ventasNeto, ventasExento, ventasDebito)}
              ${row("Notas de Crédito de Venta", ncVentasNeto, ncVentasExento, ncVentasDebito)}
            </table></div>
            <div class="foot-note" style="padding:6px 2px 0;">Operaciones de Exportación: <b class="mono">${fmtMoney(0)}</b> — la herramienta todavía no releva exportaciones; completalo manualmente si corresponde.</div>
          </div>
          <div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border);">
            <h4 class="subhead-strong" style="margin-bottom:8px;">Compras</h4>
            <div class="table-scroll"><table class="f2083-table">
              <tr><th style="text-align:left">Concepto</th><th style="text-align:right">Neto Gravado</th><th style="text-align:right">Exento o no Gravado</th><th style="text-align:right">Crédito Fiscal</th></tr>
              ${row("Operaciones de Compra", comprasNeto, comprasExento, comprasCredito)}
              ${row("Notas de Crédito de Compra", ncComprasNeto, ncComprasExento, ncComprasCredito)}
            </table></div>
          </div>
          <div style="margin-top:2px;padding-top:8px;border-top:1px solid var(--border);">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <span class="subhead-strong" style="margin:0;border-bottom:none;padding-bottom:0;">Operaciones que no generan Crédito Fiscal</span>
              <b class="mono">${fmtMoney(operacionesNoCredito)}</b>
            </div>
          </div>
        </div>
        <div class="modal-foot"><button class="btn btn-accent" data-action="close-modal">Listo</button></div>
      </div>
    </div>`;
  wireModalBackdropClose();
}

function nowStampAR() {

}

// Construye una hoja a partir de un array de arrays, aplicando formato de
// número/porcentaje a las celdas numéricas (todo lo que no sea texto queda
// prolijo con separador de miles y dos decimales, salvo que se indique lo
// contrario), anchos de columna y combinación de celdas para los "banners"
// de sección.
function newSheet(rows, opts) {
  opts = opts || {};
  const wrapCols = opts.wrapCols || [0]; // qué columnas ajustan texto a varios renglones en filas de datos comunes (por defecto sólo la primera)
  // Si una fila tiene una celda fusionada ("merge") pero el array sólo trae
  // valor en la primera columna de ese rango, completamos las demás con ""
  // para que existan como celdas reales — si no, el borde y el color de
  // fondo sólo se verían en la primera celda del título/banner, no en todo
  // el ancho fusionado.
  (opts.merges || []).forEach((m) => {
    if (!m) return;
    for (let r = m.s.r; r <= m.e.r; r++) {
      if (!rows[r]) rows[r] = [];
      for (let c = m.s.c; c <= m.e.c; c++) {
        if (rows[r][c] === undefined) rows[r][c] = "";
      }
    }
  });
  const ws = XLSX.utils.aoa_to_sheet(rows);
  const ref = ws["!ref"];
  if (ref) {
    const range = XLSX.utils.decode_range(ref);
    for (let R = range.s.r; R <= range.e.r; R++) {
      for (let C = range.s.c; C <= range.e.c; C++) {
        const cell = ws[XLSX.utils.encode_cell({ r: R, c: C })];
        if (!cell || cell.t !== "n") continue;
        const key = R + ":" + C;
        if (opts.formats && opts.formats.has(key)) { cell.z = opts.formats.get(key); continue; }
        if (opts.skipCols && opts.skipCols.indexOf(C) !== -1) continue;
        cell.z = "#,##0.00";
      }
    }
  }
  // Celdas con fórmula: se escribe el valor ya calculado (por si se abre sin
  // recalcular) y además la fórmula real, para que se pueda auditar de dónde
  // sale cada número sin depender de que Excel recalcule al abrir.
  if (opts.formulas) {
    opts.formulas.forEach((formula, key) => {
      const [R, C] = key.split(":").map(Number);
      const addr = XLSX.utils.encode_cell({ r: R, c: C });
      const existing = ws[addr];
      const v = existing && typeof existing.v === "number" ? existing.v : 0;
      ws[addr] = Object.assign({ t: "n", v, f: formula }, existing && existing.z ? { z: existing.z } : { z: "#,##0.00" });
    });
  }
  if (opts.colWidths) ws["!cols"] = opts.colWidths.map((w) => ({ wch: w }));
  if (opts.merges) ws["!merges"] = opts.merges;
  if (opts.freezeHeaderRow != null) ws["!freeze"] = { xSplit: 0, ySplit: opts.freezeHeaderRow };

  // Estilo: título de la hoja (fila 0) en violeta con texto blanco, banners
  // de sección (filas fusionadas de punta a punta, se detectan solas a
  // partir de los merges) en violeta claro, encabezados de columna
  // (opts.headerRows, porque no siempre están fusionados y hay que
  // indicarlos a mano) en un violeta más suave — los tres centrados tanto
  // horizontal como verticalmente —, filas de "TOTAL" en negrita (se
  // detectan solas: cualquier fila de datos cuya primera celda esté toda en
  // mayúsculas), borde fino y visible en toda celda con datos, y además un
  // contorno más grueso alrededor de cada "cuadro" (cada bloque de filas
  // contiguas separado del resto por una fila en blanco). Va al final para
  // no perder el estilo cuando el paso de fórmulas de arriba reemplaza la
  // celda.
  const THIN = { style: "thin", color: { rgb: "9B8AC4" } };
  const THICK = { style: "medium", color: { rgb: "5B21B6" } };
  const bannerRows = new Set();
  (opts.merges || []).forEach((m) => { if (m && m.s.r === m.e.r && m.e.c > m.s.c) bannerRows.add(m.s.r); });
  const headerRows = new Set(opts.headerRows || []);
  const isTotalLabel = (v) => typeof v === "string" && /(^|[^a-záéíóúñ])TOTAL(ES)?([^a-záéíóúñ]|$)/i.test(v.trim());

  // Detectar cada "cuadro": tramo de filas contiguas con datos, separado del
  // resto por al menos una fila en blanco. Sirve tanto para el contorno
  // grueso como, en general, para saber qué columnas ocupa cada bloque.
  const blocks = [];
  let curStart = null, curMin = Infinity, curMax = -1;
  const closeBlock = (endExclusive) => {
    if (curStart === null) return;
    blocks.push({ r0: curStart, r1: endExclusive - 1, c0: curMin, c1: curMax });
    curStart = null; curMin = Infinity; curMax = -1;
  };
  for (let r = 0; r < rows.length; r++) {
    const row = rows[r];
    const isPlain = opts.plainRows && opts.plainRows.has(r);
    const cellsWithData = (row && !isPlain) ? row.map((v, c) => (v !== undefined && v !== "" && v !== null ? c : -1)).filter((c) => c >= 0) : [];
    if (cellsWithData.length) {
      if (curStart === null) curStart = r;
      cellsWithData.forEach((c) => { if (c < curMin) curMin = c; if (c > curMax) curMax = c; });
    } else {
      closeBlock(r);
    }
  }
  closeBlock(rows.length);

  const finalRef = ws["!ref"];
  if (finalRef) {
    const range = XLSX.utils.decode_range(finalRef);
    for (let R = range.s.r; R <= range.e.r; R++) {
      for (let C = range.s.c; C <= range.e.c; C++) {
        const addr = XLSX.utils.encode_cell({ r: R, c: C });
        const cell = ws[addr];
        if (!cell) continue;
        if (opts.plainRows && opts.plainRows.has(R)) {
          cell.s = { font: { italic: true, color: { rgb: "6B6480" } }, alignment: { wrapText: true, vertical: "top" } };
          continue;
        }
        const style = { border: { top: THIN, bottom: THIN, left: THIN, right: THIN } };
        if (R === 0) {
          style.font = { bold: true, sz: 13, color: { rgb: "FFFFFF" } };
          style.fill = { patternType: "solid", fgColor: { rgb: "6D28D9" } };
          style.alignment = { vertical: "center", horizontal: "center", wrapText: true };
        } else if (bannerRows.has(R)) {
          style.font = { bold: true, color: { rgb: "3D2273" } };
          style.fill = { patternType: "solid", fgColor: { rgb: "EAE1FB" } };
          style.alignment = { vertical: "center", horizontal: "center", wrapText: true };
        } else if (headerRows.has(R)) {
          style.font = { bold: true, color: { rgb: "3D2273" } };
          style.fill = { patternType: "solid", fgColor: { rgb: "F5F1FC" } };
          style.alignment = { wrapText: true, vertical: "center", horizontal: "center" };
        } else {
          style.alignment = { wrapText: wrapCols.includes(C), vertical: "top" };
          if (cell.v === "REVISAR") style.font = { bold: true, color: { rgb: "C0392B" } };
          else if (isTotalLabel(rows[R] && rows[R][0])) style.font = { bold: true };
          if (opts.highlightRows && opts.highlightRows.has(R)) {
            const h = opts.highlightRows.get(R);
            style.font = { bold: true, color: { rgb: h.fg } };
            style.fill = { patternType: "solid", fgColor: { rgb: h.bg } };
          }
          if (opts.highlightCells && opts.highlightCells.has(R + ":" + C)) {
            const h = opts.highlightCells.get(R + ":" + C);
            style.font = { bold: true, color: { rgb: h.fg } };
            style.fill = { patternType: "solid", fgColor: { rgb: h.bg } };
          }
        }
        cell.s = style;
      }
    }
    // Contorno grueso por cuadro, encima del borde fino de cada celda.
    blocks.forEach((b) => {
      for (let R = b.r0; R <= b.r1; R++) {
        for (let C = b.c0; C <= b.c1; C++) {
          const addr = XLSX.utils.encode_cell({ r: R, c: C });
          const cell = ws[addr];
          if (!cell || !cell.s || !cell.s.border) continue;
          if (R === b.r0) cell.s.border.top = THICK;
          if (R === b.r1) cell.s.border.bottom = THICK;
          if (C === b.c0) cell.s.border.left = THICK;
          if (C === b.c1) cell.s.border.right = THICK;
        }
      }
    });
    // Divisores internos (por ejemplo, entre jurisdicciones dentro del mismo
    // cuadro): una línea algo más marcada arriba de esa fila, sin llegar a
    // fragmentar el cuadro en varios.
    (opts.innerDividerRows || []).forEach((R) => {
      for (let C = range.s.c; C <= range.e.c; C++) {
        const addr = XLSX.utils.encode_cell({ r: R, c: C });
        const cell = ws[addr];
        if (cell && cell.s && cell.s.border) cell.s.border.top = { style: "medium", color: { rgb: "B7A9E0" } };
      }
    });

    // Alto de fila automático para las celdas con ajuste de texto: al abrir
    // un archivo generado por código (a diferencia de uno tipeado a mano en
    // Excel), el alto de fila NO se agranda solo cuando el texto necesita
    // más de un renglón — por eso el texto quedaba "desbordado" fuera del
    // recuadro. Estimamos cuántos renglones va a necesitar cada celda con
    // wrap (según el ancho de su columna, sumando las columnas fusionadas
    // si corresponde) y le damos a la fila el alto que haga falta.
    const colChars = (opts.colWidths || []).map((w) => (typeof w === "number" ? w : 10));
    const mergeWidthFor = (R, C) => {
      let found = null;
      (opts.merges || []).forEach((m) => { if (m && m.s.r === R && m.s.c <= C && C <= m.e.c) found = m; });
      if (!found) return colChars[C] || 10;
      let sum = 0;
      for (let cc = found.s.c; cc <= found.e.c; cc++) sum += colChars[cc] || 10;
      return sum;
    };
    const rowHeights = {};
    for (let R = range.s.r; R <= range.e.r; R++) {
      const row = rows[R];
      if (!row) continue;
      let maxLines = 1;
      row.forEach((v, C) => {
        if (v === undefined || v === "" || v === null) return;
        const wraps = R === 0 || bannerRows.has(R) || headerRows.has(R) || wrapCols.includes(C);
        if (!wraps) return;
        const charsPerLine = Math.max(mergeWidthFor(R, C) - 2, 6);
        const lines = Math.max(1, Math.ceil(String(v).length / charsPerLine));
        if (lines > maxLines) maxLines = lines;
      });
      if (maxLines > 1) rowHeights[R] = Math.min(maxLines * 14 + 5, 220);
    }
    if (Object.keys(rowHeights).length) {
      ws["!rows"] = ws["!rows"] || [];
      Object.keys(rowHeights).forEach((R) => { ws["!rows"][R] = { hpt: rowHeights[R] }; });
    }
  }
  return ws;
}

// Notación A1, con la hoja entre comillas simples cuando corresponde (nombre
// con espacios) para referencias entre hojas: xsheetRef("IVA 08-2026", 4, 3).
function cellA1(r, c) { return XLSX.utils.encode_cell({ r, c }); }
function xsheetRef(sheetName, r, c) { return `'${sheetName}'!${cellA1(r, c)}`; }

function sectionMerge(rows, ncols) {
  const r = rows.length - 1;
  return ncols > 1 ? { s: { r, c: 0 }, e: { r, c: ncols - 1 } } : null;
}

function buildIndexSheet(wb, client, sections) {
  const rows = [];
  const plainRows = new Set();
  const headerRows = [];
  rows.push([client.name]);
  rows.push([client.cuit ? `CUIT ${client.cuit}` : "CUIT sin cargar"]);
  rows.push([]);
  rows.push([`Generado el ${nowStampAR()} desde el tablero de Papeles de Trabajo Fiscales`]);
  plainRows.add(rows.length - 1);
  rows.push([]);
  rows.push(["Contenido de este archivo"]);
  const contenidoMerge = sectionMerge(rows, 2);
  rows.push(["Hoja", "Contenido"]);
  headerRows.push(rows.length - 1);
  sections.forEach((s) => rows.push([s.sheet, s.desc]));
  rows.push([]);
  rows.push(["Cómo leer las columnas"]);
  const leyendaMerge = sectionMerge(rows, 2);
  rows.push(["Término", "Significado"]);
  headerRows.push(rows.length - 1);
  rows.push(["Según Libros", "Importe registrado en la contabilidad del contribuyente."]);
  rows.push(["Según Portal", "Importe que figura en el portal de ARCA (IVA) o en el portal de la jurisdicción / SIFERE (IIBB)."]);
  rows.push(["Calculado", "Importe que resulta de aplicar la alícuota al monto según libros."]);
  rows.push(["Diferencia", "Según Portal menos Calculado. Si supera $1 en valor absoluto, se marca \"REVISAR\"."]);
  const merges = [
    { s: { r: 0, c: 0 }, e: { r: 0, c: 1 } },
    contenidoMerge,
    leyendaMerge,
  ];
  const ws = newSheet(rows, { colWidths: [34, 66], merges: merges.filter(Boolean), headerRows, plainRows, wrapCols: [0, 1] });
  XLSX.utils.book_append_sheet(wb, ws, "Índice");
}

function exportClientToExcel(client) {
  if (!client) return;
  const wb = XLSX.utils.book_new();
  wb.Props = { Title: `Papeles de trabajo — ${client.name}`, Author: "Papeles de Trabajo Fiscales", CreatedDate: new Date() };

  const sections = [];
  if (client.iva.enabled) sections.push({ sheet: "DDJJ IVA / MM-AAAA", desc: "Declaración jurada de IVA por período y detalle de débito/crédito fiscal con origen de cada importe." });
  if (client.iibbLocal.enabled) sections.push({ sheet: "DDJJ IIBB Local", desc: "Liquidación mensual de Ingresos Brutos, jurisdicción local." });
  if (client.iibbCM.enabled) sections.push({ sheet: "Coeficientes / Actividades / Liquidacion CM", desc: "Ingresos Brutos Convenio Multilateral: coeficientes de distribución, montos por actividad y liquidación por jurisdicción." });
  buildIndexSheet(wb, client, sections);

  if (client.iva.enabled) buildIvaSheets(wb, client);
  if (client.iibbLocal.enabled) buildIibbLocalSheet(wb, client);
  if (client.iibbCM.enabled) buildIibbCMSheets(wb, client);

  const bytes = XLSX.write(wb, { bookType: "xlsx", type: "array" });
  const blob = new Blob([bytes], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  const filename = `${client.name.replace(/[^a-z0-9]+/gi, "_")}_papeles_de_trabajo.xlsx`;

  if (state.downloads) {
    state.downloads.save({ filename, data: blob }).then(() => showToast("Excel descargado")).catch((err) => {
      if (err && err.code === "declined") return;
      showToast("No se pudo descargar el Excel");
    });
  } else {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
  }
}

function buildIvaSheets(wb, client) {
  const periods = listPeriodsWithTax(client.id, "iva");
  const decreto814Rate = num(client.iva.decreto814Rate) / 100;

  // ---- 1) Una hoja de detalle, con fórmulas, para el período que se está
  // viendo en el dashboard (no todo el historial — si no, se acumula un tab
  // nuevo por cada mes cargado alguna vez). La DDJJ de más abajo sí muestra
  // todos los períodos, para mantener el arrastre de saldos. ----
  const sheetMeta = {}; // period -> { sheetName, totalDebitoCell, totalCreditoCell, debitoOnlyRange, restCreditoRange }
  periods.filter((p) => p === state.currentPeriod).forEach((p) => {
    const r = calcIvaFor(client, p);
    const rows = [["IVA — " + periodLabel(p) + " — " + client.name]];
    const merges = [{ s: { r: 0, c: 0 }, e: { r: 0, c: 5 } }];
    const formulas = new Map();

    rows.push([]);
    rows.push(["DÉBITO FISCAL"]);
    merges.push({ s: { r: 2, c: 0 }, e: { r: 2, c: 5 } });
    rows.push(["Concepto", "Neto según libros", "Débito calculado", "Débito según portal ARCA", "Diferencia (portal - calculado)", "Alerta"]);
    const debitoHeaderRow = rows.length - 1;
    const pushBracket = (b, factor) => {
      const R = rows.length;
      const f = factor == null ? 1 : factor;
      formulas.set(R + ":2", f === 1 ? `B${R + 1}*${b.rate}` : `B${R + 1}*${b.rate}*${f}`);
      formulas.set(R + ":4", `D${R + 1}-C${R + 1}`);
      rows.push([b.label, b.neto, b.calculado, b.portal, b.diff, b.flagged ? "REVISAR" : ""]);
    };
    const debitoOnlyStart = rows.length;
    r.debitoBrackets.forEach((b) => pushBracket(b));
    const debitoOnlyEnd = rows.length - 1;
    r.restDebitoBrackets.forEach((b) => pushBracket(b));
    const debitoAllEnd = rows.length - 1;
    const totalDebitoRow = rows.length;
    formulas.set(totalDebitoRow + ":3", `SUM(D${debitoOnlyStart + 1}:D${debitoAllEnd + 1})`);
    rows.push(["TOTAL DÉBITO FISCAL (según portal)", "", "", r.debitoFiscal, "", ""]);

    rows.push([]);
    rows.push([client.iva.prorrateoExento ? `CRÉDITO FISCAL (compras con prorrateo ${fmtPctRaw(r.coefProrrateo * 100)}% aplicado)` : "CRÉDITO FISCAL"]);
    merges.push({ s: { r: rows.length - 1, c: 0 }, e: { r: rows.length - 1, c: 5 } });
    rows.push(["Concepto", "Neto según libros", "Crédito calculado", "Crédito según portal ARCA", "Diferencia (portal - calculado)", "Alerta"]);
    const creditoHeaderRow = rows.length - 1;
    const creditoOnlyStart = rows.length;
    r.creditoBrackets.forEach((b) => pushBracket(b, r.coefProrrateo));
    const creditoOnlyEnd = rows.length - 1;
    const restCreditoStart = rows.length;
    r.restCreditoBrackets.forEach((b) => pushBracket(b));
    const restCreditoEnd = rows.length - 1;
    const decreto814Row = rows.length;
    formulas.set(decreto814Row + ":2", r.f931Pagado ? `B${decreto814Row + 1}*${decreto814Rate}` : "0");
    rows.push(["Créd. Fiscal Decreto 814/01 (remuneraciones x tasa" + (r.f931Pagado ? "" : " — F.931 sin pagar, no se toma") + ")", r.remuneraciones, r.creditoDecreto814, "", "", ""]);
    const totalCreditoRow = rows.length;
    formulas.set(totalCreditoRow + ":3", `SUM(D${creditoOnlyStart + 1}:D${restCreditoEnd + 1})+C${decreto814Row + 1}`);
    rows.push(["TOTAL CRÉDITO FISCAL (según portal)", "", "", r.creditoFiscal, "", ""]);

    const sheetName = ("IVA " + p.slice(5, 7) + "-" + p.slice(0, 4)).slice(0, 31);
    sheetMeta[p] = {
      sheetName,
      totalDebitoCell: [totalDebitoRow, 3],
      totalCreditoCell: [totalCreditoRow, 3],
      debitoOnlyRange: [debitoOnlyStart, debitoOnlyEnd],
      restCreditoRange: restCreditoEnd >= restCreditoStart ? [restCreditoStart, restCreditoEnd] : null,
    };
    XLSX.utils.book_append_sheet(wb, newSheet(rows, {
      colWidths: [50, 17, 17, 19, 19, 11],
      merges: merges.filter(Boolean),
      skipCols: [0, 5],
      formulas,
      freezeHeaderRow: 4,
      headerRows: [debitoHeaderRow, creditoHeaderRow],
    }), sheetName);
  });

  // ---- 2) Hoja DDJJ: un bloque por período, con fórmulas que referencian
  // la hoja de detalle de ese período y (para los saldos que se arrastran)
  // el bloque del período anterior en esta misma hoja. ----
  const ddjj = [["DDJJ IVA — " + client.name]];
  const ddjjMerges = [{ s: { r: 0, c: 0 }, e: { r: 0, c: 1 } }];
  const ddjjFormulas = new Map();
  const ddjjHighlights = new Map();
  ddjj.push([client.cuit ? "CUIT " + client.cuit : ""]);
  ddjj.push([]);

  let prevSaldoTecnicoFavorContribCell = null; // [row,col] en esta hoja
  let prevSaldoLibreDispCell = null;

  periods.forEach((p, idx) => {
    const r = calcIvaFor(client, p);
    const meta = sheetMeta[p];
    ddjj.push([periodLabel(p).toUpperCase()]);
    ddjjMerges.push(sectionMerge(ddjj, 2));

    const debitoRow = ddjj.length;
    if (meta) ddjjFormulas.set(debitoRow + ":1", xsheetRef(meta.sheetName, ...meta.totalDebitoCell));
    ddjj.push(["IVA Débito Fiscal", r.debitoFiscal]);

    const creditoRow = ddjj.length;
    if (meta) ddjjFormulas.set(creditoRow + ":1", xsheetRef(meta.sheetName, ...meta.totalCreditoCell));
    ddjj.push(["IVA Crédito Fiscal", r.creditoFiscal]);

    const saldoTecAnteriorRow = ddjj.length;
    if (prevSaldoTecnicoFavorContribCell) ddjjFormulas.set(saldoTecAnteriorRow + ":1", `B${prevSaldoTecnicoFavorContribCell[0] + 1}`);
    ddjj.push(["Saldo técnico a favor del contribuyente, período anterior", r.saldoTecnicoAnterior]);

    const saldoTecARCARow = ddjj.length;
    ddjjFormulas.set(saldoTecARCARow + ":1", `MAX(B${debitoRow + 1}-B${creditoRow + 1}-B${saldoTecAnteriorRow + 1},0)`);
    ddjj.push(["Saldo técnico a favor de ARCA", r.saldoTecnicoFavorARCA]);

    const saldoTecContribRow = ddjj.length;
    ddjjFormulas.set(saldoTecContribRow + ":1", `MAX(-(B${debitoRow + 1}-B${creditoRow + 1}-B${saldoTecAnteriorRow + 1}),0)`);
    ddjj.push(["Saldo técnico a favor del contribuyente", r.saldoTecnicoFavorContribuyente]);
    prevSaldoTecnicoFavorContribCell = [saldoTecContribRow, 1];

    const libreDispAnteriorRow = ddjj.length;
    if (prevSaldoLibreDispCell) ddjjFormulas.set(libreDispAnteriorRow + ":1", `B${prevSaldoLibreDispCell[0] + 1}`);
    ddjj.push(["Saldo a favor de libre disponibilidad, período anterior", r.libreDispAnterior]);

    const montoUtilizadoRow = ddjj.length;
    ddjj.push(["Monto utilizado", r.montoUtilizado]);
    const retencionesRow = ddjj.length;
    ddjj.push(["Retenciones sufridas", r.retenciones]);
    const percepcionesRow = ddjj.length;
    ddjj.push(["Percepciones sufridas", r.percepciones]);

    const saldoLibreDispRow = ddjj.length;
    ddjjFormulas.set(saldoLibreDispRow + ":1",
      `IF(B${saldoTecARCARow + 1}<=0,B${libreDispAnteriorRow + 1}+B${percepcionesRow + 1}+B${retencionesRow + 1},` +
      `MAX(-(B${saldoTecARCARow + 1}+B${montoUtilizadoRow + 1}-B${libreDispAnteriorRow + 1}-B${percepcionesRow + 1}-B${retencionesRow + 1}),0))`);
    ddjj.push(["Saldo de libre disponibilidad", r.saldoLibreDisponibilidad]);
    prevSaldoLibreDispCell = [saldoLibreDispRow, 1];

    const saldoAPagarRow = ddjj.length;
    ddjjFormulas.set(saldoAPagarRow + ":1",
      `IF(B${saldoTecARCARow + 1}<=0,0,MAX(B${saldoTecARCARow + 1}+B${montoUtilizadoRow + 1}-B${libreDispAnteriorRow + 1}-B${percepcionesRow + 1}-B${retencionesRow + 1},0))`);
    ddjj.push(["Saldo a pagar", r.saldoAPagar]);
    // Se resalta el resultado real de la DDJJ: si queda saldo a pagar, esa
    // fila en rojo; si no (quedó a favor / de libre disponibilidad), la fila
    // de "Saldo de libre disponibilidad" en verde — no las dos siempre en
    // negrita negra, como pasaba antes.
    if (r.saldoAPagar > 0) ddjjHighlights.set(saldoAPagarRow, { bg: "FBE1DE", fg: "C0392B" });
    else ddjjHighlights.set(saldoLibreDispRow, { bg: "DDF2E6", fg: "146C43" });

    ddjj.push([]);
    ddjj.push(["Información adicional a presentar (no integra la DDJJ)"]);
    ddjjMerges.push(sectionMerge(ddjj, 2));
    ddjj.push(["Ventas exentas o no gravadas (neto)", r.exento.ventas]);
    ddjj.push(["N.C. de venta — Exentas/No gravadas", r.exento.ncVentas]);
    ddjj.push(["Compras exentas/No gravadas", r.exento.compras]);
    ddjj.push(["N.C. de compra — Exentas/No gravadas", r.exento.ncCompras]);
    ddjj.push(["Operaciones que no generan Crédito Fiscal", r.exento.operacionesNoCredito]);
    ddjj.push([]);
    ddjj.push([]); // doble salto entre un período y el siguiente, para que el cambio de mes se note de un vistazo
  });

  XLSX.utils.book_append_sheet(wb, newSheet(ddjj, {
    colWidths: [52, 22],
    merges: ddjjMerges.filter(Boolean),
    skipCols: [],
    formulas: ddjjFormulas,
    highlightRows: ddjjHighlights,
  }), "DDJJ IVA");
}

function buildIibbLocalSheet(wb, client) {
  const periods = listPeriodsWithTax(client.id, "iibbLocal");
  const title = client.iibbLocal.jurisdiccion || "IIBB Local (jurisdicción sin cargar)";
  const activities = client.iibbLocal.activities || [];

  // ---- 1) Hoja de actividades: Base (dato cargado) x Alícuota (=Base x
  // alícuota) por actividad, con los totales de cada período. ----
  const actMeta = {}; // period -> { totalBaseCell:[r,c], totalImpuestoCell:[r,c] }
  if (activities.length) {
    const actRows = [["Ventas netas por actividad — " + title + " — " + client.name]];
    const actMerges = [{ s: { r: 0, c: 0 }, e: { r: 0, c: 1 + activities.length * 2 + 1 } }];
    const actFormulas = new Map();
    actRows.push([]);
    const header = ["Período"];
    activities.forEach((a) => header.push(`${a.code} — ${a.desc} — Ventas netas`, `${a.code} — Impuesto (${fmtPctRaw(a.alicuota)}%)`));
    header.push("TOTAL Base", "TOTAL Impuesto");
    actRows.push(header);
    const actHeaderRow = actRows.length - 1;
    const actDataStart = actRows.length;
    periods.forEach((p) => {
      const doc = getDoc(client.id, p);
      const actData = (doc && doc.iibbLocal && doc.iibbLocal.actividades) || {};
      const R = actRows.length;
      const row = [periodLabel(p)];
      const baseCols = [], impCols = [];
      activities.forEach((a, i) => {
        const baseCol = 1 + i * 2, impCol = 2 + i * 2;
        baseCols.push(baseCol); impCols.push(impCol);
        const baseVal = num(actData[a.code]);
        const impVal = round2(baseVal * (num(a.alicuota) / 100));
        actFormulas.set(R + ":" + impCol, `${XLSX.utils.encode_col(baseCol)}${R + 1}*${num(a.alicuota) / 100}`);
        row.push(baseVal, impVal);
      });
      const totalBaseCol = 1 + activities.length * 2, totalImpCol = 2 + activities.length * 2;
      actFormulas.set(R + ":" + totalBaseCol, `SUM(${baseCols.map((c) => XLSX.utils.encode_col(c) + (R + 1)).join(",")})`);
      actFormulas.set(R + ":" + totalImpCol, `SUM(${impCols.map((c) => XLSX.utils.encode_col(c) + (R + 1)).join(",")})`);
      const totalBase = round2(baseCols.reduce((s, c, i) => s + num(actData[activities[i].code]), 0));
      const totalImp = round2(impCols.reduce((s, c, i) => s + round2(num(actData[activities[i].code]) * (num(activities[i].alicuota) / 100)), 0));
      row.push(totalBase, totalImp);
      actMeta[p] = { totalBaseCell: [R, totalBaseCol], totalImpuestoCell: [R, totalImpCol] };
      actRows.push(row);
    });
    // Fila de totales acumulados (suma de cada columna a lo largo de todos
    // los períodos cargados), para ver de un vistazo cuánto lleva cada
    // actividad en lo que va del ejercicio.
    if (periods.length) {
      const actDataEnd = actRows.length - 1;
      const numDataCols = 2 * activities.length + 2;
      const totalRow = ["TOTAL"];
      for (let c = 1; c <= numDataCols; c++) {
        let sum = 0;
        for (let R2 = actDataStart; R2 <= actDataEnd; R2++) sum += num(actRows[R2][c]);
        totalRow.push(round2(sum));
        actFormulas.set(actRows.length + ":" + c, `SUM(${XLSX.utils.encode_col(c)}${actDataStart + 1}:${XLSX.utils.encode_col(c)}${actDataEnd + 1})`);
      }
      actRows.push(totalRow);
    }
    XLSX.utils.book_append_sheet(wb, newSheet(actRows, {
      colWidths: [14, ...activities.flatMap(() => [20, 20]), 16, 16],
      merges: actMerges.filter(Boolean),
      skipCols: [0],
      formulas: actFormulas,
      headerRows: [actHeaderRow],
    }), "IIBB Local Activ.");
  }

  // ---- 2) Hoja principal: Base e Impuesto referencian los totales de la
  // hoja de actividades; el saldo a favor arrastra al período siguiente. ----
  const rows = [[title + " — " + client.name]];
  const merges = [{ s: { r: 0, c: 0 }, e: { r: 0, c: 8 } }];
  rows.push([]);
  rows.push(["Período", "Ventas netas (según libros)", "Alícuota efectiva", "Impuesto (calculado)", "Retenciones (sistema)", "Percepciones (sistema)", "Rec. bancarias (sistema)", "Saldo período anterior", "Saldo a pagar / (a favor)"]);
  const mainHeaderRow = rows.length - 1;
  const formats = new Map();
  const formulas = new Map();
  const sheetName = "DDJJ IIBB Local";
  const actSheetName = "IIBB Local Activ.";
  let prevSaldoCell = null;
  periods.forEach((p) => {
    const r = calcIibbLocalFor(client, p);
    const alicuotaEfectiva = r.baseImponible ? Math.round((r.impuesto / r.baseImponible) * 10000) / 10000 : 0;
    const R = rows.length;
    formats.set(R + ":2", "0.00%");
    if (actMeta[p]) {
      formulas.set(R + ":1", xsheetRef(actSheetName, ...actMeta[p].totalBaseCell));
      formulas.set(R + ":3", xsheetRef(actSheetName, ...actMeta[p].totalImpuestoCell));
    }
    formulas.set(R + ":2", `IF(B${R + 1}=0,0,D${R + 1}/B${R + 1})`);
    if (prevSaldoCell) formulas.set(R + ":7", `MAX(-I${prevSaldoCell + 1},0)`);
    formulas.set(R + ":8", `D${R + 1}-E${R + 1}-F${R + 1}-G${R + 1}-H${R + 1}`);
    rows.push([periodLabel(p), r.baseImponible, alicuotaEfectiva, r.impuesto, r.retenciones, r.percepciones, r.recaudacionesBancarias, r.saldoAnterior, r.saldoAPagar > 0 ? r.saldoAPagar : -r.saldoAFavor]);
    prevSaldoCell = R;
  });
  XLSX.utils.book_append_sheet(wb, newSheet(rows, {
    colWidths: [14, 22, 12, 18, 16, 16, 18, 18, 20],
    merges: merges.filter(Boolean),
    skipCols: [0],
    formats,
    formulas,
    freezeHeaderRow: 3,
    headerRows: [mainHeaderRow],
  }), sheetName);
}

function buildIibbCMSheets(wb, client) {
  const periods = listPeriodsWithTax(client.id, "iibbCM");
  const jurisdictions = sortedJurisdictions(client.iibbCM.jurisdictions);
  const activities = client.iibbCM.activities || [];

  // ---- 1) Coeficientes: se guarda el valor de cada vigencia y se recuerda
  // en qué celda quedó cada jurisdicción, para poder referenciarla desde el
  // detalle. ----
  const coefCell = {}; // "desde|jurName" -> [row,col]
  const coefRows = [["Coeficientes de distribución por jurisdicción — " + client.name]];
  const coefMerges = [sectionMerge(coefRows, 2)];
  const coefFormats = new Map();
  const coefHeaderRows = [];
  (client.iibbCM.coeficientes || []).slice().sort((a, b) => a.desde.localeCompare(b.desde)).forEach((v) => {
    coefRows.push([]);
    coefRows.push([`Coeficiente vigente desde ${periodLabel(v.desde)}`]);
    coefMerges.push({ s: { r: coefRows.length - 1, c: 0 }, e: { r: coefRows.length - 1, c: 1 } });
    coefRows.push(["Jurisdicción", "Coeficiente"]);
    coefHeaderRows.push(coefRows.length - 1);
    jurisdictions.forEach((j) => {
      const R = coefRows.length;
      coefFormats.set(R + ":1", "0.00%");
      coefCell[v.desde + "|" + j.name] = [R, 1];
      coefRows.push([j.name, num(v.valores[j.name]) / 100]);
    });
  });
  XLSX.utils.book_append_sheet(wb, newSheet(coefRows, {
    colWidths: [30, 16],
    merges: coefMerges.filter(Boolean),
    skipCols: [0],
    formats: coefFormats,
    headerRows: coefHeaderRows,
  }), "Coeficientes");

  // ---- 2) Actividades: monto imponible nacional (dato cargado), por
  // período y actividad. ----
  const actCell = {}; // period -> { [code]: [row,col] }
  const actRows = [["Monto imponible nacional por actividad (según libros) — " + client.name]];
  const actMerges = [{ s: { r: 0, c: 0 }, e: { r: 0, c: activities.length + 1 } }];
  const actFormulas = new Map();
  actRows.push([]);
  actRows.push(["Período", ...activities.map((a) => `${a.code} — ${a.desc}`), "TOTAL"]);
  const cmActHeaderRow = actRows.length - 1;
  const cmActDataStart = actRows.length;
  periods.forEach((p) => {
    const doc = getDoc(client.id, p);
    const acts = (doc && doc.iibbCM && doc.iibbCM.actividades) || {};
    const R = actRows.length;
    actCell[p] = {};
    const vals = activities.map((a, i) => { actCell[p][a.code] = [R, 1 + i]; return num(acts[a.code]); });
    const totalCol = 1 + activities.length;
    actFormulas.set(R + ":" + totalCol, `SUM(${XLSX.utils.encode_col(1)}${R + 1}:${XLSX.utils.encode_col(totalCol - 1)}${R + 1})`);
    actRows.push([periodLabel(p), ...vals, vals.reduce((s, v) => s + v, 0)]);
  });
  // Fila de totales acumulados por actividad (y el gran total), sumando
  // todos los períodos cargados.
  if (periods.length) {
    const cmActDataEnd = actRows.length - 1;
    const numDataCols = activities.length + 1;
    const totalRow = ["TOTAL"];
    for (let c = 1; c <= numDataCols; c++) {
      let sum = 0;
      for (let R2 = cmActDataStart; R2 <= cmActDataEnd; R2++) sum += num(actRows[R2][c]);
      totalRow.push(round2(sum));
      actFormulas.set(actRows.length + ":" + c, `SUM(${XLSX.utils.encode_col(c)}${cmActDataStart + 1}:${XLSX.utils.encode_col(c)}${cmActDataEnd + 1})`);
    }
    actRows.push(totalRow);
  }
  XLSX.utils.book_append_sheet(wb, newSheet(actRows, {
    colWidths: [14, ...activities.map(() => 22), 18],
    merges: actMerges.filter(Boolean),
    skipCols: [0],
    formulas: actFormulas,
    headerRows: [cmActHeaderRow],
  }), "Actividades");

  // ---- 3) Detalle: una fila por jurisdicción x actividad, agrupadas por
  // período (con un renglón banner al cambiar de mes, para que se note el
  // corte en vez de tener que buscarlo en la columna "Período"), con la
  // fórmula Base = Ventas de la actividad x Coeficiente de la jurisdicción +
  // Ajuste, e Impuesto = Base x Alícuota. Acá se ve de dónde sale cada
  // importe que en "Liquidacion" aparece ya sumado. ----
  const detRows = [["Detalle por jurisdicción y actividad — " + client.name]];
  const detMerges = [sectionMerge(detRows, 8)];
  const detFormulas = new Map();
  detRows.push([]);
  const detHeaderRows = [];
  const detDividers = [];
  const detMeta = {}; // period -> { [jurName]: {start,end} }
  periods.forEach((p, pIdx) => {
    const doc = getDoc(client.id, p);
    const coefVigencia = getCoefVigencia(client, p);
    detMeta[p] = {};
    if (pIdx > 0) { detRows.push([]); detRows.push([]); } // doble salto entre un mes y el siguiente
    detRows.push([periodLabel(p).toUpperCase()]);
    detMerges.push(sectionMerge(detRows, 8));
    detRows.push(["Jurisdicción", "Actividad", "Ventas nacionales (actividad)", "Coeficiente", "Ajuste", "Base (Ventas x Coef + Ajuste)", "Alícuota", "Impuesto"]);
    detHeaderRows.push(detRows.length - 1);
    let firstJurInPeriod = true;
    jurisdictions.forEach((j) => {
      const jdoc = (doc && doc.iibbCM && doc.iibbCM.jurisdicciones && doc.iibbCM.jurisdicciones[j.name]) || { ajustes: {} };
      const start = detRows.length;
      if (!firstJurInPeriod) detDividers.push(start);
      firstJurInPeriod = false;
      activities.forEach((a) => {
        const R = detRows.length;
        const montoNacional = num((doc && doc.iibbCM && doc.iibbCM.actividades && doc.iibbCM.actividades[a.code]));
        const ajuste = num(jdoc.ajustes && jdoc.ajustes[a.code]);
        const coef = coefVigencia ? num(coefVigencia.valores[j.name]) / 100 : 0;
        const alicuota = num(j.alicuotas && j.alicuotas[a.code]) / 100;
        const base = round2(montoNacional * coef + ajuste);
        const impuesto = round2(base * alicuota);
        if (actCell[p] && actCell[p][a.code]) detFormulas.set(R + ":2", xsheetRef("Actividades", ...actCell[p][a.code]));
        if (coefVigencia && coefCell[coefVigencia.desde + "|" + j.name]) detFormulas.set(R + ":3", xsheetRef("Coeficientes", ...coefCell[coefVigencia.desde + "|" + j.name]));
        detFormulas.set(R + ":5", `C${R + 1}*D${R + 1}+E${R + 1}`);
        detFormulas.set(R + ":7", `F${R + 1}*G${R + 1}`);
        detRows.push([j.name, `${a.code} — ${a.desc}`, montoNacional, coef, ajuste, base, alicuota, impuesto]);
      });
      const end = detRows.length - 1;
      detMeta[p][j.name] = { start, end };
    });
  });
  XLSX.utils.book_append_sheet(wb, newSheet(detRows, {
    colWidths: [20, 40, 20, 12, 14, 20, 10, 16],
    merges: detMerges.filter(Boolean),
    skipCols: [0, 1],
    formulas: detFormulas,
    headerRows: detHeaderRows,
    innerDividerRows: detDividers,
    wrapCols: [0, 1],
  }), "CM Detalle");

  // ---- 4) Liquidación: una fila por jurisdicción y período, con Base e
  // Impuesto sumados desde "CM Detalle" y el saldo a favor arrastrado desde
  // el período anterior de la misma jurisdicción en esta misma hoja. ----
  const liqRows = [["Liquidación por jurisdicción y período — " + client.name]];
  const liqMerges = [sectionMerge(liqRows, 9)];
  const liqFormulas = new Map();
  const liqHeaderRows = [];
  const liqHighlights = new Map();
  const prevAFavorRow = {}; // jurName -> row
  periods.forEach((p, pIdx) => {
    const r = calcIibbCMFor(client, p);
    liqRows.push([]);
    if (pIdx > 0) liqRows.push([]); // doble salto entre un período y el siguiente
    liqRows.push([periodLabel(p).toUpperCase()]);
    liqMerges.push({ s: { r: liqRows.length - 1, c: 0 }, e: { r: liqRows.length - 1, c: 8 } });
    liqRows.push(["Jurisdicción", "Base imponible (calculada)", "Impuesto anticipo (calculado)", "Retenciones (sistema)", "Percepciones (sistema)", "Rec. bancarias (sistema)", "Saldo período anterior", "A pagar", "A favor"]);
    liqHeaderRows.push(liqRows.length - 1);
    const periodJurRows = [];
    r.jurRows.forEach((j) => {
      const R = liqRows.length;
      const meta = detMeta[p] && detMeta[p][j.jurisdiccion];
      if (meta) {
        liqFormulas.set(R + ":1", `SUM('CM Detalle'!F${meta.start + 1}:F${meta.end + 1})`);
        liqFormulas.set(R + ":2", `SUM('CM Detalle'!H${meta.start + 1}:H${meta.end + 1})`);
      }
      if (prevAFavorRow[j.jurisdiccion] != null) liqFormulas.set(R + ":6", `I${prevAFavorRow[j.jurisdiccion] + 1}`);
      liqFormulas.set(R + ":7", `MAX(C${R + 1}-D${R + 1}-E${R + 1}-F${R + 1}-G${R + 1},0)`);
      liqFormulas.set(R + ":8", `MAX(-(C${R + 1}-D${R + 1}-E${R + 1}-F${R + 1}-G${R + 1}),0)`);
      liqRows.push([j.jurisdiccion, j.baseTotal, j.impuestoAnticipo, j.ret, j.perc, j.recban, j.saldoAnterior, j.aPagar, j.aFavor]);
      // "A pagar"/"A favor" con recuadro de color, como un formato
      // condicional: rojo si esa jurisdicción debe, verde si le queda a favor.
      if (j.aPagar > 0) liqHighlights.set(R + ":7", { bg: "FBE1DE", fg: "C0392B" });
      else if (j.aFavor > 0) liqHighlights.set(R + ":8", { bg: "DDF2E6", fg: "146C43" });
      prevAFavorRow[j.jurisdiccion] = R;
      periodJurRows.push(R);
    });
    const totalRow = liqRows.length;
    if (periodJurRows.length) {
      [1, 2, 3, 4, 5, 6, 7, 8].forEach((col) => {
        const colL = XLSX.utils.encode_col(col);
        liqFormulas.set(totalRow + ":" + col, `SUM(${periodJurRows.map((rr) => colL + (rr + 1)).join(",")})`);
      });
    }
    liqRows.push(["TOTALES", r.totales.baseTotal, r.totales.impuestoAnticipo, r.totales.ret, r.totales.perc, r.totales.recban, r.totales.saldoAnterior, r.totales.aPagar, r.totales.aFavor]);
  });
  XLSX.utils.book_append_sheet(wb, newSheet(liqRows, {
    colWidths: [22, 20, 20, 16, 16, 16, 18, 14, 14],
    merges: liqMerges.filter(Boolean),
    skipCols: [0],
    formulas: liqFormulas,
    headerRows: liqHeaderRows,
    highlightCells: liqHighlights,
  }), "Liquidacion");
}
