    <div class="side-section nav-side">${(() => { const ab = sideSocAbierto(); return `<button type="button" class="side-label side-toggle" data-action="soc-side-toggle" title="${ab ? "Contraer" : "Desplegar"}"><span>Sociedades</span><span>${ab ? "▾" : "▸"}</span></button>${ab ? `<button class="nav-btn ${state.view === "soc" ? "active" : ""}" data-action="nav-view" data-view="soc">🏢 Acciones y part. societarias (BP) <span class="chip">${socContribuyentes().length}</span></button><button class="nav-btn ${state.view === "ri" ? "active" : ""}" data-action="nav-view" data-view="ri">📋 Régimen informativo de part. <span class="chip">${socContribuyentes().length}</span></button>` : ""}`; })()}</div>
    <div class="side-section">
      <div class="side-label-row">
        <div class="side-label">Clientes<span>${state.clients.length}</span></div>
        <button class="icon-btn-sm" data-action="open-add-client" title="Agregar cliente">+</button>
      </div>
      <input type="text" class="client-search" placeholder="🔍 Buscar cliente…" value="${escapeHtml(search)}" data-action="search-clients">
      <div class="client-list">${items || emptyMsg}</div>
    </div>
    <div class="side-section" style="margin-top:auto;">
      <div class="side-label">Estado</div>
      <p style="font-size:11.5px;color:var(--muted);padding:0 4px;">
        Los cambios se guardan en este navegador automáticamente.${state.syncConfig.token && state.syncConfig.gistId ? `<br>${syncStatusLabel()}` : `<br>Sincronización con GitHub: sin configurar.`}
      </p>
    </div>`;
}
function syncStatusLabel() {
  if (state.syncStatus === "syncing") return "Sincronizando…";
  if (state.syncStatus === "stuck") return `<span style="color:var(--pagar);">No se pudo sincronizar con GitHub hace varios minutos — tus cambios están a salvo en este navegador. Probá "Guardar y sincronizar" en Sincronización.</span>`;
  if (state.syncStatus === "ratelimited") return `<span style="color:var(--pagar);">Límite de pedidos a GitHub agotado por ahora — se libera alrededor de las ${state.rateLimitReset || "dentro de un rato"}. Tus cambios están a salvo en este navegador y se sincronizan solos cuando se libere.</span>`;
  if (state.syncStatus === "error") return `<span style="color:var(--pagar);">Error al sincronizar — reintentá.</span>`;
  return state.lastSync ? `Sincronizado ${state.lastSync.toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" })}.` : "Sincronización configurada.";
}

function taxTabsFor(client) {
  const tabs = [{ key: "resumen", label: "Resumen · DDJJ" }];
  if (client.iva.enabled) tabs.push({ key: "iva", label: "IVA" });
  if (client.iibbLocal.enabled) tabs.push({ key: "iibbLocal", label: "IIBB Local" });
  if (client.iibbCM.enabled) tabs.push({ key: "iibbCM", label: "IIBB Conv. Multilateral" });
  if (monoEnabled(client)) tabs.push({ key: "mono", label: "Monotributo" });
  if (client.iva.enabled || client.iibbLocal.enabled || client.iibbCM.enabled || monoEnabled(client)) tabs.push({ key: "evolucion", label: "Evolución" });
  tabs.push({ key: "config", label: "Configuración" });
  return tabs;
}

function renderMain() {
  const main = document.getElementById("main");
  if (state.view === "panel") { main.innerHTML = renderPanelView(); return; }
  if (state.view === "calendario") { main.innerHTML = renderCalendarioView(); return; }
  if (state.view === "recat") { main.innerHTML = renderRecatView(); return; }
  if (state.view === "monoVep") { main.innerHTML = renderMonoVepView(); return; }
  if (state.view === "gan") { main.innerHTML = renderGanView(); return; }
  if (state.view === "bp") { main.innerHTML = renderBpView(); bpPostRender(); return; }
  if (state.view === "soc") { main.innerHTML = state.socCli ? renderSocDetalle() : renderSocLista(); socPostRender(); return; }
  if (state.view === "ri") { main.innerHTML = renderRiView(); return; }
  if (state.view === "alic") { main.innerHTML = renderAlicView(); return; }
  if (state.view === "cm05") { main.innerHTML = renderCm05View(); return; }
  if (state.view === "nqn") { main.innerHTML = renderNqnView(); return; }
  const client = currentClient();
  if (!client) {
    main.innerHTML = `
      <div class="empty">
        <h2>Ningún cliente cargado todavía</h2>
        <p>Agregá un cliente desde el panel izquierdo para empezar a registrar IVA e Ingresos Brutos, con el detalle de libros vs. portal y la DDJJ resumen calculada automáticamente.</p>
        <button class="btn btn-accent" data-action="open-add-client">+ Agregar cliente</button>
      </div>`;
    return;
  }
  const tabs = taxTabsFor(client);
  if (!tabs.find((t) => t.key === state.currentTab)) state.currentTab = "resumen";

  const tabsHtml = tabs.map((t) => `<button class="tab ${state.currentTab === t.key ? "active" : ""}" data-action="select-tab" data-tab="${t.key}">${t.label}</button>`).join("");

  main.innerHTML = `
    <div class="topbar">
      <div class="client-title">
        <h1>${escapeHtml(client.name)}</h1>
        <div class="meta">
          <span>${escapeHtml(client.cuit || "CUIT sin cargar")}</span>
          <span>·</span>
          <span>${[client.iva.enabled && "IVA", client.iibbLocal.enabled && "IIBB Local", client.iibbCM.enabled && "IIBB Convenio Multilateral", monoEnabled(client) && "Monotributo", ganDb().clientes[client.id] && "Ganancias", bpDb().clientes[client.id] && "Bienes Personales"].filter(Boolean).join(" · ") || "Sin impuestos configurados"}</span>
        </div>
      </div>
      <div class="topbar-actions">
        <div class="period-nav">
          <button data-action="period-prev" title="Período anterior" ${state.currentPeriod <= MIN_PERIOD ? "disabled" : ""}>‹</button>
          <span class="label">${periodLabel(state.currentPeriod)}</span>
          <button data-action="period-next" title="Período siguiente">›</button>
        </div>
        ${client.iva.enabled ? `<button class="btn btn-accent" data-action="export-excel-iva" title="Excel con la DDJJ de IVA, el detalle del período y el prorrateo (si corresponde)">⬇ Exportar IVA</button>` : ""}
        ${client.iibbLocal.enabled || client.iibbCM.enabled ? `<button class="btn btn-accent" data-action="export-excel-iibb" title="Excel con la liquidación de Ingresos Brutos">⬇ Exportar IIBB</button>` : ""}
      </div>
    </div>
    <div class="tabs">${tabsHtml}</div>
    <div id="tab-body"></div>
  `;

  const body = document.getElementById("tab-body");
  if (state.currentTab === "resumen") body.innerHTML = renderResumenTab(client) + monoResumenHtml(client);
  else if (state.currentTab === "iva") body.innerHTML = renderIvaTab(client);
  else if (state.currentTab === "iibbLocal") body.innerHTML = renderIibbLocalTab(client);
  else if (state.currentTab === "iibbCM") body.innerHTML = renderIibbCMTab(client);
  else if (state.currentTab === "mono") body.innerHTML = renderMonoTab(client);
  else if (state.currentTab === "evolucion") body.innerHTML = renderEvolucionTab(client);
  else if (state.currentTab === "config") body.innerHTML = renderConfigTab(client);
  if (["iva", "iibbLocal", "iibbCM", "mono"].indexOf(state.currentTab) !== -1) body.insertAdjacentHTML("afterbegin", presentadoBarHtml(client, state.currentTab, state.currentPeriod));
}

// ---- Resumen ----
function renderResumenTab(client) {
  const period = state.currentPeriod;
  let kpis = "";
  let sections = "";

  if (client.iva.enabled) {
    const r = calcIvaFor(client, period);
    const favor = r.saldoAPagar === 0 && r.saldoLibreDisponibilidad > 0;
    kpis += `
      <div class="kpi ${r.saldoAPagar > 0 ? "state-pagar" : "state-favor"}">
        <span class="k-label">IVA</span>
        <span class="k-value">${fmtMoney(r.saldoAPagar > 0 ? r.saldoAPagar : r.saldoLibreDisponibilidad)}</span>
        <span class="k-sub"><span class="pill ${r.saldoAPagar > 0 ? "pagar" : "favor"}">${r.saldoAPagar > 0 ? "A pagar" : "A favor (libre disp.)"}</span></span>
      </div>`;
    sections += `
      <div class="card">
        <div class="card-head"><h3>IVA — DDJJ ${periodLabel(period)}</h3><span class="hint">Contribuyente: ${escapeHtml(client.name)}</span></div>
        <div class="card-body">
          <div class="table-scroll"><table>
            <tr><td>IVA Débito Fiscal</td><td class="num">${fmtMoney(r.debitoFiscal)}</td></tr>
            <tr><td>IVA Crédito Fiscal</td><td class="num">${fmtMoney(r.creditoFiscal)}</td></tr>
            <tr><td>Saldo técnico a favor del período anterior</td><td class="num">${fmtMoney(r.saldoTecnicoAnterior)}</td></tr>
            <tr class="total-row"><td>Saldo técnico a favor de ARCA</td><td class="num ${r.saldoTecnicoFavorARCA > 0 ? "cell-pagar" : ""}">${fmtMoney(r.saldoTecnicoFavorARCA)}</td></tr>
            <tr><td>Saldo técnico a favor del contribuyente</td><td class="num ${r.saldoTecnicoFavorContribuyente > 0 ? "cell-favor" : ""}">${fmtMoney(r.saldoTecnicoFavorContribuyente)}</td></tr>
            <tr><td>Saldo libre disponibilidad período anterior</td><td class="num">${fmtMoney(r.libreDispAnterior)}</td></tr>
            <tr><td>Monto utilizado</td><td class="num">${fmtMoney(r.montoUtilizado)}</td></tr>
            <tr><td>Retenciones</td><td class="num">${fmtMoney(r.retenciones)}</td></tr>
            <tr><td>Percepciones</td><td class="num">${fmtMoney(r.percepciones)}</td></tr>
            <tr><td>Saldo de libre disponibilidad</td><td class="num ${r.saldoLibreDisponibilidad > 0 ? "cell-favor" : ""}">${fmtMoney(r.saldoLibreDisponibilidad)}</td></tr>
            <tr class="total-row"><td>Saldo a pagar</td><td class="num ${r.saldoAPagar > 0 ? "cell-pagar" : ""}">${fmtMoney(r.saldoAPagar)}</td></tr>
          </table></div>
        </div>
      </div>`;
  }

  if (client.iibbLocal.enabled) {
    const r = calcIibbLocalFor(client, period);
    kpis += `
      <div class="kpi ${r.saldoAPagar > 0 ? "state-pagar" : "state-favor"}">
        <span class="k-label">IIBB Local — ${escapeHtml(client.iibbLocal.jurisdiccion || "jurisdicción")}</span>
        <span class="k-value">${fmtMoney(r.saldoAPagar || r.saldoAFavor)}</span>
        <span class="k-sub"><span class="pill ${r.saldoAPagar > 0 ? "pagar" : "favor"}">${r.saldoAPagar > 0 ? "A pagar" : "A favor"}</span></span>
      </div>`;
    sections += `
      <div class="card">
        <div class="card-head"><h3>IIBB Local — DDJJ ${periodLabel(period)}</h3><span class="hint">${escapeHtml(client.iibbLocal.jurisdiccion || "Jurisdicción sin nombre")} · ${r.activities.length} actividad${r.activities.length === 1 ? "" : "es"}</span></div>
        <div class="card-body">
          <div class="table-scroll"><table>
            <tr><td>Base imponible declarada</td><td class="num">${fmtMoney(r.baseImponible)}</td></tr>
            <tr><td>Impuesto determinado</td><td class="num">${fmtMoney(r.impuesto)}</td></tr>
            <tr><td>Retenciones</td><td class="num">${fmtMoney(r.retenciones)}</td></tr>
            <tr><td>Percepciones</td><td class="num">${fmtMoney(r.percepciones)}</td></tr>
            <tr><td>Recaudaciones bancarias</td><td class="num">${fmtMoney(r.recaudacionesBancarias)}</td></tr>
            <tr><td>Saldo a favor del período anterior</td><td class="num">${fmtMoney(r.saldoAnterior)}</td></tr>
            <tr class="total-row"><td>${r.saldoAPagar > 0 ? "Saldo a pagar" : "Saldo a favor"}</td><td class="num ${r.saldoAPagar > 0 ? "cell-pagar" : "cell-favor"}">${fmtMoney(r.saldoAPagar || r.saldoAFavor)}</td></tr>
          </table></div>
        </div>
      </div>`;
  }

  if (client.iibbCM.enabled) {
    const r = calcIibbCMFor(client, period);
    kpis += `
      <div class="kpi ${r.totales.aPagar > 0 ? "state-pagar" : "state-favor"}">
        <span class="k-label">IIBB Convenio Multilateral</span>
        <span class="k-value">${fmtMoney(r.totales.aPagar > 0 ? r.totales.aPagar : 0)}</span>
        <span class="k-sub"><span class="pill ${r.totales.aPagar > 0 ? "pagar" : "favor"}">${r.totales.aPagar > 0 ? "A pagar" : "Saldo a pagar"}</span></span>
      </div>`;
    const rows = r.jurRows.map((j) => `
      <tr>
        <td>${escapeHtml(j.jurisdiccion)}</td>
        <td class="num" style="text-align:center">${fmtMoney(j.baseTotal)}</td>
        <td class="num" style="text-align:center">${fmtMoney(j.impuestoAnticipo)}</td>
        <td class="num" style="text-align:center">${fmtMoney(j.ret + j.perc + j.recban)}</td>
        <td class="num" style="text-align:center">${fmtMoney(j.saldoAnterior)}</td>
        <td class="num ${j.aPagar > 0 ? "cell-pagar" : ""}" style="text-align:center">${j.aPagar > 0 ? fmtMoney(j.aPagar) : "—"}</td>
        <td class="num ${j.aFavor > 0 ? "cell-favor" : ""}" style="text-align:center">${j.aFavor > 0 ? fmtMoney(j.aFavor) : "—"}</td>
      </tr>`).join("") || `<tr><td colspan="7" style="text-align:center;color:var(--muted)">Sin datos cargados para este período.</td></tr>`;
    sections += `
      <div class="card">
        <div class="card-head"><h3>IIBB Convenio Multilateral — DDJJ ${periodLabel(period)}</h3></div>
        <div class="card-body">
          <div class="table-scroll"><table class="jur-summary-table">
            <tr><th style="text-align:left">Jurisdicción</th><th style="text-align:center">Base imponible</th><th style="text-align:center">Anticipo</th><th style="text-align:center">Ret/Perc/RecBan</th><th style="text-align:center">Saldo anterior</th><th style="text-align:center">A pagar</th><th style="text-align:center">A favor</th></tr>
            ${rows}
            <tr class="total-row"><td>TOTALES</td><td class="num" style="text-align:center">${fmtMoney(r.totales.baseTotal)}</td><td class="num" style="text-align:center">${fmtMoney(r.totales.impuestoAnticipo)}</td><td class="num" style="text-align:center">${fmtMoney(r.totales.ret + r.totales.perc + r.totales.recban)}</td><td class="num" style="text-align:center">${fmtMoney(r.totales.saldoAnterior)}</td><td class="num ${r.totales.aPagar > 0 ? "cell-pagar" : ""}" style="text-align:center">${fmtMoney(r.totales.aPagar)}</td><td class="num ${r.totales.aFavor > 0 ? "cell-favor" : ""}" style="text-align:center">${fmtMoney(r.totales.aFavor)}</td></tr>
          </table></div>
        </div>
      </div>`;
  }

  if (!kpis) return monoEnabled(client) ? "" : `<div class="empty"><h2>Este cliente no tiene impuestos activados</h2><p>Andá a la pestaña Configuración para activar IVA, IIBB Local, Convenio Multilateral o Monotributo.</p></div>`;

  return `
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:4px;">
      <h2 class="period-heading" style="margin:0;">${periodLabel(period)}</h2>
      <button class="btn" data-action="open-pdf-preview">📄 Ver / exportar PDF del resumen</button>
    </div>
    <div class="kpi-row" style="margin-bottom:20px;">${kpis}</div>
    <div style="display:flex;flex-direction:column;gap:16px;">${sections}</div>`;
}

// ---------------------------------------------------------------------
// Modal: borrador PDF (vista previa imprimible de la DDJJ del período)
// ---------------------------------------------------------------------
function openPdfPreviewModal(client, scope) {
  if (!client) return;
  const period = state.currentPeriod;
  const hasIva = client.iva.enabled;
  const hasIibb = client.iibbLocal.enabled || client.iibbCM.enabled;
  // scope: "iva" | "iibb" | "all". Si no se pasa, se usa el último elegido
  // (persistido en state.pdfScope) y si no hay uno todavía, "all".
  scope = scope || state.pdfScope || "all";
  if (scope === "iva" && !hasIva) scope = "all";
  if (scope === "iibb" && !hasIibb) scope = "all";
  state.pdfScope = scope;
  const showIva = hasIva && scope !== "iibb";
  const showIibb = hasIibb && scope !== "iva";
  let sections = "";
  let kpiCards = "";

  if (showIva) {
    const r = calcIvaFor(client, period);
    const ivaPagar = r.saldoAPagar > 0;
    kpiCards += `
      <div class="pdf-kpi ${ivaPagar ? "pagar" : "favor"}">
        <div class="pk-label">IVA</div>
        <div class="pk-value">${fmtMoney(ivaPagar ? r.saldoAPagar : r.saldoLibreDisponibilidad)}</div>
        <div class="pk-sub">${ivaPagar ? "A pagar" : "A favor (libre disp.)"}</div>
      </div>`;
    const rowFinal = r.saldoAPagar > 0 ? "total result-pagar" : "total";
    sections += `
      <div class="pdf-section">
        <h3>IVA — DDJJ ${periodLabel(period)}</h3>
        <table class="kv">
          <tr><td>IVA Débito Fiscal</td><td>${fmtMoney(r.debitoFiscal)}</td></tr>
          <tr><td>IVA Crédito Fiscal</td><td>${fmtMoney(r.creditoFiscal)}</td></tr>
          <tr><td>Saldo técnico a favor del período anterior</td><td>${fmtMoney(r.saldoTecnicoAnterior)}</td></tr>
          <tr class="total"><td class="${r.saldoTecnicoFavorARCA > 0 ? "pdf-bold" : ""}">Saldo técnico a favor de ARCA</td><td class="${r.saldoTecnicoFavorARCA > 0 ? "pdf-bold" : ""}">${fmtMoney(r.saldoTecnicoFavorARCA)}</td></tr>
          <tr><td>Saldo técnico a favor del contribuyente</td><td class="${r.saldoTecnicoFavorContribuyente > 0 ? "pdf-favor" : ""}">${fmtMoney(r.saldoTecnicoFavorContribuyente)}</td></tr>
          <tr><td>Saldo libre disponibilidad período anterior</td><td>${fmtMoney(r.libreDispAnterior)}</td></tr>
          <tr><td>Monto utilizado</td><td>${fmtMoney(r.montoUtilizado)}</td></tr>
          <tr><td>Retenciones</td><td>${fmtMoney(r.retenciones)}</td></tr>
          <tr><td>Percepciones</td><td>${fmtMoney(r.percepciones)}</td></tr>
          <tr><td>Saldo de libre disponibilidad</td><td class="${r.saldoLibreDisponibilidad > 0 ? "pdf-favor" : ""}">${fmtMoney(r.saldoLibreDisponibilidad)}</td></tr>
          <tr class="${rowFinal}"><td>Saldo a pagar</td><td>${fmtMoney(r.saldoAPagar)}</td></tr>
        </table>
      </div>`;
  }

  if (showIibb && client.iibbLocal.enabled) {
    const r = calcIibbLocalFor(client, period);
    const localPagar = r.saldoAPagar > 0;
    kpiCards += `
      <div class="pdf-kpi ${localPagar ? "pagar" : "favor"}">
        <div class="pk-label">IIBB Local — ${escapeHtml(client.iibbLocal.jurisdiccion || "jurisdicción")}</div>
        <div class="pk-value">${fmtMoney(r.saldoAPagar || r.saldoAFavor)}</div>
        <div class="pk-sub">${localPagar ? "A pagar" : "A favor"}</div>
      </div>`;
    const rowFinal = r.saldoAPagar > 0 ? "total result-pagar" : (r.saldoAFavor > 0 ? "total result-favor" : "total");
    sections += `
      <div class="pdf-section">
        <h3>IIBB Local (${escapeHtml(client.iibbLocal.jurisdiccion || "jurisdicción")}) — DDJJ ${periodLabel(period)}</h3>
        <table class="kv">
          <tr><td>Base imponible declarada</td><td>${fmtMoney(r.baseImponible)}</td></tr>
          <tr><td>Impuesto determinado</td><td>${fmtMoney(r.impuesto)}</td></tr>
          <tr><td>Retenciones</td><td>${fmtMoney(r.retenciones)}</td></tr>
          <tr><td>Percepciones</td><td>${fmtMoney(r.percepciones)}</td></tr>
          <tr><td>Recaudaciones bancarias</td><td>${fmtMoney(r.recaudacionesBancarias)}</td></tr>
          <tr><td>Saldo a favor del período anterior</td><td>${fmtMoney(r.saldoAnterior)}</td></tr>
          <tr class="${rowFinal}"><td>${r.saldoAPagar > 0 ? "Saldo a pagar" : "Saldo a favor"}</td><td>${fmtMoney(r.saldoAPagar || r.saldoAFavor)}</td></tr>
        </table>
      </div>`;
  }

  if (showIibb && client.iibbCM.enabled) {
    const r = calcIibbCMFor(client, period);
    const cmPagar = r.totales.aPagar > 0;
    kpiCards += `
      <div class="pdf-kpi ${cmPagar ? "pagar" : "favor"}">
        <div class="pk-label">IIBB Convenio Multilateral</div>
        <div class="pk-value">${fmtMoney(cmPagar ? r.totales.aPagar : 0)}</div>

    sections += `
      <div class="pdf-section">
        <h3>IIBB Convenio Multilateral — DDJJ ${periodLabel(period)}</h3>
        <table class="cm">
          <tr><th style="text-align:left">Jurisdicción</th><th>Base imponible</th><th>Anticipo</th><th>Ret/Perc/RecBan</th><th>Saldo anterior</th><th>A pagar</th><th>A favor</th></tr>
          ${rows}
          <tr class="total">
            <td class="pdf-bold">TOTALES</td>

function exencionesParaActividad(code) {
  const c = String(code || "").replace(/\D/g, "");
  if (!c) return null;
  const ids = new Set();
  EXENCION_REGLAS.forEach(([p, list]) => { if (c.indexOf(p) === 0) list.forEach((i) => ids.add(i)); });
  if (!ids.size) return null;
  return ids;
}
function exencionLabel(key) {
  const e = EXENCIONES[key];

// Actividades del período con ventas exentas (o con fundamento elegido), para
// documentarlas en el F. 2083 y en el Excel.
function exencionesDelPeriodo(client, period) {
  const doc = getDoc(client.id, period);
  const pa = (doc && doc.iva && doc.iva.porActividad) || {};
  return (client.iva.activities || []).map((a) => {
    const x = pa[a.code] || {};
    const monto = round2(num(x.exento) - num(x.exentoNC));
    return { code: a.code, desc: a.desc, monto, hay: num(x.exento) !== 0 || num(x.exentoNC) !== 0, key: x.exentoFund || "" };
  }).filter((x) => x.hay);
}
// Panel de control que acompaña a "Ventas exentas o no gravadas" de cada
// actividad en la Apertura de Otros Conceptos.
function exencionPanelHtml(clientId, period, code, pa) {
  const monto = num(pa.exento) - num(pa.exentoNC);
  const key = pa.exentoFund || "";
  const e = EXENCIONES[key];
  const sugeridas = exencionesParaActividad(code);
  const verTodas = !!(state.exenTodas && state.exenTodas[code]);
  const filtrar = !!sugeridas && !verTodas;
  const permitido = (id) => !filtrar || sugeridas.has(id) || id === key;
  const opts = `<option value="">— Elegí el fundamento —</option>` + EXENCIONES_GRUPOS.map((gr) => {
    const ids = gr.ids.filter(permitido);
    return ids.length ? `<optgroup label="${escapeHtml(gr.g)}">${ids.map((id) => `<option value="${id}" ${key === id ? "selected" : ""}>${escapeHtml(EXENCIONES[id].corto)} — ${escapeHtml(EXENCIONES[id].ley)}</option>`).join("")}</optgroup>` : "";
  }).join("");
  const cli = getClient(clientId), act = cli && (cli.iva.activities || []).find((a) => a.code === code);
  const filtroNota = sugeridas
    ? `<div class="hint-sm" style="font-size:11.5px;color:var(--muted);">${filtrar ? `Muestro las exenciones que suelen corresponder a esta actividad${act && act.desc ? ` (${escapeHtml(act.desc)})` : ""}. ` : "Mostrando todas las exenciones. "}<button type="button" class="linklike" style="color:var(--accent);" data-action="exen-todas" data-code="${escapeHtml(code)}" data-clientid="${clientId}" data-period="${period}">${filtrar ? "Ver todas" : "Ver solo las de esta actividad"}</button></div>`
    : `<div class="hint-sm" style="font-size:11.5px;color:var(--muted);">No tengo un filtro para este código de actividad: se muestran todas las exenciones.</div>`;
  const hayMonto = num(pa.exento) !== 0 || num(pa.exentoNC) !== 0;
  // El fundamento solo aparece cuando hay ventas exentas cargadas en la actividad.
  if (!hayMonto) return "";
  let detalle = "";
  if (e) {
    detalle = `<div><button type="button" class="btn btn-sm" data-action="open-ayuda" data-ayuda="ex_${key}">Ver fundamento y qué verificar</button></div>`;
  } else {
    detalle = `<div style="font-size:12px;color:var(--diff);">⚠ Cargaste ventas exentas sin indicar el fundamento. Elegí en qué supuesto de la ley encuadran (así queda documentado en el Excel y en el F. 2083).</div>`;
  }
  return `<div style="display:flex;flex-direction:column;gap:8px;margin-top:10px;">
      <div class="field"><label>Fundamento de la exención</label><select data-action="field" data-path="iva.porActividad.${code}.exentoFund" data-clientid="${clientId}" data-period="${period}" data-reopen="iva-actividades">${opts}</select></div>
      ${filtroNota}
      ${detalle}
    </div>`;
}

const AYUDA_TEXTOS = {"art7": "ARTICULO 7º — Estarán exentas del impuesto establecido por la presente ley, las ventas, las locaciones indicadas en el inciso c) del artículo 3º y las importaciones definitivas que tengan por objeto las cosas muebles incluidas en este artículo y las locaciones y prestaciones comprendidas en el mismo, que se indican a continuación:\n\na) Libros, folletos e impresos similares, incluso en fascículos u hojas sueltas, que constituyan una obra completa o parte de una obra, y diarios, revistas y publicaciones periódicas, así como las suscripciones de ediciones periodísticas digitales de información en línea, en toda la cadena de comercialización y distribución, en todos los casos cualquiera fuere el soporte o el medio utilizado para su difusión, excepto los servicios de distribución, clasificación, reparto y/o devolución de diarios, revistas y publicaciones periódicas que sean prestados a sujetos cuya actividad sea la producción editorial. La exención prevista en este inciso no comprende a los bienes gravados que se comercialicen conjunta o complementariamente con los bienes exentos, en tanto tengan un precio diferenciado de venta y no constituyan un elemento sin el cual estos últimos no podrían utilizarse. Se entenderá que los referidos bienes tienen un precio diferenciado, cuando posean un valor propio de comercialización, aun cuando el mismo integre el precio de los bienes que complementan, incrementando los importes habituales de negociación de los mismos.\n\n, art. 1° del Decreto N° 1008/2001 B.O. 14/08/2001. Vigencia: a partir del día de su publicación en Boletín Oficial. Surtirá efecto a partir del primer día del mes siguiente al de dicha publicación, inclusive —01/09/2001—.)\n\nb) Sellos de correo, timbres fiscales y análogos, sin obliterar, de curso legal o destinados a tener curso legal en el país de destino; papel timbrado, billetes de banco, títulos de acciones o de obligaciones y otros títulos similares, excluidos talonarios de cheques y análogos.\n\nLa exención establecida en este inciso no alcanza a los títulos de acciones o de obligaciones y otros similares que no sean válidos y firmados.\n\n, art. 2º, Título II de la Ley N° 25.239 B.O. 31/12/1999. Vigencia: desde el primer día del mes inmediato siguiente al de entrada en vigencia de la referida ley —01/01/2000—.)\n\nc) Sellos y pólizas de cotización o de capitalización, billetes para juegos de sorteos o de apuestas (oficiales o autorizados) y sellos de organizaciones de bien público del tipo empleado para obtener fondos o hacer publicidad, billetes de acceso a espectáculos teatrales comprendidos en el artículo 7º, inciso h), apartado 10, puestos en circulación por la respectiva entidad emisora o prestadora del servicio. , art. 1° del Decreto N° 496/2001 B.O. 02/05/2001. Vigencia: a partir de su publicación en el Boletín Oficial. Surtirá efecto para los hechos imponibles que se perfeccionen a partir del 1° de mayo de 2001, inclusive.)\n\nd) Oro amonedado, o en barras de buena entrega de 999/1000 de pureza, que comercialicen las entidades oficiales o bancos autorizados a operar.\n\ne) Monedas metálicas (incluidas las de materiales preciosos), que tengan curso legal en el país de emisión o cotización oficial.\n\nf) El agua ordinaria natural, la leche fluida o en polvo, entera o descremada sin aditivos, cuando el comprador sea un consumidor final, el Estado nacional, las provincias, municipalidades o la Ciudad Autónoma de Buenos Aires u organismos centralizados o descentralizados de su dependencia, comedores escolares o universitarios, obras sociales o entidades comprendidas en los incisos e), f), g) y m) del artículo 20 de la Ley de Impuesto a las Ganancias, texto ordenado en 1997 y sus modificaciones, y las especialidades medicinales para uso humano cuando se trate de su reventa por droguerías, farmacias u otros establecimientos autorizados por el organismo competente, en tanto dichas especialidades hayan tributado el impuesto en la prime ey N°23.658 y su modificatoria Ley N°23.666 fijó a partir del 1/02/90, las alícuotas al 14% y 7%, las que nunca llegaron a aplicarse.\n\n(2) Se reestablecen a partir del 1/3/92 las alícuotas del 18% y 27% como consecuencia de la finalización implícitade la vigencia de los decretos Nros. 1701/91, 1702/91, 2396/91 y 356/92.\n\nARTICULO …— Tratándose de sujetos cuya actividad sea la producción editorial, las locaciones de espacios publicitarios en diarios, revistas y publicaciones periódicas, estarán alcanzadas por la alícuota que, según el supuesto de que se trate, se indica a continuación:\n\nTratándose de sujetos cuya actividad sean las ediciones periodísticas digitales de información en línea, estarán alcanzadas por la alícuota que, según el supuesto de que se trate, se indica a continuación:\n\nLos sujetos alcanzados por el presente artículo que estén obligados a la contribución al Fondo para la Educación y Promoción Cooperativa dispuesto por ley 23.427 y modificatorias, podrán utilizar el crédito fiscal que conformare el saldo a favor a que se refiere el primer párrafo del artículo 24 de esta ley acumulado, para la cancelación de dicha contribución. A los fines de la aplicación de las alícuotas indicadas precedentemente, los sujetos indicados en los párrafos precedentes deberán, a la finalización de cada cuatrimestre calendario, considerar los montos de facturación de los últimos DOCE (12) meses calendario inmediatos anteriores, sin incluir el impuesto al valor agregado, y en función de ello, determinar la alícuota correspondiente, la que resultará de aplicación por períodos cuatrimestrales calendario.\n\nSe entenderá por montos de facturación, a los efectos del párrafo anterior, a la facturación total del sujeto pasivo.\n\nLa alícuota que resulte de aplicación a los sujetos indicados en el primer párrafo para la locación de espacios publicitarios, determinada conforme a lo allí previsto, alcanza, asimismo, a los montos facturados que obtengan todos los sujetos intervinientes en el proceso comercial, independientemente de su nivel de facturación, solo por dichos conceptos y en tanto provengan del mismo.\n\nEn el caso de iniciación de actividades, durante los CUATRO (4) primeros períodos fiscales desde dicha iniciación, los sujetos pasivos del gravamen comprendidos en este artículo determinarán la alícuota del tributo mediante una estimación razonable de los montos de facturación anual.\n\nTranscurrido los referidos CUATRO (4) períodos fiscales, deberán proceder a anualizar la facturación correspondiente a dicho período, a los fines de determinar la alícuota que resultará aplicable para las actividades indicadas a partir del quinto período fiscal posterior al de iniciación de actividades, inclusive, de acuerdo con las cifras obtenidas. Dicha anualización procederá en la medida que el período indicado coincida con la finalización del período cuatrimestral calendario completo. De no resultar tal coincidencia, se mantendrá la alícuota determinada conforme el párrafo anterior hasta la finalización del cuatrimestre calendario inmediato siguiente.\n\nLa anualización de la facturación continuará, efectuándose a la finalización de cada cuatrimestre calendario, considerando los períodos fiscales transcurridos hasta el inmediato anterior al inicio del cuatrimestre de que se trate, inclusive, hasta tanto hayan transcurrido DOCE (12) períodos fiscales contados desde el inicio de la actividad.\n\nA partir del 1° de enero de 2024, los montos de facturación indicados en el primer y segundo párrafo del presente artículo se actualizarán conforme la variación operada en el límite de ventas totales anuales aplicables a las medianas empresas del “Tramo 2” correspondientes al sector “servicios”, en los términos del artículo 2° de la ley 24.467 y sus modificatorias, y sus normas reglamentarias y complementarias. Los servicios de distribución, clasificación, reparto y/o devolución de diarios, revistas y publicaciones periódicas que sean prestados const ALICUOTA_REGLAS = [
  { exp: 10.5, pref: ["0141", "0143", "0144", "0145", "014810", "014920", "0113", "0122", "0123", "0124", "012121", "011111", "011112", "011119", "011121", "011129", "011211", "011291", "011299"], why: "venta de animales vivos, frutas, hortalizas, legumbres o granos (Art. 28 inc. a)" },
  { exp: 10.5, pref: ["101011", "101012", "101020", "101040", "472130", "472140", "472160"], why: "carnes y despojos comestibles, frutas y hortalizas frescas (Art. 28 inc. a)" },
  { exp: 10.5, pref: ["016111", "016112", "016113", "016119", "016120"], why: "labores agrícolas vinculadas con granos, frutas y hortalizas (Art. 28 inc. b)" },
  { exp: 10.5, pref: ["410011"], why: "obras destinadas a vivienda (Art. 28 inc. c)" },
  { exp: 10.5, pref: ["491110", "491120", "49211", "49214", "49215", "49216", "49218", "49219"], why: "transporte de pasajeros no exento (Art. 28 inc. h)" },
  { exp: 27, pref: ["351", "352", "353", "360", "611", "612", "613", "614", "619"], why: "gas, energía eléctrica, agua por medidor o telecomunicaciones (Art. 28, 2.º párrafo)" },
];
const ALICUOTA_RUBROS_21 = ["55", "56", "58", "59", "62", "63", "68", "69", "70", "71", "72", "73", "74", "77", "78", "79", "80", "81", "82"];
function alicuotaAviso(a, pa) {
  const code = String(a.code || "");
  if (!code) return null;
  const g = (k) => num(getDeep(pa || {}, `debito.${k}`, 0));
  const v105 = g("ri105") + g("cf105"), v21 = g("ri21") + g("cf21"), vRI = g("ri105") + g("ri21");
  const regla = ALICUOTA_REGLAS.find((r) => r.pref.some((pf) => code.startsWith(pf)));
  if (regla && regla.exp === 10.5 && v21 > 0) {
    return `Cargaste ventas al 21% en un rubro que habitualmente tributa al 10,5%: ${regla.why}. Si la venta corresponde a otro concepto, ignorá este aviso.`;
  }
  if (regla && regla.exp === 27 && vRI > 0) {
    return `Este rubro puede tributar al 27% cuando se vende a Responsables Inscriptos o monotributistas fuera de viviendas: ${regla.why}. La apertura solo tiene 10,5% y 21%; verificá cómo se declaró.`;
  }
  if (!regla && v105 > 0 && ALICUOTA_RUBROS_21.some((pf) => code.startsWith(pf))) {
    return `Cargaste ventas al 10,5% en un rubro que normalmente tributa al 21%. El 10,5% aplica solo a los supuestos puntuales del Art. 28 (carnes, frutas y hortalizas, obras de vivienda, transporte de pasajeros, intereses bancarios, etc.). Verificá que corresponda.`;
  }
  return null;
}
function alicuotaAvisoHtml(clientId, period, a, pa) {
  if (pa && pa.alicuotaAvisoDescartado) return "";
  const msg = alicuotaAviso(a, pa);
  if (!msg) return "";
  return `<div class="warn-banner" style="margin-bottom:12px;">
      <div class="wb-text">⚠ <b>Revisá la alícuota.</b> ${escapeHtml(msg)}${ayudaBtn("alicuotas")}</div>

    </div>`;
}

// ---- IIBB Local ----
function renderIibbLocalTab(client) {
  const period = state.currentPeriod;

  const actInputRows = r.actividadDetalle.map((a) => `

      <td><input type="text" inputmode="decimal" data-kind="money" value="${rawOrBlank(actData[a.code], "money")}" data-path="iibbLocal.actividades.${a.code}" data-action="field" data-clientid="${client.id}" data-period="${period}"></td>
    </tr>`).join("") || `<tr><td colspan="2" style="text-align:center;color:var(--muted)">Cargá las actividades de esta jurisdicción en Configuración.</td></tr>`;

  const actRows = r.actividadDetalle.map((a) => `
    <tr>
      <td>${escapeHtml(a.desc || a.code)} <span style="color:var(--muted-soft)">(${escapeHtml(a.code)})</span></td>
      <td class="num readonly">${fmtPct(a.alicuota)}</td>
      <td class="num readonly">${fmtMoney(a.baseImponible)}</td>

    </tr>`).join("") || `<tr><td colspan="4" style="text-align:center;color:var(--muted)">Cargá las actividades de esta jurisdicción en Configuración.</td></tr>`;

  const historyPeriods = listPeriodsWithTax(client.id, "iibbLocal").slice(-12);
  const history = historyPeriods.map((p) => {
    const rr = calcIibbLocalFor(client, p);
    const retPercRecban = rr.retenciones + rr.percepciones + rr.recaudacionesBancarias;
    return `<tr class="${p === period ? "row-current" : ""}"><td>${periodLabel(p)}</td><td class="num">${fmtMoney(rr.baseImponible)}</td><td class="num">${fmtMoney(rr.impuesto)}</td><td class="num">${fmtMoney(retPercRecban)}</td><td class="num ${rr.saldoAPagar > 0 ? "cell-pagar" : ""}">${rr.saldoAPagar > 0 ? fmtMoney(rr.saldoAPagar) : "—"}</td><td class="num ${rr.saldoAFavor > 0 ? "cell-favor" : ""}">${rr.saldoAFavor > 0 ? fmtMoney(rr.saldoAFavor) : "—"}</td></tr>`;

  const historyTotals = historyPeriods.reduce((acc, p) => {
    const rr = calcIibbLocalFor(client, p);
    acc.base += rr.baseImponible; acc.impuesto += rr.impuesto;
    acc.retPercRecban += rr.retenciones + rr.percepciones + rr.recaudacionesBancarias;
    acc.aPagar += rr.saldoAPagar; acc.aFavor += rr.saldoAFavor;

  const historyTotalsRow = historyPeriods.length ? `<tr class="total-row"><td>Totales</td><td class="num">${fmtMoney(historyTotals.base)}</td><td class="num">${fmtMoney(historyTotals.impuesto)}</td><td class="num">${fmtMoney(historyTotals.retPercRecban)}</td><td class="num">${fmtMoney(historyTotals.aPagar)}</td><td class="num">${fmtMoney(historyTotals.aFavor)}</td></tr>` : "";

  return `

      <div class="card">
        <div class="card-head"><h3>Actividades — Ventas netas (según libro IVA Ventas)</h3></div>

          <div class="table-scroll"><table>
            <tr><th>Actividad</th><th>Ventas netas</th></tr>
            ${actInputRows}
            <tr class="total-row"><td>TOTAL — todas las actividades</td><td class="num">${fmtMoney(r.baseImponible)}</td></tr>
          </table></div>
        </div>
      </div>
      <div class="card">
        <div class="card-head"><h3>${escapeHtml(client.iibbLocal.jurisdiccion || "Jurisdicción local")} — Régimen Local</h3></div>
        <div class="card-body">
          <div class="table-scroll"><table>
            <tr><th>Actividad</th><th>Alícuota</th><th>Ventas netas</th><th>Impuesto</th></tr>
            ${actRows}
            <tr class="total-row"><td colspan="3">Impuesto determinado</td><td class="num">${fmtMoney(r.impuesto)}</td></tr>
          </table></div>
          <div class="form-grid">
            <div class="field"><label>Retenciones (s/Sistema)</label><input type="text" inputmode="decimal" data-kind="money" value="${rawOrBlank(d.retenciones, "money")}" data-path="iibbLocal.retenciones" data-action="field" data-clientid="${client.id}" data-period="${period}"></div>
            <div class="field"><label>Percepciones (s/Sistema)</label><input type="text" inputmode="decimal" data-kind="money" value="${rawOrBlank(d.percepciones, "money")}" data-path="iibbLocal.percepciones" data-action="field" data-clientid="${client.id}" data-period="${period}"></div>
            <div class="field"><label>Recaudaciones bancarias (s/Sistema)</label><input type="text" inputmode="decimal" data-kind="money" value="${rawOrBlank(d.recaudacionesBancarias, "money")}" data-path="iibbLocal.recaudacionesBancarias" data-action="field" data-clientid="${client.id}" data-period="${period}"></div>
          </div>
          <div class="table-scroll"><table>
            <tr><td>Saldo a favor del período anterior</td><td class="num">${fmtMoney(r.saldoAnterior)}</td></tr>
            <tr class="total-row"><td>${r.saldoAPagar > 0 ? "Saldo a pagar" : "Saldo a favor"}</td><td class="num ${r.saldoAPagar > 0 ? "cell-pagar" : "cell-favor"}">${fmtMoney(r.saldoAPagar || r.saldoAFavor)}</td></tr>
          </table></div>
        </div>
      </div>
      <div class="card">
        <div class="card-head"><h3>Resumen de DDJJ presentadas</h3></div>
        <div class="card-body">
          <div class="table-scroll"><table class="table-compact">
            <tr><th>Período</th><th>Base imponible</th><th>Impuesto</th><th>Ret./Perc./Rec. banc.</th><th>A pagar</th><th>A favor</th></tr>
            ${history || `<tr><td colspan="6" style="text-align:center;color:var(--muted)">Sin períodos cargados todavía.</td></tr>`}
            ${historyTotalsRow}
          </table></div>
        </div>
      </div>
    </div>`;
}

// ---- Configuración ----
function renderConfigTab(client) {
  // Saldo previo por régimen: si ya hay un período anterior cargado, se
  // muestra de sólo lectura lo que ese período dejó como saldo a favor real
  // (mismo criterio para IVA, IIBB Local e IIBB CM) — el campo editable de
  // "saldo inicial" sólo tiene sentido antes de que exista ningún período.
  const ivaPrevPeriods = listPeriodsWithTax(client.id, "iva").filter((p) => p < state.currentPeriod).sort();
  const ivaPrevPeriod = ivaPrevPeriods.length ? ivaPrevPeriods[ivaPrevPeriods.length - 1] : null;
  const ivaPrevResult = ivaPrevPeriod ? calcIvaFor(client, ivaPrevPeriod) : null;
  // Prorrateo y TurIVA son por período (no todos los períodos aplican el
  // mismo tratamiento necesariamente), así que el switch de Configuración
  // muestra y edita el valor del período que se está viendo. Si ese período
  // todavía no tiene el campo cargado a mano, se usa como arranque el valor
  // histórico que tenía el cliente (así los períodos ya cargados no cambian
  // de golpe con este ajuste).
  const currentIvaDoc = getDoc(client.id, state.currentPeriod);
  const currentIvaSub = currentIvaDoc && currentIvaDoc.iva;
  const prorrateoExentoActual = currentIvaSub && typeof currentIvaSub.prorrateoExento === "boolean" ? currentIvaSub.prorrateoExento : !!client.iva.prorrateoExento;
  const turIvaActual = currentIvaSub && typeof currentIvaSub.turIvaEnabled === "boolean" ? currentIvaSub.turIvaEnabled : !!client.iva.turIva;
  const iibbLocalPrevPeriods = listPeriodsWithTax(client.id, "iibbLocal").filter((p) => p < state.currentPeriod).sort();
  const iibbLocalPrevPeriod = iibbLocalPrevPeriods.length ? iibbLocalPrevPeriods[iibbLocalPrevPeriods.length - 1] : null;
  const iibbLocalPrevResult = iibbLocalPrevPeriod ? calcIibbLocalFor(client, iibbLocalPrevPeriod) : null;

  const activityRows = (client.iibbCM.activities || []).map((a, i) => `
    <tr>
      <td style="text-align:left;padding-right:2px;"><input type="text" value="${escapeHtml(a.code)}" title="${escapeHtml(a.code)}" data-cfg="activity-code" data-idx="${i}" style="width:88px;"></td>
      <td style="text-align:left;padding-left:2px;"><input type="text" value="${escapeHtml(a.desc)}" title="${escapeHtml(a.desc)}" data-cfg="activity-desc" data-idx="${i}" style="width:100%;min-width:280px;"></td>
      <td style="text-align:left;white-space:nowrap;">
        <span class="hint-sm">${regimenLabel(a)}</span>
        <button type="button" class="btn btn-ghost btn-sm" data-action="open-activity-regimen-modal" data-code="${escapeHtml(a.code)}">Editar</button>
        ${!a.regimen && !a.regimenAvisoOk && cmEncuadreSugerido(a.code) ? `<div class="hint-sm" style="color:var(--diff);white-space:normal;">⚠ Revisar: podría corresponder el Art. ${cmEncuadreSugerido(a.code).art}</div>` : ""}
      </td>
      <td><button class="btn btn-ghost btn-danger btn-sm" data-action="remove-activity" data-idx="${i}">Quitar</button></td>
    </tr>`).join("") || `<tr><td colspan="4" style="text-align:center;color:var(--muted)">Sin actividades cargadas.</td></tr>`;

  const jurRows = (client.iibbCM.jurisdictions || [])
    .map((j, i) => ({ j, i }))
    .sort((a, b) => jurSortIndex(a.j.name) - jurSortIndex(b.j.name))
    .map(({ j, i }) => {
      const alicCells = (client.iibbCM.activities || []).map((a) => `
      <td style="text-align:center;"><span class="pct-field"><input type="text" inputmode="decimal" data-kind="percent" value="${rawOrBlank(j.alicuotas && j.alicuotas[a.code], "percent")}" placeholder="—" data-cfg="jur-alicuota" data-jur="${escapeHtml(j.name)}" data-code="${escapeHtml(a.code)}"><span class="pct-suffix">%</span></span></td>`).join("");
      return `<tr><td>${escapeHtml(j.name)}</td>${alicCells}<td><button class="btn btn-ghost btn-danger btn-sm" data-action="remove-jurisdiction" data-idx="${i}">Quitar</button></td></tr>`;
    }).join("") || `<tr><td colspan="${2 + (client.iibbCM.activities || []).length}" style="text-align:center;color:var(--muted)">Sin jurisdicciones cargadas.</td></tr>`;

  // Coeficientes: una sola vigencia visible a la vez (elegida con el
  // desplegable), en vez de un bloque por año — más compacto y refleja
  // el período real desde el que empezó a regir cada actualización.
  // Por defecto se muestra la vigencia que efectivamente aplica al período
  // que se está viendo arriba (mismo criterio que usa el cálculo real, no
  // la última vigencia cargada).
  const coefVigList = (client.iibbCM.coeficientes || []).slice().sort((a, b) => a.desde.localeCompare(b.desde));
  const vigenciaDelPeriodo = getCoefVigencia(client, state.currentPeriod);
  const defaultDesde = vigenciaDelPeriodo ? vigenciaDelPeriodo.desde : (coefVigList.length ? coefVigList[0].desde : null);
  const selectedDesde = coefVigList.some((v) => v.desde === state.selectedCoefDesde)
    ? state.selectedCoefDesde
    : (defaultDesde || (coefVigList.length ? coefVigList[coefVigList.length - 1].desde : null));
  const selectedVig = coefVigList.find((v) => v.desde === selectedDesde);
  const coefSum = selectedVig ? (client.iibbCM.jurisdictions || []).reduce((s, j) => s + num(selectedVig.valores[j.name]), 0) : 0;
  const coefRows = sortedJurisdictions(client.iibbCM.jurisdictions).map((j) => `
      <div class="jur-row">
        <span>${escapeHtml(j.name)}</span>
        <span class="pct-field"><input type="text" inputmode="decimal" data-kind="percent" value="${selectedVig ? rawOrBlank(selectedVig.valores[j.name], "percent") : ""}" placeholder="—" data-cfg="coef" data-jur="${escapeHtml(j.name)}" data-desde="${selectedDesde || ""}"><span class="pct-suffix">%</span></span>
      </div>`).join("") || `<p style="color:var(--muted);font-size:12px;">Cargá jurisdicciones primero.</p>`;

  // Saldos a favor por jurisdicción: si ya hay un período anterior cargado,
  // se muestra de sólo lectura el saldo a favor real que dejó ese período
  // (el mismo que arrastra la DDJJ) — no tiene sentido pedir que se cargue
  // a mano algo que ya se puede calcular. El campo editable sólo aparece
  // para el arranque, antes de que exista ningún período con datos.
  const cmPrevPeriods = listPeriodsWithTax(client.id, "iibbCM").filter((p) => p < state.currentPeriod).sort();
  const cmPrevPeriod = cmPrevPeriods.length ? cmPrevPeriods[cmPrevPeriods.length - 1] : null;
  const cmPrevResult = cmPrevPeriod ? calcIibbCMFor(client, cmPrevPeriod) : null;
  const saldoInicialCMRows = sortedJurisdictions(client.iibbCM.jurisdictions).map((j) => {
    if (cmPrevResult) {
      const row = cmPrevResult.jurRows.find((r) => r.jurisdiccion === j.name);
      return `
    <div class="jur-row">
      <span>${escapeHtml(j.name)}</span>
      <span class="mono" style="padding:8px 10px;color:var(--muted);">${fmtMoney(row ? row.aFavor : 0)}</span>
    </div>`;
    }
    return `
    <div class="jur-row">
      <span>${escapeHtml(j.name)}</span>
      <input type="text" inputmode="decimal" data-kind="money" value="${rawOrBlank(client.iibbCM.saldosIniciales && client.iibbCM.saldosIniciales[j.name], "money")}" placeholder="—" data-cfg="saldo-inicial-cm" data-jur="${escapeHtml(j.name)}">
    </div>`;
  }).join("") || "";

  return `
    <div style="display:flex;flex-direction:column;gap:16px;max-width:1180px;">
      <div class="cards-row">
      <div class="card">

// Mapa de refrescos para inputs que viven dentro de un modal (el modal se
// reconstruye a sí mismo, pero eso no toca #main — hay que refrescar los
// dos lados). Se indexa por el valor de data-reopen del input.
const MODAL_REFRESHERS = {

// Cuando se carga un importe en "Apertura de Otros Conceptos" (IVA), la
// venta neta de esa actividad (gravada + exenta, netas de N.C. emitidas —
// misma fórmula que el subtotal del propio modal) se traslada sola al monto
// de esa actividad en IIBB Local y/o Convenio Multilateral (el que tenga
// habilitado el cliente y tenga esa actividad cargada), para no tener que
// escribir dos veces el mismo total de ventas.
function syncVentasNetasFromIvaActividad(clientId, period, path) {
  const parts = (path || "").split(".");
  if (parts[0] !== "iva" || parts[1] !== "porActividad") return;
  const code = parts[2];
  if (!code) return;
  const client = getClient(clientId);
  if (!client) return;
  const doc = getDoc(clientId, period);
  const pa = (doc && doc.iva && doc.iva.porActividad && doc.iva.porActividad[code]) || {};
  const debitoSum = ["ri105", "cf105", "ri21", "cf21"].reduce((s, k) => s + num(getDeep(pa, `debito.${k}`, 0)), 0);
  const ncSum = ["ncEmit105RI", "ncEmit105CF", "ncEmit21RI", "ncEmit21CF"].reduce((s, k) => s + num(getDeep(pa, `restCredito.${k}`, 0)), 0);
  const ventasNetas = round2(debitoSum - ncSum + num(pa.exento) - num(pa.exentoNC));
  touchDoc(clientId, period, (d) => {
    if (client.iibbLocal.enabled && (client.iibbLocal.activities || []).some((a) => a.code === code)) {
      setDeep(d, `iibbLocal.actividades.${code}`, ventasNetas);
    }
    if (client.iibbCM.enabled && (client.iibbCM.activities || []).some((a) => a.code === code)) {
      setDeep(d, `iibbCM.actividades.${code}`, ventasNetas);
    }
  });
}

function getExtras() {
  if (!state.extras || typeof state.extras !== "object") state.extras = {};
  const e = state.extras;
  if (!e.vencLocal || typeof e.vencLocal !== "object") e.vencLocal = {};
  if (!e.alicEscalas || typeof e.alicEscalas !== "object") e.alicEscalas = {};
  if (!e.monoEscala || typeof e.monoEscala !== "object") e.monoEscala = { vigencia: "", rows: [] };
  if (!Array.isArray(e.monoEscala.rows)) e.monoEscala.rows = [];
  if (!e.monoIibb || typeof e.monoIibb !== "object") e.monoIibb = {};
  Object.keys(MONO_IIBB_DEFAULT).forEach((prov) => { if (!e.monoIibb[prov] || typeof e.monoIibb[prov] !== "object") e.monoIibb[prov] = Object.assign({}, MONO_IIBB_DEFAULT[prov]); });
  if (!e.monoEscala.rows.length) {
    e.monoEscala.rows = MONO_ESCALA_DEFAULT.map((r) => Object.assign({}, r));
    if (!e.monoEscala.vigencia) e.monoEscala.vigencia = "desde 1/08/2026 (ARCA)";
  }
  // Escalas guardadas antes del desglose: se completa integrado/SIPA/obra social desde la escala
  // oficial sólo si la cuota total guardada coincide con la oficial (si el usuario la editó, no se toca).
  e.monoEscala.rows.forEach((r) => {
    if (r.integServ !== undefined || r.sipa !== undefined) return;
    const d = MONO_ESCALA_DEFAULT.find((x) => x.cat === r.cat);
    if (d && Math.abs(num(r.cuotaServ) - d.cuotaServ) < 0.01 && Math.abs(num(r.cuotaBienes) - d.cuotaBienes) < 0.01) { r.integServ = d.integServ; r.integBienes = d.integBienes; r.sipa = d.sipa; r.obraSocial = d.obraSocial; }
  });
  return e;
}

function fechaDeCelda(v) {
  if (typeof v === "number" && v > 30000 && v < 80000) { const d = new Date(Math.round((v - 25569) * 86400000)); return { y: d.getUTCFullYear(), m: d.getUTCMonth() + 1, d: d.getUTCDate() }; }

// Reparte el neto gravado entre 10,5 / 21 / 27 según el IVA que figura.
// Comprobantes con varias alícuotas (ej. un banco) salen con IVA entre dos
// alícuotas: se resuelve el sistema neto = a + b, iva = a·t1 + b·t2.
function dividirAlicuotas(neto, iva) {
  const z = { a105: 0, a21: 0, a27: 0, a0: 0, sin: 0, mixto: false };
  if (neto <= 0.005) return z;
  const tol = Math.max(1.5, neto * 0.0006);
  if (iva < 0.5) { z.a0 = neto; return z; }
  const rates = [[0.105, "a105"], [0.21, "a21"], [0.27, "a27"]];
  for (const [t, k] of rates) if (Math.abs(iva - neto * t) <= tol) { z[k] = neto; return z; }
  const mezcla = (t1, k1, t2, k2) => {
    const b = (iva - neto * t1) / (t2 - t1);
    if (b < -tol / t2 || b > neto + tol / t2) return false;
    const bb = Math.min(neto, Math.max(0, b));
    z[k2] = round2(bb); z[k1] = round2(neto - bb); z.mixto = true; return true;
  };
  if (iva > neto * 0.105 && iva < neto * 0.21 && mezcla(0.105, "a105", 0.21, "a21")) return z;
  if (iva > neto * 0.21 && iva < neto * 0.27 && mezcla(0.21, "a21", 0.27, "a27")) return z;
  z.sin = neto;
  return z;
}

          else if (n === "exento") col.exento = i;

      comp.push({
        fecha: `${String(f.d).padStart(2, "0")}/${String(f.m).padStart(2, "0")}/${f.y}`, tipo, esNC, esND,
        pv: String(row[col.pv] || "").trim(), nro: String(row[col.num] || "").trim(),
        cuit: String(row[col.cuit] || "").trim(), nombre: String(row[col.nombre] || "").trim() || "(sin nombre)",
        neto, iva, nog, exe, total, otros: total > 0 ? round2(total - neto - iva - nog - exe) : 0, sp,
      });
    }
    if (!comp.length) { alert(`No encontré comprobantes de ${periodLabel(period)} en este archivo (¿es el período correcto?).`); return; }
    state.comprasImp = { clientId, period, comp, fuera, conceptos: Object.assign({}, (client.iva && client.iva.compraConceptos) || {}) };
    renderComprasImportModal();
  };
  reader.onerror = () => alert("No pude leer el archivo.");
  reader.readAsArrayBuffer(file);
}
// ---------------------------------------------------------------------
// Libro IVA Compras en PDF: formato "Libro IVA Compras" (Crystal / Holistor, etc.)
// y "Subdiario de IVA Compras" (Tango). Núcleo sin dependencias de la app (salvo round2).
// ---------------------------------------------------------------------
const PDF_RE_ARG = /^-?\d{1,3}(?:\.\d{3})*,\d{2}$|^-?\d+,\d{2}$/;
const PDF_RE_DOT = /^-?\d+\.\d{2}$/;
const PDF_RE_CUIT = /\d{2}-\d{8}-\d/;
const PDF_RE_PCT = /^\d{1,2},\d{2}%$/;
function pdfNumArg(s) { return parseFloat(String(s).replace(/\./g, "").replace(",", ".")); }
function pdfNumUs(s) { return parseFloat(String(s).replace(/,/g, "")); }
function pdfAgruparFilas(items) {
  items = items.slice().sort((a, b) => b.y - a.y || a.x - b.x);
  const rows = [];
  items.forEach((it) => {
    const last = rows[rows.length - 1];
    if (last && Math.abs(last.y - it.y) <= 2.2) last.it.push(it); else rows.push({ y: it.y, it: [it] });
  });
  rows.forEach((r) => r.it.sort((a, b) => a.x - b.x));
  return rows;
}
const pdfTxt = (row) => row.it.map((t) => t.s).join(" ");
const pdfFecha = (d, m, y) => `${d}/${m}/${y}`;

// ----- Formato "Libro IVA Compras" ------------------------------------
function pdfParseLibro(pages) {
  const out = { formato: "libro", empresa: "", desde: null, hasta: null, raw: [], foot: { credito: { rates: {}, nal: null }, debito: { rates: {}, nal: null }, ni: null, reg: [] }, problemas: [] };
  let cur = null, sec = null;
  const money = (t) => PDF_RE_ARG.test(t.s);
  const mval = (t) => pdfNumArg(t.s);
  const finish = () => { if (cur) { out.raw.push(cur); cur = null; } };
  const montos = (toks, esPrimera) => {
    const pidx = toks.findIndex((t) => PDF_RE_PCT.test(t.s));
    if (pidx >= 0) {
      const before = toks.slice(0, pidx).filter(money), after = toks.slice(pidx + 1).filter(money);
      const pct = parseFloat(toks[pidx].s.replace(",", "."));
      const neto = before.length ? mval(before[before.length - 1]) : 0;
      before.slice(0, -1).forEach((t) => { cur.exe += mval(t); });
      cur.lines.push({ pct, neto, iva: after.length ? mval(after[0]) : 0 });
      if (after.length >= 3) cur.total = mval(after[after.length - 1]);
      return true;
    }
    const ms = toks.filter(money).map(mval);
    if (!ms.length) return false;
    if (cur.lines.length === 0 && cur.total == null && !cur.sinPct) {
      cur.sinPct = true;
      cur.exe += ms.length === 1 ? ms[0] : ms[0];
      cur.total = ms[ms.length - 1];
      return true;
    }
    return false;
  };
  pages.forEach((rows) => {
    rows.forEach((row) => {
      const toks = row.it, txt = pdfTxt(row);
      let m;
      if (/Hoja Nro:/i.test(txt) && !out.empresa) out.empresa = txt.replace(/\s*Hoja Nro:.*$/i, "").trim();
      if ((m = txt.match(/Desde el:\s*(\d{2})\/(\d{2})\/(\d{4})/))) {
        out.desde = { d: +m[1], m: +m[2], y: +m[3] };
        const h = txt.match(/Hasta el:\s*(\d{2})\/(\d{2})\/(\d{4})/);
        if (h) out.hasta = { d: +h[1], m: +h[2], y: +h[3] };
        return;
      }
      if (/TOTALES DE OPERACIONES QUE GENERAN CREDITO FISCAL/i.test(txt)) { finish(); sec = "credito"; return; }
      if (/TOTALES DE OPERACIONES QUE GENERAN DEBITO FISCAL/i.test(txt)) { finish(); sec = "debito"; return; }
      if (/^REGIMENES ESPECIALES/i.test(txt)) { finish(); sec = "reg"; return; }
      if (/^TOTALES AL\b/i.test(txt)) { finish(); sec = "fin"; return; }
      if (sec === "credito" || sec === "debito") {
        const pi = toks.findIndex((t) => PDF_RE_PCT.test(t.s));
        if (pi >= 0 && /Tasa IVA/i.test(txt)) {
          const pct = parseFloat(toks[pi].s.replace(",", "."));
          const ns = toks.slice(pi + 1).filter(money).map(mval);
          out.foot[sec].rates[pct] = { neto: ns[0] || 0, iva: ns[1] || 0 };
        } else if (/^Compras NI/i.test(txt)) { const ns = toks.filter(money).map(mval); if (ns.length) out.foot.ni = ns[0]; }
        else if (/^No alcanzado/i.test(txt)) { const ns = toks.filter(money).map(mval); if (ns.length) out.foot[sec].nal = ns[0]; }
        return;
      }
      if (sec === "reg") {
        if (/^(\d{3,4}|IB[A-Z]{2})$/.test(toks[0].s)) { const ns = toks.filter(money).map(mval); if (ns.length) out.foot.reg.push({ code: toks[0].s, amt: ns[0] }); }
        return;
      }
      if (sec) return;
      if (/^TRANSPORTE\b/i.test(txt)) return;
      const f = txt.match(/^(\d{2})\/(\d{2})\/(\d{2})\s+([A-Z]{2,3})\s*([A-Z])?\s*(\d{4,5})-(\d{8})/);
      if (f) {
        finish();
        cur = { fecha: pdfFecha(f[1], f[2], "20" + f[3]), tipo: f[4], letra: f[5] || "", pv: f[6], nro: f[7], cuit: "", nombre: "", lines: [], nog: 0, exe: 0, total: null, percs: [], sinPct: false };
        const ni = toks.findIndex((t) => /\d{4,5}-\d{8}/.test(t.s));
        const nm = [];
        for (let i = ni + 1; i < toks.length; i++) {
          const t = toks[i];
          if (money(t) || PDF_RE_PCT.test(t.s)) break;
          const cm = t.s.match(PDF_RE_CUIT);
          if (cm) { cur.cuit = cm[0].replace(/\D/g, ""); const rest = t.s.replace(PDF_RE_CUIT, "").replace(/\s+[\d-]+$/, "").trim(); if (rest) nm.push(rest); continue; }
          if (cur.cuit) continue; // Nº de Ing. Brutos u otros datos a la derecha del CUIT
          nm.push(t.s);
        }
        cur.nombre = nm.join(" ").trim();
        montos(toks, true);
        return;
      }
      if (!cur) return;
      // Filas de continuación del comprobante
      if (toks.some((t) => PDF_RE_PCT.test(t.s))) { montos(toks, false); return; }
      const iNal = toks.findIndex((t) => /^N\.?\s*Al\.?$/i.test(t.s));
      let hizo = false;
      for (let i = 0; i < toks.length; i++) {
        const t = toks[i], nx = toks[i + 1];
        if (/^N\.?\s*Al\.?$/i.test(t.s) && nx && money(nx)) { cur.nog += mval(nx); i++; hizo = true; }
        else if (/^(\d{3,4}|IB[A-Z]{2})$/.test(t.s) && nx && money(nx)) { cur.percs.push({ code: t.s, amt: mval(nx) }); i++; hizo = true; }
      }
      if (hizo) return;
      if (toks.some(money)) { montos(toks, false); return; }
      // continuación del nombre / CUIT
      const cm = txt.match(PDF_RE_CUIT);
      if (cm && !cur.cuit) cur.cuit = cm[0].replace(/\D/g, "");
      const extra = toks.map((t) => t.s).filter((s) => !PDF_RE_CUIT.test(s) && !/^[\d-]+$/.test(s));
      if (extra.length && cur.nombre.length < 60) cur.nombre = (cur.nombre + " " + extra.join(" ")).trim();
    });
  });
  finish();
  return out;
}

// ----- Formato Subdiario de IVA Compras (Tango) ----------------------
function pdfParseTango(pages) {
  const out = { formato: "tango", empresa: "", desde: null, hasta: null, raw: [], foot: {}, problemas: [] };
  let cur = null;
  const dot = (t) => PDF_RE_DOT.test(t.s);
  const finish = () => { if (cur) { out.raw.push(cur); cur = null; } };
  pages.forEach((rows) => {
    if (!rows.some((r) => /SUBDIARIO DE IVA COMPRAS/i.test(pdfTxt(r)))) return;
    let tras = false, enDetalle = true;
    rows.forEach((row) => {
      const toks = row.it, txt = pdfTxt(row);
      let m;
      if (/SUBDIARIO DE IVA COMPRAS/i.test(txt)) { tras = true; return; }
      if (tras && !out.empresa && !/DESDE|HOJA|COMPROB/i.test(txt) && /[A-Za-z]/.test(txt)) { out.empresa = txt.trim(); return; }
      if ((m = txt.match(/DESDE\s+(\d{2})\/(\d{2})\/(\d{4})\s+HASTA\s+(\d{2})\/(\d{2})\/(\d{4})/))) {
        out.desde = { d: +m[1], m: +m[2], y: +m[3] }; out.hasta = { d: +m[4], m: +m[5], y: +m[6] }; return;
      }
      if (/^TOTALES DE IVA POR TIPO/i.test(txt)) { finish(); enDetalle = false; return; }
      if (!enDetalle) {
        let t;
        if ((t = txt.match(/TOTAL EXENTO\s*:\s*(-?[\d,]+\.\d{2})/i))) out.foot.exento = pdfNumUs(t[1]);
        if ((t = txt.match(/TOTAL OTROS IMPUESTOS\s*:\s*(-?[\d,]+\.\d{2})/i))) out.foot.otros = pdfNumUs(t[1]);
        if ((t = txt.match(/TOTAL NO GRAVADO\s*:\s*(-?[\d,]+\.\d{2})/i))) out.foot.noGravado = pdfNumUs(t[1]);
        return;
      }
      if ((m = txt.match(/^FECHA:\s*(\d{2}\/\d{2}\/\d{4})/))) { finish(); out.fechaActual = m[1]; return; }
      // fila de totales del subdiario: cuatro importes y nada más
      if (toks.length === 4 && toks.every(dot)) {
        finish();
        const v = toks.map((t) => parseFloat(t.s));
        out.foot.totales = { nog: v[0], neto: v[1], iva: v[2], total: v[3] };
        return;
      }
      const h = txt.match(/^([A-Z][A-Z\/\.]{1,4})\s+([A-Z])(\d{5})(\d{8})\s+(.*)$/);
      if (h) {
        finish();
        const ci = toks.findIndex((t) => PDF_RE_CUIT.test(t.s));
        const rest = h[5];
        const cm = rest.match(PDF_RE_CUIT);
        let nombre = cm ? rest.slice(0, rest.indexOf(cm[0])) : rest;
        nombre = nombre.replace(/^\d+\s+/, "").replace(/\s+[A-Z]{2}\s*$/, "").trim();
        const nums = ci >= 0 ? toks.slice(ci + 1).filter(dot).map((t) => parseFloat(t.s)) : toks.filter(dot).map((t) => parseFloat(t.s));
        cur = { fecha: out.fechaActual || "", tipo: h[1], letra: h[2], pv: h[3], nro: h[4], cuit: cm ? cm[0].replace(/\D/g, "") : "", nombre, lines: [], nog: 0, exe: 0, total: null, percs: [], otrosImp: 0, netoLibro: 0, ivaLibro: 0 };
        if (nums.length === 5) {
          cur.nog = nums[0]; cur.netoLibro = nums[1]; cur.total = nums[4];
          if (nums[2] > 0) cur.lines.push({ pct: nums[2], neto: nums[1], iva: nums[3] });
          else if (nums[1] > 0) cur.lines.push({ pct: 0, neto: nums[1], iva: 0 });
          cur.ivaLibro += nums[3];
        } else if (nums.length === 3) {
          cur.nog = nums[0]; cur.netoLibro = nums[1]; cur.total = nums[2];
          if (nums[1] > 0) cur.lines.push({ pct: 0, neto: nums[1], iva: 0 });
        } else out.problemas.push(`No pude leer los importes de ${h[2]}${h[3]}-${h[4]} (${nombre}).`);
        return;
      }
      if (!cur) return;
      // continuación: "OTROS IMPUESTOS", segundas alícuotas, percepciones
      const nums = toks.filter(dot).map((t) => parseFloat(t.s));
      if (/OTROS\s+IMPUESTOS/i.test(txt) && nums.length) { const o = nums.shift(); cur.otrosImp += o; cur.percs.push({ code: "OTROS", amt: o }); }
      for (let i = 0; i + 1 < nums.length; i += 2) {
        const pct = nums[i], iva = nums[i + 1];
        cur.ivaLibro += iva;
        if (pct === 3) cur.percs.push({ code: "IVA3", amt: iva });
        else cur.lines.push({ pct, neto: null, iva });
      }
    });
  });
  finish();
  return out;
}

// ----- Armado del comprobante en el formato que usa el importador -----
function pdfArmarComp(r, formato) {
  const A = (v) => Math.abs(v || 0);
  const tipo = (r.tipo + (r.letra ? " " + r.letra : "")).trim();
  const esNC = /^(NC|N\/C|NCR|NCRE)/i.test(r.tipo);
  const esND = /^(ND|N\/D|NDB|NDEB)/i.test(r.tipo);
  const lines = r.lines.map((l) => Object.assign({}, l));
  const conIva = lines.filter((l) => l.pct > 0);
  const derivar = conIva.length > 1 && conIva.some((l) => l.neto == null);
  conIva.forEach((l) => { if (derivar || l.neto == null) l.neto = round2(A(l.iva) / (l.pct / 100)); });
  const sp = { a105: 0, a21: 0, a27: 0, a0: 0, sin: 0, mixto: conIva.length > 1 };
  let neto = 0, iva = 0;
  lines.forEach((l) => {
    const n = A(l.neto), i = A(l.iva);
    const k = Math.abs(l.pct - 10.5) < 0.001 ? "a105" : Math.abs(l.pct - 21) < 0.001 ? "a21" : Math.abs(l.pct - 27) < 0.001 ? "a27" : l.pct === 0 ? "a0" : "sin";
    sp[k] += n; neto += n; iva += i;
  });
  Object.keys(sp).forEach((k) => { if (typeof sp[k] === "number") sp[k] = round2(sp[k]); });
  neto = round2(neto); iva = round2(iva);
  const sg = esNC ? -1 : 1;
  const esPercIva = (c) => c === "2408" || c === "3337" || c === "IVA3";
  let percIva = 0, percOtras = 0;
  r.percs.forEach((p) => { if (esPercIva(p.code)) percIva += sg * p.amt; else percOtras += sg * p.amt; });
  percIva = round2(percIva); percOtras = round2(percOtras);
  const nog = round2(A(r.nog)), exe = round2(A(r.exe));
  const total = round2(A(r.total != null ? r.total : neto + iva + nog + exe + A(percIva + percOtras)));
  // Factura C / sin discriminar: si no hay nada más, todo el importe es no gravado.
  let nog2 = nog;
  if (neto === 0 && iva === 0 && nog === 0 && exe === 0 && total > 0) nog2 = total;
  return {
    fecha: r.fecha, tipo, esNC, esND, pv: r.pv, nro: r.nro, cuit: r.cuit, nombre: r.nombre || "(sin nombre)",
    neto, iva, nog: nog2, exe, total, otros: round2(percIva + percOtras), percIva, percOtras, sp, lines, raw: r,
  };
}

// ----- Control contra los totales impresos en el libro ----------------
function pdfControl(parsed, comp) {
  const items = [];
  const push = (label, libro, calc, tol) => { if (libro == null || isNaN(libro)) return; items.push({ label, libro: round2(libro), calc: round2(calc), ok: Math.abs(libro - calc) <= (tol == null ? 0.06 : tol) }); };
  const pctTxt = (p) => String(p).replace(".", ",");
  if (parsed.formato === "libro") {
    const sumar = (esNC) => {
      const t = {};
      comp.filter((c) => c.esNC === esNC).forEach((c) => c.lines.forEach((l) => { const o = t[l.pct] = t[l.pct] || { neto: 0, iva: 0 }; o.neto += Math.abs(l.neto || 0); o.iva += Math.abs(l.iva || 0); }));
      return t;
    };
    [["credito", false, "Compras"], ["debito", true, "N.C. recibidas"]].forEach(([sec, esNC, rot]) => {
      const calc = sumar(esNC), foot = parsed.foot[sec].rates;
      new Set([...Object.keys(foot), ...Object.keys(calc)]).forEach((p) => {
        const f = foot[p], c = calc[p] || { neto: 0, iva: 0 };
        if (f) { push(`${rot}: neto ${pctTxt(p)}%`, Math.abs(f.neto), c.neto); push(`${rot}: IVA ${pctTxt(p)}%`, Math.abs(f.iva), c.iva); }
        else if (c.neto || c.iva) push(`${rot}: neto ${pctTxt(p)}% (no figura en el pie del libro)`, 0, c.neto);
      });
    });
    // no alcanzado (N. Al) y NI/NR/Exento/Monotributo, por separado
    const nalFC = comp.filter((c) => !c.esNC).reduce((s, c) => s + Math.abs(c.raw.nog || 0), 0);
    const nalNC = comp.filter((c) => c.esNC).reduce((s, c) => s + Math.abs(c.raw.nog || 0), 0);
    const exeFC = comp.filter((c) => !c.esNC).reduce((s, c) => s + Math.abs(c.raw.exe || 0), 0);
    if (parsed.foot.credito.nal != null) push("Compras: no alcanzado", Math.abs(parsed.foot.credito.nal), nalFC);
    if (parsed.foot.debito.nal != null) push("N.C. recibidas: no alcanzado", Math.abs(parsed.foot.debito.nal), nalNC);
    if (parsed.foot.ni != null) push("Compras NI / NR / exento / monotributo", Math.abs(parsed.foot.ni), exeFC);
    const regCalc = {};
    comp.forEach((c) => c.raw.percs.forEach((p) => { regCalc[p.code] = (regCalc[p.code] || 0) + p.amt; }));
    const regFoot = {};
    parsed.foot.reg.forEach((r) => { regFoot[r.code] = (regFoot[r.code] || 0) + r.amt; });
    new Set([...Object.keys(regFoot), ...Object.keys(regCalc)]).forEach((code) => { if (regFoot[code] != null) push(`Régimen especial ${code}`, regFoot[code], regCalc[code] || 0); });
  } else {
    const f = parsed.foot;
    const sg = (c) => (c.esNC ? -1 : 1);
    const sum = (fn) => comp.reduce((s, c) => s + sg(c) * fn(c), 0);
    if (f.totales) {
      push("Importe no gravado (exento + otros impuestos)", f.totales.nog, sum((c) => Math.abs(c.raw.nog || 0) + Math.abs(c.raw.otrosImp || 0)));
      push("Neto gravado", f.totales.neto, sum((c) => Math.abs(c.raw.netoLibro || 0)));
      push("IVA (incluye percepciones 3%)", f.totales.iva, sum((c) => Math.abs(c.raw.ivaLibro || 0)));
      push("Total de comprobantes", f.totales.total, sum((c) => c.total));
    }
    if (f.exento != null) push("Exento / no gravado", f.exento, sum((c) => Math.abs(c.raw.nog || 0)));
    if (f.otros != null) push("Otros impuestos", f.otros, sum((c) => Math.abs(c.raw.otrosImp || 0)));
  }
  return { items, ok: items.every((i) => i.ok) };
}

function pdfParseLibroCompleto(pages) {
  const texto = pages.map((rows) => rows.map(pdfTxt).join("\n")).join("\n");
  let parsed = null;
  if (/SUBDIARIO DE IVA COMPRAS/i.test(texto)) parsed = pdfParseTango(pages);
  else if (/Libro IVA Compras/i.test(texto)) parsed = pdfParseLibro(pages);
  else if (/SUBDIARIO DE IVA VENTAS|Libro IVA Ventas/i.test(texto)) return { error: "ventas" };
  if (!parsed) return { error: "formato" };
  const comp = parsed.raw.map((r) => pdfArmarComp(r, parsed.formato)).filter((c) => c.neto || c.iva || c.nog || c.exe || c.total);
  const control = pdfControl(parsed, comp);
  return { parsed, comp, control };
}

// ---- Lectura del PDF en el navegador (pdf.js se carga recién al usarlo) ----
let pdfjsPromise = null;
function cargarPdfJs() {
  if (window.pdfjsLib && window.pdfjsLib.getDocument && window.pdfjsLib.GlobalWorkerOptions.workerSrc) return Promise.resolve(window.pdfjsLib);
  if (pdfjsPromise) return pdfjsPromise;
  const base = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/";
  pdfjsPromise = new Promise((resolve, reject) => {
    if (window.pdfjsLib) { resolve(window.pdfjsLib); return; }
    const sc = document.createElement("script");
    sc.src = base + "pdf.min.js";
    sc.onload = () => resolve(window.pdfjsLib);
    sc.onerror = () => reject(new Error("No pude cargar el lector de PDF. Revisá la conexión a internet."));
    document.head.appendChild(sc);
  }).then(async (lib) => {
    try {
      const r = await fetch(base + "pdf.worker.min.js");
      const txt = await r.text();
      lib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([txt], { type: "text/javascript" }));
    } catch (e) { lib.GlobalWorkerOptions.workerSrc = base + "pdf.worker.min.js"; }
    return lib;
  }).catch((e) => { pdfjsPromise = null; throw e; });
  return pdfjsPromise;
}
async function pdfLeerFilas(file) {
  const lib = await cargarPdfJs();
  const data = new Uint8Array(await file.arrayBuffer());
  const pdf = await lib.getDocument({ data }).promise;
  const pages = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    const tc = await (await pdf.getPage(p)).getTextContent();
    pages.push(pdfAgruparFilas(tc.items.filter((i) => i.str && i.str.trim() !== "").map((i) => ({ x: i.transform[4], y: i.transform[5], w: i.width, s: i.str.trim() }))));
  }
  return pages;
}
function fechaCorta(f) { return f ? `${String(f.d).padStart(2, "0")}/${String(f.m).padStart(2, "0")}/${f.y}` : ""; }
async function importarComprasPdf(clientId, period, file) {
  const client = getClient(clientId);
  if (!client) return;
  showToast("Leyendo el PDF…");
  let pages;
  try { pages = await pdfLeerFilas(file); }
  catch (err) { alert("No pude leer el PDF. " + (err && err.message ? err.message : "")); return; }
  const r = pdfParseLibroCompleto(pages);
  if (r.error === "ventas") { alert("Ese PDF es un libro de IVA Ventas. Acá hay que cargar el Libro IVA Compras."); return; }
  if (r.error) { alert("No reconocí el formato del PDF. Funciona con el \"Libro IVA Compras\" y con el \"Subdiario de IVA Compras\" (Tango)."); return; }
  const p = r.parsed;
  if (!r.comp.length) { alert("No encontré comprobantes en ese PDF."); return; }
  if (p.desde) {
    const ym = (f) => `${f.y}-${String(f.m).padStart(2, "0")}`;
    if (ym(p.desde) !== period || (p.hasta && ym(p.hasta) !== period)) {
      alert(`Ese libro es del ${fechaCorta(p.desde)} al ${fechaCorta(p.hasta)}, pero estás en ${periodLabel(period)}. Cambiá de período y volvé a importarlo.`);
      return;
    }
  }
  state.comprasImp = {
    clientId, period, comp: r.comp, fuera: 0, conceptos: Object.assign({}, (client.iva && client.iva.compraConceptos) || {}),
    fuente: "pdf", libro: { empresa: p.empresa, formato: p.formato, desde: p.desde, hasta: p.hasta }, control: r.control, problemas: p.problemas || [],
  };
  renderComprasImportModal();
}

// Totales por casillero del papel de trabajo, según el concepto elegido por proveedor.
function comprasImpTotales() {
  const s = state.comprasImp;
  const t = { credito: { prest105: 0, bienes21: 0, bienesUso: 0, locaciones: 0, bienesExterior: 0, prest27: 0 }, restDebito: { ncRecLocaciones: 0, ncRecLocal21: 0, ncRecBienesUso: 0, ncRecServicios: 0 }, exentoC: 0, exentoNC: 0, otros: 0, sin: 0, percIva: 0, percOtras: 0, cant: s.comp.length, cantNC: 0 };
  s.comp.forEach((c) => {
    const conc = s.conceptos[c.cuit] || "bienes21";
    const sp = c.sp;
    if (c.esND) { /* las N.D. se tratan como facturas */ }
    if (c.esNC) {
      t.cantNC++;
      t.restDebito.ncRecLocaciones += sp.a105;
      if (conc === "bienesUso") t.restDebito.ncRecBienesUso += sp.a21; else t.restDebito.ncRecLocal21 += sp.a21;
      t.restDebito.ncRecServicios += sp.a27;
      t.exentoNC += c.nog + c.exe + sp.a0;
      t.otros -= c.otros;
    } else {
      t.credito.prest105 += sp.a105;
      t.credito[conc] = (t.credito[conc] || 0) + sp.a21;
      t.credito.prest27 += sp.a27;
      t.exentoC += c.nog + c.exe + sp.a0;
      t.otros += c.otros;
    }
    t.sin += sp.sin;
    const sgp = c.esNC ? -1 : 1;
    t.percIva += sgp * (c.percIva || 0); t.percOtras += sgp * (c.percOtras || 0);
  });
  ["credito", "restDebito"].forEach((g) => Object.keys(t[g]).forEach((k) => (t[g][k] = round2(t[g][k]))));
  t.exentoC = round2(t.exentoC); t.exentoNC = round2(t.exentoNC); t.otros = round2(t.otros); t.sin = round2(t.sin); t.percIva = round2(t.percIva); t.percOtras = round2(t.percOtras);
  return t;
}
function renderComprasImportModal() {
  const s = state.comprasImp;

    const sg = c.esNC ? -1 : 1;
    p.n++; p.neto += sg * c.neto; p.iva += sg * c.iva; p.a21 += c.sp.a21;
  });
  const provRows = Object.values(prov).sort((a, b) => b.neto - a.neto).map((p) => {
    const conc = s.conceptos[p.cuit] || "bienes21";

  }).join("");
  const labelCr = { prest105: "Prestaciones de servicios 10,5%", bienes21: "Bienes de cambio / servicios 21%", bienesUso: "Bienes de uso 21%", locaciones: "Locaciones 21%", bienesExterior: "Bienes del exterior 21%", prest27: "Prestaciones de servicios 27%" };
  const labelNC = { ncRecLocaciones: "N.C. recibidas 10,5%", ncRecLocal21: "N.C. recibidas — bienes de cambio 21%", ncRecBienesUso: "N.C. recibidas — bienes de uso 21%", ncRecServicios: "N.C. recibidas 27%" };
  const totRows = [].concat(
    Object.keys(labelCr).filter((k) => t.credito[k]).map((k) => `<tr><td style="text-align:left;">${labelCr[k]}</td><td class="num">${fmtMoney(t.credito[k])}</td></tr>`),
    Object.keys(labelNC).filter((k) => t.restDebito[k]).map((k) => `<tr><td style="text-align:left;">${labelNC[k]}</td><td class="num">${fmtMoney(t.restDebito[k])}</td></tr>`),
    t.exentoC ? [`<tr><td style="text-align:left;">Compras exentas / no gravadas</td><td class="num">${fmtMoney(t.exentoC)}</td></tr>`] : [],
    t.exentoNC ? [`<tr><td style="text-align:left;">N.C. de compra exentas / no gravadas</td><td class="num">${fmtMoney(t.exentoNC)}</td></tr>`] : []
  ).join("");
  const mixtos = s.comp.filter((c) => c.sp.mixto).length;
  const avisos = [];

  if (mixtos > 0) avisos.push(s.fuente === "pdf"
    ? `${mixtos} comprobante${mixtos > 1 ? "s tienen" : " tiene"} más de una alícuota: el libro las discrimina, cada neto se carga en su alícuota.`
    : `${mixtos} comprobante${mixtos > 1 ? "s tienen" : " tiene"} más de una alícuota: repartí el neto entre 10,5% y 21% (o 21% y 27%) según el IVA facturado.`);
  if (s.fuente === "pdf") {
    if (Math.abs(t.percIva) > 0.5) avisos.push(`Percepciones de IVA que figuran en el libro: <b>${fmtMoney(t.percIva)}</b>. <b>No se cargan solas</b>: cargalas en "Percepciones sufridas".`);
    if (Math.abs(t.percOtras) > 0.5) avisos.push(`Otras percepciones e impuestos del libro (IIBB, RG 140, etc.): ${fmtMoney(t.percOtras)}. No se cargan.`);
    (s.problemas || []).slice(0, 5).forEach((m) => avisos.push(escapeHtml(m)));
  } else if (Math.abs(t.otros) > 1) avisos.push(`<b>${fmtMoney(t.otros)}</b> de diferencia entre el total y neto + IVA: son percepciones, impuestos internos u otros tributos. <b>No se cargan solos</b>: si son percepciones de IVA, cargalas en "Percepciones sufridas".`);
  if (s.fuera > 0) avisos.push(`Se ignoraron ${s.fuera} comprobante${s.fuera > 1 ? "s" : ""} del archivo por no pertenecer a ${periodLabel(s.period)}.`);
  let libroHeaderHtml = "", controlHtml = "";
  if (s.fuente === "pdf") {
    const cli = getClient(s.clientId);
    const pal = (x) => normalizeSearch(x).split(/\s+/).filter((w) => w.length > 2);
    const clienteOk = !s.libro.empresa || !cli || pal(s.libro.empresa).some((w) => normalizeSearch(cli.name).indexOf(w) !== -1);
    libroHeaderHtml = `<p class="hint-sm" style="margin:0;">📄 ${s.libro.formato === "tango" ? "Subdiario de IVA Compras (Tango)" : "Libro IVA Compras"} · <b>${escapeHtml(s.libro.empresa || "sin nombre")}</b>${s.libro.desde ? ` · del ${fechaCorta(s.libro.desde)} al ${fechaCorta(s.libro.hasta)}` : ""}</p>`
      + (clienteOk ? "" : `<div class="warn-banner"><div class="wb-text"><b>Ojo:</b> el libro dice "${escapeHtml(s.libro.empresa)}" y estás cargando a "${escapeHtml(cli.name)}". Verificá que sea el cliente correcto.</div></div>`);
    const c = s.control;
    if (c && c.items.length) {
      controlHtml = c.ok
        ? `<div class="ok-banner">✔ Los totales leídos coinciden con los del libro (${c.items.length} controles: neto e IVA por alícuota, no gravado y percepciones).</div>`
        : `<div class="warn-banner"><div class="wb-text"><b>Hay diferencias con los totales impresos en el libro.</b> Revisá antes de cargar:<br>${c.items.filter((i) => !i.ok).map((i) => `${escapeHtml(i.label)}: libro ${fmtMoney(i.libro)} · leído ${fmtMoney(i.calc)}`).join("<br>")}</div></div>`;
    }
  }
  document.getElementById("modal-root").innerHTML = `

          <div class="table-scroll"><table style="min-width:0;">${totRows || `<tr><td>Nada para cargar</td></tr>`}</table></div>
          ${avisos.length ? `<div class="warn-banner"><div class="wb-text">${avisos.join("<br>")}</div></div>` : ""}
          <p class="hint-sm" style="margin:0;">Reemplaza el neto de compras (y las exentas de compra) que ya hubiera cargado en este período. No toca la columna "S/ Portal ARCA".</p>

function aplicarComprasImport() {
  const s = state.comprasImp;
  if (!s) return;
  const t = comprasImpTotales();
  const client = getClient(s.clientId);
  touchDoc(s.clientId, s.period, (doc) => {
    Object.keys(t.credito).forEach((k) => setDeep(doc, `iva.credito.${k}.neto`, t.credito[k]));
    Object.keys(t.restDebito).forEach((k) => setDeep(doc, `iva.restDebito.${k}.neto`, t.restDebito[k]));
    setDeep(doc, "iva.exento.compras", t.exentoC);
    setDeep(doc, "iva.exento.ncCompras", t.exentoNC);
  });
  mutateClient(s.clientId, (c) => {
    const prev = Object.assign({}, c.iva.compraConceptos || {});
    Object.keys(s.conceptos).forEach((cuit) => { if (s.conceptos[cuit] && s.conceptos[cuit] !== "bienes21") prev[cuit] = s.conceptos[cuit]; else delete prev[cuit]; });

  });

  document.getElementById("modal-root").innerHTML = "";

  showToast(`Compras de ${periodLabel(s.period)} cargadas (${t.cant} comprobantes).`);
}
