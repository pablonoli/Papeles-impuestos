            <div class="field"><label>Recaudaciones bancarias (s/Sistema)</label><input type="text" inputmode="decimal" data-kind="money" value="${rawOrBlank(d.recaudacionesBancarias, "money")}" data-path="iibbLocal.recaudacionesBancarias" data-action="field" data-clientid="${client.id}" data-period="${period}"></div>
          </div>
          <div class="table-scroll"><table>
            <tr><td>Saldo a favor del período anterior</td><td class="num">${fmtMoney(r.saldoAnterior)}</td></tr>
            <tr class="total-row"><td>${r.saldoAPagar > 0 ? "Saldo a pagar" : "Saldo a favor"}</td><td class="num ${r.saldoAPagar > 0 ? "cell-pagar" : "cell-favor"}">${fmtMoney(r.saldoAPagar || r.saldoAFavor)}</td></tr>
          </table></div>

      <div class="card">
        <div class="card-head"><h3>Resumen de DDJJ presentadas</h3></div>
        <div class="card-body">

            <tr><th>Período</th><th>Base imponible</th><th>Impuesto</th><th>Ret./Perc./Rec. banc.</th><th>A pagar</th><th>A favor</th></tr>
            ${history || `<tr><td colspan="6" style="text-align:center;color:var(--muted)">Sin períodos cargados todavía.</td></tr>`}
            ${historyTotalsRow}

}

// ---- IIBB Convenio Multilateral ----
function renderIibbCMTab(client) {
  const period = state.currentPeriod;
  const r = calcIibbCMFor(client, period);
  const doc = getDoc(client.id, period);
  const actData = (doc && doc.iibbCM && doc.iibbCM.actividades) || {};
  const coefLabel = r.coefVigencia ? "vigente desde " + periodLabel(r.coefVigencia.desde) : "sin coeficiente cargado";
  const actTotal = (client.iibbCM.activities || []).reduce((s, a) => s + num(actData[a.code]), 0);

  const actRows = (client.iibbCM.activities || []).map((a) => `
    <tr>
      <td>${escapeHtml(a.code)} — ${escapeHtml(a.desc)}</td>
      <td><input type="text" inputmode="decimal" data-kind="money" value="${rawOrBlank(actData[a.code], "money")}" data-path="iibbCM.actividades.${a.code}" data-action="field" data-clientid="${client.id}" data-period="${period}"></td>
    </tr>`).join("") || `<tr><td colspan="2" style="text-align:center;color:var(--muted)">Cargá actividades en Configuración.</td></tr>`;

  const jurCards = r.jurRows.map((j) => {
    const jdoc = (doc && doc.iibbCM && doc.iibbCM.jurisdicciones && doc.iibbCM.jurisdicciones[j.jurisdiccion]) || {};
    const actDetail = j.actividadDetalle.map((a) => `
      <tr>
        <td style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:4px;" title="${escapeHtml(a.desc)} — ${a.regimen === "especial" ? `Especial: ${fmtPct(a.attrib)} propio de esta actividad` : a.regimen === "art14" ? "Inicio de actividades (Art. 14)" : `General (Art. 2): ${fmtPct(a.attrib)}`}">${escapeHtml(a.code)}</td>
        <td class="num readonly" style="text-align:center;">${(() => {
          const beKey = j.jurisdiccion + "|" + a.code;
          const isEditingBase = state.editingBaseImponible === beKey;
          if (isEditingBase) {
            return `<span style="display:flex;align-items:center;gap:2px;justify-content:center;"><input type="text" inputmode="decimal" data-kind="money" value="${rawOrBlank(jdoc.baseOverrides && jdoc.baseOverrides[a.code], "money")}" placeholder="auto" data-path="iibbCM.jurisdicciones.${j.jurisdiccion}.baseOverrides.${a.code}" data-action="field" data-clientid="${client.id}" data-period="${period}" style="width:64px;text-align:center;font-size:12px;"><button type="button" data-action="toggle-base-edit" data-jur="${escapeHtml(j.jurisdiccion)}" data-code="${escapeHtml(a.code)}" title="Cerrar edición" style="border:none;background:none;cursor:pointer;color:var(--muted);font-size:10px;padding:0;">✕</button></span>`;
          }
          return `${fmtMoney(a.baseImponible)}${a.baseOverridden ? `<sup title="Base imponible editada manualmente" style="color:var(--accent-strong);font-size:8px;">✎</sup>` : ""}<button type="button" data-action="toggle-base-edit" data-jur="${escapeHtml(j.jurisdiccion)}" data-code="${escapeHtml(a.code)}" title="Editar base imponible manualmente" style="border:none;background:none;cursor:pointer;color:var(--muted);opacity:.4;font-size:10px;padding:0 0 0 3px;vertical-align:middle;">✎</button>`;
        })()}</td>
        <td style="text-align:center;">
          <input type="text" inputmode="decimal" data-kind="money" value="${rawOrBlank(jdoc.ajustes && jdoc.ajustes[a.code], "money")}" placeholder="ajuste" data-path="iibbCM.jurisdicciones.${j.jurisdiccion}.ajustes.${a.code}" data-action="field" data-clientid="${client.id}" data-period="${period}" style="text-align:center;">
        </td>
        <td class="num readonly" style="text-align:center;">${fmtMoney(a.base)}</td>
        <td class="num readonly" style="text-align:center;">${fmtPct(a.alicuota)}</td>
        <td class="num readonly">${fmtMoney(a.impuesto)}</td>
      </tr>`).join("");
    return `
      <div class="card">
        <div class="card-head"><h3>${escapeHtml(j.jurisdiccion)}</h3><span class="hint">Coeficiente ${coefLabel}: ${fmtPct(j.coef)}</span></div>
        <div class="card-body">
          <div class="table-scroll"><table style="table-layout:fixed;">
            <tr><th style="text-align:left;width:80px;padding-right:4px;">Actividad</th><th style="text-align:center;">Base Imponible</th><th style="text-align:center;">Ajuste a la Base</th><th style="text-align:center;">Base Imp. Neta</th><th style="text-align:center;">Alícuota</th><th>Impuesto</th></tr>
            ${actDetail}
            <tr class="total-row"><td colspan="5">Impuesto Determinado</td><td class="num">${fmtMoney(j.impuestoAnticipo)}</td></tr>
          </table></div>
          <div class="form-grid">
            <div class="field"><label>Retenciones (s/Sistema)</label><input type="text" inputmode="decimal" data-kind="money" value="${rawOrBlank(jdoc.ret, "money")}" data-path="iibbCM.jurisdicciones.${j.jurisdiccion}.ret" data-action="field" data-clientid="${client.id}" data-period="${period}"></div>
            <div class="field"><label>Percepciones (s/Sistema)</label><input type="text" inputmode="decimal" data-kind="money" value="${rawOrBlank(jdoc.perc, "money")}" data-path="iibbCM.jurisdicciones.${j.jurisdiccion}.perc" data-action="field" data-clientid="${client.id}" data-period="${period}"></div>
            <div class="field"><label>Recaudaciones bancarias (s/Sistema)</label><input type="text" inputmode="decimal" data-kind="money" value="${rawOrBlank(jdoc.recban, "money")}" data-path="iibbCM.jurisdicciones.${j.jurisdiccion}.recban" data-action="field" data-clientid="${client.id}" data-period="${period}"></div>
          </div>
          <div class="table-scroll"><table>
            <tr><td>Saldo a favor del período anterior</td><td class="num">${fmtMoney(j.saldoAnterior)}</td></tr>
            <tr class="total-row"><td>${j.aPagar > 0 ? "Saldo a pagar" : "Saldo a favor"}</td><td class="num ${j.aPagar > 0 ? "cell-pagar" : "cell-favor"}">${fmtMoney(j.aPagar || j.aFavor)}</td></tr>
          </table></div>
        </div>
      </div>`;
  }).join("");

  return `
    <div style="display:flex;flex-direction:column;gap:16px;">
      ${cmEncuadreBannerHtml(client)}
      <div class="card">
        <div class="card-head"><h3>Actividades — Ventas netas (según libro IVA Ventas)</h3><span class="hint">Art. 2 (general) se distribuye según el coeficiente ${coefLabel}; las actividades con régimen especial o Art. 14 usan su propio reparto (Configuración)</span></div>
        <div class="card-body">
          <div class="table-scroll"><table>
            <tr><th>Actividad</th><th>Ventas netas</th></tr>
            ${actRows}
            <tr class="total-row"><td>TOTAL — todas las actividades</td><td class="num">${fmtMoney(actTotal)}</td></tr>
          </table></div>
        </div>
      </div>
      ${jurCards}
    </div>`;
}

// ---- Configuración ----
function renderConfigTab(client) {
  // Saldo previo por régimen: si ya hay un período anterior cargado, se
  // muestra de sólo lectura lo que ese período dejó como saldo a favor real
  // (mismo criterio para IVA, IIBB Local e IIBB CM) — el campo editable de
  // "saldo inicial" sólo tiene sentido antes de que exista ningún período.
  const ivaPrevPeriods = listPeriodsWithTax(client.id, "iva").filter((p) => p < state.currentPeriod).sort();
  const ivaPrevPeriod = ivaPrevPeriods.length ? ivaPrevPeriods[ivaPrevPeriods.length - 1] : null;
  const ivaPrevResult = ivaPrevPeriod ? calcIvaFor(client, ivaPrevPeriod) : null;
  // Prorrateo y TurIVA son por período (no todos los períodos aplican el
  // mismo tratamiento necesariamente), así que el switch de Configuración
  // muestra y edita el valor del período que se está viendo. Si ese período
  // todavía no tiene el campo cargado a mano, se usa como arranque el valor
  // histórico que tenía el cliente (así los períodos ya cargados no cambian
  // de golpe con este ajuste).
  const currentIvaDoc = getDoc(client.id, state.currentPeriod);
  const currentIvaSub = currentIvaDoc && currentIvaDoc.iva;
  const prorrateoExentoActual = currentIvaSub && typeof currentIvaSub.prorrateoExento === "boolean" ? currentIvaSub.prorrateoExento : !!client.iva.prorrateoExento;
  const turIvaActual = currentIvaSub && typeof currentIvaSub.turIvaEnabled === "boolean" ? currentIvaSub.turIvaEnabled : !!client.iva.turIva;
  const iibbLocalPrevPeriods = listPeriodsWithTax(client.id, "iibbLocal").filter((p) => p < state.currentPeriod).sort();
  const iibbLocalPrevPeriod = iibbLocalPrevPeriods.length ? iibbLocalPrevPeriods[iibbLocalPrevPeriods.length - 1] : null;
  const iibbLocalPrevResult = iibbLocalPrevPeriod ? calcIibbLocalFor(client, iibbLocalPrevPeriod) : null;

  const activityRows = (client.iibbCM.activities || []).map((a, i) => `
    <tr>
      <td style="text-align:left;padding-right:2px;"><input type="text" value="${escapeHtml(a.code)}" title="${escapeHtml(a.code)}" data-cfg="activity-code" data-idx="${i}" style="width:88px;"></td>
      <td style="text-align:left;padding-left:2px;"><input type="text" value="${escapeHtml(a.desc)}" title="${escapeHtml(a.desc)}" data-cfg="activity-desc" data-idx="${i}" style="width:100%;min-width:280px;"></td>
      <td style="text-align:left;white-space:nowrap;">
        <span class="hint-sm">${regimenLabel(a)}</span>
        <button type="button" class="btn btn-ghost btn-sm" data-action="open-activity-regimen-modal" data-code="${escapeHtml(a.code)}">Editar</button>
        ${!a.regimen && !a.regimenAvisoOk && cmEncuadreSugerido(a.code) ? `<div class="hint-sm" style="color:var(--diff);white-space:normal;">⚠ Revisar: podría corresponder el Art. ${cmEncuadreSugerido(a.code).art}</div>` : ""}
      </td>
      <td><button class="btn btn-ghost btn-danger btn-sm" data-action="remove-activity" data-idx="${i}">Quitar</button></td>
    </tr>`).join("") || `<tr><td colspan="4" style="text-align:center;color:var(--muted)">Sin actividades cargadas.</td></tr>`;

  const jurRows = (client.iibbCM.jurisdictions || [])
    .map((j, i) => ({ j, i }))
    .sort((a, b) => jurSortIndex(a.j.name) - jurSortIndex(b.j.name))
    .map(({ j, i }) => {
      const alicCells = (client.iibbCM.activities || []).map((a) => `
      <td style="text-align:center;"><span class="pct-field"><input type="text" inputmode="decimal" data-kind="percent" value="${rawOrBlank(j.alicuotas && j.alicuotas[a.code], "percent")}" placeholder="—" data-cfg="jur-alicuota" data-jur="${escapeHtml(j.name)}" data-code="${escapeHtml(a.code)}"><span class="pct-suffix">%</span></span></td>`).join("");
      return `<tr><td>${escapeHtml(j.name)}</td>${alicCells}<td><button class="btn btn-ghost btn-danger btn-sm" data-action="remove-jurisdiction" data-idx="${i}">Quitar</button></td></tr>`;
    }).join("") || `<tr><td colspan="${2 + (client.iibbCM.activities || []).length}" style="text-align:center;color:var(--muted)">Sin jurisdicciones cargadas.</td></tr>`;

  // Coeficientes: una sola vigencia visible a la vez (elegida con el
  // desplegable), en vez de un bloque por año — más compacto y refleja
  // el período real desde el que empezó a regir cada actualización.
  // Por defecto se muestra la vigencia que efectivamente aplica al período
  // que se está viendo arriba (mismo criterio que usa el cálculo real, no
  // la última vigencia cargada).
  const coefVigList = (client.iibbCM.coeficientes || []).slice().sort((a, b) => a.desde.localeCompare(b.desde));
  const vigenciaDelPeriodo = getCoefVigencia(client, state.currentPeriod);
  const defaultDesde = vigenciaDelPeriodo ? vigenciaDelPeriodo.desde : (coefVigList.length ? coefVigList[0].desde : null);
  const selectedDesde = coefVigList.some((v) => v.desde === state.selectedCoefDesde)
    ? state.selectedCoefDesde
    : (defaultDesde || (coefVigList.length ? coefVigList[coefVigList.length - 1].desde : null));
  const selectedVig = coefVigList.find((v) => v.desde === selectedDesde);
  const coefSum = selectedVig ? (client.iibbCM.jurisdictions || []).reduce((s, j) => s + num(selectedVig.valores[j.name]), 0) : 0;
  const coefRows = sortedJurisdictions(client.iibbCM.jurisdictions).map((j) => `
      <div class="jur-row">
        <span>${escapeHtml(j.name)}</span>
        <span class="pct-field"><input type="text" inputmode="decimal" data-kind="percent" value="${selectedVig ? rawOrBlank(selectedVig.valores[j.name], "percent") : ""}" placeholder="—" data-cfg="coef" data-jur="${escapeHtml(j.name)}" data-desde="${selectedDesde || ""}"><span class="pct-suffix">%</span></span>
      </div>`).join("") || `<p style="color:var(--muted);font-size:12px;">Cargá jurisdicciones primero.</p>`;

  // Saldos a favor por jurisdicción: si ya hay un período anterior cargado,
  // se muestra de sólo lectura el saldo a favor real que dejó ese período
  // (el mismo que arrastra la DDJJ) — no tiene sentido pedir que se cargue
  // a mano algo que ya se puede calcular. El campo editable sólo aparece
  // para el arranque, antes de que exista ningún período con datos.
  const cmPrevPeriods = listPeriodsWithTax(client.id, "iibbCM").filter((p) => p < state.currentPeriod).sort();
  const cmPrevPeriod = cmPrevPeriods.length ? cmPrevPeriods[cmPrevPeriods.length - 1] : null;
  const cmPrevResult = cmPrevPeriod ? calcIibbCMFor(client, cmPrevPeriod) : null;
  const saldoInicialCMRows = sortedJurisdictions(client.iibbCM.jurisdictions).map((j) => {
    if (cmPrevResult) {
      const row = cmPrevResult.jurRows.find((r) => r.jurisdiccion === j.name);
      return `
    <div class="jur-row">
      <span>${escapeHtml(j.name)}</span>
      <span class="mono" style="padding:8px 10px;color:var(--muted);">${fmtMoney(row ? row.aFavor : 0)}</span>
    </div>`;
    }
    return `
    <div class="jur-row">
      <span>${escapeHtml(j.name)}</span>
      <input type="text" inputmode="decimal" data-kind="money" value="${rawOrBlank(client.iibbCM.saldosIniciales && client.iibbCM.saldosIniciales[j.name], "money")}" placeholder="—" data-cfg="saldo-inicial-cm" data-jur="${escapeHtml(j.name)}">
    </div>`;
  }).join("") || "";

  return `
    <div style="display:flex;flex-direction:column;gap:16px;max-width:1180px;">
      <div class="cards-row">
      <div class="card">
        <div class="card-head"><h3>Datos del cliente</h3></div>
        <div class="card-body">
          <div class="form-grid">
            <div class="field"><label>Nombre / razón social</label><input type="text" value="${escapeHtml(client.name)}" data-cfg="name"></div>
            <div class="field"><label>CUIT</label><input type="text" value="${escapeHtml(client.cuit || "")}" data-cfg="cuit"></div>
          </div>
          <button class="btn btn-danger" data-action="delete-client" style="align-self:flex-start;">Eliminar cliente</button>
        </div>
      </div>

      <div class="card">
        <div class="card-head"><h3>Impuestos activos</h3></div>
        <div class="card-body">
          <div class="switch-row">
            <div class="st"><b>IVA</b><span>DDJJ mensual — régimen general (ARCA)</span></div>
            <label class="switch"><input type="checkbox" ${client.iva.enabled ? "checked" : ""} data-cfg="toggle-iva"><span class="slider"></span></label>
          </div>
          <div class="switch-row">
            <div class="st"><b>Ingresos Brutos — Local</b><span>Única jurisdicción</span></div>
            <label class="switch"><input type="checkbox" ${client.iibbLocal.enabled ? "checked" : ""} data-cfg="toggle-iibblocal"><span class="slider"></span></label>
          </div>
          <div class="switch-row">
            <div class="st"><b>Ingresos Brutos — Convenio Multilateral</b><span>Varias jurisdicciones, coeficiente de distribución</span></div>
            <label class="switch"><input type="checkbox" ${client.iibbCM.enabled ? "checked" : ""} data-cfg="toggle-iibbcm"><span class="slider"></span></label>
          </div>
          <div class="switch-row">
            <div class="st"><b>Monotributo</b><span>Categoría, tope de facturación y cuota mensual</span></div>
            <label class="switch"><input type="checkbox" ${monoEnabled(client) ? "checked" : ""} data-cfg="toggle-mono"><span class="slider"></span></label>
          </div>
          ${monoEnabled(client) ? `<div class="form-grid" style="margin-top:8px;">
            <div class="field"><label>Categoría</label><select data-cfg="mono-cat"><option value="">— elegir —</option>${MONO_CATS.map((k) => `<option value="${k}" ${client.mono.categoria === k ? "selected" : ""}>${k}</option>`).join("")}</select></div>
            <div class="field"><label>Actividad</label><select data-cfg="mono-tipo"><option value="servicios" ${client.mono.tipo !== "bienes" ? "selected" : ""}>Servicios</option><option value="bienes" ${client.mono.tipo === "bienes" ? "selected" : ""}>Venta de bienes</option></select></div>
          </div>` : ""}
        </div>
        <p class="foot-note">IVA se presenta siempre junto con IIBB (Local o Convenio Multilateral) para una misma sociedad: activá IVA y el régimen de IIBB que corresponda en este mismo cliente, no como clientes separados.</p>
      </div>
      </div>

      ${client.iva.enabled ? `
      <div class="card">
        <div class="card-head"><h3>IVA</h3></div>
        <div class="card-body">
          <div class="subsection">
            <h4 class="subhead">Parámetros</h4>
            <div class="form-grid">
              <div class="field"><label>Tasa crédito Decreto 814/01</label><span class="pct-field"><input type="text" inputmode="decimal" data-kind="percent" value="${typeof client.iva.decreto814Rate === "number" ? fmtPctRaw(client.iva.decreto814Rate) : client.iva.decreto814Rate}" data-cfg="decreto814rate"><span class="pct-suffix">%</span></span></div>
              <div class="field"><label>Saldo técnico a favor inicial</label>${ivaPrevResult
                ? `<span class="mono" style="padding:8px 10px;color:var(--muted);display:block;">${fmtMoney(ivaPrevResult.saldoTecnicoFavorContribuyente)}</span><span class="hint-sm">Resultado de ${periodLabel(ivaPrevPeriod)} (se actualiza solo)</span>`
                : `<input type="text" inputmode="decimal" data-kind="money" value="${rawOrBlank(client.iva.saldosIniciales.saldoTecnicoAnterior, "money")}" data-cfg="iva-saldo-tecnico-inicial"><span class="hint-sm">Previo al primer período cargado</span>`}</div>
              <div class="field"><label>Saldo libre disponibilidad inicial</label>${ivaPrevResult
                ? `<span class="mono" style="padding:8px 10px;color:var(--muted);display:block;">${fmtMoney(ivaPrevResult.saldoLibreDisponibilidad)}</span><span class="hint-sm">Resultado de ${periodLabel(ivaPrevPeriod)} (se actualiza solo)</span>`
                : `<input type="text" inputmode="decimal" data-kind="money" value="${rawOrBlank(client.iva.saldosIniciales.saldoLibreDisponibilidadAnterior, "money")}" data-cfg="iva-saldo-libre-inicial"><span class="hint-sm">Previo al primer período cargado</span>`}</div>
            </div>
            <div class="switch-row">
              <div class="st"><b>Prorrateo crédito fiscal</b><span>Coeficiente = ventas gravadas / (ventas gravadas + ventas exentas); se aplica sobre el crédito fiscal de compras — <b>solo para ${periodLabel(state.currentPeriod)}</b>, no afecta otros períodos</span></div>
              <label class="switch"><input type="checkbox" ${prorrateoExentoActual ? "checked" : ""} data-cfg="toggle-prorrateo-exento"><span class="slider"></span></label>
            </div>
            <div class="switch-row">
              <div class="st"><b>Incluido en el régimen TurIVA</b><span>Ventas a turistas extranjeros que generan crédito fiscal especial — habilita cargarlo a mano en el papel de trabajo del Crédito Fiscal — <b>solo para ${periodLabel(state.currentPeriod)}</b>, no afecta otros períodos</span></div>
              <label class="switch"><input type="checkbox" ${turIvaActual ? "checked" : ""} data-cfg="toggle-turiva"><span class="slider"></span></label>
            </div>
          </div>
          <div class="subsection">
            <h4 class="subhead">Actividades <span style="text-transform:none;letter-spacing:0;">— ventas por actividad (portal ARCA)</span></h4>
            <div class="table-scroll"><table>
              <tr><th style="text-align:left;width:88px;padding-right:2px;">Código</th><th style="text-align:left;padding-left:2px;">Descripción</th><th></th></tr>

// Cuando se carga un importe en "Apertura de Otros Conceptos" (IVA), la
// venta neta de esa actividad (gravada + exenta, netas de N.C. emitidas —
// misma fórmula que el subtotal del propio modal) se traslada sola al monto
// de esa actividad en IIBB Local y/o Convenio Multilateral (el que tenga
// habilitado el cliente y tenga esa actividad cargada), para no tener que
// escribir dos veces el mismo total de ventas.
function syncVentasNetasFromIvaActividad(clientId, period, path) {
  const parts = (path || "").split(".");
  if (parts[0] !== "iva" || parts[1] !== "porActividad") return;
  const code = parts[2];
  if (!code) return;
  const client = getClient(clientId);
  if (!client) return;
  const doc = getDoc(clientId, period);
  const pa = (doc && doc.iva && doc.iva.porActividad && doc.iva.porActividad[code]) || {};
  const debitoSum = ["ri105", "cf105", "ri21", "cf21"].reduce((s, k) => s + num(getDeep(pa, `debito.${k}`, 0)), 0);
  const ncSum = ["ncEmit105RI", "ncEmit105CF", "ncEmit21RI", "ncEmit21CF"].reduce((s, k) => s + num(getDeep(pa, `restCredito.${k}`, 0)), 0);
  const ventasNetas = round2(debitoSum - ncSum + num(pa.exento) - num(pa.exentoNC));
  touchDoc(clientId, period, (d) => {
    if (client.iibbLocal.enabled && (client.iibbLocal.activities || []).some((a) => a.code === code)) {
      setDeep(d, `iibbLocal.actividades.${code}`, ventasNetas);
    }
    if (client.iibbCM.enabled && (client.iibbCM.activities || []).some((a) => a.code === code)) {
      setDeep(d, `iibbCM.actividades.${code}`, ventasNetas);
    }
  });
}

// ¿Hay algún importe distinto de cero cargado? (los textos sólo cuentan si
// son numéricos: un fundamento o una fecha no son "datos cargados").
function hasAnyValue(o) {
  if (o == null) return false;
  if (typeof o === "number") return o !== 0;
  if (typeof o === "string") return /^-?[\d.,]+$/.test(o.trim()) && num(o) !== 0;
  if (Array.isArray(o)) return o.some(hasAnyValue);
  if (typeof o === "object") return Object.keys(o).some((k) => hasAnyValue(o[k]));
  return false;
}
function fmtCompact(n) {
  const a = Math.abs(n), s = n < 0 ? "-" : "";
  if (a >= 1e9) return s + (a / 1e9).toLocaleString("es-AR", { maximumFractionDigits: 1 }) + " MM";
  if (a >= 1e6) return s + (a / 1e6).toLocaleString("es-AR", { maximumFractionDigits: 1 }) + " M";
  if (a >= 1e3) return s + Math.round(a / 1e3).toLocaleString("es-AR") + " mil";
  return s + Math.round(a).toLocaleString("es-AR");
}
const MESES_CORTOS = ["Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"];

// Convenio Multilateral: 0-2, 3-5, 6-7, 8-9
// Monotributo: todas las terminaciones.
// ---------------------------------------------------------------------
const VENC_CAL = {
  2026: {
    iva: [[19,20,21,22,23],[18,19,20,23,24],[18,19,20,25,26],[20,21,22,23,24],[18,19,20,21,22],[18,19,22,23,24],[20,21,22,23,24],[18,19,20,21,24],[18,21,22,23,24],[19,20,21,22,23],[18,19,20,24,25],[18,21,22,23,28]],
    cm:  [[15,16,19,20],[13,18,19,20],[13,16,17,18],[15,16,17,20],[15,18,19,20],[16,17,18,19],[15,16,17,20],[14,18,19,20],[15,16,17,18],[15,16,19,20],[13,16,17,18],[15,16,17,18]],
    mono: [20,20,20,20,20,22,20,20,21,20,20,21],
  },
};
const TAX_LABEL = { iva: "IVA", iibbLocal: "IIBB Local", iibbCM: "IIBB Conv. Mult.", mono: "Monotributo" };
function monoEnabled(c) { return !!(c && c.mono && c.mono.enabled); }
function impuestosActivos(c) {
  const a = [];
  if (c.iva.enabled) a.push("iva");
  if (c.iibbLocal.enabled) a.push("iibbLocal");
  if (c.iibbCM.enabled) a.push("iibbCM");
  if (monoEnabled(c)) a.push("mono");
  return a;
}
function cuitTerminal(client) {
  const d = String(client.cuit || "").replace(/\D/g, "");
  return d.length ? Number(d[d.length - 1]) : null;
}
function isoDate(y, m, d) { return `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`; }
// Vencimiento (ISO) de un impuesto para un período fiscal. null si no hay
// dato (CUIT sin cargar, año sin calendario o IIBB local sin fecha manual).
function vencimientoDe(client, taxKey, period) {
  if (taxKey === "iibbLocal") return getExtras().vencLocal[client.id + "|" + period] || null;
  const vp = addMonths(period, 1), y = periodYear(vp), m = periodMonth(vp);
  const t = VENC_CAL[y];
  if (!t) return null;
  if (taxKey === "mono") return isoDate(y, m, t.mono[m - 1]);
  const term = cuitTerminal(client);
  if (term == null) return null;
  if (taxKey === "iva") return isoDate(y, m, t.iva[m - 1][Math.floor(term / 2)]);
  if (taxKey === "iibbCM") return isoDate(y, m, t.cm[m - 1][term <= 2 ? 0 : term <= 5 ? 1 : term <= 7 ? 2 : 3]);
  return null;
}
function diasHasta(iso) {
  if (!iso) return null;
  const [y, m, d] = iso.split("-").map(Number);
  const hoy = new Date();
  return Math.round((new Date(y, m - 1, d) - new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate())) / 86400000);
}
function urgenciaDe(dias) {
  if (dias == null) return "na";
  if (dias < 0) return "vencido";
  if (dias <= 3) return "urgente";
  if (dias <= 7) return "pronto";
  return "ok";
}
const URG_ICON = { vencido: "⛔", urgente: "⏰", pronto: "⏳", ok: "", na: "" };
function fmtFechaCorta(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString("es-AR", { weekday: "short", day: "2-digit", month: "2-digit" }).replace(".", "");
}
function diasTexto(dias) {
  if (dias == null) return "";
  if (dias < 0) return `vencido hace ${-dias} d`;
  if (dias === 0) return "vence hoy";
  if (dias === 1) return "vence mañana";
  return `en ${dias} días`;
}

// ---------------------------------------------------------------------
// Estado de cada impuesto en un período (para el panel de clientes)
// ---------------------------------------------------------------------
function saldoDe(aPagar, aFavor) {
  if (aPagar > 0) return { tipo: "pagar", monto: aPagar };
  if (aFavor > 0) return { tipo: "favor", monto: aFavor };
  return { tipo: "cero", monto: 0 };
}
function estadoImpuesto(client, taxKey, period) {
  try {
    const doc = getDoc(client.id, period);
    if (taxKey === "iva") {
      if (!(doc && hasAnyValue(doc.iva))) return { status: "falta" };
      const r = calcIvaFor(client, period);
      const ventas = r.debitoBrackets.reduce((s, b) => s + b.neto, 0) + r.exento.ventas;
      const compras = r.creditoBrackets.reduce((s, b) => s + b.neto, 0);
      return { status: ventas > 0 && compras > 0 ? "ok" : "parcial", saldo: saldoDe(r.saldoAPagar, round2(r.saldoTecnicoFavorContribuyente + r.saldoLibreDisponibilidad)), nota: ventas > 0 && compras > 0 ? "" : (ventas > 0 ? "sin compras" : "sin ventas") };
    }
    if (taxKey === "iibbLocal") {
      if (!(doc && hasAnyValue(doc.iibbLocal))) return { status: "falta" };
      const r = calcIibbLocalFor(client, period);
      return { status: r.baseImponible > 0 ? "ok" : "parcial", saldo: saldoDe(r.saldoAPagar, r.saldoAFavor), nota: r.baseImponible > 0 ? "" : "sin base" };
    }
    if (taxKey === "iibbCM") {
      if (!(doc && hasAnyValue(doc.iibbCM))) return { status: "falta" };
      const r = calcIibbCMFor(client, period);
      const ok = r.totales.baseTotal > 0 && !!r.coefVigencia;
      return { status: ok ? "ok" : "parcial", saldo: saldoDe(round2(r.totales.aPagar), round2(r.totales.aFavor)), nota: ok ? "" : (r.coefVigencia ? "sin base" : "sin coeficientes") };
    }
    if (taxKey === "mono") {
      const raw = doc && doc.mono && doc.mono.facturacion;
      const cargado = raw !== undefined && raw !== null && String(raw).trim() !== "";
      return { status: cargado ? "ok" : "falta", mono: monoCalc(client, period) };
    }
  } catch (e) { /* un cliente con datos raros no debe romper el panel */ }
  return { status: "falta" };
}

// Alertas por variación (ventas / compras vs. promedio de 3 meses previos)
// ---------------------------------------------------------------------
const VAR_UMBRAL = 0.30;
function serieVentasCompras(client, p) {
  const doc = getDoc(client.id, p);
  if (!doc) return null;
  try {
    if (client.iva.enabled && hasAnyValue(doc.iva)) {
      const r = calcIvaFor(client, p);
      return { ventas: r.ventasNetasGravadas + r.ventasExentasNetas, compras: r.comprasNetasGravadas };
    }
    if (client.iibbLocal.enabled && hasAnyValue(doc.iibbLocal)) return { ventas: calcIibbLocalFor(client, p).baseImponible, compras: null };
    if (client.iibbCM.enabled && hasAnyValue(doc.iibbCM)) return { ventas: calcIibbCMFor(client, p).totales.baseTotal, compras: null };
  } catch (e) {}
  return null;
}
function variacionAlertas(client, period) {
  const cur = serieVentasCompras(client, period);
  if (!cur) return [];
  const prev = [];
  for (let i = 1; i <= 8 && prev.length < 3; i++) {

function fechaDeCelda(v) {
  if (typeof v === "number" && v > 30000 && v < 80000) { const d = new Date(Math.round((v - 25569) * 86400000)); return { y: d.getUTCFullYear(), m: d.getUTCMonth() + 1, d: d.getUTCDate() }; }

// Reparte el neto gravado entre 10,5 / 21 / 27 según el IVA que figura.
// Comprobantes con varias alícuotas (ej. un banco) salen con IVA entre dos
// alícuotas: se resuelve el sistema neto = a + b, iva = a·t1 + b·t2.
function dividirAlicuotas(neto, iva) {
  const z = { a105: 0, a21: 0, a27: 0, a0: 0, sin: 0, mixto: false };
  if (neto <= 0.005) return z;
  const tol = Math.max(1.5, neto * 0.0006);
  if (iva < 0.5) { z.a0 = neto; return z; }
  const rates = [[0.105, "a105"], [0.21, "a21"], [0.27, "a27"]];
  for (const [t, k] of rates) if (Math.abs(iva - neto * t) <= tol) { z[k] = neto; return z; }
  const mezcla = (t1, k1, t2, k2) => {
    const b = (iva - neto * t1) / (t2 - t1);
    if (b < -tol / t2 || b > neto + tol / t2) return false;
    const bb = Math.min(neto, Math.max(0, b));
    z[k2] = round2(bb); z[k1] = round2(neto - bb); z.mixto = true; return true;
  };
  if (iva > neto * 0.105 && iva < neto * 0.21 && mezcla(0.105, "a105", 0.21, "a21")) return z;
  if (iva > neto * 0.21 && iva < neto * 0.27 && mezcla(0.21, "a21", 0.27, "a27")) return z;
  z.sin = neto;
  return z;
}

    const norm = (s) => String(s || "").trim().toLowerCase();
    let hi = -1; const col = {};
    for (let r = 0; r < Math.min(rows.length, 10); r++) {

      const tc = col.tc != null && num(row[col.tc]) > 0 ? num(row[col.tc]) : 1;

      const neto = round2(g(col.neto)), iva = round2(g(col.iva)), exe = round2(g(col.exento)), total = round2(g(col.total));
      let nog = round2(g(col.nog));

      const esNC = /Nota de Cr[eé]dito/i.test(tipo);
      const esND = /Nota de D[eé]bito/i.test(tipo);
      const sp = dividirAlicuotas(neto, iva);
      comp.push({
        fecha: `${String(f.d).padStart(2, "0")}/${String(f.m).padStart(2, "0")}/${f.y}`, tipo, esNC, esND,
        pv: String(row[col.pv] || "").trim(), nro: String(row[col.num] || "").trim(),
        cuit: String(row[col.cuit] || "").trim(), nombre: String(row[col.nombre] || "").trim() || "(sin nombre)",
        neto, iva, nog, exe, total, otros: total > 0 ? round2(total - neto - iva - nog - exe) : 0, sp,

    renderComprasImportModal();

}
// Totales por casillero del papel de trabajo, según el concepto elegido por proveedor.
function comprasImpTotales() {
  const s = state.comprasImp;
  const t = { credito: { prest105: 0, bienes21: 0, bienesUso: 0, locaciones: 0, bienesExterior: 0, prest27: 0 }, restDebito: { ncRecLocaciones: 0, ncRecLocal21: 0, ncRecBienesUso: 0, ncRecServicios: 0 }, exentoC: 0, exentoNC: 0, otros: 0, sin: 0, cant: s.comp.length, cantNC: 0 };
  s.comp.forEach((c) => {
    const conc = s.conceptos[c.cuit] || "bienes21";
    const sp = c.sp;
    if (c.esND) { /* las N.D. se tratan como facturas */ }
    if (c.esNC) {
      t.cantNC++;
      t.restDebito.ncRecLocaciones += sp.a105;
      if (conc === "bienesUso") t.restDebito.ncRecBienesUso += sp.a21; else t.restDebito.ncRecLocal21 += sp.a21;
      t.restDebito.ncRecServicios += sp.a27;
      t.exentoNC += c.nog + c.exe + sp.a0;
      t.otros -= c.otros;
    } else {
      t.credito.prest105 += sp.a105;
      t.credito[conc] = (t.credito[conc] || 0) + sp.a21;
      t.credito.prest27 += sp.a27;
      t.exentoC += c.nog + c.exe + sp.a0;
      t.otros += c.otros;
    }
    t.sin += sp.sin;
  });
  ["credito", "restDebito"].forEach((g) => Object.keys(t[g]).forEach((k) => (t[g][k] = round2(t[g][k]))));
  t.exentoC = round2(t.exentoC); t.exentoNC = round2(t.exentoNC); t.otros = round2(t.otros); t.sin = round2(t.sin);
  return t;
}

function fechaAnyToYM(v) {
  if (typeof v === "number" && v > 30000 && v < 80000) { const d = new Date(Math.round((v - 25569) * 86400000)); return { y: d.getUTCFullYear(), m: d.getUTCMonth() + 1 }; }
  const t = String(v || "").trim();
  let m = t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (m) return { y: Number(m[3]), m: Number(m[2]) };
  m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return { y: Number(m[1]), m: Number(m[2]) };
  return null;
}
function importarVentasMono(clientId, period, file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    let wb;
    try { wb = XLSX.read(e.target.result, { type: "array" }); }
    catch (err) { alert("No pude leer el archivo. ¿Es el Excel de comprobantes emitidos de ARCA?"); return; }
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "", raw: true });
    const norm = (x) => String(x || "").trim().toLowerCase();
    let hi = -1; const col = {};
    for (let r = 0; r < Math.min(rows.length, 15); r++) {
      const names = rows[r].map(norm);
      const iF = names.findIndex((n) => n.indexOf("fecha") === 0);
      const iT = names.findIndex((n) => n === "imp. total" || n === "importe total" || n === "total" || n === "imp total");
      if (iF !== -1 && iT !== -1) {
        hi = r; col.fecha = iF; col.total = iT;
        names.forEach((n, i) => {
          if (n === "tipo" || n === "tipo de comprobante") col.tipo = i;
          else if (n.indexOf("tipo cambio") !== -1 || n.indexOf("tipo de cambio") !== -1) col.tc = i;
        });
        break;
      }
    }
    if (hi === -1 || col.tipo == null) { alert("No reconocí las columnas. Necesito una columna de fecha, una de tipo de comprobante y una de importe total (Excel de \"Mis Comprobantes\" emitidos o de \"Comprobantes de Ventas\")."); return; }
    const meses = {}; let recibos = 0, leidos = 0;
    for (let r = hi + 1; r < rows.length; r++) {
      const row = rows[r], f = fechaAnyToYM(row[col.fecha]);
      if (!f) continue;
      const tipo = String(row[col.tipo] || "").trim();
      if (/recibo/i.test(tipo)) { recibos++; continue; }
      const tc = col.tc != null && num(row[col.tc]) > 0 ? num(row[col.tc]) : 1;
      let monto = Math.abs(num(row[col.total])) * tc;
      if (/Nota de Cr[eé]dito/i.test(tipo)) monto = -monto;
      const ym = `${f.y}-${String(f.m).padStart(2, "0")}`;
      const o = meses[ym] = meses[ym] || { total: 0, n: 0, nc: 0 };
      o.total = round2(o.total + monto); o.n++; if (monto < 0) o.nc++;
      leidos++;
    }
    if (!leidos) { alert("No encontré comprobantes con fecha en este archivo."); return; }
    state.monoImp = { clientId, period, meses, recibos, ceros: true };
    renderMonoImportModal();
  };
  reader.onerror = () => alert("No pude leer el archivo.");
  reader.readAsArrayBuffer(file);
}

  cross.setAttribute("x1", h.dataset.x); cross.setAttribute("x2", h.dataset.x); cross.style.display = "";
});

// Al perder el foco, si el campo es un monto o una alícuota/coeficiente,
// se reformatea para que se vea prolijo (separador de miles y 2 decimales
// para montos; 2-4 decimales para porcentajes) — nunca mientras se tipea,
// para no romper el punto decimal en progreso (ver `num`/`rawOrBlank`).
document.addEventListener(
  "focusout",
  (e) => {
    if (isRerendering) return; // synthetic blur from removing the focused node during re-render, not a real blur
    const t = e.target;
    if (!t || !t.dataset) return;
    const kind = t.dataset.kind;
    if (kind !== "money" && kind !== "percent") return;
    const refresher = MODAL_REFRESHERS[t.dataset.reopen];
    // El campo de edición manual de Base Imponible (Convenio Multilateral) se
    // cierra solo al perder el foco, volviendo al formato de solo lectura +
    // lápiz — en vez de quedar trabado como input.
    const isBaseOverride = t.dataset.path && t.dataset.path.indexOf(".baseOverrides.") !== -1;
    const raw = String(t.value || "").trim();
    // El refresco (reformatear + refresher/render) reconstruye el DOM del
    // modal o de #main. Si esto pasa de forma síncrona durante el mismo
    // click con el que se sale del campo (por ejemplo, clickeando el botón
    // "Listo" de un modal justo después de tipear), el navegador reemplaza
    // ese botón a mitad de camino entre el mousedown y el mouseup, y el
    // click se pierde — hacía falta un segundo click para que funcionara.
    // Diferirlo con setTimeout deja que el click en curso termine de
    // procesarse primero.
    const runRefresher = (clientid, period) => {
      if (!refresher) return;
      setTimeout(() => {
        if (document.getElementById("modal-root").innerHTML.trim() !== "") refresher(clientid, period);
      }, 0);
    };
    const closeBaseOverride = () => { setTimeout(() => { state.editingBaseImponible = null; render(); }, 0); };
    if (raw === "") {
      if (isBaseOverride) { closeBaseOverride(); return; }
      runRefresher(t.dataset.clientid, t.dataset.period); return;
    }
    const formatted = kind === "money" ? fmtMoneyRaw(num(raw)) : fmtPctRaw(num(raw));
    if (formatted === raw) {
      if (isBaseOverride) { closeBaseOverride(); return; }
      runRefresher(t.dataset.clientid, t.dataset.period); return;
    }
    t.value = formatted;
    if (t.dataset.action === "field") {
      const { clientid, period, path } = t.dataset;
      touchDoc(clientid, period, (doc) => setDeep(doc, path, formatted));
      if (isBaseOverride) { closeBaseOverride(); return; }
      if (refresher) { runRefresher(clientid, period); return; }
    } else if (t.dataset.cfg) {
      handleConfigInput(t);
    }
  },
  true
);

function handleConfigInput(t) {
  const c = currentClient();
  if (!c) return;
  const cfg = t.dataset.cfg;
  if (cfg === "name") mutateClient(c.id, (cl) => (cl.name = t.value));
  else if (cfg === "cuit") mutateClient(c.id, (cl) => (cl.cuit = t.value));
  else if (cfg === "toggle-iva") mutateClient(c.id, (cl) => (cl.iva.enabled = t.checked));
  else if (cfg === "toggle-prorrateo-exento") touchDoc(c.id, state.currentPeriod, (doc) => setDeep(doc, "iva.prorrateoExento", t.checked));
  else if (cfg === "toggle-turiva") touchDoc(c.id, state.currentPeriod, (doc) => setDeep(doc, "iva.turIvaEnabled", t.checked));
  else if (cfg === "toggle-iibblocal") mutateClient(c.id, (cl) => (cl.iibbLocal.enabled = t.checked));
  else if (cfg === "toggle-iibbcm") mutateClient(c.id, (cl) => (cl.iibbCM.enabled = t.checked));
  else if (cfg === "toggle-mono") mutateClient(c.id, (cl) => { cl.mono = Object.assign({ categoria: "", tipo: "servicios" }, cl.mono || {}); cl.mono.enabled = t.checked; });
  else if (cfg === "mono-cat") mutateClient(c.id, (cl) => { cl.mono = cl.mono || {}; cl.mono.categoria = t.value; });
  else if (cfg === "mono-tipo") mutateClient(c.id, (cl) => { cl.mono = cl.mono || {}; cl.mono.tipo = t.value; });
  else if (cfg === "decreto814rate") mutateClient(c.id, (cl) => (cl.iva.decreto814Rate = t.value));
  else if (cfg === "iva-saldo-tecnico-inicial") mutateClient(c.id, (cl) => (cl.iva.saldosIniciales.saldoTecnicoAnterior = t.value));
  else if (cfg === "iva-saldo-libre-inicial") mutateClient(c.id, (cl) => (cl.iva.saldosIniciales.saldoLibreDisponibilidadAnterior = t.value));
  else if (cfg === "iibblocal-jurisdiccion") mutateClient(c.id, (cl) => (cl.iibbLocal.jurisdiccion = t.value));
  else if (cfg === "iibblocal-saldo-inicial") mutateClient(c.id, (cl) => (cl.iibbLocal.saldoInicial = t.value));
  else if (cfg === "iibblocal-activity-code") mutateClient(c.id, (cl) => (cl.iibbLocal.activities[Number(t.dataset.idx)].code = t.value));
  else if (cfg === "iva-activity-code") mutateClient(c.id, (cl) => (cl.iva.activities[Number(t.dataset.idx)].code = t.value));
  else if (cfg === "iva-activity-desc") mutateClient(c.id, (cl) => (cl.iva.activities[Number(t.dataset.idx)].desc = t.value));
  else if (cfg === "iva-pv-numero") mutateClient(c.id, (cl) => (cl.iva.puntosVenta[Number(t.dataset.idx)].puntoVenta = t.value));
  else if (cfg === "iva-pv-code") mutateClient(c.id, (cl) => (cl.iva.puntosVenta[Number(t.dataset.idx)].code = t.value));
  else if (cfg === "iva-pv-alicuota") mutateClient(c.id, (cl) => (cl.iva.puntosVenta[Number(t.dataset.idx)].alicuota = t.value));
  else if (cfg === "iibblocal-activity-desc") mutateClient(c.id, (cl) => (cl.iibbLocal.activities[Number(t.dataset.idx)].desc = t.value));
  else if (cfg === "iibblocal-activity-alicuota") mutateClient(c.id, (cl) => (cl.iibbLocal.activities[Number(t.dataset.idx)].alicuota = t.value));
  else if (cfg === "activity-code") mutateClient(c.id, (cl) => (cl.iibbCM.activities[Number(t.dataset.idx)].code = t.value));
  else if (cfg === "activity-desc") mutateClient(c.id, (cl) => (cl.iibbCM.activities[Number(t.dataset.idx)].desc = t.value));
  else if (cfg === "jur-alicuota") mutateClient(c.id, (cl) => {
    const jur = cl.iibbCM.jurisdictions.find((j) => j.name === t.dataset.jur);
    if (jur) { jur.alicuotas = jur.alicuotas || {}; jur.alicuotas[t.dataset.code] = t.value; }
  });
  else if (cfg === "coef") mutateClient(c.id, (cl) => {
    const desde = t.dataset.desde;
    const v = (cl.iibbCM.coeficientes || []).find((x) => x.desde === desde);
    if (v) { v.valores = v.valores || {}; v.valores[t.dataset.jur] = t.value; }
  });
  else if (cfg === "saldo-inicial-cm") mutateClient(c.id, (cl) => {
    cl.iibbCM.saldosIniciales = cl.iibbCM.saldosIniciales || {};
    cl.iibbCM.saldosIniciales[t.dataset.jur] = t.value;
  });
  renderPreservingFocus();
}

              <p style="font-size:11.5px;color:var(--muted);margin:0;">La jurisdicción productora toma como base el precio mayorista, oficial o corriente en plaza al despachar (o el 85% del precio de venta si no se puede establecer). El resto del ingreso se reparte entre las jurisdicciones con el coeficiente general (Art. 2) vigente al período que estás viendo.</p>
              <div class="field"><label>Jurisdicción productora</label>
                <select id="regimen-prod"><option value="">Elegir…</option>${jurs.map((j) => `<option value="${escapeHtml(j.name)}" ${a.especial13 && a.especial13.prod === j.name ? "selected" : ""}>${escapeHtml(j.name)}</option>`).join("")}</select></div>
              <div class="field"><label>Ingreso bruto total de la actividad</label>
                <input type="text" inputmode="decimal" data-kind="money" id="regimen-total13" value="${rawOrBlank(a.especial13 && a.especial13.total, "money")}" placeholder="—"></div>
              <div class="field"><label>Base de la jurisdicción productora</label>
                <input type="text" inputmode="decimal" data-kind="money" id="regimen-base13" value="${rawOrBlank(a.especial13 && a.especial13.base, "money")}" placeholder="—">
                <button type="button" class="btn btn-ghost btn-sm" id="regimen-85" style="align-self:flex-start;">Usar el 85% del ingreso total</button></div>
              <span id="regimen-art13-res" style="font-size:11.5px;color:var(--muted);"></span>
            </div>
            <p style="font-size:11.5px;color:var(--muted);margin:0;">Repartí el 100% de esta actividad entre las jurisdicciones que ya cargaste. Queda fijo — si en algún momento cambia (otra obra, otro contrato), lo volvés a editar acá.</p>
            ${jurs.length ? jurs.map((j) => `
              <div class="field" style="flex-direction:row;align-items:center;justify-content:space-between;gap:8px;">
                <label style="margin:0;">${escapeHtml(j.name)}</label>
                <span class="pct-field"><input type="text" inputmode="decimal" data-kind="percent" data-jur="${escapeHtml(j.name)}" value="${rawOrBlank(a.distribEspecial && a.distribEspecial[j.name], "percent")}" placeholder="—" style="width:80px;"><span class="pct-suffix">%</span></span>
              </div>`).join("") : `<p style="color:var(--muted);font-size:12px;">Cargá jurisdicciones primero, en la sección de arriba.</p>`}
          </div>
          <div id="regimen-art14-block" style="display:${regimen === "art14" ? "block" : "none"};">
            <div class="field">
              <label>Jurisdicción donde arrancó la actividad</label>
              <select id="regimen-art14-jur">
                <option value="">Elegir…</option>
                ${jurs.map((j) => `<option value="${escapeHtml(j.name)}" ${a.art14Jur === j.name ? "selected" : ""}>${escapeHtml(j.name)}</option>`).join("")}
              </select>
            </div>
          </div>
        </div>
        <div class="modal-foot">
          <button class="btn" data-action="close-modal">Cancelar</button>
          <button class="btn btn-accent" data-action="confirm-activity-regimen" data-code="${escapeHtml(a.code)}">Guardar</button>
        </div>
      </div>
    </div>`;
  wireModalBackdropClose();
  // Reparto automático (Arts. 6, 7, 10, 11 y 12): con la jurisdicción de la
  // sede y la jurisdicción donde se hace la actividad se completan solos los
  // porcentajes (p. ej. 80% / 20%); si ambas son la misma, 100% a esa.
  const aplicarReparto = (completar) => {
    const v = Number(document.getElementById("regimen-especial-art").value);
    const e2 = CM_ENCUADRES.find((x) => x.art === v);
    const blk = document.getElementById("regimen-reparto-block");
    document.getElementById("regimen-montos-block").style.display = e2 && e2.montos ? "flex" : "none";
    document.getElementById("regimen-art13-block").style.display = e2 && e2.art13 ? "flex" : "none";
    if (e2 && e2.montos) document.getElementById("regimen-montos-txt").textContent = e2.montos.txt;
    if (!e2 || !e2.reparto) { blk.style.display = "none"; return; }
    blk.style.display = "flex";
    document.getElementById("regimen-sede-label").textContent = e2.reparto.ls;
    document.getElementById("regimen-donde-label").textContent = e2.reparto.ld;
    document.getElementById("regimen-reparto-hint").textContent = `Se completa ${e2.reparto.donde}% donde corresponde a la actividad y ${e2.reparto.sede}% a la sede. Si la actividad se hace en más de una jurisdicción, ajustá los porcentajes a mano abajo.`;
    if (!completar) return;
    const sede = document.getElementById("regimen-sede").value, donde = document.getElementById("regimen-donde").value;
    if (!sede || !donde) return;
    const map = {};
    if (sede === donde) map[sede] = 100; else { map[sede] = e2.reparto.sede; map[donde] = e2.reparto.donde; }
    document.querySelectorAll("#regimen-especial-block input[data-jur]").forEach((inp) => { inp.value = map[inp.dataset.jur] ? fmtPctRaw(map[inp.dataset.jur]) : ""; });
  };
  const actualizarRegla = (completar) => {
    const v = Number(document.getElementById("regimen-especial-art").value);
    const e2 = CM_ENCUADRES.find((x) => x.art === v);
    document.getElementById("regimen-especial-regla").textContent = e2 ? e2.regla : "";
    aplicarReparto(completar === true);
  };
  const llenarPct = (map) => {
    document.querySelectorAll("#regimen-especial-block input[data-jur]").forEach((inp) => { inp.value = map[inp.dataset.jur] ? fmtPctRaw(map[inp.dataset.jur]) : ""; });
  };
  // Arts. 8 y 9: porcentaje = importe de la jurisdicción / total.
  const calcMontos = () => {
    const ins = [...document.querySelectorAll("#regimen-montos-block input[data-montojur]")];
    const total = ins.reduce((acc, i) => acc + num(i.value), 0);
    document.getElementById("regimen-montos-total").textContent = total ? `Total: ${fmtMoney(total)}` : "";
    if (!total) return;
    const map = {};
    ins.forEach((i) => { const v = num(i.value); if (v) map[i.dataset.montojur] = (v / total) * 100; });
    llenarPct(map);
  };
  document.querySelectorAll("#regimen-montos-block input[data-montojur]").forEach((i) => i.addEventListener("input", calcMontos));
  // Art. 13: la productora toma la base; el resto se reparte por el coeficiente general.
  const calc13 = () => {
    const prod = document.getElementById("regimen-prod").value;
    const total = num(document.getElementById("regimen-total13").value);
    const base = num(document.getElementById("regimen-base13").value);
    const res = document.getElementById("regimen-art13-res");
    if (!prod || !total) { res.textContent = ""; return; }
    const pr = Math.max(0, Math.min(1, base / total));
    const map = {};
    jurs.forEach((j) => { map[j.name] = (1 - pr) * getCoef(client, j.name, state.currentPeriod) * 100; });
    map[prod] = (map[prod] || 0) + pr * 100;
    llenarPct(map);
    const suma = Object.values(map).reduce((x, y) => x + y, 0);
    res.textContent = `La productora toma ${fmtPct(pr)} por la base y el resto se reparte por coeficiente. Suma del reparto: ${fmtPct(suma / 100)}.` + (Math.abs(suma - 100) > 0.01 ? " Revisá que los coeficientes sumen 100%." : "");
  };
  ["regimen-prod", "regimen-total13", "regimen-base13"].forEach((id) => document.getElementById(id).addEventListener(id === "regimen-prod" ? "change" : "input", calc13));
  document.getElementById("regimen-85").addEventListener("click", () => {
    const total = num(document.getElementById("regimen-total13").value);
    if (!total) { showToast("Cargá primero el ingreso bruto total"); return; }
    document.getElementById("regimen-base13").value = fmtMoneyRaw(total * 0.85);
    calc13();
  });
  document.getElementById("regimen-especial-art").addEventListener("change", () => actualizarRegla(true));
  document.getElementById("regimen-sede").addEventListener("change", () => aplicarReparto(true));
  document.getElementById("regimen-donde").addEventListener("change", () => aplicarReparto(true));
  actualizarRegla(false);
  const usarBtn = document.getElementById("usar-encuadre");
  if (usarBtn) usarBtn.addEventListener("click", () => {
    document.getElementById("regimen-select").value = "especial";
    document.getElementById("regimen-especial-block").style.display = "flex";
    document.getElementById("regimen-art14-block").style.display = "none";
    document.getElementById("regimen-especial-art").value = String(enc.art);
    actualizarRegla(true);
    usarBtn.parentElement.remove();
  });
  document.getElementById("regimen-select").addEventListener("change", (e) => {
    document.getElementById("regimen-especial-block").style.display = e.target.value === "especial" ? "flex" : "none";
    document.getElementById("regimen-art14-block").style.display = e.target.value === "art14" ? "block" : "none";
  });
}

// ---------------------------------------------------------------------
// Selector de fecha propio (reemplaza <input type="date"> nativo, que no
// se puede re-diseñar para que combine con la paleta de la herramienta).
// ---------------------------------------------------------------------
let datePickerState = null; // { path, clientId, period, reopen, viewYear, viewMonth, selected, anchorRect }
function fmtDateDMY(iso) {
  if (!iso) return "";
  const [y, m, d] = iso.split("-");
  return `${d}/${m}/${y}`;
}
function openDatePickerFor(btn) {
  const { path, clientid, period, reopen } = btn.dataset;
  if (datePickerState && datePickerState.path === path && datePickerState.clientId === clientid && datePickerState.period === period) {
    closeDatePicker();
    return;
  }
  const doc = getDoc(clientid, period);
  const current = getDeep(doc, path, "") || "";
  const base = current ? new Date(current + "T00:00:00") : new Date();
  datePickerState = {
    path, clientId: clientid, period, reopen,
    viewYear: base.getFullYear(), viewMonth: base.getMonth(),
    selected: current || null,
    anchorRect: btn.getBoundingClientRect(),
  };
  renderDatePicker();
}
function closeDatePicker() {
  datePickerState = null;
  const root = document.getElementById("date-picker-root");
  if (root) root.innerHTML = "";
}
function saveDatePickerValue(iso) {
  if (!datePickerState) return;
  const { clientId, period, path, reopen } = datePickerState;
  touchDoc(clientId, period, (doc) => setDeep(doc, path, iso));
  const refresher = MODAL_REFRESHERS[reopen];
  if (refresher) refresher(clientId, period); else render();
}
function renderDatePicker() {
  const root = document.getElementById("date-picker-root");
  if (!datePickerState) { root.innerHTML = ""; return; }
  const { viewYear, viewMonth, selected, anchorRect } = datePickerState;
  const startDow = new Date(viewYear, viewMonth, 1).getDay();
  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
  const daysInPrevMonth = new Date(viewYear, viewMonth, 0).getDate();
  const now = new Date();
  const cells = [];
  for (let i = 0; i < startDow; i++) {
    const d = daysInPrevMonth - startDow + 1 + i;
    const m = viewMonth === 0 ? 11 : viewMonth - 1, y = viewMonth === 0 ? viewYear - 1 : viewYear;
    cells.push({ d, m, y, muted: true });
  }
  for (let d = 1; d <= daysInMonth; d++) cells.push({ d, m: viewMonth, y: viewYear, muted: false });
  while (cells.length < 42) {
    const d = cells.length - (startDow + daysInMonth) + 1;
    const m = viewMonth === 11 ? 0 : viewMonth + 1, y = viewMonth === 11 ? viewYear + 1 : viewYear;
    cells.push({ d, m, y, muted: true });
  }
  const isoOf = (c) => `${c.y}-${String(c.m + 1).padStart(2, "0")}-${String(c.d).padStart(2, "0")}`;
  const dowLabels = ["DO", "LU", "MA", "MI", "JU", "VI", "SA"];
  const dayButtons = cells.map((c) => {
    const iso = isoOf(c);
    const cls = ["dp-day"];
    if (c.muted) cls.push("dp-muted");
    if (c.y === now.getFullYear() && c.m === now.getMonth() && c.d === now.getDate()) cls.push("dp-today");
    if (selected && iso === selected) cls.push("dp-selected");
    return `<button type="button" class="${cls.join(" ")}" data-dp-iso="${iso}">${c.d}</button>`;
  }).join("");
  const monthLabel = `${MESES[viewMonth].toLowerCase()} de ${viewYear}`;

  const popW = 270, popH = 340;
  let top = anchorRect.bottom + 6, left = anchorRect.left;
  if (left + popW > window.innerWidth - 10) left = window.innerWidth - popW - 10;
  if (left < 10) left = 10;
  if (top + popH > window.innerHeight - 10) top = anchorRect.top - popH - 6;
  if (top < 10) top = 10;

  root.innerHTML = `
    <div class="date-picker-popover" style="top:${top}px;left:${left}px;">
      <div class="dp-head">
        <button type="button" data-dp-action="prev-month" title="Mes anterior">‹</button>
        <b>${monthLabel}</b>
        <button type="button" data-dp-action="next-month" title="Mes siguiente">›</button>
      </div>
      <div class="dp-grid">
        ${dowLabels.map((l) => `<div class="dp-dow">${l}</div>`).join("")}
        ${dayButtons}
      </div>
      <div class="dp-foot">
        <button type="button" data-dp-action="clear">Borrar</button>
        <button type="button" data-dp-action="today">Hoy</button>
      </div>
    </div>`;
}
document.getElementById("date-picker-root").addEventListener("click", (e) => {
  const dayBtn = e.target.closest("[data-dp-iso]");
  if (dayBtn) { saveDatePickerValue(dayBtn.dataset.dpIso); closeDatePicker(); return; }
  const actionBtn = e.target.closest("[data-dp-action]");
  if (!actionBtn || !datePickerState) return;
  const action = actionBtn.dataset.dpAction;
  if (action === "prev-month") {
    datePickerState.viewMonth--;
    if (datePickerState.viewMonth < 0) { datePickerState.viewMonth = 11; datePickerState.viewYear--; }
    renderDatePicker();
  } else if (action === "next-month") {
    datePickerState.viewMonth++;
    if (datePickerState.viewMonth > 11) { datePickerState.viewMonth = 0; datePickerState.viewYear++; }
    renderDatePicker();
  } else if (action === "clear") { saveDatePickerValue(""); closeDatePicker(); }
  else if (action === "today") {
    const n = new Date();
    saveDatePickerValue(`${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, "0")}-${String(n.getDate()).padStart(2, "0")}`);
    closeDatePicker();
  }
});

document.getElementById("modal-root").addEventListener("click", (e) => {
  const btn = e.target.closest("[data-action]");
  if (!btn) return;
  if (btn.dataset.action === "close-modal") document.getElementById("modal-root").innerHTML = "";
  else if (btn.dataset.action === "confirm-add-client") {
    const name = document.getElementById("new-client-name").value.trim();
    const cuit = document.getElementById("new-client-cuit").value.trim();
    document.getElementById("modal-root").innerHTML = "";
    addClient(name || "Nuevo cliente", cuit);
  }
  else if (btn.dataset.action === "confirm-coef-vigencia") {
    const re = /^\d{4}-(0[1-9]|1[0-2])$/;
    const desde = document.getElementById("coef-vig-desde").value.trim();
    const sigueVigente = document.getElementById("coef-vig-sigue").checked;
    const hasta = sigueVigente ? null : document.getElementById("coef-vig-hasta").value.trim();
    if (!re.test(desde)) { showToast("El período 'Desde' tiene que tener formato AAAA-MM"); return; }
    if (hasta && !re.test(hasta)) { showToast("El período 'Hasta' tiene que tener formato AAAA-MM"); return; }
    if (hasta && hasta < desde) { showToast("'Hasta' no puede ser anterior a 'Desde'"); return; }
    const editingDesde = btn.dataset.editing;
    let ok = true;
    mutateClient(currentClient().id, (c) => {
      c.iibbCM.coeficientes = c.iibbCM.coeficientes || [];
      if (editingDesde) {
        if (desde !== editingDesde && c.iibbCM.coeficientes.some((v) => v.desde === desde)) { ok = false; return; }
        const v = c.iibbCM.coeficientes.find((x) => x.desde === editingDesde);
        if (v) { v.desde = desde; v.hasta = hasta || null; }
      } else {
        if (c.iibbCM.coeficientes.some((v) => v.desde === desde)) { ok = false; return; }
        c.iibbCM.coeficientes.push({ desde, hasta: hasta || null, valores: {} });
      }
    });
    if (!ok) { showToast("Ya existe una vigencia cargada con esa fecha de inicio"); return; }
    state.selectedCoefDesde = desde;
    document.getElementById("modal-root").innerHTML = "";
    render();
  }
  else if (btn.dataset.action === "delete-coef-vigencia") {
    const desde = btn.dataset.desde;
    if (!confirm(`¿Eliminar la vigencia de coeficientes desde ${periodLabel(desde)}? Esta acción no se puede deshacer.`)) return;
    mutateClient(currentClient().id, (c) => {
      c.iibbCM.coeficientes = (c.iibbCM.coeficientes || []).filter((v) => v.desde !== desde);
    });
    if (state.selectedCoefDesde === desde) state.selectedCoefDesde = null;
    document.getElementById("modal-root").innerHTML = "";
    render();
  }
  else if (btn.dataset.action === "confirm-activity-regimen") {
    const code = btn.dataset.code;
    const regimen = document.getElementById("regimen-select").value;
    let art14Jur = "";
    let distribEspecial = null;
    if (regimen === "especial") {
      distribEspecial = {};
      document.querySelectorAll("#regimen-especial-block input[data-jur]").forEach((inp) => {
        const v = num(inp.value);
        if (v) distribEspecial[inp.dataset.jur] = v;
      });
    } else if (regimen === "art14") {
      const sel = document.getElementById("regimen-art14-jur");
      art14Jur = sel ? sel.value : "";
      if (!art14Jur) { showToast("Elegí en qué jurisdicción arrancó la actividad"); return; }
    }
    mutateClient(currentClient().id, (c) => {
      const a = (c.iibbCM.activities || []).find((x) => x.code === code);
      if (!a) return;
      a.regimen = regimen === "general" ? undefined : regimen;
      a.especialArt = regimen === "especial" ? (Number(document.getElementById("regimen-especial-art") && document.getElementById("regimen-especial-art").value) || undefined) : undefined;
      const montosEl = [...document.querySelectorAll("#regimen-montos-block input[data-montojur]")];
      const artSel = Number(document.getElementById("regimen-especial-art").value);
      a.especialMontos = regimen === "especial" && (artSel === 8 || artSel === 9) ? Object.fromEntries(montosEl.filter((i) => num(i.value)).map((i) => [i.dataset.montojur, num(i.value)])) : undefined;
      a.especial13 = regimen === "especial" && artSel === 13 ? { prod: document.getElementById("regimen-prod").value, total: num(document.getElementById("regimen-total13").value), base: num(document.getElementById("regimen-base13").value) } : undefined;
      a.especialSede = regimen === "especial" ? (document.getElementById("regimen-sede").value || undefined) : undefined;
      a.especialDonde = regimen === "especial" ? (document.getElementById("regimen-donde").value || undefined) : undefined;
      if (regimen === "general") a.regimenAvisoOk = true; // ya lo revisó y lo dejó en general
      a.distribEspecial = regimen === "especial" ? distribEspecial : undefined;
      a.art14Jur = regimen === "art14" ? art14Jur : undefined;
    });
    document.getElementById("modal-root").innerHTML = "";
    render();
  }
  else if (btn.dataset.action === "pick-activity") {
    const code = btn.dataset.code, desc = btn.dataset.desc;
    mutateClient(currentClient().id, (c) => {
      // Se carga la actividad en TODOS los regímenes que el cliente tenga
      // habilitados (no sólo en el que abrió el buscador) — si ya la usás
      // en IVA, tiene sentido que esté también en IIBB (local y/o Convenio
      // Multilateral), sin tener que cargarla dos o tres veces a mano.
      // Sacarla si no corresponde en alguno se sigue haciendo manual, con
      // "Quitar" — eso sí queda independiente por régimen.
      if (c.iva.enabled && !c.iva.activities.some((a) => a.code === code)) c.iva.activities.push({ code, desc });
      if (c.iibbLocal.enabled && !c.iibbLocal.activities.some((a) => a.code === code)) c.iibbLocal.activities.push({ code, desc, alicuota: 0 });
      if (c.iibbCM.enabled && !c.iibbCM.activities.some((a) => a.code === code)) c.iibbCM.activities.push({ code, desc });
    });
    document.getElementById("modal-root").innerHTML = "";
    render();
  }
});

function renderIvaActividadesModal(clientId, period) {
  const client = state.clients.find((c) => c.id === clientId);
  if (!client) return;
  const alertaProrrateoModal = prorrateoAlertaHtml(client, period, true);
  const doc = getDoc(clientId, period);
  const porActividad = (doc && doc.iva && doc.iva.porActividad) || {};
  const activities = client.iva.activities || [];

  const rateCell = (code, group, key) => {

  };

// ---------------------------------------------------------------------
// Importar "Comprobantes de Ventas" (Excel descargado del portal IVA de
// ARCA) y volcarlo en "Apertura de Otros Conceptos", por actividad/
// alícuota/condición del comprador — usando el mapeo Punto de Venta →
// Actividad cargado en Configuración → IVA. No toca lo que el contador ya
// haya tipeado a mano en otras actividades/alícuotas no presentes en el
// archivo importado.
// ---------------------------------------------------------------------
function parseArcaFecha(raw) {
  // Siempre "dd/mm/aaaa" (así la exporta el portal de ARCA). Si viniera
  // como fecha real de Excel (número serie), XLSX ya la entrega como string
  // acá porque leemos la hoja con raw:false.
  const m = String(raw || "").trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (!m) return null;
  return { y: Number(m[3]), m: Number(m[2]), d: Number(m[1]) };
}
function importArcaComprobantes(clientId, period, file) {
  const client = getClient(clientId);
  if (!client) return;
  const puntosVenta = client.iva.puntosVenta || [];
  const [targetY, targetM] = period.split("-").map(Number);

  const reader = new FileReader();
  reader.onload = (e) => {
    let wb;
    try {
      wb = XLSX.read(e.target.result, { type: "array" });
    } catch (err) {
      alert("No pude leer el archivo. ¿Es el Excel de \"Comprobantes de Ventas\" exportado de ARCA?");
      return;
    }
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "", raw: false });

    // Ubicar la fila de encabezados por nombre de columna (en vez de asumir
    // que es la fila 0), por si el portal cambia el orden o hay filas antes.
    const norm = (s) => String(s || "").trim().toLowerCase();
    let headerIdx = -1, col = {};
    for (let r = 0; r < Math.min(rows.length, 10); r++) {
      const names = rows[r].map(norm);
      if (names.includes("fecha") && names.some((n) => n.indexOf("punto de venta") !== -1)) {
        headerIdx = r;
        names.forEach((n, i) => {
          if (n === "fecha") col.fecha = i;
          else if (n === "tipo") col.tipo = i;
          else if (n.indexOf("punto de venta") !== -1) col.pv = i;
          else if (n.indexOf("neto gravado") !== -1) col.neto = i;
          else if (n === "exento") col.exento = i;
          else if (n === "iva") col.iva = i;
        });
        break;
      }
    }
    if (headerIdx === -1 || col.fecha == null || col.tipo == null || col.pv == null || col.neto == null || col.iva == null) {
      alert("No reconocí las columnas del archivo. Tiene que ser el Excel \"Comprobantes de Ventas\" tal como lo exporta el portal IVA de ARCA.");
      return;
    }

    // Acumuladores por actividad: igual estructura que iva.porActividad.
    const acc = {}; // code -> { debito:{ri105,cf105,ri21,cf21}, restCredito:{ncEmit105RI,...}, exento, exentoNC }
    const emptyAcc = () => ({ debito: { ri105: 0, cf105: 0, ri21: 0, cf21: 0 }, restCredito: { ncEmit105RI: 0, ncEmit105CF: 0, ncEmit21RI: 0, ncEmit21CF: 0 }, exento: 0, exentoNC: 0 });

    let comprobantesOk = 0, comprobantesFueraDePeriodo = 0;
    let montoSinPV = 0, pvSinConfigurar = new Set();
    let montoSinAlicuota = 0;
    let montoSinLetra = 0;

    for (let r = headerIdx + 1; r < rows.length; r++) {
      const row = rows[r];
      const fechaRaw = row[col.fecha];
      // La hoja trae, debajo de los comprobantes, el cuadro resumen armado a
      // mano (separado por una fila en blanco) — cortamos ahí.
      if (!fechaRaw && String(row[col.pv] || "").trim() === "" && comprobantesOk > 0) break;
      const fecha = parseArcaFecha(fechaRaw);
      if (!fecha) continue; // fila sin fecha válida (totales, encabezados repetidos, etc.)

      const tipo = String(row[col.tipo] || "").trim();
      const pv = String(row[col.pv] || "").trim();
      // Las Notas de Crédito vienen con el Neto Gravado (y el IVA) en
      // negativo en el export de ARCA — se trabaja con el valor absoluto, ya
      // que acá se guardan como un monto positivo de "N.C. emitidas" que el
      // propio papel de trabajo resta del débito (no como un neto negativo).
      const netoGravado = Math.abs(num(row[col.neto]));
      const ivaMonto = Math.abs(num(row[col.iva]));
      const exentoMonto = Math.abs(col.exento != null ? num(row[col.exento]) : 0);

      if (fecha.y !== targetY || fecha.m !== targetM) { comprobantesFueraDePeriodo++; continue; }

      const letraMatch = tipo.match(/([A-Z])\s*$/);
      const letra = letraMatch ? letraMatch[1] : null;
      const esRI = letra === "A";
      const esCF = letra === "B" || letra === "C";
      if (!esRI && !esCF) { montoSinLetra += netoGravado + exentoMonto; continue; }
      const esNC = /Nota de Cr[eé]dito/i.test(tipo);

      // A qué actividad corresponde este punto de venta — si tiene más de
      // una actividad asociada, se distingue por la alícuota real del
      // comprobante (IVA / Neto Gravado).
      const candidatos = puntosVenta.filter((x) => String(x.puntoVenta).trim() === pv);
      let code = null;
      let rate105 = null; // true=10,5% / false=21% / null=no se pudo determinar
      if (candidatos.length === 1) {
        code = candidatos[0].code;
      } else if (candidatos.length > 1) {
        const rateReal = netoGravado > 0 ? ivaMonto / netoGravado : 0;
        const match = candidatos.find((x) => Math.abs(rateReal - num(x.alicuota) / 100) < 0.02);
        code = match ? match.code : null;
      }
      if (!code) {
        montoSinPV += netoGravado + exentoMonto;
        if (pv) pvSinConfigurar.add(pv);
        continue;
      }

      if (netoGravado > 0) {
        const rateReal = ivaMonto / netoGravado;
        if (Math.abs(rateReal - 0.21) < 0.03) rate105 = false;
        else if (Math.abs(rateReal - 0.105) < 0.02) rate105 = true;
        else { montoSinAlicuota += netoGravado; continue; }
      }

      if (!acc[code]) acc[code] = emptyAcc();
      if (netoGravado > 0) {
        const key = (esRI ? "ri" : "cf") + (rate105 ? "105" : "21");
        if (esNC) acc[code].restCredito[("ncEmit" + (rate105 ? "105" : "21") + (esRI ? "RI" : "CF"))] += netoGravado;
        else acc[code].debito[key] += netoGravado;
      }
      if (exentoMonto) {
        if (esNC) acc[code].exentoNC += exentoMonto; else acc[code].exento += exentoMonto;
      }
      comprobantesOk++;
    }

    if (!comprobantesOk) {
      alert(`No encontré comprobantes de ${periodLabel(period)} en este archivo (¿es el período correcto?).`);
      return;
    }

    const codesImportados = Object.keys(acc);
    touchDoc(clientId, period, (doc) => {
      codesImportados.forEach((code) => {
        setDeep(doc, `iva.porActividad.${code}`, acc[code]);
      });
    });
    codesImportados.forEach((code) => syncVentasNetasFromIvaActividad(clientId, period, `iva.porActividad.${code}.debito.ri21`));

    let msg = `Importados ${comprobantesOk} comprobantes de ${periodLabel(period)} en ${codesImportados.length} actividad(es).`;
    if (montoSinPV > 0) msg += `\n\nOjo: ${fmtMoney(montoSinPV)} corresponden a punto(s) de venta sin configurar (${[...pvSinConfigurar].join(", ")}) — andá a Configuración → IVA → Puntos de venta y asignalos.`;
    if (montoSinAlicuota > 0) msg += `\n\n${fmtMoney(montoSinAlicuota)} tienen una alícuota que no pude identificar como 10,5% ni 21% — revisalos a mano.`;
    if (montoSinLetra > 0) msg += `\n\n${fmtMoney(montoSinLetra)} corresponden a comprobantes cuyo tipo no reconocí (ni Factura A, B o C) — revisalos a mano.`;
    if (comprobantesFueraDePeriodo > 0) msg += `\n\n(Se ignoraron ${comprobantesFueraDePeriodo} comprobantes del archivo por no pertenecer a ${periodLabel(period)}.)`;
    alert(msg);

    refreshIvaActividadesModal(clientId, period);
  };
  reader.onerror = () => alert("No pude leer el archivo.");
  reader.readAsArrayBuffer(file);
}

const PRORRATEO_ALICUOTAS = [

  document.getElementById("modal-root").innerHTML = `
    <div class="modal-backdrop">
      <div class="modal" style="max-width:480px;">

            <div style="border-top:1px solid var(--border);margin-top:2px;">${kv("Total ventas netas", fmtMoney(totalVentasNetas), { bold: true })}</div>

          </div>
          <div class="subsection" style="padding-top:12px;border-top:1px solid var(--border);">
            <h4 class="subhead">Crédito Fiscal Total del período</h4>
            <div class="field"><label>CF Total (a prorratear)</label><input type="text" inputmode="decimal" data-kind="money" value="${rawOrBlank(pm.cfTotal, "money")}" data-path="iva.prorrateoManual.cfTotal" data-action="field" data-clientid="${clientId}" data-period="${period}" data-reopen="prorrateo"></div>
            <div style="margin-top:6px;">

              ${kv("CF No Computable", fmtMoney(cfNoComputable), { color: "var(--pagar)" })}
            </div>
          </div>
          <div class="subsection" style="padding-top:12px;border-top:1px solid var(--border);">
            ${prorrateoModalShowDesglose ? `

function renderFormulario2083Modal(clientId, period) {
  const client = state.clients.find((c) => c.id === clientId);
  if (!client) return;
  const r = calcIvaFor(client, period);

  const sumNeto = (arr) => round2(arr.reduce((s, b) => s + b.neto, 0));
  const sumCalc = (arr) => round2(arr.reduce((s, b) => s + b.calculado, 0));
  // Para Ventas y Compras usamos el importe "s/Portal IVA" (declarado) en
  // vez del recalculado, porque pueden existir diferencias entre ambos.
  const sumPortal = (arr) => round2(arr.reduce((s, b) => s + (b.portal ? b.portal : b.calculado), 0));

  // Ventas: "Operaciones de Venta" = Débito Fiscal (bruto); "Notas de Crédito
  // de Venta" = N.C. emitidas (restitución de crédito fiscal) — el F.2083
  // los declara sin netear, cada uno con su propia columna de Débito Fiscal.
  const ventasNeto = sumNeto(r.debitoBrackets), ventasDebito = sumPortal(r.debitoBrackets);
  const ncVentasNeto = sumNeto(r.restCreditoBrackets), ncVentasDebito = sumPortal(r.restCreditoBrackets);
  const ventasExento = num(r.exento.ventas), ncVentasExento = num(r.exento.ncVentas);

  // Compras: "Operaciones de Compra" = Crédito Fiscal; "Notas de Crédito de
  // Compra" = N.C. recibidas (restitución de débito fiscal).
  const comprasNeto = sumNeto(r.creditoBrackets), comprasCredito = sumPortal(r.creditoBrackets);
  const ncComprasNeto = sumNeto(r.restDebitoBrackets), ncComprasCredito = sumPortal(r.restDebitoBrackets);
  const comprasExento = num(r.exento.compras), ncComprasExento = num(r.exento.ncCompras);

  const operacionesNoCredito = num(r.exento.operacionesNoCredito);

  const row = (label, neto, exento, impuesto) => `
    <tr><td>${label}</td><td class="num">${fmtMoney(neto)}</td><td class="num">${fmtMoney(exento)}</td><td class="num">${fmtMoney(impuesto)}</td></tr>`;

  document.getElementById("modal-root").innerHTML = `
    <div class="modal-backdrop">
      <div class="modal" style="max-width:680px;">
        <div class="modal-head"><h3>Resumen Formulario 2083 — ${periodLabel(period)}</h3><button class="btn btn-ghost" data-action="close-modal">✕</button></div>
        <div class="modal-body" style="gap:10px;">
          <p style="font-size:11.5px;color:var(--muted);margin:0;">Armado con lo cargado en la herramienta (según libros), para cotejar contra el Libro de IVA Digital antes de presentarlo en el Portal IVA.</p>
          <div style="margin-top:2px;">
            <h4 class="subhead-strong" style="margin-bottom:8px;">Ventas</h4>
            <div class="table-scroll"><table class="f2083-table">
              <tr><th style="text-align:left">Concepto</th><th style="text-align:right">Neto Gravado</th><th style="text-align:right">Exento o no Gravado</th><th style="text-align:right">Débito Fiscal</th></tr>
              ${row("Operaciones de Venta", ventasNeto, ventasExento, ventasDebito)}
              ${row("Notas de Crédito de Venta", ncVentasNeto, ncVentasExento, ncVentasDebito)}
            </table></div>
            ${(() => {
              const ex = exencionesDelPeriodo(client, period);
              if (!ex.length) return "";
              return `<div class="foot-note" style="padding:8px 2px 0;"><b>Fundamento de lo exento o no gravado:</b>${ex.map((x) => `<br>• ${escapeHtml(x.code)} — ${fmtMoney(x.monto)}: ${x.key ? escapeHtml(exencionLabel(x.key)) : "<b>sin fundamento indicado</b>"}`).join("")}</div>`;
            })()}
            <div class="foot-note" style="padding:6px 2px 0;">Operaciones de Exportación: <b class="mono">${fmtMoney(0)}</b> — la herramienta todavía no releva exportaciones; completalo manualmente si corresponde.</div>
          </div>
          <div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border);">
            <h4 class="subhead-strong" style="margin-bottom:8px;">Compras</h4>
            <div class="table-scroll"><table class="f2083-table">
              <tr><th style="text-align:left">Concepto</th><th style="text-align:right">Neto Gravado</th><th style="text-align:right">Exento o no Gravado</th><th style="text-align:right">Crédito Fiscal</th></tr>
              ${row("Operaciones de Compra", comprasNeto, comprasExento, comprasCredito)}
              ${row("Notas de Crédito de Compra", ncComprasNeto, ncComprasExento, ncComprasCredito)}
            </table></div>
          </div>
          <div style="margin-top:2px;padding-top:8px;border-top:1px solid var(--border);">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <span class="subhead-strong" style="margin:0;border-bottom:none;padding-bottom:0;">Operaciones que no generan Crédito Fiscal</span>
              <b class="mono">${fmtMoney(operacionesNoCredito)}</b>
            </div>
          </div>
        </div>
        <div class="modal-foot"><button class="btn btn-accent" data-action="close-modal">Listo</button></div>
      </div>
    </div>`;
  wireModalBackdropClose();
}

function normalizeSearch(s) {

}
function filterActivityPicker(q) {
  const container = document.getElementById("activity-results");
  if (!container) return;

    ? AFIP_ACTIVIDADES.filter(([code, desc]) => code.includes(query) || normalizeSearch(desc).includes(query))

  ).slice(0, query ? 200 : 60);
