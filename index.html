// ---- Lectura del F.931 (PDF de "Declaración en línea") ----
function ganCargarPdfJs() {
  if (window.pdfjsLib && window.__ganPdfWorker) return Promise.resolve();
  const base = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/";
  const lib = window.pdfjsLib ? Promise.resolve() : new Promise((ok, ko) => { const s = document.createElement("script"); s.src = base + "pdf.min.js"; s.onload = ok; s.onerror = () => ko(new Error("No se pudo cargar el lector de PDF (¿hay conexión a internet?)")); document.head.appendChild(s); });
  return lib.then(() => fetch(base + "pdf.worker.min.js")).then((r) => r.text()).then((t) => { window.__ganPdfWorker = URL.createObjectURL(new Blob([t], { type: "application/javascript" })); window.pdfjsLib.GlobalWorkerOptions.workerSrc = window.__ganPdfWorker; });
}
async function ganLeerPdfTexto(file) {
  await ganCargarPdfJs();
  const pdf = await window.pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
  let out = "";
  for (let p = 1; p <= pdf.numPages; p++) {
    const items = (await (await pdf.getPage(p)).getTextContent()).items.filter((i) => String(i.str).trim() !== "");
    const lines = [];
    items.forEach((i) => { const y = i.transform[5], l = lines.find((x) => Math.abs(x.y - y) < 3); if (l) l.it.push(i); else lines.push({ y, it: [i] }); });
    lines.sort((a, b) => b.y - a.y).forEach((l) => { out += l.it.sort((a, b) => a.transform[4] - b.transform[4]).map((i) => i.str.trim()).join(" ") + "\n"; });
  }
  return out;
}
// Del F.931 se toma el costo del empleador: remuneraciones + contribuciones patronales (no los aportes del empleado).
function ganParseF931(txt) {
  const mon = "([\\d.]+,\\d{2})", f = (re) => { const m = txt.match(re); return m ? num(m[1]) : null; };
  const per = txt.match(/\b(0[1-9]|1[0-2])\/(20\d{2})\b/), cuit = txt.match(/\b\d{2}-\d{8}-\d\b/);
  const rem1 = f(new RegExp("Suma de Rem\\.\\s*1:\\s*" + mon)), rem9 = f(new RegExp("Suma de Rem\\.\\s*9:\\s*" + mon));
  if (!per || rem1 === null || !/931/.test(txt)) return null;
  const ss = f(new RegExp("351\\s*-\\s*Contribuciones de Seguridad Social\\s+" + mon)), os = f(new RegExp("352\\s*-\\s*Contribuciones de Obra Social\\s+" + mon));
  const art = f(new RegExp("312\\s*-\\s*L\\.R\\.T\\.\\s+" + mon)), svo = f(new RegExp("028\\s*-\\s*Seguro Colectivo de Vida Obligatorio\\s+" + mon));
  return { mm: per[1], anio: Number(per[2]), cuit: cuit ? cuit[0] : "", rect: /Rect\. \(1\/9\):\s*[1-9]/.test(txt),
    rem: rem1, norem: Math.max(0, round2((rem9 === null ? rem1 : rem9) - rem1)), ss: ss || 0, os: os || 0, art: art || 0, svo: svo || 0 };
}
async function ganCargarF931Archivos(files) {
  const cid = state.ganCli, c = getClient(cid), ok = [], fallas = [];
  for (const file of Array.from(files)) {
    try {
      const d = ganParseF931(await ganLeerPdfTexto(file));
      if (!d) { fallas.push(file.name + " (no parece un F.931 de Declaración en línea)"); continue; }
      const dig = (x) => String(x || "").replace(/\D/g, "");
      if (c && dig(c.cuit) && dig(d.cuit) && dig(c.cuit) !== dig(d.cuit) && !(await appConfirm(`El CUIT del F.931 (${d.cuit}) no coincide con el de ${c.name} (${c.cuit}). ¿Cargarlo igual?`, { ok: "Cargar igual" }))) continue;
      GAN_F931_COLS.forEach(([k]) => ganSet(cid, d.anio, "f931." + d.mm + "." + k, fmtMoneyRaw(d[k])));
      ganSet(cid, d.anio, "f931src." + d.mm, "F.931 " + d.mm + "/" + d.anio + (d.rect ? " (rectificativa)" : ""));
      ok.push(d);
    } catch (e) { fallas.push(file.name + " (" + (e && e.message ? e.message : "error al leerlo") + ")"); }
  }
  if (ok.length) { state.ganAnio = ok[ok.length - 1].anio; render(); renderGanF931Modal(ok[ok.length - 1].mm); showToast(ok.length === 1 ? `F.931 ${ok[0].mm}/${ok[0].anio} cargado` : `${ok.length} F.931 cargados`); }
  if (fallas.length) alert("No se pudo leer:\n" + fallas.join("\n"));
}

function bpCalc(cid, anio) {

  BP_RUBROS.forEach(([k]) => { Object.keys(T).forEach((c) => { rub[k][c] = round2(rub[k][c]); T[c] += rub[k][c]; }); });
  Object.keys(T).forEach((c) => { T[c] = round2(T[c]); });

  Object.assign(v, { gravado, mni: Math.min(gravado, P.mni), mniFull: P.mni, base, impuesto, pagos, "obj.min": objMin, casaTot: round2(casaTot), casaExe: round2(casaExe), casaExc, casaN, sust: round2(sust), reibp, cump,
    saldoArca: round2(Math.max(0, impuesto - pagos)), saldoContrib: round2(Math.max(0, pagos - impuesto)), _det: det, _P: P });
  return v;
}

// ---- Copiar bienes del período anterior ----
function bpCopiarAnterior(cid, anio) {
  const prevP = bpParams(anio - 1);
  const out = bpItems(cid, anio - 1).filter((it) => it.sit !== "baja").map((it) => {
    const c = JSON.parse(JSON.stringify(it)), k = bpKind(c);
    c.id = bpNewId(); if (k === "inm" || k === "rod") c.metodo = bpMetodo(it);
    if (k === "din") { c.cant = ""; if (c.moneda !== "ARS") c.cot = ""; }
    else if (k === "cre") c.monto = "";
    else if (k === "tit") { c.pn = ""; if (c.tipo === "acc") c.cot = ""; }
    else if (k === "gen") { c.importe = ""; if (String(c.costo == null ? "" : c.costo).trim() !== "") c.amort = ""; }
    else if (k === "inm") {
      if (!(num(c.base17) > 0) && num(c.vfPrev) > 0 && prevP.coefPrev > 0) c.base17 = (Math.round(num(c.vfPrev) / prevP.coefPrev * 10000) / 10000).toString().replace(".", ",");
      if (c.metodo === "vfPrev" && num(c.base17) > 0) c.metodo = "base17";
      c.vfPrev = ""; c.vman = "";
    } else if (k === "rod") { c.amort = ""; c.dnrpa = ""; c.vman = ""; }
    return c;
  });
  bpData(cid, anio).items = out; persistExtras();

function recatCalcCliente(client, v) {
  const m = client.mono || {};
  const bienes = m.tipo === "bienes";
  const meses = [];
  for (let p = v.ini; p <= v.fin; p = addMonths(p, 1)) {
    const d = getDoc(client.id, p), raw = d && d.mono ? d.mono.facturacion : undefined;
    const cargado = raw !== undefined && raw !== null && String(raw).trim() !== "";
    meses.push({ period: p, cargado, valor: cargado ? num(raw) : 0 });
  }
  const rows = getExtras().monoEscala.rows;
  const permitidas = MONO_CATS.filter((c) => { const r = monoRow(c); return r && num(r.tope) > 0; });
  const catPara = (t) => permitidas.find((c) => t <= num(monoRow(c).tope)) || "EXCLUIDO";
  const total = round2(meses.reduce((s, x) => s + x.valor, 0));
  const cargados = meses.filter((x) => x.cargado).length;
  const hoy = todayPeriod();
  const rest = meses.filter((x) => x.period > hoy).length;
  const prom = cargados ? total / cargados : 0;
  const proy = round2(total + prom * rest);
  return { m, bienes, meses, permitidas, catPara, total, cargados, rest, prom: round2(prom), proy, catAct: m.categoria, catNew: catPara(total), catProy: catPara(proy) };
}
function recatDesglose(r, bienes) {

function recatSheetName(nombre, usados) {

function recatAlinear(ws, primeraIzq) {

  const filename = `Recategorización Monotributo ${recat}.xlsx`;
  if (state.downloads) {
    state.downloads.save({ filename, data: blob }).then(() => showToast("Excel descargado")).catch((err) => { if (err && err.code === "declined") return; showToast("No se pudo descargar el Excel"); });
  } else {
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename; a.click();
  }
  if (sinCat.length) showToast(sinCat.length + " cliente(s) sin categoría asignada: figuran en el Resumen, sin hoja.");
}

// ---- Hoja "Ventas x Actividad": la apertura de ventas por actividad del
// período (mismo contenido que el modal "Apertura de Otros Conceptos"). Los
// conceptos van en filas y las actividades en columnas (+ una columna TOTAL),
// así la hoja crece hacia abajo y no se estira a lo ancho. Sólo si el cliente
// tiene actividades de IVA cargadas.
function buildIvaActividadesSheet(wb, client, p, r) {
  const activities = client.iva.activities || [];
  if (!activities.length) return;
  const porActividad = (r.doc && r.doc.porActividad) || {};
  const nAct = activities.length;
  const NCOLS = nAct + 2; // concepto + una columna por actividad + TOTAL
  const colTotal = nAct + 1;
  const col = (c) => XLSX.utils.encode_col(c);
  const rows = [["Ventas por actividad — " + periodLabel(p) + " — " + client.name]];
  const merges = [{ s: { r: 0, c: 0 }, e: { r: 0, c: NCOLS - 1 } }];
  const formulas = new Map();
  rows.push([]);
  rows.push(["Concepto", ...activities.map((a) => (a.code ? a.code + " — " : "") + (a.desc || "")), "TOTAL"]);
  const headerRow = rows.length - 1;
  const g = (a, path) => num(getDeep(porActividad[a.code] || {}, path, 0));

  const secciones = [
    { titulo: "1. Ventas gravadas", filas: [
      ["R.I. y Monotributistas 10,5%", "debito.ri105"], ["Cons. Finales y Exentos 10,5%", "debito.cf105"],
      ["R.I. y Monotributistas 21%", "debito.ri21"], ["Cons. Finales y Exentos 21%", "debito.cf21"] ] },
    { titulo: "2. Ventas exentas o no gravadas", filas: [
      ["Ventas exentas o no gravadas", "exento"], ["N.C. de venta exentas / no gravadas", "exentoNC"] ] },
    { titulo: "3. N.C. emitidas (restitución de crédito fiscal)", filas: [
      ["N.C. a R.I. y Monotrib. 10,5%", "restCredito.ncEmit105RI"], ["N.C. a Cons. Finales y Exentos 10,5%", "restCredito.ncEmit105CF"],
      ["N.C. a R.I. y Monotrib. 21%", "restCredito.ncEmit21RI"], ["N.C. a Cons. Finales y Exentos 21%", "restCredito.ncEmit21CF"] ] },
  ];
  const filaRows = {}; // path -> índice de fila (0-based)
  const valores = {};  // path -> [valor por actividad]
  secciones.forEach((sec) => {
    rows.push([sec.titulo]);
    merges.push({ s: { r: rows.length - 1, c: 0 }, e: { r: rows.length - 1, c: NCOLS - 1 } });
    sec.filas.forEach(([label, path]) => {
      const R = rows.length;
      const vals = activities.map((a) => g(a, path));
      formulas.set(R + ":" + colTotal, `SUM(B${R + 1}:${col(nAct)}${R + 1})`);
      rows.push([label, ...vals, round2(vals.reduce((x, y) => x + y, 0))]);
      filaRows[path] = R; valores[path] = vals;
    });
  });

  // Ventas netas = gravadas - N.C. gravadas + exentas - N.C. exentas.
  const rg = (path) => filaRows[path] + 1; // fila en notación A1
  const R = rows.length;
  const gravIni = rg("debito.ri105"), gravFin = rg("debito.cf21");
  const ncIni = rg("restCredito.ncEmit105RI"), ncFin = rg("restCredito.ncEmit21CF");
  const netas = [];
  for (let c = 1; c <= colTotal; c++) {
    const L = col(c);
    formulas.set(R + ":" + c, `SUM(${L}${gravIni}:${L}${gravFin})-SUM(${L}${ncIni}:${L}${ncFin})+${L}${rg("exento")}-${L}${rg("exentoNC")}`);
    const sumPaths = (paths) => paths.reduce((s2, pth) => s2 + (c === colTotal ? valores[pth].reduce((x, y) => x + y, 0) : valores[pth][c - 1]), 0);
    netas.push(round2(
      sumPaths(["debito.ri105", "debito.cf105", "debito.ri21", "debito.cf21"])
      - sumPaths(["restCredito.ncEmit105RI", "restCredito.ncEmit105CF", "restCredito.ncEmit21RI", "restCredito.ncEmit21CF"])
      + sumPaths(["exento"]) - sumPaths(["exentoNC"])));
  }
  rows.push(["TOTAL VENTAS NETAS", ...netas]);

  // Fundamento legal de las ventas exentas, por actividad.
  const exMap = {};
  exencionesDelPeriodo(client, p).forEach((x) => { exMap[x.code] = x; });
  if (activities.some((a) => exMap[a.code])) {
    rows.push([]);
    rows.push(["Fundamento de las exenciones"]);
    merges.push({ s: { r: rows.length - 1, c: 0 }, e: { r: rows.length - 1, c: NCOLS - 1 } });
    rows.push(["Fundamento legal", ...activities.map((a) => { const x = exMap[a.code]; return x ? (x.key ? exencionLabel(x.key) : "Sin fundamento indicado") : "—"; }), ""]);
  }

  XLSX.utils.book_append_sheet(wb, newSheet(rows, {
    colWidths: [42, ...activities.map(() => 24), 20],
    merges, skipCols: [0], formulas, headerRows: [headerRow], freezeHeaderRow: headerRow + 1,
    wrapCols: Array.from({ length: NCOLS }, (_, i) => i),
  }), "Ventas x Actividad");
}

// ---- Hoja "F2083": resumen del Formulario 2083 del período (mismo
// contenido que el modal), para cotejar contra el Libro de IVA Digital.
function buildIvaF2083Sheet(wb, client, p, r) {
  const sumNeto = (arr) => round2(arr.reduce((s, b) => s + b.neto, 0));
  // Igual que el modal: para Ventas y Compras se toma el importe "s/Portal IVA"
  // (declarado) y, si no hay, el calculado.
  const sumPortal = (arr) => round2(arr.reduce((s, b) => s + (b.portal ? b.portal : b.calculado), 0));
  const rows = [["Formulario 2083 — " + periodLabel(p) + " — " + client.name]];
  const merges = [{ s: { r: 0, c: 0 }, e: { r: 0, c: 3 } }];
  const headerRows = [];
  const section = (titulo, impuestoLabel, filas) => {
    rows.push([]);
    rows.push([titulo]);
    merges.push({ s: { r: rows.length - 1, c: 0 }, e: { r: rows.length - 1, c: 3 } });
    rows.push(["Concepto", "Neto Gravado", "Exento o no Gravado", impuestoLabel]);
    headerRows.push(rows.length - 1);
    filas.forEach((f) => rows.push(f));
  };
  section("Ventas", "Débito Fiscal", [
    ["Operaciones de Venta", sumNeto(r.debitoBrackets), num(r.exento.ventas), sumPortal(r.debitoBrackets)],
    ["Notas de Crédito de Venta", sumNeto(r.restCreditoBrackets), num(r.exento.ncVentas), sumPortal(r.restCreditoBrackets)],
    ["Operaciones de Exportación (no se releva — completar a mano)", 0, 0, 0],
  ]);
  section("Compras", "Crédito Fiscal", [
    ["Operaciones de Compra", sumNeto(r.creditoBrackets), num(r.exento.compras), sumPortal(r.creditoBrackets)],
    ["Notas de Crédito de Compra", sumNeto(r.restDebitoBrackets), num(r.exento.ncCompras), sumPortal(r.restDebitoBrackets)],
  ]);
  rows.push([]);
  rows.push(["Operaciones que no generan Crédito Fiscal", "", "", num(r.exento.operacionesNoCredito)]);

  const exFund = exencionesDelPeriodo(client, p);
  if (exFund.length) {
    rows.push([]);
    rows.push(["Fundamento de lo exento o no gravado (por actividad)"]);
    merges.push({ s: { r: rows.length - 1, c: 0 }, e: { r: rows.length - 1, c: 3 } });
    rows.push(["Actividad", "Monto neto", "Fundamento legal", ""]);
    headerRows.push(rows.length - 1);
    merges.push({ s: { r: rows.length - 1, c: 2 }, e: { r: rows.length - 1, c: 3 } });
    exFund.forEach((x) => {
      rows.push([x.code + " — " + x.desc, x.monto, x.key ? exencionLabel(x.key) : "Sin fundamento indicado", ""]);
      merges.push({ s: { r: rows.length - 1, c: 2 }, e: { r: rows.length - 1, c: 3 } });
    });
  }

  const sheetName = "F2083";
  XLSX.utils.book_append_sheet(wb, newSheet(rows, {
    colWidths: [56, 20, 22, 20],
    merges, skipCols: [0], headerRows,
  }), sheetName);
}

function buildIvaSheets(wb, client) {
  const periods = listPeriodsWithTax(client.id, "iva");
  const decreto814Rate = num(client.iva.decreto814Rate) / 100;

  // ---- 1) Una hoja de detalle, con fórmulas, para el período que se está
  // viendo en el dashboard (no todo el historial — si no, se acumula un tab
  // nuevo por cada mes cargado alguna vez). La DDJJ de más abajo sí muestra
  // todos los períodos, para mantener el arrastre de saldos. ----
  const sheetMeta = {}; // period -> { sheetName, totalDebitoCell, totalCreditoCell, debitoOnlyRange, restCreditoRange }
  periods.filter((p) => p === state.currentPeriod).forEach((p) => {
    const r = calcIvaFor(client, p);
    const rows = [["IVA — " + periodLabel(p) + " — " + client.name]];
    const merges = [{ s: { r: 0, c: 0 }, e: { r: 0, c: 5 } }];
    const formulas = new Map();

    rows.push([]);
    rows.push(["DÉBITO FISCAL"]);
    merges.push({ s: { r: 2, c: 0 }, e: { r: 2, c: 5 } });
    rows.push(["Concepto", "Neto según libros", "Débito calculado", "Débito según portal ARCA", "Diferencia (portal - calculado)", "Alerta"]);
    const debitoHeaderRow = rows.length - 1;
    const pushBracket = (b, factor) => {
      const R = rows.length;
      const f = factor == null ? 1 : factor;
      formulas.set(R + ":2", f === 1 ? `B${R + 1}*${b.rate}` : `B${R + 1}*${b.rate}*${f}`);
      formulas.set(R + ":4", `D${R + 1}-C${R + 1}`);
      rows.push([b.label, b.neto, b.calculado, b.portal, b.diff, b.flagged ? "REVISAR" : ""]);
    };
    const debitoOnlyStart = rows.length;
    r.debitoBrackets.forEach((b) => pushBracket(b));
    const debitoOnlyEnd = rows.length - 1;
    r.restDebitoBrackets.forEach((b) => pushBracket(b));
    const debitoAllEnd = rows.length - 1;
    const totalDebitoRow = rows.length;
    formulas.set(totalDebitoRow + ":3", `SUM(D${debitoOnlyStart + 1}:D${debitoAllEnd + 1})`);
    rows.push(["TOTAL DÉBITO FISCAL (según portal)", "", "", r.debitoFiscal, "", ""]);

    rows.push([]);
    rows.push([r.prorrateoExentoEnabled ? `CRÉDITO FISCAL (compras con prorrateo ${fmtPctRaw(r.coefProrrateo * 100)}% aplicado)` : "CRÉDITO FISCAL"]);
    merges.push({ s: { r: rows.length - 1, c: 0 }, e: { r: rows.length - 1, c: 5 } });
    rows.push(["Concepto", "Neto según libros", "Crédito calculado", "Crédito según portal ARCA", "Diferencia (portal - calculado)", "Alerta"]);
    const creditoHeaderRow = rows.length - 1;
    const creditoOnlyStart = rows.length;
    r.creditoBrackets.forEach((b) => pushBracket(b, r.coefProrrateo));
    const creditoOnlyEnd = rows.length - 1;
    const restCreditoStart = rows.length;
    r.restCreditoBrackets.forEach((b) => pushBracket(b));
    const restCreditoEnd = rows.length - 1;
    const decreto814Row = rows.length;
    formulas.set(decreto814Row + ":2", r.f931Pagado ? `B${decreto814Row + 1}*${decreto814Rate}` : "0");
    rows.push(["Créd. Fiscal Decreto 814/01 (remuneraciones x tasa" + (r.f931Pagado ? "" : " — F.931 sin pagar, no se toma") + ")", r.remuneraciones, r.creditoDecreto814, "", "", ""]);
    let turIvaRow = null;
    if (r.turIvaEnabled) {
      turIvaRow = rows.length;
      rows.push(["Crédito Fiscal por TurIVA (cargado a mano)", "", r.creditoTurIva, "", "", ""]);
    }
    const totalCreditoRow = rows.length;
    formulas.set(totalCreditoRow + ":3", `SUM(D${creditoOnlyStart + 1}:D${restCreditoEnd + 1})+C${decreto814Row + 1}${turIvaRow != null ? `+C${turIvaRow + 1}` : ""}`);
    rows.push(["TOTAL CRÉDITO FISCAL (según portal)", "", "", r.creditoFiscal, "", ""]);

    // ---- Prorrateo del crédito fiscal (sólo si está activo en este período):
    // mismo contenido que el modal "⚡ Prorrateo" del dashboard. ----
    const headerRowsIdx = [debitoHeaderRow, creditoHeaderRow];
    const formats = new Map();
    if (r.prorrateoExentoEnabled) {
      const pm = (r.doc && r.doc.prorrateoManual) || {};
      const porAl = pm.porAlicuota || {};
      const coef = r.coefProrrateo;
      rows.push([]);
      rows.push(["PRORRATEO DE CRÉDITO FISCAL"]);
      merges.push({ s: { r: rows.length - 1, c: 0 }, e: { r: rows.length - 1, c: 5 } });
      rows.push(["Concepto", "Importe"]);
      headerRowsIdx.push(rows.length - 1);
      const gravR = rows.length;
      rows.push(["Ventas gravadas (netas de N.C.)", r.ventasNetasGravadas]);
      const exeR = rows.length;
      rows.push(["Ventas exentas o no gravadas (netas de N.C.)", r.ventasExentasNetas]);
      const totVR = rows.length;
      formulas.set(totVR + ":1", `B${gravR + 1}+B${exeR + 1}`);
      rows.push(["TOTAL VENTAS NETAS", round2(r.ventasNetasGravadas + r.ventasExentasNetas)]);
      const coefR = rows.length;
      formulas.set(coefR + ":1", `IF(B${totVR + 1}>0,B${gravR + 1}/B${totVR + 1},1)`);
      formats.set(coefR + ":1", "0.0000%");
      rows.push(["Coeficiente de prorrateo", coef]);
      const cfTotR = rows.length;
      rows.push(["CF total del período (cargado a mano)", num(pm.cfTotal)]);
      const cfCompR = rows.length;
      formulas.set(cfCompR + ":1", `ROUND(B${cfTotR + 1}*B${coefR + 1},2)`);
      rows.push(["CF computable (prorrateado)", round2(num(pm.cfTotal) * coef)]);
      const cfNoCompR = rows.length;
      formulas.set(cfNoCompR + ":1", `B${cfTotR + 1}-B${cfCompR + 1}`);
      rows.push(["CF no computable", round2(num(pm.cfTotal) - round2(num(pm.cfTotal) * coef))]);

      // Desglose por alícuota: sólo si se cargó algo en el modal.
      const hayDesglose = PRORRATEO_ALICUOTAS.some(({ key }) => num(porAl[key]) !== 0);
      if (hayDesglose) {
        rows.push([]);
        rows.push(["Alícuota", "CF original (total)", "CF prorrateado"]);
        headerRowsIdx.push(rows.length - 1);
        const alStart = rows.length;
        PRORRATEO_ALICUOTAS.forEach(({ key, rate }) => {
          const R = rows.length;
          formulas.set(R + ":2", `ROUND(B${R + 1}*$B$${coefR + 1},2)`);
          rows.push(["CF " + fmtPct(rate), num(porAl[key]), round2(num(porAl[key]) * coef)]);
        });
        const alEnd = rows.length - 1;
        const totAlR = rows.length;
        formulas.set(totAlR + ":1", `SUM(B${alStart + 1}:B${alEnd + 1})`);
        formulas.set(totAlR + ":2", `SUM(C${alStart + 1}:C${alEnd + 1})`);
        rows.push(["TOTAL CF por alícuota",
          round2(PRORRATEO_ALICUOTAS.reduce((s, { key }) => s + num(porAl[key]), 0)),
          round2(PRORRATEO_ALICUOTAS.reduce((s, { key }) => s + round2(num(porAl[key]) * coef), 0))]);
      }
    }

    const sheetName = "IVA";
    sheetMeta[p] = {
      sheetName,
      totalDebitoCell: [totalDebitoRow, 3],
      totalCreditoCell: [totalCreditoRow, 3],
      debitoOnlyRange: [debitoOnlyStart, debitoOnlyEnd],
      restCreditoRange: restCreditoEnd >= restCreditoStart ? [restCreditoStart, restCreditoEnd] : null,
    };
    XLSX.utils.book_append_sheet(wb, newSheet(rows, {
      colWidths: [50, 17, 17, 19, 19, 11],
      merges: merges.filter(Boolean),
      skipCols: [0, 5],
      formulas,
      freezeHeaderRow: 4,
      headerRows: headerRowsIdx,
      formats,
    }), sheetName);
    buildIvaActividadesSheet(wb, client, p, r);
    buildIvaF2083Sheet(wb, client, p, r);
  });

  // ---- 2) Hoja DDJJ: un bloque por período, con fórmulas que referencian
  // la hoja de detalle de ese período y (para los saldos que se arrastran)
  // el bloque del período anterior en esta misma hoja. ----
  const ddjj = [["Posición IVA — " + client.name]];
  const ddjjMerges = [{ s: { r: 0, c: 0 }, e: { r: 0, c: 1 } }];
  const ddjjFormulas = new Map();
  const ddjjHighlights = new Map();
  const ddjjBanners = new Map();
  ddjj.push([client.cuit ? "CUIT " + client.cuit : ""]);
  ddjj.push([]);

  // Orden de los bloques: el período que se está viendo va primero y
  // resaltado, y después el resto del más nuevo al más viejo. Cada bloque
  // ocupa siempre la misma cantidad de filas, así que se puede calcular de
  // antemano en qué fila queda cada período — las fórmulas de arrastre de
  // saldos apuntan al bloque del período anterior donde sea que esté.
  const BLOQUE_FILAS = 14, ENCABEZADO_FILAS = 3;
  const cronologico = periods.slice().sort();
  const visual = cronologico.slice().reverse();
  const actual = visual.indexOf(state.currentPeriod);
  if (actual > 0) visual.unshift(visual.splice(actual, 1)[0]);
  const inicioBloque = {};
  visual.forEach((p, i) => { inicioBloque[p] = ENCABEZADO_FILAS + i * BLOQUE_FILAS; });

  visual.forEach((p) => {
    const r = calcIvaFor(client, p);
    const meta = sheetMeta[p];
    const cIdx = cronologico.indexOf(p);
    const prevInicio = cIdx > 0 ? inicioBloque[cronologico[cIdx - 1]] : null;
    const esActual = p === state.currentPeriod && cronologico.length > 1;
    ddjj.push([periodLabel(p).toUpperCase() + (esActual ? " — PERÍODO ACTUAL" : "")]);
    ddjjMerges.push(sectionMerge(ddjj, 2));
    if (esActual) ddjjBanners.set(ddjj.length - 1, { bg: "FFE08A", fg: "5C3B00" });

    const debitoRow = ddjj.length;
    if (meta) ddjjFormulas.set(debitoRow + ":1", xsheetRef(meta.sheetName, ...meta.totalDebitoCell));
    ddjj.push(["IVA Débito Fiscal", r.debitoFiscal]);

    const creditoRow = ddjj.length;
    if (meta) ddjjFormulas.set(creditoRow + ":1", xsheetRef(meta.sheetName, ...meta.totalCreditoCell));
    ddjj.push(["IVA Crédito Fiscal", r.creditoFiscal]);

    const saldoTecAnteriorRow = ddjj.length;
    if (prevInicio != null) ddjjFormulas.set(saldoTecAnteriorRow + ":1", `B${prevInicio + 5 + 1}`); // "Saldo técnico a favor del contribuyente" del período anterior
    ddjj.push(["Saldo técnico a favor del contribuyente, período anterior", r.saldoTecnicoAnterior]);

    const saldoTecARCARow = ddjj.length;
    ddjjFormulas.set(saldoTecARCARow + ":1", `MAX(B${debitoRow + 1}-B${creditoRow + 1}-B${saldoTecAnteriorRow + 1},0)`);
    ddjj.push(["Saldo técnico a favor de ARCA", r.saldoTecnicoFavorARCA]);

    const saldoTecContribRow = ddjj.length;
    ddjjFormulas.set(saldoTecContribRow + ":1", `MAX(-(B${debitoRow + 1}-B${creditoRow + 1}-B${saldoTecAnteriorRow + 1}),0)`);
    ddjj.push(["Saldo técnico a favor del contribuyente", r.saldoTecnicoFavorContribuyente]);

    const libreDispAnteriorRow = ddjj.length;
    if (prevInicio != null) ddjjFormulas.set(libreDispAnteriorRow + ":1", `B${prevInicio + 10 + 1}`); // "Saldo de libre disponibilidad" del período anterior
    ddjj.push(["Saldo a favor de libre disponibilidad, período anterior", r.libreDispAnterior]);

    const montoUtilizadoRow = ddjj.length;
    ddjj.push(["Monto utilizado", r.montoUtilizado]);
    const retencionesRow = ddjj.length;
    ddjj.push(["Retenciones sufridas", r.retenciones]);
    const percepcionesRow = ddjj.length;
    ddjj.push(["Percepciones sufridas", r.percepciones]);

    const saldoLibreDispRow = ddjj.length;
    ddjjFormulas.set(saldoLibreDispRow + ":1",
      `IF(B${saldoTecARCARow + 1}<=0,MAX(B${libreDispAnteriorRow + 1}+B${percepcionesRow + 1}+B${retencionesRow + 1}-B${montoUtilizadoRow + 1},0),` +
      `MAX(-(B${saldoTecARCARow + 1}+B${montoUtilizadoRow + 1}-B${libreDispAnteriorRow + 1}-B${percepcionesRow + 1}-B${retencionesRow + 1}),0))`);
    ddjj.push(["Saldo de libre disponibilidad", r.saldoLibreDisponibilidad]);

    const saldoAPagarRow = ddjj.length;
    ddjjFormulas.set(saldoAPagarRow + ":1",
      `IF(B${saldoTecARCARow + 1}<=0,0,MAX(B${saldoTecARCARow + 1}+B${montoUtilizadoRow + 1}-B${libreDispAnteriorRow + 1}-B${percepcionesRow + 1}-B${retencionesRow + 1},0))`);
    ddjj.push(["Saldo a pagar", r.saldoAPagar]);
    // Se resalta el resultado real de la DDJJ: si queda saldo a pagar, esa
    // fila en rojo; si no (quedó a favor / de libre disponibilidad), la fila
    // de "Saldo de libre disponibilidad" en verde.
    if (r.saldoAPagar > 0) ddjjHighlights.set(saldoAPagarRow, { bg: "FBE1DE", fg: "C0392B" });
    else ddjjHighlights.set(saldoLibreDispRow, { bg: "DDF2E6", fg: "146C43" });

    ddjj.push([]);
    ddjj.push([]); // doble salto entre un período y el siguiente, para que el cambio de mes se note de un vistazo
    if (ddjj.length !== inicioBloque[p] + BLOQUE_FILAS) throw new Error("Posición IVA: el bloque de " + p + " no ocupa " + BLOQUE_FILAS + " filas");
  });

  XLSX.utils.book_append_sheet(wb, newSheet(ddjj, {
    colWidths: [52, 22],
    merges: ddjjMerges.filter(Boolean),
    skipCols: [],
    formulas: ddjjFormulas,
    highlightRows: ddjjHighlights,
    highlightBanners: ddjjBanners,
  }), "Posición IVA");
}

function buildIibbLocalSheet(wb, client) {
  const periods = listPeriodsWithTax(client.id, "iibbLocal");
  const title = client.iibbLocal.jurisdiccion || "IIBB Local (jurisdicción sin cargar)";
  const activities = client.iibbLocal.activities || [];
  // IIBB Local: orden cronológico (Enero → último período); el período
  // actual sólo se marca en dorado.
  const ordenVisual = periods.slice().sort();
  const resaltarActual = periods.length > 1 && periods.includes(state.currentPeriod);

  // ---- 1) Hoja de actividades: Base (dato cargado) x Alícuota (=Base x
  // alícuota) por actividad, con los totales de cada período. ----
  const actMeta = {}; // period -> { totalBaseCell:[r,c], totalImpuestoCell:[r,c] }
  if (activities.length) {
    const actRows = [["Ventas netas por actividad — " + title + " — " + client.name]];
    const actMerges = [{ s: { r: 0, c: 0 }, e: { r: 0, c: 1 + activities.length * 2 + 1 } }];
    const actFormulas = new Map();
    actRows.push([]);
    const header = ["Período"];
    activities.forEach((a) => header.push(`${a.code} — ${a.desc} — Ventas netas`, ((a.alicHist || []).length || alicTramosVig(client.iibbLocal.jurisdiccion, a.code)) ? `${a.code} — Impuesto` : `${a.code} — Impuesto (${fmtPctRaw(a.alicuota)}%)`));
    header.push("TOTAL Base", "TOTAL Impuesto");
    actRows.push(header);
    const actHeaderRow = actRows.length - 1;
    const actDataStart = actRows.length;
    const actHighlights = new Map();
    ordenVisual.forEach((p) => {
      const doc = getDoc(client.id, p);
      const actData = (doc && doc.iibbLocal && doc.iibbLocal.actividades) || {};
      const R = actRows.length;
      const row = [periodLabel(p)];
      const baseCols = [], impCols = [];
      activities.forEach((a, i) => {
        const baseCol = 1 + i * 2, impCol = 2 + i * 2;
        baseCols.push(baseCol); impCols.push(impCol);
        const baseVal = num(actData[a.code]);
        const alicP = alicLocal(a, p, client) / 100;
        const impVal = round2(baseVal * alicP);
        actFormulas.set(R + ":" + impCol, `${XLSX.utils.encode_col(baseCol)}${R + 1}*${alicP}`);
        row.push(baseVal, impVal);
      });
      const totalBaseCol = 1 + activities.length * 2, totalImpCol = 2 + activities.length * 2;
      actFormulas.set(R + ":" + totalBaseCol, `SUM(${baseCols.map((c) => XLSX.utils.encode_col(c) + (R + 1)).join(",")})`);
      actFormulas.set(R + ":" + totalImpCol, `SUM(${impCols.map((c) => XLSX.utils.encode_col(c) + (R + 1)).join(",")})`);
      const totalBase = round2(baseCols.reduce((s, c, i) => s + num(actData[activities[i].code]), 0));
      const totalImp = round2(impCols.reduce((s, c, i) => s + round2(num(actData[activities[i].code]) * (alicLocal(activities[i], p, client) / 100)), 0));
      row.push(totalBase, totalImp);
      actMeta[p] = { totalBaseCell: [R, totalBaseCol], totalImpuestoCell: [R, totalImpCol] };
      if (resaltarActual && p === state.currentPeriod) actHighlights.set(R, COLOR_ACTUAL);
      actRows.push(row);
    });
    // Fila de totales acumulados (suma de cada columna a lo largo de todos
    // los períodos cargados), para ver de un vistazo cuánto lleva cada
    // actividad en lo que va del ejercicio.
    if (periods.length) {
      const actDataEnd = actRows.length - 1;
      const numDataCols = 2 * activities.length + 2;
      const totalRow = ["TOTAL"];
      for (let c = 1; c <= numDataCols; c++) {
        let sum = 0;
        for (let R2 = actDataStart; R2 <= actDataEnd; R2++) sum += num(actRows[R2][c]);
        totalRow.push(round2(sum));
        actFormulas.set(actRows.length + ":" + c, `SUM(${XLSX.utils.encode_col(c)}${actDataStart + 1}:${XLSX.utils.encode_col(c)}${actDataEnd + 1})`);
      }
      actRows.push(totalRow);
    }
    XLSX.utils.book_append_sheet(wb, newSheet(actRows, {
      colWidths: [14, ...activities.flatMap(() => [20, 20]), 16, 16],
      merges: actMerges.filter(Boolean),
      skipCols: [0],
      formulas: actFormulas,
      headerRows: [actHeaderRow],
      highlightRows: actHighlights,
    }), "IIBB Local Activ.");
  }

  // ---- 2) Hoja principal: Base e Impuesto referencian los totales de la
  // hoja de actividades; el saldo a favor arrastra al período siguiente. ----
  const rows = [[title + " — " + client.name]];
  const merges = [{ s: { r: 0, c: 0 }, e: { r: 0, c: 8 } }];
  rows.push([]);
  rows.push(["Período", "Ventas netas (según libros)", "Alícuota efectiva", "Impuesto (calculado)", "Retenciones (sistema)", "Percepciones (sistema)", "Rec. bancarias (sistema)", "Saldo período anterior", "Saldo a pagar / (a favor)"]);
  const mainHeaderRow = rows.length - 1;
  const formats = new Map();
  const formulas = new Map();
  const sheetName = "DDJJ IIBB Local";
  const actSheetName = "IIBB Local Activ.";
  const mainStart = rows.length;
  const filaDe = {};
  ordenVisual.forEach((p, i) => { filaDe[p] = mainStart + i; });
  const mainHighlights = new Map();
  const mainCellColors = new Map(); // "Saldo a pagar / (a favor)": rojo si debe, verde si queda a favor
  ordenVisual.forEach((p) => {
    const cIdx = periods.indexOf(p);
    const prevSaldoCell = cIdx > 0 ? filaDe[periods[cIdx - 1]] : null; // fila del período anterior (cronológico), esté donde esté
    const r = calcIibbLocalFor(client, p);
    const alicuotaEfectiva = r.baseImponible ? Math.round((r.impuesto / r.baseImponible) * 10000) / 10000 : 0;
    const R = rows.length;
    formats.set(R + ":2", "0.00%");
    if (actMeta[p]) {
      formulas.set(R + ":1", xsheetRef(actSheetName, ...actMeta[p].totalBaseCell));
      formulas.set(R + ":3", xsheetRef(actSheetName, ...actMeta[p].totalImpuestoCell));
    }
    formulas.set(R + ":2", `IF(B${R + 1}=0,0,D${R + 1}/B${R + 1})`);
    if (prevSaldoCell != null) formulas.set(R + ":7", `MAX(-I${prevSaldoCell + 1},0)`);
    formulas.set(R + ":8", `D${R + 1}-E${R + 1}-F${R + 1}-G${R + 1}-H${R + 1}`);
    rows.push([periodLabel(p), r.baseImponible, alicuotaEfectiva, r.impuesto, r.retenciones, r.percepciones, r.recaudacionesBancarias, r.saldoAnterior, r.saldoAPagar > 0 ? r.saldoAPagar : -r.saldoAFavor]);
    if (resaltarActual && p === state.currentPeriod) mainHighlights.set(R, COLOR_ACTUAL);
    if (r.saldoAPagar > 0) mainCellColors.set(R + ":8", { bg: "FBE1DE", fg: "C0392B" });
    else if (r.saldoAFavor > 0) mainCellColors.set(R + ":8", { bg: "DDF2E6", fg: "146C43" });
  });
  // Fila de TOTAL (acumulado del ejercicio). La alícuota efectiva, el saldo
  // del período anterior y el saldo a pagar / (a favor) no se suman: cada mes ya arrastra el saldo
  // del anterior, así que sumarlos contaría dos veces lo mismo.
  if (periods.length) {
    const dataRows = rows.slice(mainStart);
    const tR = rows.length;
    const sumCol = (c) => round2(dataRows.reduce((acc, row) => acc + num(row[c]), 0));
    [1, 3, 4, 5, 6].forEach((c) => {
      const L = XLSX.utils.encode_col(c);
      formulas.set(tR + ":" + c, `SUM(${L}${mainStart + 1}:${L}${tR})`);
    });
    // La alícuota efectiva no se totaliza (no tiene sentido sumarla).
    rows.push(["TOTAL", sumCol(1), "", sumCol(3), sumCol(4), sumCol(5), sumCol(6), "", ""]);
  }
  XLSX.utils.book_append_sheet(wb, newSheet(rows, {
    colWidths: [14, 22, 12, 18, 16, 16, 18, 18, 20],
    merges: merges.filter(Boolean),
    skipCols: [0],
    formats,
    formulas,
    freezeHeaderRow: 3,
    headerRows: [mainHeaderRow],
    highlightRows: mainHighlights,
    highlightCells: mainCellColors,
  }), sheetName);
}

function buildIibbCMSheets(wb, client) {
  const periods = listPeriodsWithTax(client.id, "iibbCM");
  const ordenVisual = periodosOrdenVisual(periods);
  const resaltarActual = periods.length > 1 && periods.includes(state.currentPeriod);
  const etiquetaPeriodo = (p) => periodLabel(p).toUpperCase() + (resaltarActual && p === state.currentPeriod ? " — PERÍODO ACTUAL" : "");
  const jurisdictions = sortedJurisdictions(client.iibbCM.jurisdictions);
  const activities = client.iibbCM.activities || [];
  // "Actividades" y "Coeficientes" eran dos hojas separadas; se unifican acá
  // en una sola ("Base y Coeficientes CM") porque son los dos insumos que
  // alimentan el Detalle, uno debajo del otro.
  const baseSheetName = "Base y Coeficientes CM";

  const rows = [];
  const merges = [];
  const formats = new Map();
  const formulas = new Map();
  const headerRows = [];

  // ---- 1) Actividades: monto imponible nacional (dato cargado), por
  // período y actividad. ----
  const actCell = {}; // period -> { [code]: [row,col] }
  rows.push(["Monto imponible nacional por actividad (según libros) — " + client.name]);
  merges.push({ s: { r: 0, c: 0 }, e: { r: 0, c: activities.length + 1 } });
  rows.push([]);
  rows.push(["Período", ...activities.map((a) => `${a.code} — ${a.desc}`), "TOTAL"]);
  headerRows.push(rows.length - 1);
  const cmActDataStart = rows.length;
  const baseHighlights = new Map();
  // Esta hoja va en orden cronológico puro (Enero → último período); el
  // período actual sólo se marca en dorado.
  periods.forEach((p) => {
    const doc = getDoc(client.id, p);
    const acts = (doc && doc.iibbCM && doc.iibbCM.actividades) || {};
    const R = rows.length;
    actCell[p] = {};
    const vals = activities.map((a, i) => { actCell[p][a.code] = [R, 1 + i]; return num(acts[a.code]); });
    const totalCol = 1 + activities.length;
    formulas.set(R + ":" + totalCol, `SUM(${XLSX.utils.encode_col(1)}${R + 1}:${XLSX.utils.encode_col(totalCol - 1)}${R + 1})`);
    if (resaltarActual && p === state.currentPeriod) baseHighlights.set(R, COLOR_ACTUAL);
    rows.push([periodLabel(p), ...vals, vals.reduce((s, v) => s + v, 0)]);
  });
  // Fila de totales acumulados por actividad (y el gran total), sumando
  // todos los períodos cargados.
  if (periods.length) {
    const cmActDataEnd = rows.length - 1;
    const numDataCols = activities.length + 1;
    const totalRow = ["TOTAL"];
    for (let c = 1; c <= numDataCols; c++) {
      let sum = 0;
      for (let R2 = cmActDataStart; R2 <= cmActDataEnd; R2++) sum += num(rows[R2][c]);
      totalRow.push(round2(sum));
      formulas.set(rows.length + ":" + c, `SUM(${XLSX.utils.encode_col(c)}${cmActDataStart + 1}:${XLSX.utils.encode_col(c)}${cmActDataEnd + 1})`);
    }
    rows.push(totalRow);
  }

  // ---- 2) Coeficientes: se guarda el valor de cada vigencia y se recuerda
  // en qué celda quedó cada jurisdicción, para poder referenciarla desde el
  // detalle. Va debajo de "Actividades", separado por un salto de dos
  // filas para que se note el corte entre ambas secciones. ----
  rows.push([]);
  rows.push([]);
  const coefCell = {}; // "desde|jurName" -> [row,col]
  // El título va fusionado con el mismo ancho que el de "Actividades" (no
  // sólo 2 columnas) para que la banda de color cubra todo el texto y las
  // dos secciones queden con el mismo diseño.
  const coefTitleEndCol = Math.max(activities.length + 1, 1);
  rows.push(["Coeficientes de distribución por jurisdicción — " + client.name]);
  const coefTitleRow = rows.length - 1;
  merges.push({ s: { r: coefTitleRow, c: 0 }, e: { r: coefTitleRow, c: coefTitleEndCol } });
  (client.iibbCM.coeficientes || []).slice().sort((a, b) => a.desde.localeCompare(b.desde)).forEach((v) => {
    rows.push([]);
    rows.push([`Coeficiente vigente desde ${periodLabel(v.desde)}`]);
    merges.push({ s: { r: rows.length - 1, c: 0 }, e: { r: rows.length - 1, c: coefTitleEndCol } });
    rows.push(["Jurisdicción", "Coeficiente"]);
    headerRows.push(rows.length - 1);
    jurisdictions.forEach((j) => {
      const R = rows.length;
      formats.set(R + ":1", "0.00%");
      coefCell[v.desde + "|" + j.name] = [R, 1];
      rows.push([j.name, num(v.valores[j.name]) / 100]);
    });
  });

  XLSX.utils.book_append_sheet(wb, newSheet(rows, {
    colWidths: [22, ...activities.map(() => 22), 18],
    merges: merges.filter(Boolean),
    skipCols: [0],
    formats,
    formulas,
    headerRows,
    highlightRows: baseHighlights,
    // Mismo violeta oscuro + texto blanco que el título de la hoja (fila 0),
    // para que "Coeficientes..." se vea igual que "Monto imponible...".
    mainTitleRows: new Set([coefTitleRow]),
  }), baseSheetName);

  // ---- 3) Detalle: una fila por jurisdicción x actividad, agrupadas por
  // período (con un renglón banner al cambiar de mes, para que se note el
  // corte en vez de tener que buscarlo en la columna "Período"), con la
  // fórmula Base = Ventas de la actividad x Coeficiente de la jurisdicción +
  // Ajuste, e Impuesto = Base x Alícuota. Acá se ve de dónde sale cada
  // importe que en "Liquidacion" aparece ya sumado. ----
  const detRows = [["Detalle por jurisdicción y actividad — " + client.name]];
  const detMerges = [sectionMerge(detRows, 8)];
  const detFormulas = new Map();
  detRows.push([]);
  const detHeaderRows = [];
  const detDividers = [];
  const detBanners = new Map();
  const detMeta = {}; // period -> { [jurName]: {start,end} }
  ordenVisual.forEach((p, pIdx) => {
    const doc = getDoc(client.id, p);
    const coefVigencia = getCoefVigencia(client, p);
    detMeta[p] = {};
    if (pIdx > 0) { detRows.push([]); detRows.push([]); } // doble salto entre un mes y el siguiente
    detRows.push([etiquetaPeriodo(p)]);
    detMerges.push(sectionMerge(detRows, 8));
    if (resaltarActual && p === state.currentPeriod) detBanners.set(detRows.length - 1, COLOR_ACTUAL);
    detRows.push(["Jurisdicción", "Actividad", "Ventas nacionales (actividad)", "Coeficiente", "Ajuste", "Base (Ventas x Coef + Ajuste)", "Alícuota", "Impuesto"]);
    detHeaderRows.push(detRows.length - 1);
    let firstJurInPeriod = true;
    jurisdictions.forEach((j) => {
      const jdoc = (doc && doc.iibbCM && doc.iibbCM.jurisdicciones && doc.iibbCM.jurisdicciones[j.name]) || { ajustes: {} };
      const start = detRows.length;
      if (!firstJurInPeriod) detDividers.push(start);
      firstJurInPeriod = false;
      activities.forEach((a) => {
        const R = detRows.length;
        const montoNacional = num((doc && doc.iibbCM && doc.iibbCM.actividades && doc.iibbCM.actividades[a.code]));
        const ajuste = num(jdoc.ajustes && jdoc.ajustes[a.code]);
        const coefGeneral = coefVigencia ? num(coefVigencia.valores[j.name]) / 100 : 0;
        const attrib = getActivityAttribution(a, j.name, coefGeneral);
        const alicuota = alicCM(client, j.name, a.code, p) / 100;
        const base = round2(montoNacional * attrib + ajuste);
        const impuesto = round2(base * alicuota);
        if (actCell[p] && actCell[p][a.code]) detFormulas.set(R + ":2", xsheetRef(baseSheetName, ...actCell[p][a.code]));
        // El link a la sección "Coeficientes" sólo aplica a Art. 2 (general)
        // — las actividades con reparto propio (especial/Art. 14) llevan acá
        // directamente su % fijo, sin depender de esa sección.
        if (!a.regimen && coefVigencia && coefCell[coefVigencia.desde + "|" + j.name]) detFormulas.set(R + ":3", xsheetRef(baseSheetName, ...coefCell[coefVigencia.desde + "|" + j.name]));
        detFormulas.set(R + ":5", `C${R + 1}*D${R + 1}+E${R + 1}`);
        detFormulas.set(R + ":7", `F${R + 1}*G${R + 1}`);
        const regimenTag = a.regimen === "especial" ? " [Especial]" : a.regimen === "art14" ? " [Art.14]" : "";
        detRows.push([j.name, `${a.code} — ${a.desc}${regimenTag}`, montoNacional, attrib, ajuste, base, alicuota, impuesto]);
      });
      const end = detRows.length - 1;
      detMeta[p][j.name] = { start, end };
    });
  });
  XLSX.utils.book_append_sheet(wb, newSheet(detRows, {
    colWidths: [20, 40, 20, 12, 14, 20, 10, 16],
    merges: detMerges.filter(Boolean),
    skipCols: [0, 1],
    formulas: detFormulas,
    headerRows: detHeaderRows,
    innerDividerRows: detDividers,
    highlightBanners: detBanners,
    wrapCols: [0, 1],
  }), "Detalle CM");

  // ---- 4) Liquidación: una fila por jurisdicción y período, con Base e
  // Impuesto sumados desde "CM Detalle" y el saldo a favor arrastrado desde
  // el período anterior de la misma jurisdicción en esta misma hoja. ----
  const liqRows = [["Liquidación por jurisdicción y período — " + client.name]];
  const liqMerges = [sectionMerge(liqRows, 9)];
  const liqFormulas = new Map();
  const liqHeaderRows = [];
  const liqHighlights = new Map();
  const liqBanners = new Map();
  const filaJur = {}; // period -> { jurName: fila } (para el arrastre del saldo a favor, que va al período anterior esté donde esté)
  const pendientes = [];
  ordenVisual.forEach((p, pIdx) => {
    const r = calcIibbCMFor(client, p);
    liqRows.push([]);
    if (pIdx > 0) liqRows.push([]); // doble salto entre un período y el siguiente
    liqRows.push([etiquetaPeriodo(p)]);
    liqMerges.push({ s: { r: liqRows.length - 1, c: 0 }, e: { r: liqRows.length - 1, c: 8 } });
    if (resaltarActual && p === state.currentPeriod) liqBanners.set(liqRows.length - 1, COLOR_ACTUAL);
    filaJur[p] = {};
    liqRows.push(["Jurisdicción", "Base imponible (calculada)", "Impuesto anticipo (calculado)", "Retenciones (sistema)", "Percepciones (sistema)", "Rec. bancarias (sistema)", "Saldo período anterior", "A pagar", "A favor"]);
    liqHeaderRows.push(liqRows.length - 1);
    const periodJurRows = [];
    r.jurRows.forEach((j) => {
      const R = liqRows.length;
      const meta = detMeta[p] && detMeta[p][j.jurisdiccion];
      if (meta) {
        liqFormulas.set(R + ":1", `SUM('Detalle CM'!F${meta.start + 1}:F${meta.end + 1})`);
        liqFormulas.set(R + ":2", `SUM('Detalle CM'!H${meta.start + 1}:H${meta.end + 1})`);
      }
      pendientes.push({ R, jur: j.jurisdiccion, p });
      filaJur[p][j.jurisdiccion] = R;
      liqFormulas.set(R + ":7", `MAX(C${R + 1}-D${R + 1}-E${R + 1}-F${R + 1}-G${R + 1},0)`);
      liqFormulas.set(R + ":8", `MAX(-(C${R + 1}-D${R + 1}-E${R + 1}-F${R + 1}-G${R + 1}),0)`);
      liqRows.push([j.jurisdiccion, j.baseTotal, j.impuestoAnticipo, j.ret, j.perc, j.recban, j.saldoAnterior, j.aPagar, j.aFavor]);
      // "A pagar"/"A favor" con recuadro de color, como un formato
      // condicional: rojo si esa jurisdicción debe, verde si le queda a favor.
      if (j.aPagar > 0) liqHighlights.set(R + ":7", { bg: "FBE1DE", fg: "C0392B" });
      else if (j.aFavor > 0) liqHighlights.set(R + ":8", { bg: "DDF2E6", fg: "146C43" });
      periodJurRows.push(R);
    });
    const totalRow = liqRows.length;
    if (periodJurRows.length) {
      [1, 2, 3, 4, 5, 6, 7, 8].forEach((col) => {
        const colL = XLSX.utils.encode_col(col);
        liqFormulas.set(totalRow + ":" + col, `SUM(${periodJurRows.map((rr) => colL + (rr + 1)).join(",")})`);
      });
    }
    liqRows.push(["TOTALES", r.totales.baseTotal, r.totales.impuestoAnticipo, r.totales.ret, r.totales.perc, r.totales.recban, r.totales.saldoAnterior, r.totales.aPagar, r.totales.aFavor]);
  });
  // Saldo del período anterior: el "A favor" de la última vez (cronológica)
  // que esa jurisdicción apareció antes de este período.
  pendientes.forEach(({ R, jur, p }) => {
    for (let k = periods.indexOf(p) - 1; k >= 0; k--) {
      const rr = filaJur[periods[k]] && filaJur[periods[k]][jur];
      if (rr != null) { liqFormulas.set(R + ":6", `I${rr + 1}`); break; }
    }
  });
  XLSX.utils.book_append_sheet(wb, newSheet(liqRows, {
    colWidths: [22, 20, 20, 16, 16, 16, 18, 14, 14],
    merges: liqMerges.filter(Boolean),
    skipCols: [0],
    formulas: liqFormulas,
    headerRows: liqHeaderRows,
    highlightCells: liqHighlights,
    highlightBanners: liqBanners,
  }), "Liquidación CM");
}

// Arranque
// ---------------------------------------------------------------------
initApp();

</script>
