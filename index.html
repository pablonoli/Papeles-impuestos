<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Papeles de Trabajo Fiscales</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#150f28">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#f7f7fb;
    --surface:#ffffff;
    --surface-2:#faf9fc;
    --surface-3:#f0eef6;
    --ink:#1e1b2e;
    --muted:#7a7488;
    --muted-soft:#9891a8;
    --border:#ecebf2;
    --accent:#6d28d9;
    --accent-strong:#5b21b6;
    --accent-ink:#ffffff;
    --accent-soft:#f3effc;
    --favor:#16794f;
    --favor-soft:#e7f7ef;
    --pagar:#c0392b;
    --pagar-soft:#fdecea;
    --diff:#a3690f;
    --diff-soft:#fbedd4;
    --shadow:rgba(30,20,60,.10);
    --focus:#6d28d9;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#151220;
      --surface:#1c1830;
      --surface-2:#221d3a;
      --surface-3:#2c2547;
      --ink:#ece9f5;
      --muted:#a79fc0;
      --muted-soft:#7c749a;
      --border:#332c50;
      --accent:#b794f6;
      --accent-strong:#d6bcfa;
      --accent-ink:#1e1533;
      --accent-soft:#2a2247;
      --favor:#5ecb92;
      --favor-soft:#1a3324;
      --pagar:#e6837a;
      --pagar-soft:#3b1f1d;
      --diff:#e6b565;
      --diff-soft:#3c2f15;
      --shadow:rgba(0,0,0,.4);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#151220;
    --surface:#1c1830;
    --surface-2:#221d3a;
    --surface-3:#2c2547;
    --ink:#ece9f5;
    --muted:#a79fc0;
    --muted-soft:#7c749a;
    --border:#332c50;
    --accent:#b794f6;
    --accent-strong:#d6bcfa;
    --accent-ink:#1e1533;
    --accent-soft:#2a2247;
    --favor:#5ecb92;
    --favor-soft:#1a3324;
    --pagar:#e6837a;
    --pagar-soft:#3b1f1d;
    --diff:#e6b565;
    --diff-soft:#3c2f15;
    --shadow:rgba(0,0,0,.4);
    color-scheme: dark;
  }

  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Public Sans', system-ui, sans-serif;
    font-size:14px;
    line-height:1.45;
  }
  ::selection{ background:var(--accent-soft); }
  h1,h2,h3{ font-family:'Public Sans', system-ui, sans-serif; font-weight:700; text-wrap:balance; margin:0; }
  .mono, .num, input[type=number], td.num, th.num { font-family:'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  button{ font-family:inherit; cursor:pointer; }
  a{ color:var(--accent); }
  input, select{ font-family:inherit; font-size:13px; color:var(--ink); background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:5px 8px; }
  input:focus, select:focus, button:focus-visible{ outline:2px solid var(--focus); outline-offset:1px; }
  label{ font-size:12px; color:var(--muted); }

  .app{ display:flex; min-height:100vh; align-items:stretch; }
  .sidebar{
    width:272px; flex-shrink:0; background:var(--surface-2); border-right:1px solid var(--border);
    padding:20px 16px 24px; display:flex; flex-direction:column; gap:22px; position:sticky; top:0; align-self:flex-start; height:100vh; overflow-y:auto;
  }
  .brand{ display:flex; align-items:flex-start; justify-content:space-between; gap:8px; padding:0 4px; }
  .brand .mark{ font-size:19px; letter-spacing:.01em; }
  .brand .tag{ font-size:11.5px; color:var(--muted); letter-spacing:.03em; text-transform:uppercase; }
  .brand-actions{ display:flex; align-items:center; gap:6px; flex-shrink:0; padding-top:2px; }
  .icon-btn-ghost{
    width:26px; height:26px; min-width:26px; border-radius:7px; background:var(--surface); border:1px solid var(--border);
    color:var(--ink); display:flex; align-items:center; justify-content:center; font-size:13px; line-height:1; cursor:pointer; flex-shrink:0;
  }
  .icon-btn-ghost:hover{ background:var(--surface-3); }

  .side-section{ display:flex; flex-direction:column; gap:8px; }
  .side-label{ font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted-soft); padding:0 4px; display:flex; justify-content:space-between; align-items:center; }
  .side-toggle{ width:100%; background:none; border:none; cursor:pointer; font:inherit; font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted-soft); padding:4px; border-radius:6px; }
  .side-toggle:hover{ color:var(--ink); background:var(--surface-2); }
  .side-label-row{ display:flex; align-items:center; gap:8px; }
  .side-label-row .side-label{ flex:1; }
  .icon-btn-sm{ width:22px; height:22px; min-width:22px; border-radius:6px; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-size:15px; line-height:1; border:none; cursor:pointer; flex-shrink:0; }
  .icon-btn-sm:hover{ opacity:.85; }
  .client-search{ width:100%; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:7px 10px; font-size:12.5px; color:var(--ink); font-family:inherit; }
  .client-list{ display:flex; flex-direction:column; gap:4px; }
  .client-item{
    display:flex; flex-direction:column; gap:4px; text-align:left; background:transparent; border:1px solid transparent;
    border-radius:12px; padding:9px 10px; color:var(--ink);
  }
  .client-item:hover{ background:var(--surface-3); }
  .client-item.active{ background:var(--surface); border-color:var(--border); box-shadow:0 1px 2px var(--shadow); }
  .client-item .name{ font-weight:600; font-size:13.5px; }
  .client-item .cuit{ font-size:11px; color:var(--muted); }
  .tax-chips{ display:flex; gap:5px; flex-wrap:wrap; margin-top:2px; }
  .chip{ font-size:10px; padding:2px 6px; border-radius:99px; background:var(--surface-3); color:var(--muted); letter-spacing:.02em; }
  .chip.on{ background:var(--accent-soft); color:var(--accent-strong); font-weight:600; }

  .btn{ border:1px solid var(--border); background:var(--surface); color:var(--ink); border-radius:10px; padding:7px 12px; font-size:12.5px; font-weight:600; display:inline-flex; align-items:center; gap:6px; }
  .btn:hover{ background:var(--surface-3); }
  .btn-accent{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); box-shadow:0 2px 8px rgba(109,40,217,.28); }
  .btn-accent:hover{ background:var(--accent-strong); border-color:var(--accent-strong); }
  .btn-ghost{ background:transparent; border-color:transparent; padding:6px 8px; }
  .btn-ghost:hover{ background:var(--surface-3); }
  .btn-sm{ padding:4px 9px; font-size:11.5px; }
  .btn-block{ width:100%; justify-content:center; }
  .btn-danger{ color:var(--pagar); }

  .main{ flex:1; min-width:0; padding:26px 34px 60px; display:flex; flex-direction:column; gap:20px; }
  .topbar{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; }
  .client-title{ display:flex; flex-direction:column; gap:3px; flex:1 1 240px; min-width:0; }
  .client-title h1{ font-size:26px; }
  .client-title .meta{ font-size:12.5px; color:var(--muted); display:flex; gap:10px; flex-wrap:wrap; }
  .topbar-actions{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; flex:0 0 auto; max-width:100%; }

  .period-nav{ display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--border); border-radius:99px; padding:5px 6px; }
  .period-nav .label{ font-family:'IBM Plex Mono', monospace; font-size:13px; min-width:118px; text-align:center; text-transform:capitalize; }
  .period-nav button{ background:transparent; border:none; color:var(--ink); font-size:15px; padding:2px 8px; border-radius:5px; }
  .period-nav button:hover{ background:var(--surface-3); }
  .period-nav button:disabled{ opacity:.3; cursor:default; }
  .period-nav button:disabled:hover{ background:transparent; }

  /* Ganancias */
  .gan-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(460px,1fr)); gap:16px; align-items:start; }
  .gan-t, .gan-m{ width:100%; border-collapse:collapse; min-width:0; }
  .gan-t td, .gan-t th{ white-space:normal; }
  .gan-t td:first-child, .gan-t th:first-child{ position:static; text-align:left; }
  .gan-t td:first-child{ background:transparent; }
  .gan-t tr.tot > td:first-child{ background:var(--surface-2); }
  .gan-t td.num{ white-space:nowrap; }
  .gan-t td, .gan-t th{ padding:7px 12px; border-bottom:1px solid var(--border); font-size:13px; vertical-align:middle; }
  .gan-t th{ font-size:11.5px; color:var(--muted); text-align:right; font-weight:600; }
  .gan-t td.num{ text-align:right; font-family:'IBM Plex Mono', monospace; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .gan-t input[type=text]{ width:150px; text-align:right; padding:4px 6px; }
  .gan-t select{ max-width:300px; }
  .gan-t tr.auto > td{ color:var(--muted); }
  .gan-t tr.tot > td{ font-weight:700; background:var(--surface-2); }
  .gan-t tr.sub > td{ font-weight:600; }
  .gan-m th, .gan-m td{ padding:4px 4px; font-size:12px; border-bottom:1px solid var(--border); text-align:right; vertical-align:middle; }
  .gan-m th{ color:var(--muted); font-weight:600; font-size:10.5px; white-space:normal; line-height:1.2; }
  .gan-m th:first-child, .gan-m td:first-child{ padding-left:14px; min-width:112px; white-space:nowrap; }
  .gan-m td.auto, .gan-m tr.tot td{ font-size:11.5px; }
  .gan-m input[type=text]{ width:104px; text-align:right; padding:4px 5px; font-size:12px; }
  .gan-m th:last-child, .gan-m td:last-child{ padding-right:14px; }
  .gan-m td.auto, .gan-m tr.tot td{ letter-spacing:-.02em; }
  .gan-t input.gan-auto::placeholder{ color:var(--accent); opacity:1; }
  .gan-m input.gan-auto::placeholder{ color:var(--accent); opacity:1; }
  .gan-f931-btn{ font-family:'IBM Plex Mono', monospace; font-size:11.5px; }
  .gan-m td.auto{ color:var(--muted); font-family:'IBM Plex Mono', monospace; white-space:nowrap; }
  .gan-m tr.tot td{ font-weight:700; background:var(--surface-2); font-family:'IBM Plex Mono', monospace; }
  .gan-n{ display:inline-flex; width:22px; height:22px; border-radius:50%; background:var(--accent-soft); color:var(--accent-strong); font-size:12px; align-items:center; justify-content:center; margin-right:6px; font-family:'IBM Plex Mono', monospace; }
  .gan-copy{ background:none; border:1px dashed transparent; border-radius:6px; font:inherit; color:inherit; padding:2px 8px; cursor:copy; }
  .gan-copy:hover{ border-color:var(--accent); background:var(--accent-soft); }
  .gan-copy.copiado{ background:var(--favor-soft); border-color:var(--favor); }
  .bp-list{ display:flex; flex-direction:column; gap:8px; }
  .bp-bar{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .bp-adds{ display:flex; gap:8px; flex-wrap:wrap; }
  .bp-bar-r{ display:flex; gap:4px; }
  .bp-linea{ margin:0; }
  .bp-help{ font-size:12.5px; color:var(--muted); }
  .bp-help summary{ cursor:pointer; list-style:none; display:inline-block; padding:2px 0; }
  .bp-help summary:hover{ color:var(--accent); }
  .bp-help div{ margin-top:6px; padding:10px 12px; background:var(--surface-2); border-radius:10px; line-height:1.5; }
  .bp-head{ cursor:pointer; margin-bottom:0 !important; }
  .bp-item.open .bp-head{ margin-bottom:12px !important; padding-bottom:10px; border-bottom:1px solid var(--border); }
  .bp-item:not(.open) .bp-body{ display:none; }
  .bp-body{ display:grid; grid-template-columns:1fr 1fr; gap:22px; align-items:start; padding-bottom:6px; }
  @media (max-width:980px){ .bp-body{ grid-template-columns:1fr; } }
  .bp-sec{ font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:700; margin-bottom:8px; }
  .bp-row{ display:grid; grid-template-columns:128px 1fr; align-items:center; gap:8px; padding:3px 0; font-size:12px; color:var(--muted); }
  .bp-row input, .bp-row select{ width:100%; max-width:none; box-sizing:border-box; padding:6px 9px; font-size:13px; color:var(--ink); }
  .bp-row input[data-kind=money]{ text-align:right; }
  .bp-valu{ border:1px solid var(--border); border-radius:10px; padding:12px 14px; background:var(--surface-2); }
  .bp-seg{ display:flex; background:var(--surface); border:1px solid var(--border); border-radius:9px; padding:3px; gap:2px; margin-bottom:10px; }
  .bp-seg button{ flex:1; border:0; background:transparent; padding:5px 4px; border-radius:7px; font:inherit; font-size:11.5px; color:var(--muted); cursor:pointer; }
  .bp-seg button.on{ background:var(--accent-soft); color:var(--accent-strong); font-weight:700; }
  .bp-calc{ display:flex; flex-direction:column; margin-top:8px; }
  .bp-calc div{ display:flex; justify-content:space-between; gap:10px; padding:5px 0; border-bottom:1px dashed var(--border); color:var(--muted); font-size:12.5px; }
  .bp-calc div b{ color:var(--ink); font-family:'IBM Plex Mono', monospace; font-weight:600; white-space:nowrap; }
  .bp-res{ margin-top:10px; padding:10px 14px; background:var(--accent-soft); border-radius:10px; display:flex; justify-content:space-between; align-items:center; color:var(--accent-strong); font-weight:700; }
  .bp-res .gan-copy{ font-size:17px; }
  .bp-chev{ color:var(--muted); font-size:11px; width:10px; transition:transform .12s; }
  .bp-item.open .bp-chev{ transform:rotate(90deg); }
  .bp-item:hover{ border-color:var(--accent); }
  .bp-item{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:9px 14px; }
  .bp-head{ display:flex; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
  .bp-spacer{ flex:1; }
  .bp-title{ font-size:14px; }
  .bp-tt{ display:flex; flex-direction:column; min-width:0; line-height:1.25; }
  .bp-sub{ font-size:11.5px; color:var(--muted); font-family:'IBM Plex Mono', monospace; letter-spacing:-.01em; }
  .bp-sub:empty{ display:none; }
  .bp-head{ flex-wrap:nowrap !important; }
  .bp-head > *{ flex-shrink:0; }
  .bp-head > .bp-tt{ flex:0 1 auto; flex-shrink:1; min-width:0; }
  .bp-sit{ white-space:nowrap; }
  .bp-nota{ font-size:11.5px; }
  .bp-nota.bp-warn{ color:var(--pagar); }
  .bp-sit{ font-size:11px; padding:2px 8px; border-radius:20px; background:var(--surface-2); color:var(--muted); border:1px solid var(--border); }
  .bp-sit-grav{ background:var(--accent-soft); color:var(--accent-strong); border-color:transparent; }
  .bp-sit-casa{ background:var(--favor-soft); color:var(--favor); border-color:transparent; }
  .bp-copy{ font-family:'IBM Plex Mono', monospace; font-weight:700; font-size:14px; }
  .bp-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(172px,1fr)); gap:10px 12px; }
  .bp-f{ display:flex; flex-direction:column; gap:3px; font-size:11.5px; color:var(--muted); min-width:0; }
  .bp-f.w2{ grid-column:span 2; }
  .bp-f input, .bp-f select{ width:100%; max-width:none; box-sizing:border-box; padding:5px 7px; font-size:13px; color:var(--ink); }
  .bp-f input[data-kind=money]{ text-align:right; }
  .bp-tots{ display:flex; gap:18px; flex-wrap:wrap; padding:10px 14px; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; font-size:12.5px; color:var(--muted); }
  .bp-tots b{ color:var(--ink); font-family:'IBM Plex Mono', monospace; margin-left:4px; }
  .flow{ display:flex; align-items:stretch; gap:10px; }
  .flow .bx{ flex:1; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:10px 12px; font-size:12.5px; color:var(--muted); }
  .flow .bx b{ display:block; margin-bottom:3px; font-size:13px; color:var(--ink); }
  .flow .ar{ align-self:center; color:var(--accent); font-size:20px; font-weight:800; }
  .chk{ display:flex; gap:8px; align-items:flex-start; padding:7px 0; border-bottom:1px solid var(--border); font-size:13px; }
  .chk:last-child{ border-bottom:none; }
  .chk .b{ width:17px; height:17px; border-radius:5px; border:1.5px solid var(--border); flex-shrink:0; margin-top:1px; display:flex; align-items:center; justify-content:center; font-size:11px; }
  .chk .b.on{ background:var(--favor); border-color:var(--favor); color:#fff; }
  .chk input[type=checkbox]{ margin:0; }
  .madd-list{ max-height:300px; overflow-y:auto; border:1px solid var(--border); border-radius:10px; }
  .madd-row{ color:var(--ink); display:flex; gap:9px; align-items:center; padding:8px 12px; border-bottom:1px solid var(--border); cursor:pointer; font-size:13px; }
  .madd-row:last-child{ border-bottom:none; }
  .madd-row:hover{ background:var(--surface-3); }
  .bp-prov{ background:var(--accent-soft); color:var(--accent-strong); border-radius:10px; padding:9px 14px; font-size:13px; }
  .bp-avisos li{ color:var(--ink); }
  .bp-reg td.num, .bp-reg th{ min-width:130px; }

  .tabs{ display:flex; gap:4px; border-bottom:1px solid var(--border); flex-wrap:wrap; }
  .tab{ background:transparent; border:none; padding:9px 14px; font-size:13px; font-weight:600; color:var(--muted); border-bottom:2px solid transparent; margin-bottom:-1px; }
  .tab:hover{ color:var(--ink); }
  .tab.active{ color:var(--accent-strong); border-bottom-color:var(--accent); }

  .kpi-row{ display:grid; grid-template-columns:repeat(auto-fit, minmax(200px,1fr)); gap:12px; }
  .period-heading{ font-family:'Fraunces', serif; font-size:20px; font-weight:600; margin:0 0 4px; color:var(--ink); }
  .kpi{ background:var(--surface-2); border:1px solid var(--border); border-radius:14px; padding:14px 16px; display:flex; flex-direction:column; gap:6px; box-shadow:0 1px 2px var(--shadow); }
  .kpi .k-label{ font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
  .kpi .k-value{ font-family:'IBM Plex Mono', monospace; font-size:21px; font-weight:600; font-variant-numeric:tabular-nums; }
  .kpi .k-sub{ font-size:11.5px; color:var(--muted); }
  .kpi.state-favor .k-value{ color:var(--favor); }
  .kpi.state-pagar .k-value{ color:var(--pagar); }
  .pill{ display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:3px 9px; border-radius:99px; letter-spacing:.02em; }
  .pill.favor{ background:var(--favor-soft); color:var(--favor); }
  .pill.pagar{ background:var(--pagar-soft); color:var(--pagar); }
  .cell-favor{ color:var(--favor); font-weight:600; }
  .cell-pagar{ color:var(--pagar); font-weight:600; }

  .card{ background:var(--surface); border:1px solid var(--border); border-radius:16px; box-shadow:0 1px 2px var(--shadow), 0 6px 18px var(--shadow); overflow:hidden; }
  .card-head{ display:flex; justify-content:space-between; align-items:center; padding:16px 20px 12px; border-bottom:none; gap:12px; flex-wrap:wrap; }
  .card-head h3{ font-size:16px; }
  .subsection{ padding-top:16px; margin-top:16px; border-top:1px solid var(--border); }
  .subsection:first-child{ padding-top:0; margin-top:0; border-top:none; }
  .subhead{ font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted-soft); font-weight:600; margin:0 0 10px; }
  .subhead-strong{ font-size:13.5px; text-transform:none; letter-spacing:0; color:var(--accent-strong); font-weight:700; margin:0 0 12px; padding-bottom:6px; border-bottom:1.5px solid var(--accent-soft); }
  .card-head .hint{ font-size:11.5px; color:var(--muted); }
  .card-body{ padding:16px 18px; display:flex; flex-direction:column; gap:14px; }
  .table-scroll{ overflow-x:auto; }

  table{ width:100%; border-collapse:collapse; min-width:640px; }
  th, td{ padding:7px 10px; border-bottom:1px solid var(--border); white-space:nowrap; }
  table.table-compact{ min-width:0; }
  table.table-compact th, table.table-compact td{ padding:6px 4px; font-size:11px; }
  table.table-compact th{ white-space:normal; line-height:1.25; vertical-align:bottom; }

  /* ---- Borrador PDF ---- */

  /* En pantalla (previsualización), la hoja usa un celeste suave — pedido
     explícito del usuario (variante E) para que no "encandile" en blanco.
     Al imprimir de verdad, @media print más abajo la fuerza a papel claro
     fijo (blanco hueso + tinta negra), que es lo que corresponde en papel. */
  .pdf-page{ background:#f3f8fb; color:#142433; padding:40px 44px; font-family:'Public Sans', system-ui, sans-serif; }
  .pdf-page h1,.pdf-page h2,.pdf-page h3{ font-family:'Public Sans', system-ui, sans-serif; }
  .pdf-letterhead{ display:flex; justify-content:space-between; align-items:flex-start; border-bottom:2px solid #0369a1; padding-bottom:16px; margin-bottom:26px; }

  .pdf-kpi .pk-sub{ display:inline-block; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; padding:3px 9px; border-radius:99px; }

  .pdf-kpi.favor{ border-color:#bfe3cd; }
  .pdf-kpi.favor .pk-value{ color:#16794f; }

  .pdf-section{ margin-bottom:28px; }
  .pdf-section h3{ font-size:12.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:#0369a1; margin:0 0 12px; padding-bottom:7px; border-bottom:1.5px solid #cfe6f3; }
  .pdf-section table{ width:100%; border-collapse:collapse; min-width:0; }
  /* Tablas clave/valor (IVA e IIBB Local): sin width:100% quedaban con el
     valor pegado al borde derecho de la hoja y un hueco enorme respecto de
     la etiqueta ("estirado"). Se angostan y quedan pegadas a la izquierda. */
  .pdf-section table.kv{ width:auto; min-width:340px; max-width:460px; margin:0 auto; }
  .pdf-section table.kv td:first-child{ padding-right:28px; }

     parten en dos renglones; la columna de jurisdicciones es la que cede ancho
     (su texto sí puede ajustarse) y la tipografía/padding son algo más chicos. */
  .pdf-section table.cm td, .pdf-section table.cm th{ padding:6px 5px; font-size:11px; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .pdf-section table.cm th{ white-space:normal; }

  .pdf-section tr.total td{ border-top:1.5px solid #142433; border-bottom:none; padding-top:9px; padding-bottom:9px; }
  .pdf-section tr.total td.pdf-bold{ font-weight:700; }
  /* Resultado final (a pagar / a favor): resalta la fila entera, no sólo
     el número, para que se vea de un vistazo el resultado de la DDJJ. */
  .pdf-section tr.total.result-pagar td{ background:#fdecea; color:#c0392b; font-weight:800; border-top:none; }
  .pdf-section tr.total.result-favor td{ background:#e7f7ef; color:#16794f; font-weight:800; border-top:none; }
  .pdf-section tr.total.result-pagar td:first-child, .pdf-section tr.total.result-favor td:first-child{ border-radius:6px 0 0 6px; }
  .pdf-section tr.total.result-pagar td:last-child, .pdf-section tr.total.result-favor td:last-child{ border-radius:0 6px 6px 0; }
  .pdf-favor{ color:#16794f !important; font-weight:700; }

  .pdf-foot{ font-size:10.5px; color:#8aa4b5; text-align:center; margin-top:28px; }
  @media print{
    /* El celeste se mantiene también al imprimir/exportar — se fuerza con
       print-color-adjust para que Chrome no lo apague "para ahorrar tinta". */
    .pdf-page, .pdf-page *{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    /* El dashboard (#app) y los demás overlays quedan totalmente afuera del
       flujo con display:none — con visibility:hidden solamente, el sidebar
       de 100vh seguía reservando ese espacio y salía una hoja 1 en blanco. */
    #app, #date-picker-root, #toast-root{ display:none !important; }
    .no-print{ display:none !important; }
    /* El backdrop y el modal quedan con position:fixed/sticky en pantalla;
       si se imprimen así, Chrome repite ese subárbol "fijo" en cada página
       (eso era el contenido duplicado). Al imprimir los volvemos estáticos
       y dejamos que #pdf-print-area fluya normalmente en el documento. */
    .modal-backdrop{ position:static !important; inset:auto !important; background:none !important; padding:0 !important; display:block !important; }
    .pdf-modal{ position:static !important; max-width:none !important; width:auto !important; max-height:none !important; overflow:visible !important; box-shadow:none !important; border:none !important; border-radius:0 !important; }
    .pdf-toolbar{ position:static !important; }
    #pdf-print-area{ position:static; width:auto; }
    .pdf-page{ padding:0; }
  }

  Object.entries(SEED_PERIODS_IIBB_LOCAL_COMAHUE).forEach(([period, iibbLocal]) => {
    const existing = docs.find((d) => d.id === `comahue__${period}`);
    if (existing) existing.iibbLocal = iibbLocal;
    else docs.push({ id: `comahue__${period}`, clientId: "comahue", period, iibbLocal });
  });
  // IIBB Convenio Multilateral — mismo cliente "comahue" (se fusiona con el
  // doc de ese período si ya existe por IVA o IIBB Local).
  Object.keys(SEED_ACTIVIDADES_CM).forEach((period) => {
    const jurisdicciones = {};
    Object.keys(SEED_RETPERC_CM).forEach((jur) => {
      jurisdicciones[jur] = {
        ajustes: (SEED_AJUSTES_CM[period] && SEED_AJUSTES_CM[period][jur]) || {},
        ret: SEED_RETPERC_CM[jur][period].ret,
        perc: SEED_RETPERC_CM[jur][period].perc,
        recban: SEED_RETPERC_CM[jur][period].recban,
      };
    });
    const iibbCM = { actividades: SEED_ACTIVIDADES_CM[period], jurisdicciones };
    const existing = docs.find((d) => d.id === `comahue__${period}`);
    if (existing) existing.iibbCM = iibbCM;
    else docs.push({ id: `comahue__${period}`, clientId: "comahue", period, iibbCM });
  });
  return docs;
}

<script>
// =====================================================================
// Papeles de trabajo fiscales — IVA / IIBB Local / IIBB Convenio Multilateral
// =====================================================================

// ---------------------------------------------------------------------
// Utilidades
// ---------------------------------------------------------------------
const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
// No se permite navegar a períodos anteriores a este (todavía no existía
// la herramienta / no hay datos que carguen tan atrás).
const MIN_PERIOD = "2026-01";

function fmtMoney(n) {
  n = Number(n) || 0;
  const s = n.toLocaleString("es-AR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return (n < 0 ? "-$ " : "$ ") + s.replace("-", "");
}
function fmtPct(n) {
  return (Number(n) * 100).toLocaleString("es-AR", { maximumFractionDigits: 3 }) + "%";
}
// Formatea un saldo editable como "XXX.XXX,XX" (sin signo $, para inputs).
function fmtMoneyRaw(n) {
  n = Number(n) || 0;
  return n.toLocaleString("es-AR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
// Formatea una alícuota/coeficiente editable, ya expresada en unidades de
// porcentaje (5 significa 5%), como "X,XX" (el signo "%" se muestra aparte,
// como sufijo visual del input, no como parte del valor editable).
function fmtPctRaw(n) {
  // num() (no Number()) porque la alícuota puede venir como texto con coma
  // decimal (ej. "5,00", tal como lo deja el input al perder el foco); con
  // Number() directo eso daba NaN y el encabezado mostraba siempre 0,00%.
  n = num(n);
  return n.toLocaleString("es-AR", { minimumFractionDigits: 2, maximumFractionDigits: 4 });
}
function periodLabel(period) {
  const [y, m] = period.split("-").map(Number);
  return `${MESES[m - 1]} ${y}`;
}
function regimenLabel(a) {
  if (a.regimen === "especial") return a.especialArt ? `Especial (Art. ${a.especialArt})` : "Especial (Art. 6 a 13)";
  if (a.regimen === "art14") return a.art14Jur ? `Inicio de actividades — ${a.art14Jur}` : "Inicio de actividades (Art. 14)";
  return "General (Art. 2)";
}
function periodYear(period) { return Number(period.split("-")[0]); }
function periodMonth(period) { return Number(period.split("-")[1]); }
function todayPeriod() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
}
function addMonths(period, delta) {
  let y = periodYear(period), m = periodMonth(period) + delta;
  while (m > 12) { m -= 12; y++; }
  while (m < 1) { m += 12; y--; }
  return `${y}-${String(m).padStart(2, "0")}`;
}
function uid(prefix) { return (prefix || "id") + "_" + Math.random().toString(36).slice(2, 10); }
// Para mostrar en un <input> lo que la persona está tipeando tal cual (sin
// normalizar a número en cada tecla, lo que rompería el punto decimal o el
// signo negativo mientras se está escribiendo). Los ceros "de fábrica" se
// muestran vacíos; cualquier otra cosa (número guardado o texto en edición)
// se muestra literal.
function rawOrBlank(v, kind) {
  if (v === undefined || v === null) return "";
  if (typeof v === "number" && v === 0) return "";
  // Numbers come straight from seed/config data (never touched by the user yet in this
  // session) — format them the same way blur would, so pre-loaded figures already look
  // like "XXX.XXX,XX" / "X,XX%" on first render. Strings are values the user is actively
  // typing (stored raw via the input handler) or already blur-formatted — leave as-is.
  if (typeof v === "number") {
    if (kind === "percent") return fmtPctRaw(v);
    if (kind === "money") return fmtMoneyRaw(v);
  }
  return String(v);
}
function num(v) {
  if (typeof v === "number") return isFinite(v) ? v : 0;
  if (v == null) return 0;
  let s = String(v).trim();
  if (s === "" || s === "-") return 0;
  s = s.replace(/[^0-9.,\-]/g, "");
  const neg = s.startsWith("-");
  s = s.replace(/-/g, "");
  // El separador decimal es el ÚLTIMO "." o "," que aparece (soporta tanto
  // "1234.56" tipeado en crudo como "1.234.567,89" ya formateado con miles):
  // todo separador anterior a ese último se descarta por ser de miles.
  const lastSep = Math.max(s.lastIndexOf(","), s.lastIndexOf("."));
  if (lastSep !== -1) {
    const intPart = s.slice(0, lastSep).replace(/[.,]/g, "");
    const decPart = s.slice(lastSep + 1).replace(/[.,]/g, "");
    s = intPart + "." + decPart;
  }
  const n = Number((neg ? "-" : "") + s);
  return isFinite(n) ? n : 0;
}
function round2(n) { return Math.round((n + Number.EPSILON) * 100) / 100; }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function getClient(id) { return state.clients.find((c) => c.id === id); }
function currentClient() { return getClient(state.currentClientId); }
function getDoc(clientId, period) { return (state.periods[clientId] && state.periods[clientId][period]) || null; }
function ensureLocalPeriodBucket(clientId) { if (!state.periods[clientId]) state.periods[clientId] = {}; }

function listPeriodsWithTax(clientId, taxKey) {
  const bucket = state.periods[clientId] || {};
  return Object.keys(bucket).filter((p) => bucket[p] && bucket[p][taxKey]).sort();
}

// ---------------------------------------------------------------------
// Persistencia standalone: localStorage (fuente local, siempre disponible,
// sin red) + sincronización opcional contra un GitHub Gist privado (para
// tener los mismos datos en más de un dispositivo/navegador). El token y
// el ID del Gist quedan guardados sólo en el localStorage de este navegador
// — nunca se mandan a ningún lado que no sea api.github.com.
// ---------------------------------------------------------------------
const LOCAL_STORE_KEY = "papeles_fiscales_store_v1";
const SYNC_CONFIG_KEY = "papeles_fiscales_sync_v1";
const GIST_FILENAME = "papeles-fiscales-datos.json";
// Se prende cuando hay un cambio local todavía no confirmado en el Gist, y
// se apaga recién cuando el push efectivamente se completa. Persiste en
// localStorage (no sólo en memoria) para sobrevivir a un F5 a mitad de un
// push trabado — si no, un simple reload podía perder cambios reales (ver
// comentario largo en initApp).
const SYNC_DIRTY_KEY = "papeles_fiscales_sync_dirty_v1";

function loadLocalStore() {
  try {
    const raw = localStorage.getItem(LOCAL_STORE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) { /* localStorage no disponible o dato corrupto */ }
  return null;
}
function saveLocalStore() {
  try {
    localStorage.setItem(LOCAL_STORE_KEY, JSON.stringify({ clients: state.clients, periods: state.periods, extras: state.extras }));
  } catch (e) { showToast("No se pudo guardar localmente (¿memoria del navegador llena?)"); }
}
function loadSyncConfig() {
  try {
    const raw = JSON.parse(localStorage.getItem(SYNC_CONFIG_KEY) || "null");
    if (raw && typeof raw === "object") return { token: raw.token || "", gistId: raw.gistId || "" };
  } catch (e) { /* nada guardado todavía */ }
  return { token: "", gistId: "" };
}
function saveSyncConfig(cfg) {
  state.syncConfig = cfg;
  try { localStorage.setItem(SYNC_CONFIG_KEY, JSON.stringify(cfg)); } catch (e) {}
}

async function initApp() {
  const local = loadLocalStore();
  if (local) {
    state.clients = local.clients || [];
    state.periods = local.periods || {};
    state.extras = local.extras || {};
  } else {
    loadSeedIntoMemory();
    saveLocalStore();
  }
  state.syncConfig = loadSyncConfig();
  state.currentClientId = state.clients[0] && state.clients[0].id;
  pickDefaultPeriod();
  render();

  // Si hay sincronización configurada, traer lo último apenas arranca (sin
  // bloquear el primer render, que ya se hizo con lo que había en local).
  //
  // PERO: si quedaron cambios locales sin confirmar en el Gist de la sesión
  // anterior (por ejemplo, se cerró la pestaña o se refrescó mientras el
  // push automático seguía reintentando tras un corte), NO hacemos ese pull
  // — pisaría esos cambios con la versión vieja del Gist sin que el usuario
  // se entere, perdiéndolos para siempre. En ese caso primero empujamos lo
  // local (que es la versión más nueva) y recién después queda habilitado
  // volver a traer.
  if (state.syncConfig.token && state.syncConfig.gistId) {
    if (isSyncDirty()) {
      showToast("Había cambios de la sesión anterior sin sincronizar — los estamos subiendo primero.");
      const pushed = await gistPush();
      if (!pushed) {
        showToast("No se pudo confirmar esos cambios en GitHub todavía — no se trae nada del Gist para no pisarlos. Abrí Sincronización cuando tengas conexión.");
        return;
      }
    }
    const changed = await gistPull();
    if (changed) { state.currentClientId = state.clients[0] && state.clients[0].id; pickDefaultPeriod(); render(); }
  }
}

function loadSeedIntoMemory() {
  state.clients = JSON.parse(JSON.stringify(SEED_CLIENTS));
  state.periods = {};
  buildSeedPeriodDocs().forEach((d) => {
    ensureLocalPeriodBucket(d.clientId);
    state.periods[d.clientId][d.period] = d;
  });
}

function pickDefaultPeriod() {
  const c = currentClient();
  if (!c) return;
  const all = [
    ...listPeriodsWithTax(c.id, "iva"),
    ...listPeriodsWithTax(c.id, "iibbLocal"),
    ...listPeriodsWithTax(c.id, "iibbCM"),
  ].sort();
  state.currentPeriod = all.length ? all[all.length - 1] : todayPeriod();
  if (state.currentPeriod < MIN_PERIOD) state.currentPeriod = MIN_PERIOD;
}

// Guardado local: inmediato y sin red, así que no hace falta debounce (a
// diferencia del push al Gist, que si se hiciera en cada tecla saturaría
// la API de GitHub — ese sí se demora unos segundos, ver scheduleGistPush).
let gistPushTimer = null;
function scheduleSave(clientId, period) {
  saveLocalStore();
  scheduleGistPush();
}
function persistDoc(clientId, period) {
  saveLocalStore();
  scheduleGistPush();
}
function persistClient(client) {
  saveLocalStore();
  scheduleGistPush();
}
function persistDeleteClient(clientId) {
  saveLocalStore();
  scheduleGistPush();
}
// fetch() del navegador no tiene timeout propio: con wifi inestable, una
// conexión que "se cuelga" (ni responde ni corta) puede dejar un await
// esperando indefinidamente sin llegar nunca al catch — y por lo tanto sin
// disparar el reintento ni el cartel de error, quedando "Sincronizando…"
// pegado en pantalla para siempre. Este helper fuerza que, pasados 15s sin
// respuesta, se aborte y se trate como una falla transitoria más.
function fetchGithub(url, options) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 15000);
  return fetch(url, Object.assign({}, options, { signal: controller.signal })).finally(() => clearTimeout(timer));
}
// Push automático en segundo plano, después de cada cambio. A diferencia del
// botón manual del modal de Sincronización, éste NO se rinde ni molesta al
// usuario si falla por algo transitorio (se cortó un instante el wifi, o
// GitHub devolvió "demasiadas solicitudes" por varios cambios seguidos):
// reintenta solo, con espera cada vez más larga, hasta que el guardado
// efectivamente se complete. El dato siempre está a salvo en este navegador
// mientras tanto (saveLocalStore ya se hizo antes de llegar acá), así que
// no hay ningún riesgo en dejar que reintente en silencio.
let gistRetryTimer = null;
let gistRetryDelay = 4000; // arranca en 4s y se va duplicando hasta un tope de 60s
let gistPushInFlight = false;
let gistPushDirty = false; // hubo un cambio nuevo mientras se estaba sincronizando
let gistFatalErrorShown = false; // token/Gist inválidos: avisar una sola vez, no en cada reintento
let gistRetryFailCount = 0; // reintentos consecutivos fallidos (red/rate-limit), para avisar si se estanca
let gistStuckWarningShown = false;
// Convierte la cabecera X-RateLimit-Reset (timestamp Unix en segundos) de
// una respuesta 403 de GitHub en una hora local legible, para avisar al
// usuario cuándo se libera el límite. Si la cabecera no viene, devolvemos
// un texto genérico en vez de romper el flujo.
function rateLimitResetLabel(res) {
  try {
    const raw = res && res.headers && res.headers.get("x-ratelimit-reset");
    const secs = Number(raw);
    if (!raw || !isFinite(secs) || secs <= 0) return "dentro de un rato";
    return new Date(secs * 1000).toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" });
  } catch (e) {
    return "dentro de un rato";
  }
}
function markSyncDirty() {
  try { localStorage.setItem(SYNC_DIRTY_KEY, "1"); } catch (e) {}
}
function clearSyncDirty() {
  try { localStorage.removeItem(SYNC_DIRTY_KEY); } catch (e) {}
}
function isSyncDirty() {
  try { return localStorage.getItem(SYNC_DIRTY_KEY) === "1"; } catch (e) { return false; }
}
function scheduleGistPush() {
  if (!state.syncConfig.token || !state.syncConfig.gistId) return;
  gistPushDirty = true;
  markSyncDirty();
  clearTimeout(gistPushTimer);
  gistPushTimer = setTimeout(() => attemptAutoGistPush(), 3000);
}
async function attemptAutoGistPush() {
  if (!state.syncConfig.token || !state.syncConfig.gistId) return;
  if (gistPushInFlight) { gistPushDirty = true; return; }
  gistPushInFlight = true;
  gistPushDirty = false;
  clearTimeout(gistRetryTimer);
  const cfg = state.syncConfig;
  state.syncStatus = "syncing"; renderSidebar();
  try {
    const res = await fetchGithub(`https://api.github.com/gists/${cfg.gistId}`, {
      method: "PATCH",
      headers: { "Authorization": `Bearer ${cfg.token}`, "Accept": "application/vnd.github+json", "Content-Type": "application/json" },
      body: JSON.stringify({ files: { [GIST_FILENAME]: { content: JSON.stringify({ clients: state.clients, periods: state.periods, extras: state.extras, savedAt: new Date().toISOString() }) } } }),
    });
    gistPushInFlight = false;
    if (!res.ok) {
      // 401/404 no se arreglan reintentando (token vencido o Gist borrado):
      // ahí sí hace falta que el usuario cargue un token/Gist ID válido.
      if (res.status === 401 || res.status === 404) {
        state.syncStatus = "error";
        renderSidebar();
        if (!gistFatalErrorShown) {
          gistFatalErrorShown = true;
          showToast(res.status === 401 ? "El token de GitHub venció o no es válido — cargá uno nuevo en Sincronización" : "No se encontró el Gist configurado — revisá el Gist ID en Sincronización");
        }
        return;
      }
      // 403 con cabecera X-RateLimit-Remaining en 0: límite de requests de
      // GitHub agotado (5000/hora por token) — pasa si hubo muchos
      // reintentos seguidos (como el cuelgue que originó este arreglo) o si
      // varias computadoras comparten el mismo token. No es un error real:
      // se soluciona solo cuando resetea, así que lo mostramos aparte en vez
      // de "Error al sincronizar" genérico, con la hora en que se libera.
      if (res.status === 403 && res.headers.get("x-ratelimit-remaining") === "0") {
        state.syncStatus = "ratelimited";
        state.rateLimitReset = rateLimitResetLabel(res);
        renderSidebar();
        if (!gistFatalErrorShown) {
          gistFatalErrorShown = true;
          showToast("Se agotó el límite de pedidos a GitHub por ahora — tus cambios siguen a salvo acá y se van a sincronizar solos cuando se libere.");
        }
        gistRetryDelay = 60000; // no tiene sentido reintentar seguido mientras dure el límite
        gistRetryTimer = setTimeout(() => attemptAutoGistPush(), gistRetryDelay);
        return;
      }
      throw new Error(String(res.status));
    }
    gistFatalErrorShown = false;
    gistRetryDelay = 4000;
    gistRetryFailCount = 0;
    gistStuckWarningShown = false;
    state.lastSync = new Date();
    state.syncStatus = "idle";
    if (!gistPushDirty) clearSyncDirty(); // si no quedó otro cambio pendiente en el medio, ya está todo subido
    renderSidebar();
    if (gistPushDirty) { gistPushDirty = false; scheduleGistPush(); }
  } catch (e) {
    // Falla transitoria (red, rate limit, etc.): no corta el reintento
    // (los datos están a salvo en este navegador mientras tanto), pero si
    // se repite varias veces seguidas sí avisamos una vez — antes quedaba
    // reintentando en silencio indefinidamente y la única pista era el
    // cartelito "Sincronizando…" sin fecha, fácil de no notar.
    gistPushInFlight = false;
    gistRetryFailCount++;
    // Después de varios reintentos seguidos fallidos dejamos de mostrar
    // "Sincronizando…" sin más (parece que está progresando cuando en
    // realidad está trabada) y pasamos a un estado "stuck" que lo dice
    // explícitamente, con el aviso una sola vez.
    state.syncStatus = gistRetryFailCount >= 5 ? "stuck" : "syncing";
    renderSidebar();
    if (gistRetryFailCount >= 5 && !gistStuckWarningShown) {
      gistStuckWarningShown = true;
      showToast("La sincronización con GitHub viene fallando hace rato — tus cambios están a salvo en este navegador. Revisá tu conexión o abrí Sincronización.");
    }
    gistRetryDelay = Math.min(Math.round(gistRetryDelay * 1.8), 60000);
    gistRetryTimer = setTimeout(() => attemptAutoGistPush(), gistRetryDelay);
  }
}
// Push inmediato para las acciones manuales del modal de Sincronización
// ("Guardar y sincronizar"): un solo intento con feedback directo, porque
// acá el usuario está mirando y esperando el resultado.
async function gistPush() {
  const cfg = state.syncConfig;
  if (!cfg.token || !cfg.gistId) return false;
  clearTimeout(gistPushTimer);
  clearTimeout(gistRetryTimer);
  gistPushInFlight = true;
  state.syncStatus = "syncing"; renderSidebar();
  const payload = JSON.stringify({ clients: state.clients, periods: state.periods, extras: state.extras, savedAt: new Date().toISOString() }, null, 0);
  try {
    const res = await fetchGithub(`https://api.github.com/gists/${cfg.gistId}`, {
      method: "PATCH",
      headers: { "Authorization": `Bearer ${cfg.token}`, "Accept": "application/vnd.github+json", "Content-Type": "application/json" },
      body: JSON.stringify({ files: { [GIST_FILENAME]: { content: payload } } }),
    });
    gistPushInFlight = false;
    if (!res.ok) {
      // Mismo caso que en attemptAutoGistPush(): límite de requests de
      // GitHub agotado, no un error real. Acá el usuario está mirando el
      // modal, así que el mensaje va directo en vez de un toast.
      if (res.status === 403 && res.headers.get("x-ratelimit-remaining") === "0") {
        state.syncStatus = "ratelimited";
        state.rateLimitReset = rateLimitResetLabel(res);
        renderSidebar();
        showToast("Se agotó el límite de pedidos a GitHub por ahora — tus cambios siguen a salvo acá y se van a sincronizar solos cuando se libere.");
        return false;
      }
      throw new Error(String(res.status));
    }
    gistFatalErrorShown = false;
    gistRetryDelay = 4000;
    gistRetryFailCount = 0;
    gistStuckWarningShown = false;
    state.lastSync = new Date();
    state.syncStatus = "idle";
    clearSyncDirty();
    renderSidebar();
    return true;
  } catch (e) {
    gistPushInFlight = false;
    state.syncStatus = "error";
    renderSidebar();
    showToast("No se pudo sincronizar con GitHub — se guardó local, reintentá más tarde");
    return false;
  }
}
async function gistPull() {
  const cfg = state.syncConfig;
  if (!cfg.token || !cfg.gistId) return false;
  state.syncStatus = "syncing"; renderSidebar();
  try {
    const res = await fetchGithub(`https://api.github.com/gists/${cfg.gistId}`, {
      headers: { "Authorization": `Bearer ${cfg.token}`, "Accept": "application/vnd.github+json" },
    });
    if (!res.ok) throw new Error(String(res.status));
    const data = await res.json();
    const file = data.files && data.files[GIST_FILENAME];
    if (!file || !file.content) { state.syncStatus = "idle"; renderSidebar(); return false; }
    const parsed = JSON.parse(file.content);
    if (parsed && Array.isArray(parsed.clients)) {
      state.clients = parsed.clients;
      state.periods = parsed.periods || {};
      state.extras = parsed.extras || state.extras || {};
      saveLocalStore();
    }
    state.lastSync = new Date();
    state.syncStatus = "idle";
    renderSidebar();
    return true;
  } catch (e) {
    state.syncStatus = "error";
    renderSidebar();
    showToast("No se pudo traer los datos de GitHub — revisá el token/Gist ID");
    return false;
  }
}
// Crea un Gist privado nuevo con el estado actual (para cuando todavía no
// hay uno configurado) y guarda su ID.
async function gistCreate(token) {
  const payload = JSON.stringify({ clients: state.clients, periods: state.periods, extras: state.extras, savedAt: new Date().toISOString() });
  try {
    const res = await fetchGithub("https://api.github.com/gists", {
      method: "POST",
      headers: { "Authorization": `Bearer ${token}`, "Accept": "application/vnd.github+json", "Content-Type": "application/json" },
      body: JSON.stringify({ description: "Papeles de Trabajo Fiscales — datos (privado)", public: false, files: { [GIST_FILENAME]: { content: payload } } }),
    });
    if (!res.ok) throw new Error(String(res.status));
    const data = await res.json();
    saveSyncConfig({ token, gistId: data.id });
    state.lastSync = new Date();
    showToast("Gist creado y sincronizado");
    document.getElementById("modal-root").innerHTML = "";
    render();
    return true;
  } catch (e) {
    showToast("No se pudo crear el Gist — revisá el token (necesita permiso 'gist')");
    return false;
  }
}

async function syncSaveFromModal() {
  const tokenEl = document.getElementById("sync-token-input"), gistEl = document.getElementById("sync-gistid-input");
  const token = tokenEl ? tokenEl.value.trim() : "";
  const gistId = gistEl ? gistEl.value.trim() : "";
  if (!token) { showToast("Falta el token de GitHub"); return; }
  if (!gistId) { await gistCreate(token); return; }
  saveSyncConfig({ token, gistId });
  const pulled = await gistPull();
  if (pulled) {
    state.currentClientId = state.clients[0] && state.clients[0].id;
    pickDefaultPeriod();
    showToast("Datos traídos de GitHub");
  } else {
    const pushed = await gistPush();
    if (!pushed) { renderSyncModal(); return; } // error: dejamos el modal abierto para reintentar
    showToast("Sincronizado con GitHub");
  }
  document.getElementById("modal-root").innerHTML = "";
  render();
}
async function syncPullFromModal() {
  const ok = await gistPull();
  if (ok) {
    state.currentClientId = state.clients[0] && state.clients[0].id;
    pickDefaultPeriod();
    showToast("Datos actualizados desde GitHub");
    document.getElementById("modal-root").innerHTML = "";
  } else {
    renderSyncModal(); // error: dejamos el modal abierto para reintentar

function touchDoc(clientId, period, mutator) {
  ensureLocalPeriodBucket(clientId);
  let doc = state.periods[clientId][period];
  if (!doc) {
    doc = { id: clientId + "__" + period, clientId, period };
    state.periods[clientId][period] = doc;
  }
  mutator(doc);
  scheduleSave(clientId, period);
}

function setDeep(obj, path, value) {
  const parts = path.split(".");
  let cur = obj;
  for (let i = 0; i < parts.length - 1; i++) {
    if (typeof cur[parts[i]] !== "object" || cur[parts[i]] === null) cur[parts[i]] = {};
    cur = cur[parts[i]];
  }
  cur[parts[parts.length - 1]] = value;
}
function getDeep(obj, path, fallback) {
  const parts = path.split(".");
  let cur = obj;
  for (const p of parts) {
    if (cur == null) return fallback;
    cur = cur[p];
  }
  return cur === undefined ? fallback : cur;
}

// ---------------------------------------------------------------------
// Motor de cálculo
// ---------------------------------------------------------------------
function computeIvaPeriod(client, doc, carryIn) {
  doc = Object.assign(emptyIvaDoc(), doc || {}, {
    debito: Object.assign(emptyIvaDoc().debito, (doc && doc.debito) || {}),
    restDebito: Object.assign(emptyIvaDoc().restDebito, (doc && doc.restDebito) || {}),
    credito: Object.assign(emptyIvaDoc().credito, (doc && doc.credito) || {}),
    restCredito: Object.assign(emptyIvaDoc().restCredito, (doc && doc.restCredito) || {}),
    porActividad: Object.assign({}, (doc && doc.porActividad) || {}),
    decreto814: Object.assign({ remuneraciones: 0, f931Pagado: false, f931Fecha: "" }, (doc && doc.decreto814) || {}),
    turIva: Object.assign({ credito: 0 }, (doc && doc.turIva) || {}),
    exento: Object.assign({ ventas: 0, ncVentas: 0, compras: 0, ncCompras: 0, operacionesNoCredito: 0 }, (doc && doc.exento) || {}),
  });

  const mapBrackets = (defs, data, factor) => defs.map((b) => {
    const cell = data[b.key] || emptyBracket();
    const neto = num(cell.neto), portal = num(cell.portal);
    const calculado = round2(neto * b.rate * (factor == null ? 1 : factor));
    const diff = round2(portal - calculado);
    return { ...b, neto, portal, calculado, diff, flagged: Math.abs(diff) > 1 };
  });

  // Ventas por actividad (portal ARCA): si el cliente tiene actividades
  // cargadas, el neto de cada renglón de Débito Fiscal, de N.C. emitidas
  // (restitución de crédito fiscal) y las ventas exentas es la suma de lo
  // declarado por actividad — no se tipea directamente en la tabla
  // agregada. Sin actividades cargadas, se admite la carga directa como
  // antes (compatibilidad con clientes sin desglosar).
  const ivaActivities = client.iva.activities || [];
  const usaActividadesIva = ivaActivities.length > 0;
  const exentoPorActividad = round2(ivaActivities.reduce((s, a) => s + num(getDeep(doc.porActividad, `${a.code}.exento`, 0)), 0));
  const exentoNCPorActividad = round2(ivaActivities.reduce((s, a) => s + num(getDeep(doc.porActividad, `${a.code}.exentoNC`, 0)), 0));
  const aggByActividad = (defs, group) => Object.fromEntries(defs.map((b) => [b.key, {
    neto: round2(ivaActivities.reduce((s, a) => s + num(getDeep(doc.porActividad, `${a.code}.${group}.${b.key}`, 0)), 0)),
    portal: num((doc[group][b.key] || {}).portal),
  }]));
  const debitoData = usaActividadesIva ? aggByActividad(IVA_DEBITO, "debito") : doc.debito;
  const restCreditoData = usaActividadesIva ? aggByActividad(IVA_REST_CREDITO, "restCredito") : doc.restCredito;

  const debitoBrackets = mapBrackets(IVA_DEBITO, debitoData);
  const restDebitoBrackets = mapBrackets(IVA_REST_DEBITO, doc.restDebito);
  const restCreditoBrackets = mapBrackets(IVA_REST_CREDITO, restCreditoData);

  const decreto814Rate = num(client.iva.decreto814Rate) / 100;
  const remuneraciones = num(doc.decreto814.remuneraciones);
  const f931Pagado = !!doc.decreto814.f931Pagado;
  // El crédito del Decreto 814/01 sólo se puede computar una vez pagadas
  // las contribuciones (F.931); si no está marcado como pagado, no se toma.
  const creditoDecreto814 = f931Pagado ? round2(remuneraciones * decreto814Rate) : 0;
  // Régimen TurIVA: sociedades con ventas a turistas extranjeros que generan
  // crédito fiscal especial por esas operaciones. El crédito se carga a
  // mano (no hay forma de calcularlo a partir de otros datos del período) y
  // se suma al resto del crédito fiscal computable.
  // Estos dos son por período (ver doc.prorrateoExento / doc.turIvaEnabled
  // más abajo): si el período puntual no tiene el campo cargado todavía, se
  // usa como arranque el valor histórico a nivel cliente (client.iva.*),
  // que quedó "congelado" en lo que era antes de pasar a ser por período —
  // así los períodos ya declarados no cambian de golpe.
  const turIvaEnabled = typeof doc.turIvaEnabled === "boolean" ? doc.turIvaEnabled : !!client.iva.turIva;
  const creditoTurIva = turIvaEnabled ? num(doc.turIva.credito) : 0;

  const ventasNetasGravadas = round2(debitoBrackets.reduce((s, b) => s + b.neto, 0) - restCreditoBrackets.reduce((s, b) => s + b.neto, 0));

  // Prorrateo de crédito fiscal de compras (sociedades con ventas exentas y
  // gravadas a la vez): el "crédito calculado" de cada concepto de compras
  // ya sale multiplicado por este coeficiente — no es un ajuste aparte sobre
  // el total, así el comparativo contra lo declarado en el portal tiene
  // sentido (lo que se declaró ya debería venir prorrateado). Las ventas
  // exentas se toman netas de sus notas de crédito.
  const ventasExentasNetas = usaActividadesIva
    ? round2(exentoPorActividad - exentoNCPorActividad)
    : round2(num(doc.exento.ventas) - num(doc.exento.ncVentas));
  const totalVentasParaProrrateo = ventasNetasGravadas + ventasExentasNetas;
  const prorrateoExentoEnabled = typeof doc.prorrateoExento === "boolean" ? doc.prorrateoExento : !!client.iva.prorrateoExento;
  const coefProrrateo = prorrateoExentoEnabled
    ? (totalVentasParaProrrateo > 0 ? ventasNetasGravadas / totalVentasParaProrrateo : 1)
    : 1;

  const creditoBrackets = mapBrackets(IVA_CREDITO, doc.credito, coefProrrateo);

  const sumPortal = (arr) => arr.reduce((s, b) => s + b.portal, 0);
  const debitoFiscal = round2(sumPortal(debitoBrackets) + sumPortal(restDebitoBrackets));
  const creditoFiscal = round2(sumPortal(creditoBrackets) + sumPortal(restCreditoBrackets) + creditoDecreto814 + creditoTurIva);

  const comprasNetasGravadas = round2(creditoBrackets.reduce((s, b) => s + b.neto, 0) - restDebitoBrackets.reduce((s, b) => s + b.neto, 0));

  const saldoTecnicoAnterior = num(carryIn.saldoTecnicoAnterior);
  const saldoTecnico = round2(debitoFiscal - creditoFiscal - saldoTecnicoAnterior);
  const saldoTecnicoFavorARCA = saldoTecnico > 0 ? saldoTecnico : 0;
  const saldoTecnicoFavorContribuyente = saldoTecnico < 0 ? -saldoTecnico : 0;

  const exento = {
    ventas: usaActividadesIva ? exentoPorActividad : num(doc.exento.ventas), ncVentas: usaActividadesIva ? exentoNCPorActividad : num(doc.exento.ncVentas),
    compras: num(doc.exento.compras), ncCompras: num(doc.exento.ncCompras),
    operacionesNoCredito: num(doc.exento.operacionesNoCredito),
  };

  const libreDispAnterior = num(carryIn.saldoLibreDisponibilidadAnterior);
  const montoUtilizado = num(doc.montoUtilizado);
  const percepciones = num(doc.percepciones);
  const retenciones = num(doc.retenciones);

  let saldoLibreDisponibilidad = 0, saldoAPagar = 0;
  if (saldoTecnicoFavorARCA <= 0) {
    // El "monto utilizado" también debita acá: si no, un monto utilizado
    // cargado en un período sin saldo técnico a favor de ARCA quedaba sin
    // efecto y el saldo de libre disponibilidad no bajaba.
    saldoLibreDisponibilidad = round2(Math.max(0, libreDispAnterior + percepciones + retenciones - montoUtilizado));
  } else {
    const x = round2(saldoTecnicoFavorARCA + montoUtilizado - libreDispAnterior - percepciones - retenciones);
    if (x > 0) { saldoAPagar = x; saldoLibreDisponibilidad = 0; }
    else { saldoAPagar = 0; saldoLibreDisponibilidad = -x; }
  }

  const result = {
    doc, debitoBrackets, restDebitoBrackets, creditoBrackets, restCreditoBrackets,
    decreto814Rate, remuneraciones, creditoDecreto814, f931Pagado, turIvaEnabled, creditoTurIva,
    debitoFiscal, creditoFiscal, coefProrrateo, prorrateoExentoEnabled, ventasNetasGravadas, ventasExentasNetas, comprasNetasGravadas,
    saldoTecnicoAnterior, saldoTecnico, saldoTecnicoFavorARCA, saldoTecnicoFavorContribuyente,
    libreDispAnterior, montoUtilizado, percepciones, retenciones,
    saldoLibreDisponibilidad, saldoAPagar, exento, usaActividadesIva,
  };
  const carryOut = { saldoTecnicoAnterior: saldoTecnicoFavorContribuyente, saldoLibreDisponibilidadAnterior: saldoLibreDisponibilidad };
  return { result, carryOut };
}

function computeIibbLocalPeriod(client, doc, carryIn) {
  doc = Object.assign(emptyIibbLocalDoc(client), doc || {}, {
    actividades: Object.assign(emptyIibbLocalDoc(client).actividades, (doc && doc.actividades) || {}),
  });
  const activities = client.iibbLocal.activities || [];
  // La alícuota de IIBB depende de la actividad declarada, no es única para
  // toda la jurisdicción: cada actividad tiene la suya y el impuesto
  // determinado es la suma del impuesto de cada una.
  const actividadDetalle = activities.map((a) => {
    const baseImponible = num(doc.actividades[a.code]);
    const alicuota = alicLocal(a, doc.period, client) / 100;
    const impuesto = round2(baseImponible * alicuota);
    return { code: a.code, desc: a.desc, baseImponible, alicuota, impuesto };
  });
  const baseImponible = round2(actividadDetalle.reduce((s, a) => s + a.baseImponible, 0));
  const impuesto = round2(actividadDetalle.reduce((s, a) => s + a.impuesto, 0));
  const retenciones = num(doc.retenciones), percepciones = num(doc.percepciones), recban = num(doc.recaudacionesBancarias);
  const saldoAnterior = num(carryIn.saldoAnterior);
  const resultado = round2(impuesto - retenciones - percepciones - recban - saldoAnterior);
  const saldoAPagar = resultado > 0 ? resultado : 0;
  const saldoAFavor = resultado < 0 ? -resultado : 0;
  const result = { doc, activities, actividadDetalle, baseImponible, impuesto, retenciones, percepciones, recaudacionesBancarias: recban, saldoAnterior, resultado, saldoAPagar, saldoAFavor };
  const carryOut = { saldoAnterior: saldoAFavor };
  return { result, carryOut };
}

// Coeficientes de distribución CM: se guardan como una lista de vigencias,
// cada una con el período desde el que empezó a regir y, opcionalmente,
// hasta qué período rigió (si no tiene "hasta", se considera vigente hasta
// que aparezca una vigencia más nueva). Para un período dado, se busca la
// vigencia cuyo rango [desde, hasta] lo contenga — si no hay ninguna, no
// se aplica ningún coeficiente (para que se note el hueco en vez de
// arrastrar silenciosamente uno viejo que ya no corresponde).
function getCoefVigencia(client, period) {
  const vigencias = (client.iibbCM.coeficientes || []).filter((v) => v.desde && v.desde <= period && (!v.hasta || period <= v.hasta));
  if (!vigencias.length) return null;
  return vigencias.reduce((latest, v) => (v.desde > latest.desde ? v : latest));
}
function getCoef(client, jurName, period) {
  const v = getCoefVigencia(client, period);
  return v ? num(v.valores[jurName]) / 100 : 0;
}
// Alícuotas con vigencia (IIBB CM y Local). La alícuota "base" es la que está
// cargada en Configuración (rige hasta la primera actualización); cada
// actualización anual agrega una vigencia {desde, valores} (CM) o
// {desde, valor} (Local, dentro de la actividad). Para un período se usa la
// vigencia más nueva cuyo "desde" no lo supere; así, actualizar las alícuotas
// de enero no cambia los períodos ya cerrados. Devuelve % (1.5 = 1,5%).
// Alícuotas progresivas (algunas jurisdicciones): la alícuota depende de los
// ingresos del ejercicio anterior del cliente. Los tramos se cargan una vez
// por jurisdicción + actividad (con vigencia) en "Actualizar alícuotas". Rige
// lo más nuevo entre la vigencia de tramos y la alícuota cargada a mano para
// ese cliente (si empatan, gana la del cliente).
function alicEscalaDe(jur, code) {
  const jc = jurCanon(jur);
  return Object.values(getExtras().alicEscalas || {}).find((x) => x.jur === jc && (x.codes || []).includes(code)) || null;
}
function alicTramosVig(jur, code, period) {
  const esc = alicEscalaDe(jur, code); if (!esc) return null;
  const v = (esc.vig || []).filter((x) => x.desde && (!period || x.desde <= period)).sort((a, b) => b.desde.localeCompare(a.desde))[0];
  return v ? { desde: v.desde, tramos: v.tramos, req: esc.req || "", esc } : null;
}
function clienteCumple(client, req) {
  const t = (client && client.tamano) || "";
  return !req || (req === "micro" ? t === "micro" : (t === "micro" || t === "peq"));
}
// Ingresos del ejercicio atribuidos a una jurisdicción (CM: base distribuida + ajustes; local: ventas si es su jurisdicción).
function ingresosJur(client, year, jur) {
  const jc = jurCanon(jur), man = client.ingrAnt && client.ingrAnt[year + "|" + jc];
  if (man !== undefined && man !== null && String(man).trim() !== "") return { monto: num(man), manual: true };
  let tot = 0, hay = false;
  if (client.iibbCM) {
    const j = (client.iibbCM.jurisdictions || []).find((y) => jurCanon(y.name) === jc), acts = client.iibbCM.activities || [];
    listPeriodsWithTax(client.id, "iibbCM").filter((p) => periodYear(p) === Number(year)).forEach((p) => {
      hay = true; if (!j) return;
      const d = getDoc(client.id, p), cd = (d && d.iibbCM) || {}, jd = (cd.jurisdicciones && cd.jurisdicciones[j.name]) || {}, coef = getCoef(client, j.name, p);
      acts.forEach((a) => {
        const ov = jd.baseOverrides && jd.baseOverrides[a.code];
        const base = ov !== undefined && ov !== null && ov !== "" ? num(ov) : round2(num(cd.actividades && cd.actividades[a.code]) * getActivityAttribution(a, j.name, coef));
        tot += base + num(jd.ajustes && jd.ajustes[a.code]);
      });
    });
  }
  if (client.iibbLocal && jurCanon(client.iibbLocal.jurisdiccion) === jc) {
    listPeriodsWithTax(client.id, "iibbLocal").filter((p) => periodYear(p) === Number(year)).forEach((p) => {
      const d = getDoc(client.id, p), act = (d && d.iibbLocal && d.iibbLocal.actividades) || {};
      Object.keys(act).forEach((k) => { tot += num(act[k]); }); hay = true;
    });
  }
  return hay ? { monto: round2(tot), manual: false } : null;
}
function alicDeTramos(tramos, ingresos) {
  const vacio = (x) => x === null || x === undefined || String(x).trim() === "";
  const t = (tramos || []).slice().sort((a, b) => (vacio(a.hasta) ? Infinity : num(a.hasta)) - (vacio(b.hasta) ? Infinity : num(b.hasta)));
  const hit = t.find((x) => vacio(x.hasta) || ingresos <= num(x.hasta));
  return hit && !vacio(hit.alic) ? num(hit.alic) : null;
}
function alicElegir(client, tv, exp, period, base, jur) {
  if (tv && client && clienteCumple(client, tv.req) && !(exp && exp.forzada && exp.desde >= tv.desde)) {
    const ing = ingresosJur(client, periodYear(period || todayPeriod()) - 1, jur);
    const r = ing ? alicDeTramos(tv.tramos, ing.monto) : null;
    if (r !== null) return r;
  }
  return exp ? exp.valor : base;
}
function alicCM(client, jurName, code, period) {
  const vigs = (client.iibbCM.alicVig || []).filter((v) => v.desde && (!period || v.desde <= period)).sort((a, b) => b.desde.localeCompare(a.desde));
  let exp = null;
  for (const v of vigs) {
    const x = v.valores && v.valores[jurName] && v.valores[jurName][code];
    if (x !== undefined && x !== null && x !== "") { exp = { desde: v.desde, valor: num(x), forzada: !!(v.forzar && v.forzar[jurName] && v.forzar[jurName][code]) }; break; }
  }
  const j = (client.iibbCM.jurisdictions || []).find((y) => y.name === jurName);
  return alicElegir(client, alicTramosVig(jurName, code, period), exp, period, num(j && j.alicuotas && j.alicuotas[code]), jurName);
}
function alicLocal(a, period, client) {
  const vigs = (a.alicHist || []).filter((v) => v.desde && (!period || v.desde <= period)).sort((x, y) => y.desde.localeCompare(x.desde));
  const exp = vigs.length ? { desde: vigs[0].desde, valor: num(vigs[0].valor), forzada: !!vigs[0].forzada } : null;
  const jur = client && client.iibbLocal && client.iibbLocal.jurisdiccion;
  const tv = client && a.code ? alicTramosVig(jur, a.code, period) : null;
  return alicElegir(client, tv, exp, period, num(a.alicuota), jur);
}

// Qué fracción de la base nacional de una actividad le corresponde a una
// jurisdicción. Las actividades bajo Art. 2 (régimen general, el default)
// usan el coeficiente de distribución único del cliente; las de régimen
// "especial" (Art. 6 a 13) usan su propio reparto fijo por actividad; las
// de "art14" (inicio de actividades) le asignan el 100% a una sola
// jurisdicción — la que se eligió como donde arrancó la actividad.
function getActivityAttribution(a, jurName, coefGeneral) {
  if (a.regimen === "especial") return num(a.distribEspecial && a.distribEspecial[jurName]) / 100;
  if (a.regimen === "art14") return a.art14Jur === jurName ? 1 : 0;
  return coefGeneral;
}

function computeIibbCMPeriod(client, doc, carryIn) {
  doc = Object.assign(emptyIibbCMDoc(client), doc || {}, {
    actividades: Object.assign(emptyIibbCMDoc(client).actividades, (doc && doc.actividades) || {}),
    jurisdicciones: Object.assign(emptyIibbCMDoc(client).jurisdicciones, (doc && doc.jurisdicciones) || {}),
  });
  const activities = client.iibbCM.activities || [];
  const jurisdictions = sortedJurisdictions(client.iibbCM.jurisdictions);
  const period = doc.period;
  const coefVigencia = getCoefVigencia(client, period);

  const jurRows = jurisdictions.map((j) => {
    const jdoc = doc.jurisdicciones[j.name] || { ajustes: {}, baseOverrides: {}, ret: 0, perc: 0, recban: 0 };
    const coef = getCoef(client, j.name, period);
    const actividadDetalle = activities.map((a) => {
      const montoNacional = num(doc.actividades[a.code]);
      const ajuste = num(jdoc.ajustes && jdoc.ajustes[a.code]);
      const attrib = getActivityAttribution(a, j.name, coef);
      const overrideRaw = jdoc.baseOverrides && jdoc.baseOverrides[a.code];
      const hasOverride = overrideRaw !== undefined && overrideRaw !== null && overrideRaw !== "";
      const baseImponible = hasOverride ? num(overrideRaw) : round2(montoNacional * attrib);
      const base = round2(baseImponible + ajuste);
      const alicuota = alicCM(client, j.name, a.code, period) / 100;
      const impuesto = round2(base * alicuota);
      return { code: a.code, desc: a.desc, montoNacional, ajuste, attrib, regimen: a.regimen || "general", baseImponible, base, alicuota, impuesto, baseOverridden: hasOverride };
    });
    const baseTotal = round2(actividadDetalle.reduce((s, a) => s + a.base, 0));
    const impuestoAnticipo = round2(actividadDetalle.reduce((s, a) => s + a.impuesto, 0));
    const ret = num(jdoc.ret), perc = num(jdoc.perc), recban = num(jdoc.recban);
    const saldoAnterior = num(carryIn[j.name]);
    const resultado = round2(impuestoAnticipo - ret - perc - recban - saldoAnterior);
    const aPagar = resultado > 0 ? resultado : 0;
    const aFavor = resultado < 0 ? -resultado : 0;
    return { jurisdiccion: j.name, coef, actividadDetalle, baseTotal, impuestoAnticipo, ret, perc, recban, saldoAnterior, resultado, aPagar, aFavor };
  });

  const totales = jurRows.reduce((acc, r) => {
    acc.baseTotal += r.baseTotal; acc.impuestoAnticipo += r.impuestoAnticipo;
    acc.ret += r.ret; acc.perc += r.perc; acc.recban += r.recban;
    acc.saldoAnterior += r.saldoAnterior; acc.aPagar += r.aPagar; acc.aFavor += r.aFavor;
    return acc;
  }, { baseTotal: 0, impuestoAnticipo: 0, ret: 0, perc: 0, recban: 0, saldoAnterior: 0, aPagar: 0, aFavor: 0 });

  const result = { doc, activities, jurRows, totales, coefVigencia };
  const carryOut = {};
  jurRows.forEach((r) => (carryOut[r.jurisdiccion] = r.aFavor));
  return { result, carryOut };
}

function computeSeriesUpTo(client, taxKey, uptoPeriod, computeFn, initialCarry, docGetter) {
  const set = new Set(listPeriodsWithTax(client.id, taxKey));
  set.add(uptoPeriod);
  const periods = Array.from(set).sort().filter((p) => p <= uptoPeriod);
  let carry = initialCarry;
  let out = null;
  for (const p of periods) {
    const rawDoc = docGetter(client.id, p);
    const docWithPeriod = Object.assign({ period: p }, rawDoc || {});
    const { result, carryOut } = computeFn(client, docWithPeriod, carry);
    carry = carryOut;
    if (p === uptoPeriod) out = result;
  }
  return out;
}

function calcIvaFor(client, period) {
  return computeSeriesUpTo(client, "iva", period, computeIvaPeriod, client.iva.saldosIniciales, (cid, p) => getDoc(cid, p) && getDoc(cid, p).iva);
}
function calcIibbLocalFor(client, period) {
  return computeSeriesUpTo(client, "iibbLocal", period, computeIibbLocalPeriod, { saldoAnterior: client.iibbLocal.saldoInicial }, (cid, p) => getDoc(cid, p) && getDoc(cid, p).iibbLocal);
}
function calcIibbCMFor(client, period) {
  return computeSeriesUpTo(client, "iibbCM", period, computeIibbCMPeriod, client.iibbCM.saldosIniciales || {}, (cid, p) => getDoc(cid, p) && getDoc(cid, p).iibbCM);
}

function newClientTemplate(name, cuit) {
  return {
    id: uid("cli"), name: name || "Nuevo cliente", cuit: cuit || "",
    iva: { enabled: true, decreto814Rate: 3, prorrateoExento: false, turIva: false, activities: [], puntosVenta: [], saldosIniciales: { saldoTecnicoAnterior: 0, saldoLibreDisponibilidadAnterior: 0 } },
    iibbLocal: { enabled: false, jurisdiccion: "", activities: [], saldoInicial: 0 },
    iibbCM: { enabled: false, activities: [], jurisdictions: [], coeficientes: [], saldosIniciales: {} },
  };
}
function addClient(name, cuit) {
  const c = newClientTemplate(name, cuit);
  state.clients.push(c);
  state.clients.sort((a, b) => a.name.localeCompare(b.name, "es"));
  persistClient(c);
  state.view = "client";
  state.currentClientId = c.id;
  pickDefaultPeriod();
  render();
}
function deleteClient(id) {
  state.clients = state.clients.filter((c) => c.id !== id);
  delete state.periods[id];
  persistDeleteClient(id);
  if (state.currentClientId === id) {
    state.currentClientId = state.clients[0] && state.clients[0].id;
    pickDefaultPeriod();
  }
  render();
}
function mutateClient(id, mutator) {
  const c = getClient(id);
  if (!c) return;
  mutator(c);
  persistClient(c);
}

function applySavedTheme() {
  try {

    if (saved === "dark" || saved === "light") document.documentElement.setAttribute("data-theme", saved);
  } catch (e) { /* localStorage no disponible: seguimos con el tema del sistema */ }

function toggleTheme() {
  const current = document.documentElement.getAttribute("data-theme") || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const next = current === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("papelesTheme", next); } catch (e) { /* no se pudo persistir la preferencia */ }

}

function escapeHtml(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

// Identifica un campo editable de forma estable entre un render y el
// siguiente: los campos de período usan data-path; los de configuración
// usan data-cfg combinado con los data-* que los distinguen (fila, año,
// jurisdicción, código de actividad).
let isRerendering = false;
function getFieldKey(el) {
  if (!el || !el.dataset) return null;
  if (el.dataset.path) return "path:" + el.dataset.path;
  if (el.dataset.cfg) {
    return "cfg:" + el.dataset.cfg + "|" + (el.dataset.idx || "") + "|" + (el.dataset.jur || "") + "|" + (el.dataset.code || "") + "|" + (el.dataset.year || "");
  }
  return null;
}
function renderSidebarPreservingFocus() {
  const active = document.activeElement;
  const isSearch = active && active.dataset && active.dataset.action === "search-clients";
  const selStart = isSearch ? active.selectionStart : null;
  const selEnd = isSearch ? active.selectionEnd : null;
  renderSidebar();
  if (isSearch) {
    const el = document.querySelector('[data-action="search-clients"]');
    if (el) { el.focus(); el.setSelectionRange(selStart, selEnd); }
  }
}
function renderPreservingFocus() {
  const active = document.activeElement;
  let key = null, selStart = null, selEnd = null;
  if (active && document.getElementById("main").contains(active)) {
    key = getFieldKey(active);
    if (key) { selStart = active.selectionStart; selEnd = active.selectionEnd; }
  }
  // Rebuilding #main removes the focused input from the DOM, which makes the
  // browser fire a genuine "focusout" on it — not a real blur by the user.
  // Our focusout listener reformats money/percent fields on blur, so without
  // this guard every keystroke would trigger a premature reformat (rounding
  // the value mid-typing) instead of only on real blur. Suppress it here.
  isRerendering = true;
  render();
  isRerendering = false;
  if (key) {
    let el = null;
    document.querySelectorAll("[data-path],[data-cfg]").forEach((c) => { if (!el && getFieldKey(c) === key) el = c; });
    if (el) {
      el.focus();
      if (selStart != null && el.setSelectionRange) { try { el.setSelectionRange(selStart, selEnd); } catch (e) {} }
    }
  }
}

  renderSidebar();
  renderMain();
}
